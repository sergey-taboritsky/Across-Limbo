#开局介绍事件
 AST_event_1_t: "内战前夜"
 AST_event_1_d: "1946年战争结束后，新西兰分治运动在澳大利亚本土引爆政治地震。工党奇夫利政府为维系与社会主义美国的关系，选择承认新西兰的高度自治，右翼据此怒斥工党出卖帝国。1947年，接任病逝的科廷的奇夫利首次尝试落实工党社会主义纲领，宣布将以强制收购国有化银行业；然而相关法律在施行前被澳大利亚高等法院裁定违宪，酿成1947年宪法危机。叠加此前的分治风波，右翼认定工党不过是'美国人的狗'。自由党主席孟席斯趁机炒作共产主义威胁、组织倒阁；工党内的反共派系亦出走另立民主工党。内战，已不可避免。\n\n[AST_faction_pie_display]"
 AST_event_1_opt: "继续"

#书签介绍
 AST_BLITZKRIEG_DESC: "战争于1946年落幕，但澳大利亚并未迎来和平。新西兰分治运动迫使工党政府承认其高度自治，右翼怒火中烧；1947年奇夫利政府试图国有化银行业的立法被高等法院判为违宪，酿成宪法危机。自由党主席孟席斯借'赤色威胁'煽动倒阁，工党反共派出走另立民主工党——澳大利亚，正滑向一场决定国运的内战。"

