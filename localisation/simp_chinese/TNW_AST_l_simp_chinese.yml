#人物
 AST_Joseph_Benedict_Chifley: "约瑟夫·班纳迪克特·奇夫利"
 AST_Joseph_Benedict_Chifley_desc: "工党元老，1945年接替病逝的科廷出任总理。他笃信工党的社会主义纲领，却在1947年试图强制国有化银行业的立法被高等法院判为违宪，由此引爆宪法危机，被右翼斥为'美国人的狗'。"
 AST_HV_Evatt: "赫伯特·维尔·伊瓦特"
 AST_HV_Evatt_desc: "工党外长、联合国初创时期的关键人物，党内左翼的旗手。在奇夫利之后接掌工党，是工党胜出路线下最可能的总理人选。"
 AST_Albert_Monk: "阿尔伯特·蒙克"
 AST_Albert_Monk_desc: "澳大利亚工会理事会（ACTU）主席，温和的工会官僚，力主以谈判而非革命维护劳工权益，是工党与工会之间最重要的缓冲阀。"
 AST_Lance_Sharkey: "兰斯·沙基"
 AST_Lance_Sharkey_desc: "澳大利亚共产党总书记，亲莫斯科的强硬派。在战后罢工浪潮中影响力骤增，却被孟席斯当作'赤色威胁'的活标本。"
 AST_Ernie_Thornton: "埃内斯特·索顿"
 AST_Ernie_Thornton_desc: "澳共工会书记，矿工与钢铁工人运动的组织者，多次领导大规模罢工，是孟席斯红色恐慌叙事中最具威胁的工会人物。"
 AST_Robert_Menzies: "罗伯特·孟席斯"
 AST_Robert_Menzies_desc: "自由党党魁、战时反对派领袖。1947年宪法危机后借'共产主义威胁'煽动民意，组织倒阁，是右翼与反共力量的核心。"
 AST_Billy_Hughes: "比利·休斯"
 AST_Billy_Hughes_desc: "前总理、自由党元老，以好斗的民粹作风与威权倾向著称。若自由党胜出却被底层民粹运动颠覆，他是最可能的强人化身。"
 AST_Arthur_Fadden: "阿瑟·法登"
 AST_Arthur_Fadden_desc: "国家党（乡村党）党魁，代表 rural 保守派与牧场主利益，在反工党联盟中与自由党结盟。"
 AST_Bob_Santamaria: "鲍勃·桑塔马里亚"
 AST_Bob_Santamaria_desc: "天主教反共知识分子，民主工党（DLP）的精神教父。他推动工党内的反共派出走，是分裂最关键的幕后推手。"
 AST_Frank_McManus: "弗兰克·麦克马纳斯"
 AST_Frank_McManus_desc: "民主工党议会领袖，桑塔马里亚在议会中的代理人，代表出走的工党反共派系。"
 AST_Clarrie_Fallon: "克拉里·法伦"
 AST_Clarrie_Fallon_desc: "澳大利亚工人联合会（AWU）主席，掌控最大的单一工会，立场偏工党右翼、反共，是工党机器的重要票仓。"
 AST_Tom_Dougherty: "汤姆·多尔蒂"
 AST_Tom_Dougherty_desc: "澳大利亚工人联合会总书记，与法伦共同执掌AWU，对工党组织机器拥有巨大影响力。"

