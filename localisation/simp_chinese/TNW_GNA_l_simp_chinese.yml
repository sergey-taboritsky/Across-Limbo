 TNW_GNA_Yacine_Diallo_desc:0 "几内亚政治的元老，法兰西国民议会第一位几内亚议员。当塞古·杜尔们还在工会里当学徒的时候，他已经在巴黎的社会主义阵营里替几内亚争取了十几年的席位。如今由他出面主持这个年轻的政权，论资历、论人望，几内亚无人能出其右。"
