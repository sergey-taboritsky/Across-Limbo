#顾问
 AUS_Charles_I_of_Austria:0 "卡尔一世"
 AUS_Charles_I_of_Austria_desc:0 "卡尔·弗朗茨·约瑟夫·路德维希·胡伯特·格奥尔格·玛利亚·冯·哈布斯堡一洛林，曾经的“维也纳议会所代表的帝国皇室领地与匈牙利圣史蒂芬王冠领地”的合法皇帝，也是如今多瑙联邦的合法皇帝。在伯父弗朗茨·斐迪南大公遇刺后，二十七岁的卡尔被弗朗茨·约瑟夫一世立为皇储，并在一九一八年夏季即位。\n\n在卡尔一世即位后，帝国深受战争带来的问题困扰：东方毫无收获，意大利也未割让土地，帝国崩溃的财政却先导致了奥匈内部问题的总爆发。所幸，在联邦主义者的努力下，帝国并未崩溃，多瑙联邦的成立则几乎彻底平定了帝国内部的民族问题。\n\n卡尔一世的执政平平无奇，但不可否认的，皇帝本人的私德无亏，在民间的威望随着他年岁的增长而逐渐升高。但皇帝的身体状况也在岁月的侵蚀中缓慢恶化:一九二二年的肺炎几乎要了他的命，而来自左右两翼激进分子的攻击与指责也使他承受了极大的精神压力。\n\n§R他已走过诸秋，他将迎来寒冬......§!"
 AUS_Those_who_hold_contradictions:0 "执矛击盾者"
 
#民族精神
 AUS_The_Lion_of_desertion:0 "脱疆之狮"
 AUS_The_Lion_of_desertion_desc:0 "大战的失败与紧随其后的匈牙利叛乱导致我们失去了全部的外莱塔尼亚与部分的内莱塔尼亚。而对捷克人的镇压也导致了波希米亚王国的暴乱，这场可怕的暴乱虽已结束，但也使得布拉格与维也纳的距离与日俱增。"
 AUS_Martial_Law_of_1920:0 "一九二零戒严法"
 AUS_Martial_Law_of_1920_desc:0 "一九二零年颁布的国家戒严法永远杀死了帝国的民主雏芽:为了镇压民族叛乱与维护政治稳定，大部分的政党与民主机构都遭到了查禁与裁撤，这固然维持了帝国的统一，但这样一部过时且严厉的法律已经显得越来越格格不入。"
 AUS_The_hangover_from_Budapest:0 "布达佩斯的余毒"
 AUS_The_hangover_from_Budapest_desc:0 "匈牙利的叛党为帝国的安定献上了一剂致命的毒药:社会主义，即使我们数十年如一日的在内莱塔尼亚扫荡赤匪，但赤红的花枝还是在帝国的内部生长了起来，伴随着欧洲经济的衰退，来自匈牙利的余毒对帝国的影响越来越深，几近蚀骨。"
 AUS_The_Austrian_economy_is_depressed:0 "奥地利经济萧条"
 AUS_The_Austrian_economy_is_depressed_desc:0 "来自大洋彼岸的经济浩劫吞噬了欧陆上的每一个自由国家，帝国也不例外，而由于我们经济体量的缩小，经济危机的冲击并不如预计中的那样强烈。"

#新闻
 AUS_news_event.1.t:0 "维也纳之春"
 AUS_news_event.1.d:0 "在整整二十六年的军事戒严与专制统治后，端坐在霍夫堡宫内的传统君主已经被证实对于席卷欧洲的经济萧条毫无作为，无论是在仅存的捷克人还是奥地利人眼中，这位旧时代的君主显然已经成为了一个旧日的鬼影，几乎无人爱戴。\n\n在蒂罗尔事件发生后，群情激愤的人民揭竿而起，二十余年的镇压终于引发了民意的海啸，在得知自己已经孤立无援后，卡尔一世随即宣布退位。"
 AUS_news_event.1.a:0 "哈布斯堡的未来将会如何？"
 AUS_news_event.2.t:0 "维也纳之冬"
 AUS_news_event.2.d:0 "在整整二十六年的军事戒严与专制统治后，端坐在霍夫堡宫内的传统君主已经被证实对于席卷欧洲的经济萧条毫无作为，无论是在仅存的捷克人还是奥地利人眼中，这位旧时代的君主显然已经成为了一个旧日的鬼影，几乎无人爱戴。\n\n在蒂罗尔事件发生后，群情激愤的人民揭竿而起，二十余年的镇压终于引发了民意的海啸，但军队并未在人民的浪潮前倒戈相向，政府也照常运转，随着新一轮的戒严令被签发实施，奥地利帝国的未来也将愈发暗淡。"
 AUS_news_event.2.a:0 "欧洲的保守派？"

