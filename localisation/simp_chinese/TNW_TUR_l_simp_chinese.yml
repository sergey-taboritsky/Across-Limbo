#民族精神
 TUR_peoples_revolutionary_army: "土耳其工农革命军"
 TUR_peoples_revolutionary_army_desc: "工农革命军是新土耳其国家的武装力量，由党和全土耳其爱国者在1946年的革命后组建而成。作为土耳其社会主义劳工共和国在官方层面的武装力量，工农革命军主要负责保卫土耳其工人政权，打击内外敌人，并与国际各社会主义势力维持良好关系。\n\n然而现实是，新军的来源相当复杂，从曾旅居英法的各色流亡社会主义军事组织，到土耳其国内的左翼民兵和前工人赤卫队成员，再到对社会主义并不完全接纳的前国民军成员，如今正共同接受党的整编、重组与训练，这一进程造成了军队内部纷繁复杂的军事派系问题。"
 TUR_dark_legacy_of_Gokalp: "疯诗人的遗产"
 TUR_dark_legacy_of_Gokalp_desc: "土耳其民族国最后一任总统齐亚·戈卡尔普的漫长任期见证了这个国家从动乱到稳定发展，再到第二次大战期间又一次失败的过程。在此期间，土耳其建设了一支相对现代化的军队，并在中东地区建立了相当的影响力。然而，戈卡尔普的民族主义与复仇主义政策也在土耳其内外留下了深刻的烙印。随着战争的结束，戈卡尔普政权遗留的疮疤并未自然消亡，而是至今仍在内政与外交场合影响新政权的国际形象和内部治理能力。"
 TUR_scholars_workers_soldiers: "学者、工人与士兵"
 TUR_scholars_workers_soldiers_desc: "土耳其工农社会党在草创之初便被称为“学者的党”，这绝非虚言。与留学生群体的密切联系使得党与知识分子界的联系相当密切，可社会主义革命的一般范式中的工人与1946年革命中发挥了至关重要作用的士兵们如今对政权的存续也不可或缺。如今，新共和国的存废，党的兴亡，乃至中东地区社会主义运动的成败，都将维系于这三类人群的团结与协作之上。"
 TUR_revolutionary_emergency: "革命紧急状态"
 TUR_revolutionary_emergency_desc: "自从革命爆发，原本处于解体边缘的土耳其国家便加速瓦解。海峡非军事区被俄罗斯占领，特拉比松地区宣布独立，不安分的库尔德人也起来叛乱......尤其是在法俄关系日渐转冷的当下，俄罗斯及其巴尔干盟友已经隐隐形成对共和国的包围态势。因此，紧急状态与部分领域的军事管制始终难以解除，民主与社会主义解放的彻底实施似乎遥遥无期。"
 TUR_undying_flame_of_revanchism: "仍未熄灭"
 TUR_undying_flame_of_revanchism_desc: "土耳其民族国的几任总统点燃了复仇主义的火炬，而其覆灭并未让火焰熄灭。尽管土耳其工农社会党在1946年的革命中成功夺取政权，但仍有大量的民族主义者、保守派以及前进步党成员对新政权抱有敌意。如今，他们不但联合起内外敌人筹划对新土耳其的全面进攻，还有部分复仇主义者正与党内边缘派系进行合作，或向政权内部渗透。尽管党并非土耳其民族的敌人，但复仇主义运动的反革命行为仍然急需遏止。无论任何手段。"

#介绍
 TNW_welcome_TUR_intro_text_1: "在世界大战中取得最终胜利的奥斯曼帝国从未料到，所谓的胜利对帝国实际上则是一场彻头彻尾的灾难。\n\n1920年的光荣和平条约规定，奥斯曼帝国将按照“停战线”调整边界——这意味着阿拉伯领土的彻底丢失。此外，耶路撒冷成立了几大列强同时管辖的托管领地，而先前叛乱的哈希姆家族则得以控制全部马什里克。\n\n此时，联合进步委员会陷入彻底的混乱中，随后是接连的军事政变、失能的文官政府......直到1922年，在军队和文官内部的复仇主义-泛突厥民族主义力量支持下，伊斯梅尔·恩维尔帕夏掌握了政权。他宣布废除君主制，成立土耳其民族国，仅保留原苏丹的哈里发头衔，同时加紧建设军队和军事工业，期盼复仇的机会。\n\n这一机会在1925年的近东战争中自行显露了出来。英国爆发革命后，耶路撒冷国际托管领内部的阿拉伯人起义并宣布建立巴勒斯坦国。哈希姆叙利亚介入其中，而巴勒斯坦为求援选择了土耳其和埃及。土军立刻进入叙利亚和伊拉克北部，尝试在国际干预到来前彻底打垮叙利亚，重建中东势力范围。\n\n意料之外的是，希腊王国选择下场干预，在拥有其海空基地后德军迅速进入战场。最终，土耳其不得不退出叙利亚的全部领土，仅收获了摩苏尔一带的小片土地。很快，被认为丧权辱国的恩维尔帕夏在一场兵变中被当街枪杀，泛突厥主义学者齐亚·戈卡尔普被推举为新总统。"
 TNW_welcome_TUR_intro_text_2: "作为学者，戈卡尔普的部分内外政策相当温和：拆解联合进步委员会遗留的各大垄断企业和财阀，扶持“民族资本”，推广妇女选举权，乃至废除奥斯曼帝国遗留的头衔，全面采用西方姓氏格式的《姓氏法》。在其治下，土耳其尽管种族矛盾愈发尖锐，但仍安稳渡过了数次国际经济危机，经济得到了长足发展，并将影响力扩张到亚美尼亚和叙利亚北部。在德土和解的背景下，亚美尼亚的保护权正式移交土耳其。\n\n好景不长，第二次世界大战爆发后，俄罗斯于1943年向原本中立的土耳其索取亚美尼亚、卡尔斯和巴统，以及黑海海峡的通航和驻军权。在遭到拒绝后，俄罗斯不顾其西欧盟友的反对悍然入侵，并联合保加利亚人迅速击垮了土耳其军队。最终，不但东部领土沦丧，色雷斯也被保加利亚吞并，海峡与首都君士坦丁堡更是被军管控制。戈卡尔普在战后尝试稳定局势但遭遇了彻底的失败，而其通过种族屠杀维持政权稳定的做法更是直接逼得东部叛乱四起。最终，左翼民兵攻入科尼亚，戈卡尔普被当街处决。土耳其工农社会主义党夺取了国家政权。\n\n新政权上台后，承认特拉比松的希腊国家独立，积极镇压南部库尔德叛乱，同时注重于稳定内政。截止到1947年底，社会主义政权已经基本得到巩固。"

#决议
 TNW_TUR_party_matters_category: "党内事务"
 TNW_TUR_party_matters_category_desc: "土耳其工农社会党成立于世界大战结束后的混乱时期，已经持续运作了数十年。尽管1946年革命让党夺取国家权力，但长久以来的秘密社团模式和地下运作方式，外加自建党以来从未解决的复杂人事问题，使得党内难以达成绝对的意见统一。党内主要派系的情况如下：\n\n东方派：早在苏维埃俄国控制喀山之时，一批土耳其战俘便通过俄罗斯人的灌输接受了马克思列宁主义思想，其领袖则是穆斯塔法·苏普希同志。他们在喀山的俄罗斯苏维埃伊斯兰管理局工作，后来组织了所谓“东方事务委员会”，负责向穆斯林国家输出共产主义。在苏俄战败后，该组织随布尔什维克中央撤退到法国，并在工农社会党中央由于恩维尔的反社会主义政策流亡巴黎后与其合流。如今，他们掌握着大约五千“土耳其红军”士兵成员，构成了过渡时期土耳其人民军的骨干力量。除军事领域以外，这一派还掌握了经济与外交部门的某些话语权。\n\n雪月派：土耳其工农社会党"

#事件
 TUR_event.1.t: "寒冬之息"
 TUR_event.1.d: "科斯坦丁尼耶的一月，相比几年以前显得格外寒冷。海风吹过金角湾，带不来地中海的暖流，反而使东欧大地上的寒风吹遍整座城市。\n\n苏丹穆罕默德七世躺在塞拉宫内，他旧时生活过的小床上，半闭着眼。托普卡帕宫的繁忙政务压得他喘不过气来，外国使臣的傲气、臣子们的无能、民众的愤怒......直到如今，在这难得的歇息时刻，这对于一个七旬老人来说过于残酷的现实才能短暂离开他的心头。\n\n苏丹竟做起梦来。他梦到德意志帝国—曾经多么无敌于天下的德意志，将协约国打翻在地的世界帝国—竟在第一次大战中失败了。最高朴特追随在德意志身后，也承受着堪比当下的战败之耻，失去领土，失去主权。最后，是那联合进步党，将帝国卷入战争的军国主义巢穴—每次都是他们！是联合进步党的凯末尔帕夏将苏丹国彻底废除，他也只得在帝国的前领土上四处流浪，先是贝鲁特，之后又是亚历山大港......\n\n在冰冷的小床上，苏丹却露出了意义莫名的微笑。“那样的结局，难道就不如今年的寒冬吗？我现在好累......我太累了......”"
 TUR_event.1.a: "在睡梦中，苏丹彻底阖上了眼睛。"
