#理念
 TUR_route_eastern: "喀山路线"
 TUR_route_eastern_desc: "东方派执政。党向列宁主义先锋队转型，纪律与计划优先——以及对喀山岁月保持复杂的沉默。"
 TUR_route_central: "第一书记体制"
 TUR_route_central_desc: "实权归于党的第一书记，总统成为体面的国家象征。党机器运转一切。"
 TUR_route_populist: "凯末尔左翼注释"
 TUR_route_populist_desc: "民众派执政：以农村为中心的发展主义。革命的义务先写在村庄的账本上。"
 TUR_route_snowmoon: "巴黎正统"
 TUR_route_snowmoon_desc: "雪月派执政：与第三国际同气连枝，以国际主义为纲。"
 TUR_route_compromise: "四派妥协"
 TUR_route_compromise_desc: "无人过半。国家在派系共识的薄冰上继续前行。"
 TUR_union_participation: "工联会参与执政"
 TUR_union_participation_desc: "工厂委员会的代表进入了政府。"
 TUR_mwc_disbanded: "军委已解散"
 TUR_mwc_disbanded_desc: "军事委员会的职能移交国防部与党的军事部门。"
 TUR_mwc_integrated: "党的军事部"
 TUR_mwc_integrated_desc: "军事委员会整体并入党中央：刺刀属于党，虽然这个党眼下有四五个心脏。"
 TUR_mwc_left_alone: "刺刀在党外"
 TUR_mwc_left_alone_desc: "军事委员会原封未动——一份悬在头顶的沉默。"
 TUR_red_army_reorg: "红军化整编"
 TUR_red_army_reorg_desc: "以土耳其红军为骨干的正规化、党指挥枪的军队。"
 TUR_retained_officers: "留用旧军官"
 TUR_retained_officers_desc: "旧军官团留任执教，军队的操典还是熟悉的味道。"
 TUR_militia_doctrine: "全民民兵"
 TUR_militia_doctrine_desc: "入厂入村的武装人民。"
 TUR_new_army: "革命军队的统一"
 TUR_new_army_desc: "军令政令重新统一，派系林立的过渡军队成为历史。"
 TUR_straits_humiliation: "海峡的屈辱"
 TUR_straits_humiliation_desc: "我们在照会上签了字。字迹很轻，耻辱很重。"
 TUR_security_crackdown: "安全大清查"
 TUR_security_crackdown_desc: "全境搜捕“旧部同人”的网络。"

#事件
 TUR_event.1.t: "军事委员会的去留"
 TUR_event.1.d: "革命军事委员会由起义军官与工人民兵代表组成，在1946年革命中功勋卓著。如今党代会即将重新划定党、国家与军队的关系，而这个身穿军装的庞大团体恰恰不在任何一派的名单之内。代表们在走廊里反复交换意见：革命不能没有刺刀，但刺刀不能自成一方诸侯。"
 TUR_event.1.a: "解散改编。职能移交国家机关，军官按个人意愿留任或退役。"
 TUR_event.1.b: "收编为党的军事部——刺刀属于党。"
 TUR_event.1.c: "听之任之。“让他们留在原地吧。”事实上，没有人有能力让他们离开原地。"
 TUR_event.2.t: "第五次代表大会"
 TUR_event.2.d: "自建党以来，土耳其工农社会党始终以秘密社团的方式运作——巴黎的流亡中央、喀山的战俘网络、安纳托利亚的地下支部，彼此甚至从未坐进过同一个会场。如今，归国者的行囊还带着旅途的尘土，第五次代表大会就要在科尼亚开幕了。这是党第一次公开、合法、全国性的大会——也是第一次必须讨论“今后由谁说了算”的大会。"
 TUR_event.2.a: "让大会开始吧。"
 TUR_event.3.t: "海峡危机"
 TUR_event.3.d: "1949年初，俄罗斯政府向安卡拉递交照会，要求以条约形式确认莫斯科对黑海海峡的驻军权与管制权——换言之，把六年来的占领事实永久化。照会的措辞前所未有地直白：红军不会离开达达尼尔，除非被抬走。消息传开，科尼亚的党部彻夜灯火通明：承认，意味着革命政权在全世界面前自缚手脚；拒绝，则可能意味着战争——一场谁都没有准备好的战争。"
 TUR_event.3.a: "严正抗议。海峡属于土耳其。"
 TUR_event.3.b: "隐忍接受。先活下去。"
 TUR_event.3.c: "提请第三国际斡旋。"
 TUR_event.4.t: "君士坦丁堡来信"
 TUR_event.4.d: "安全部门截获了几封辗转寄出的信件。写信人自称“旧部的同人”——以易卜拉欣·苏克鲁·索柯曼苏尔为首的一批前政府官员，正盘踞在俄国占领下的君士坦丁堡。他们不为早已在1920年倒台、失去一切合法性的旧王朝张目，而是梦想着有朝一日“光复”安纳托利亚，重建他们记忆中的土耳其。信件的措辞客气得可疑，仿佛在试探归来的可能。"
 TUR_event.4.a: "揭露并清洗。新土耳其不欢迎他们。"
 TUR_event.4.b: "静默监视。记下每一个做梦的人。"
 TUR_event.5.t: "表决通过"
 TUR_event.5.d: "代表大会的最后一次全体会议在延长至深夜的争论后落幕。党章草案、土地问题决议、对军事委员会的处置意见——全部付诸表决并通过。真正的问题没有出现在表决名单上，它写在每一位代表的脸上：下一次再坐在这里时，谁将坐在主席台的正中央？"
 TUR_event.5.a: "大会闭幕。"
