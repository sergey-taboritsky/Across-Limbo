 TUR_socialism_party_long: "土耳其工农社会党(Türkiye İşçi ve Çiftçi Sosyalist Fırkası)\n\n§W土耳其工农社会党诞生于1919年德国留学生群体围绕埃德姆·内贾特贝伊组建的土耳其工农党以及第二国际老牌成员奥斯曼社会党的合并，是土耳其主流的社会主义政党。党的左翼民族主义一翼曾部分参与了戈卡尔普政权，并在政权崩溃后抓住时机成功动员起支持革命的军队和工人发动左翼政变，夺权上台。§!\n"
