#政党名字
 TUR_communist_party: "工农社会党 - 东方派/雪月派"
 TUR_communist_party_long: "土耳其工农社会党(Türkiye İşçi ve Çiftçi Sosyalist Fırkası)\n\n§W土耳其工农社会党诞生于1919年德国留学生群体围绕埃德姆·内贾特贝伊组建的土耳其工农党以及第二国际老牌成员奥斯曼社会党的合并，是土耳其主流的社会主义政党。党的左翼民族主义一翼曾部分参与了戈卡尔普政权，并在政权崩溃后抓住时机成功动员起支持革命的军队和工人发动左翼政变，夺权上台。\n\n东方派一般指曾就职于苏维埃俄国东方事务委员会的穆斯塔法·苏普希及其前布尔什维克同僚，这些土耳其人代表着如今党内的列宁主义强硬派。\n\n雪月派诞生于法国的雪月事件后新列宁主义迅速在各国左翼内扩张的浪潮，尤其是早已流亡法国的部分老党员尤为接受这一立场。§!\n"
 TUR_syndicalism_party: "工农社会党 - 工联会"
 TUR_syndicalism_party_long: "土耳其工农社会党(Türkiye İşçi ve Çiftçi Sosyalist Fırkası)\n\n§W土耳其工农社会党诞生于1919年德国留学生群体围绕埃德姆·内贾特贝伊组建的土耳其工农党以及第二国际老牌成员奥斯曼社会党的合并，是土耳其主流的社会主义政党。党的左翼民族主义一翼曾部分参与了戈卡尔普政权，并在政权崩溃后抓住时机成功动员起支持革命的军队和工人发动左翼政变，夺权上台。§!\n"
