#国策（1948 党代会-1949 海峡危机）
 TUR_The_Returnees: "归国之冬"
 TUR_The_Returnees_desc: "流亡巴黎的中央机构与东方派大队人马越过边境返回安纳托利亚。科尼亚的党员们涌向车站迎接——迎接的既是同志，也是四个彼此客客气气、暗地里寸土必争的派系。"
 TUR_Fifth_Congress_Convenes: "第五次代表大会"
 TUR_Fifth_Congress_Convenes_desc: "建党数十年来，党第一次召开公开的全国代表大会。议程只有一项：结束“临时”状态。"
 TUR_Kazan_Legacy: "喀山的遗产"
 TUR_Kazan_Legacy_desc: "东方派亮出喀山岁月的资历与“五千红军”的人望，呼吁党的布尔什维克化。"
 TUR_Countryside_Surveys: "下乡调查"
 TUR_Countryside_Surveys_desc: "民众派把代表们拉进村庄。卡德罗集团相信，土耳其的革命写在农村的账本上。"
 TUR_Party_Audit: "清党审查"
 TUR_Party_Audit_desc: "中央派主持清党审查，梳理各派的人事账目——审查的权力本身就是票仓。"
 TUR_Paris_Letters: "巴黎来信"
 TUR_Paris_Letters_desc: "雪月派宣读来自巴黎的信件：正统、纪律与国际主义。工联会的代表们在旁起立鼓掌。"
 TUR_Military_Committee_Question: "革命军事委员会问题"
 TUR_Military_Committee_Question_desc: "那个在革命中功勋卓著、如今却游离于党纲之外的军事团体，其去留被正式列入大会议程。"
 TUR_Congress_Vote: "全体表决"
 TUR_Congress_Vote_desc: "代表大会的议程草案付诸表决。真正的较量在表决之外。"
 TUR_Route_Eastern: "东方派的胜利"
 TUR_Route_Eastern_desc: "穆斯塔法·苏布希当选党的领袖，党开始向列宁主义先锋队转型。"
 TUR_Route_Central: "中央派的胜利"
 TUR_Route_Central_desc: "谢菲克·许斯努出任党的第一书记，党的机器接管国家。"
 TUR_Route_Populist: "民众派的胜利"
 TUR_Route_Populist_desc: "谢夫凯特·叙雷亚·艾德迈尔领导的卡德罗集团胜出，农村第一次被写进了党的最高纲领。"
 TUR_Route_Snowmoon: "雪月派的胜利"
 TUR_Route_Snowmoon_desc: "伊斯梅尔·比伦在工联会支持下当选党的领袖，巴黎的火种回到了安纳托利亚。"
 TUR_Congress_Compromise: "僵局与妥协"
 TUR_Congress_Compromise_desc: "无人过半。各派在走廊里讨价还价了一整夜，最终捏出了一份谁都不满意、谁都能接受的决议案。"
 TUR_Snowmoon_Dominance: "雪月派绝对控制"
 TUR_Snowmoon_Dominance_desc: "比伦清点工联会的支持并收归己用：路线是雪月派的路线，工联会最好记住这一点。"
 TUR_Union_Power_Share: "工联会参与执政"
 TUR_Union_Power_Share_desc: "工联会以独立姿态进入政府，用工厂委员会的账本换取部长席位。"
 TUR_Party_Constitution: "通过党章"
 TUR_Party_Constitution_desc: "组织的原则、派系活动的边界、代表大会的周期——白纸黑字。"
 TUR_State_Apparatus: "健全国家机器"
 TUR_State_Apparatus_desc: "把党的地下网络改造成国家的行政机器。"
 TUR_Literacy_Campaign: "扫盲运动"
 TUR_Literacy_Campaign_desc: "学者之党的第一张答卷：让每一个安纳托利亚的村庄都读得懂党的报纸。"
 TUR_Spring_Sowing: "扶助春耕"
 TUR_Spring_Sowing_desc: "种子、农具与信贷优先发往乡村。饥荒的记忆不容重演。"
 TUR_Rebuild_Anatolia: "重建安纳托利亚"
 TUR_Rebuild_Anatolia_desc: "战争的创伤仍在，工厂的烟囱必须先立起来。"
 TUR_Constantinople_Letters: "君士坦丁堡来信"
 TUR_Constantinople_Letters_desc: "俄占君士坦丁堡里的旧官员集团浮出了水面。"
 TUR_Straits_Crisis: "海峡危机"
 TUR_Straits_Crisis_desc: "1949年，俄国照会到了。海峡问题迎来总爆发。"
 TUR_Reorganize_Revolutionary_Army: "整编革命军队"
 TUR_Reorganize_Revolutionary_Army_desc: "危机证明了一支统一指挥的军队之于革命政权的必要。"
 TUR_Red_Army_Reorganization: "红军化整编"
 TUR_Red_Army_Reorganization_desc: "以五千土耳其红军为骨干，将全军锻造成党的军队。"
 TUR_Retain_Old_Officers: "留用旧军官"
 TUR_Retain_Old_Officers_desc: "革命的军队也需要会打仗的人。旧帝国军队的军官团被请回了操场。"
 TUR_Militia_Doctrine: "民兵化路线"
 TUR_Militia_Doctrine_desc: "正规军解散入厂入村，全民武装。马克思的教条在这里读作：武装的人民没有失败。"
 TUR_Southern_Campaign: "南部军事行动"
 TUR_Southern_Campaign_desc: "对库尔德山区的清剿行动。军饷照发，但仇恨也在山里发芽。"
 TUR_Straits_Defense_Plans: "海峡防御预案"
 TUR_Straits_Defense_Plans_desc: "从最坏处着想：为海峡沿岸拟定防御预案。"
 TUR_Revolutionary_Army_Unified: "革命军队的统一"
 TUR_Revolutionary_Army_Unified_desc: "整编完成。革命的军队终于只有一个指挥系统、一面旗帜。"

