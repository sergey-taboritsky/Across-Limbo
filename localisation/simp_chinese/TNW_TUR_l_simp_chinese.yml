 TUR_event.10.t: "第二行动军？"
 TUR_event.10.d: "第三军临时总司令杰拉勒·安特尔站在奇里乞亚的平原上，望着面前高山与地中海之间的肥沃农田。他想起了曾经在索邦大学—如今已经解放的革命堡垒法兰西—学习教育学的日子。如今，那些同学们还能站在讲台上吗？还有多少能够保持他们求学时的那颗本心，为人类解放出力？至少，他如今身穿这身将军军服，远在千里之外，做着如此激动人心的革命工作。\n\n杰拉勒·安特尔低声笑了笑。伊诺努或许即将完成土耳其的二月，但总有人要带来火红的十月。他确信，他和向来与激进主义有染的第三军已经准备好了。这不再会是安卡拉那些议员老爷、商业精英或大将元帅的革命，而是土耳其工人和农民的革命。真正的革命。"
 TUR_event.10.a: "至少，让他们看住共和国的南线吧。"
 TUR_event.10.b: "选择此选项以游玩第三军"

 TUR_news_event.1.t: "奥斯曼苏丹病故"
 TUR_news_event.1.d: "科斯坦丁尼耶传来的最新消息表明，四年前刚刚即位的苏丹穆罕默德七世于睡梦中去世。由于苏丹的身体向来不甚健康，他本人也长期饱受肺结核后遗症的困扰，这一事件并不奇怪；然而，由于奥斯曼帝国如今的特殊状态，苏丹之死无疑将会为国家的动荡再添一把火。\n\n按照奥斯曼继承法，奥斯曼奥卢家族最年长的男性成员艾哈迈德·尼哈德埃芬迪已经就任为苏丹艾哈迈德五世。与前任苏丹不同的是，穆罕默德七世似乎对外交事务更为上心，国内政治多半托付给大维齐尔，而新苏丹则明确表示了对本届人民党政府内部政策的厌恶。"
 TUR_news_event.1.a: "旧王已死，新王万岁！"
 TUR_news_event.1.b: "他们会滑入自相残杀的深渊吗？"
 TUR_news_event.1.c: "最高朴特的光芒日渐消逝。"
 TUR_news_event.2.t: "军队推翻伊斯麦特政府！"
 TUR_news_event.2.d: "苏丹艾哈迈德五世继位后，人民党大维齐尔穆罕默德·伊斯麦特帕夏与新苏丹的关系急转直下。如今，这一紧张状态最终演变为了对人民党政府的全面清洗。\n\n在苏丹号召下，驻扎在布尔萨的第五军进入科斯坦丁尼耶，逮捕了大量人民党成员与军政领袖。然而，伊斯麦特帕夏已经抵达安卡拉并宣布新政府非法，苏丹则“已经成为第二个艾哈迈德哈米德二世般的反动暴君”。\n\n由于科斯坦丁尼耶城内仍在混战，苏丹与其临时政府已经转移至伊兹密尔，而人民党势力则向安卡拉集中。安纳托利亚各地的军队纷纷站队，各维拉耶开始自行其是—一切迹象表明，全面内战即将降临这一垂暮帝国。"
 TUR_news_event.2.a: "这是三·三一事件的重演吗？"
 TUR_news_event.3.t: "安卡拉政府宣告成立共和国"
 TUR_news_event.3.d: "奥斯曼帝国近期的内乱已经导致人民党与奥斯曼奥卢王朝之间的关系彻底破灭。如今，随着伊兹密尔与安卡拉两个政府之间的紧张关系不断加深，位于安卡拉的人民党终于迈出了决裂的最后一步。前大维齐尔、人民党党魁穆罕默德·伊斯麦特·雷希特召开了由人民党占据绝对主导的大国民议会，并通过议案宣布废除君主制，成立“土耳其共和国”。与此同时，奥斯曼人民党也随之改名为土耳其人民党。\n\n伊兹密尔政府对此强烈谴责，并号召全国“反抗专制主义以及对伊斯兰传统的侵蚀”，似乎希望团结自由派与保守派力量反对安卡拉。据分析，一切和平解决安纳托利亚危机的手段均已失效，全面内战已经迫在眉睫。"
 TUR_news_event.3.a: "青年土耳其的最后一步......"

