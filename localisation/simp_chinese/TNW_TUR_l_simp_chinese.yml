#角色
 TUR_Sadrettin_Celal_Andel: "萨德雷丁·杰拉勒·安德尔"
 TUR_Sadrettin_Celal_Andel_desc: "§Y出生于：§!§L1890年5月14日，崇高奥斯曼帝国，科斯坦丁尼耶§!\n§Y人物背景：§!§L萨德雷丁·杰拉勒是达拉芬农学院著名的海事法教授穆罕默德·杰拉勒贝伊五个孩子中的长子。1909年，萨德雷丁·杰拉勒获得帝国国家奖学金，前往巴黎高等师范学院完成了本科学业，随后前往索邦大学成为埃米尔·杜尔海姆教授的研究生，学习社会心理学。\n\n1913年，他返回家乡，并被任命为阿达纳达鲁尔穆阿利姆学校的校长，随后在伊斯坦布尔多所学校担任校长，同时教授法语、教育学和哲学。\n\n1919年，成为《救赎》杂志的编辑部成员，进而结识了总编埃德姆·内贾特贝伊及其周边正在形成的土耳其左翼社群。随后，他加入土耳其工农党，又在与社会党的合并中成为工农社会党的创始成员。1922年，曾作为七人代表团中的一员前往巴黎参加第三国际全球大会，化名奥尔罕做出针对土耳其形式的发言。\n\n在恩维尔政权颁布《姓氏法》后，其父决定将家族姓氏确定为“安德尔”，即“效忠者”之意。随后，萨德雷丁进入教育部门工作，直到因反对在科斯坦丁尼耶教师协会纲领中加入“效忠伊斯兰”而被怀疑是共产主义煽动者并遭到解职。直到第二次世界大战前，他在明面上都以翻译文献为生。\n\n二战期间，由于土耳其官僚机构的人手紧张，他被重新启用进入宣传部。战败初期，随着行政中心迁往科尼亚，安德尔作为政府方面的先遣人员在城内扎根，并随后在党内成为科尼亚地区的重要领袖。战后，随着土耳其政权的再一次崩溃，革命军队开进各大城市，工农社会党取得了政权，而恰好位于科尼亚的安德尔则由于党的领导层尚未归国而被中央委员会任命为临时总统，负责政权过渡及新政府建立的过程。§!"

 TUR_Mehmed_VII: "穆罕默德七世"
 TUR_Mehmed_VII_desc: "§Y出生于：§!§L1873年8月26日，崇高奥斯曼帝国，科斯坦丁尼耶贝伊奥卢区塞拉宫§!\n§Y人物背景：§!§L穆罕默德·齐亚扎丁·奥斯曼奥卢是苏丹穆罕默德五世及其王妃卡姆尔·卡丁的长子。其对奥斯曼皇位的继承权始于1876年，时年其父成为苏丹阿卜杜勒·哈米德二世的继承人。\n\n尽管困于宫墙之内，齐亚扎丁埃芬迪仍然擅于音乐，精通多种乐器。1911年起，他成为帝国军事学院的学生，并于1916年进入军队服役，成为骑兵准将。随后，他又负担起大量的外交工作，例如于1917年安排与德皇威廉二世、1918年与奥皇卡尔一世的会面。\n\n1918年7月，穆罕默德五世去世，其幼弟即位为穆罕默德六世。1926年，皇位被传递给穆罕默德五世的表弟，即阿卜杜勒迈吉德二世。最终，阿卜杜勒迈吉德二世于1944年去世，而此时齐亚扎丁埃芬迪作为奥斯曼奥卢家族最为年长的继承人则顺位继任苏丹，称穆罕默德六世。\n\n前任苏丹遗传下来的帝国已有倾覆之危：由于苏丹长期弱势，帝国权柄几乎全部归于大维齐尔与奥斯曼人民党，而正是人民党的鲁莽政策导致帝国卷入世界大战。穆罕默德七世只得发挥其外交天分，与人民党新政府共同为帝国争取来了一纸《安卡拉条约》以保全帝国核心。然而，此举严重打击了苏丹的民望，并导致科斯坦丁尼耶威望尽失。与此同时，苏丹的身体状况也不容乐观......§!"
 TUR_Puppet_sultan: "傀儡苏丹"
 TUR_Ahmed_V_Nihad: "艾哈迈德五世·尼哈德"
 TUR_Ahmed_V_Nihad_desc: "§Y出生于：§!§L1883年7月5日，崇高奥斯曼帝国，科斯坦丁尼耶贝伊奥卢区塞拉宫§!\n§Y人物背景：§!§L艾哈迈德·尼哈德·奥斯曼奥卢是穆罕默德·萨拉赫丁亲王的长子，也是苏丹穆拉德五世的长孙。由于穆拉德五世早已在艾哈迈德·尼哈德埃芬迪出生前九年便被推翻，他自幼便生活在软禁状态中，直到1904年穆拉德五世去世才获得自由。\n\n随后，艾哈迈德·尼哈德选择搬出皇宫在科斯坦丁尼耶城郊修建新居所。战争期间，他同大部分王室成员一道参军，并在战争末期以陆军中校身份退役。战后，随着王室年长成员不断离世，他的继承序列也不断前移。最终，在苏丹穆罕默德七世离世后，他作为奥斯曼奥卢王朝最年长的成年男性得以继承皇位。\n\n然而，此时的帝国状况却不甚乐观—财政崩溃，军队溃散，民怨沸腾，而缺乏实力的中央政府只能坐视帝国日渐分崩离析。为了确保帝国的存续，苏丹艾哈迈德五世似乎已经确定，他不会像他的前任般对那些导致帝国堕入深渊的人如此宽容......§!"

