 TUR_route_andel_education_tt: "萨德雷丁·杰拉勒·安德尔将转任教育部部长"
 TUR_route_central_andel_tt: "安德尔将留任总统，党的第一书记掌握实权"
 TUR_route_populist_andel_tt: "安德尔将体面地退出政坛"

