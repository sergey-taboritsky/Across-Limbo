ALG_Albert_Camus:0 "阿尔贝·加缪"
ALG_Albert_Camus_desc:0 "阿尔及尔贫民区出身的黑脚作家，《阿尔及尔共和报》的调查记者与《战斗报》的主编。他是殖民地里唯一同时为阿拉伯穷人和欧洲穷人发声的著名左翼——贫穷才是他的祖国。在法共治下的阿尔及尔，这位拒绝任何意识形态站队的左派被各方推举出来，主持一个跨越种族分界的联合政府。他常说：错误的思想，不值得为之撒谎。"
