 TNW_welcome_thanks_text:0 "感谢名单：陆（策划+文案）\n凄微寒（策划+文案）\n小何AEQS（文案+美工+技术）\nBlank、白洛零（策划+文案）\nComrade（策划+文案+技术）\n麦凯乐\n，（技术）\n北條義寧（策划＋文案）\n半空的水杯（文案）\n战国（美工+代码+文案）\n皮易克（美工）\nsergey taboristky（代码+文案）排名不分先后"
 
 TNW_welcome_SOV_intro_text_1:0 "你是一个一个一个苏联"
 TNW_welcome_WGR_intro_text_1:0 "你是一个一个一个西德"
 TNW_welcome_FRA_intro_text_1:0 "自工业革命以来，法兰西便是工人运动的发源地与心脏之一。在这里，社会主义的红旗曾经两次高举——1871年的巴黎公社，与1919年的法兰西社会主义革命。随后，随着苏维埃俄国沦陷，法兰西成为世界上第一个稳定存活的社会主义国家，而在社会主义指引下，法兰西工人们也将公社建设成了无愧于其革命始源地历史地位的伟大国度。雪月革命，欧洲革命浪潮，第二次世界大战......法兰西完成了一个又一个挑战，如今已是世界舞台上举足轻重的强国。第三国际心脏坐落于此，欧洲工人联军总部也设在此处，似乎半个世界——红色，充满生机与希望，代表工人革命未来的半个世界在法兰西英明的指挥棒下翩翩起舞。\n\n不过，随着击败德意志世界帝国的同袍情谊日渐消散，战争的阴云似乎又一次要笼罩欧陆，法兰西能否生存下去，并带领工人走向真正的赤旗寰宇呢？"
 TNW_welcome_BUL_intro_text_1:0 "作为巴尔干之主，保加利亚已经历许多。\n\n随着第四次巴尔干战争的枪炮声走向沉寂，保加利亚仍未解决的国内问题再次浮出水面—如斯塔姆博利伊斯基、共产党等势力的在战前战后持续激化矛盾的对抗。1938年9月，共产党小组发动了一场针对基里尔亲王的刺杀，刺杀者企图在基里尔亲王开车兜风时炸死他，但是其副官及时拔枪杀死了刺杀者，但此次事件导致了基里尔亲王的精神问题。军方、警察以此为由镇压了左翼运动，将斯塔姆博利伊斯基关进了监狱。\n\n1939年5月，秘密军人同盟与“环节派”发动了针对鲍里斯三世沙皇的刺杀，不过他们的运气没比共产党人们好，两位叛徒出卖了他们。秘密军人同盟遭到镇压，军方的权力遭到了削弱，深陷恐惧的鲍里斯三世以此为由解散党派，与极右翼合作，建立起了君主专制。"
 TNW_welcome_BUL_intro_text_2:0 "在第二次世界大战期间，左翼运动重新开始活跃，共产党、保加利亚农民联盟-正午、一部分社会民主工党（广泛派）党员共同组织起了名为“祖国阵线”的泛左翼组织，甚至建立起游击队。随着战争的影响波及保加利亚本就脆弱的经济，祖国阵线愈发活跃起来。\n\n1946年，带领保加利亚走过战争的沙皇鲍里斯三世去世。西美昂二世年幼无法执政，因而经国民议会投票，由首相博格丹·菲洛夫、基里尔亲王、战争部长尼古拉·米霍尔三人共同组成摄政委员会代为摄政统治。"
 TNW_welcome_GRE_intro_text_1:0 "希腊曾是巴尔干半岛首个获得独立的民族国家，也曾是巴尔干半岛的首个共和国。然而，希腊的一切荣耀似乎从未与其平民人口有过任何关系。不但如此，自从第二次希土战争的失败以来，希腊的对外扩张之路便充满荆棘。\n\n希腊曾经在著名“贤相”韦尼泽洛斯带领下克服内部分裂，尝试参与世界大战，但中央同盟意料之外的胜利使得数十万希腊男儿的性命只换回一纸《萨洛尼卡条约》的无情羞辱。国王退位，共和成立，军队政变......直到康迪利斯建立军事独裁，并在五年后被民主政党推翻，希腊才重新得到些许稳定。\n\n可惜，1931年至1938年的短暂稳定发展阶段又一次被无情的炮火碾碎。为了收复马其顿，希腊参与了塞尔维亚与罗马尼亚的军事冒险—尝试挑战巴尔干之主。被胜利蒙蔽了双眼的联军在奥地利干涉下灰飞烟灭，希腊则为自身的鲁莽付出了惨痛代价，塞萨洛尼基。"
 TNW_welcome_GRE_intro_text_2:0 "希腊的社会党是巴尔干地区起步较早的左翼政党之一。在巴尔干战争前夕，阿夫拉姆·贝纳若亚便在萨洛尼卡组织起附属于联合进步委员会的“社会主义工人联盟”。1915年，随着国家分裂的潮汐不断撕扯希腊的肌体，社会主义工人党在这一联盟的基础上成立，并立刻成功进入议会，得到工人群体的广泛支持。\n\n1924年，经历长足发展的社工党决定重组。党内新秀潘德利斯·波利欧普洛斯高喊“布尔什维克化”口号击败创始人贝纳若亚，并迅速将党转变为革命先锋，联系工人采取激进行动。军政府时期的打压并未摧毁党内斗志，反而巩固了其作为主要反对派的地位，于是在军事冒险失败后，工人民兵进军雅典，希腊工人共和国成立。\n\n第二次世界大战期间的希腊作为联军后方并未卷入过多战斗，反而通过承接工业转移而得到了长足的发展。如今，希腊作为红色阵营在巴尔干的落脚点，是国际最为重要的欧洲盟友之一。"
 TNW_welcome_ALP_intro_text_1:0 "大叙利亚王国是“光荣和平”的产物：同盟国赢得了大战，奥斯曼帝国却被伦敦与柏林联手出卖，被迫承认阿拉伯诸省独立，麦加的哈希姆圣裔家族如愿以偿地在即将独立的前夕加冕于大马士革。年轻的加齐国王继承了一个看似稳固的国家：德式训练的军官团、德国资本的铁路与港口，以及一个由旧贵族与部落长老装点门面的议会。然而，繁荣建立在借来的时间之上——军官团效忠柏林，财政仰赖德国市场，而宪法许诺的四年一度大选，自1936年起就再也没有兑现过。\n\n社会主义思潮并未缺席这片土地。随着雪月革命在法国爆发，大叙利亚共产党转入地下活动；结合了阿拉伯民族主义与社会主义的复兴运动虽遭王室镇压、其激进领导人被流放至的黎波里塔尼亚，其思想仍在耶路撒冷、安曼与大马士革的文人之间传播；1938年海法大罢工中，一批青年民族主义者与社会主义者又组建了民族革命党，立志继承复兴运动的遗志。沙漠战争的惨败让王室威信扫地，各进步组织被迫愈发深入工人、士兵与山民之中，等待属于他们的时刻。"
 TNW_welcome_ALP_intro_text_2:0 "转机与灾难一同到来。德意志帝国在二战的战火中崩溃，叙利亚的军械供应中断、海外市场蒸发，宫廷只剩伦敦一个金主——以基地与油管特权换取军饷的条约激怒了所有人。大选第四次被推迟，德鲁兹山起义的枪声未平，霍姆斯的征召兵又调转了枪口。1948年初，胡斯尼·扎伊姆将军发动政变，国王出逃安曼，投奔庇护他的英国人；军队则在混乱中彻底分裂——西北驻军被左翼军官与社会民族党分子渗透，革命阵线顺势夺取阿勒颇，宣布建立革命政权；贝鲁特的军人集团亦割据海岸，虎视眈眈。\n\n对这些年轻的革命者来说，最危险的时刻远未结束。民族主义与社会主义的前路究竟该如何走下去？大马士革的军政权、安曼的哈希姆王党、海岸的军阀与北方的革命土耳其彼此环伺，他们能否胜出？红色黎凡特的第一站，就此启程。"
