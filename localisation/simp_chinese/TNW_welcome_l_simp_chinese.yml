 TNW_welcome_thanks_text: "组员名单\n\n组长：sergey_taboritsky(塔比)\n\n策划组：長谷川みしや(白翻译)，sergey_taboritsky(塔比)，普通的苏联人，gjjgfth，铃铃，键山家的逸仙号(逸仙)，玫莉_Official(帕拉曼·德谟卡提斯)，这个人可能是个喜多厨(妖梦)，„СветаНеделия“，Amia(弗林)，大卄，Jack_Jones，季诺维也夫_official，加香竹席_official，Malaparte，仙人，伊藤正姬，某个隐形的人(佩利塞尔)\n\n文案组：長谷川みしや(白翻译)，gjjgfth，铃铃，键山家的逸仙号(逸仙)，玫莉_Official(帕拉曼·德谟卡提斯)，这个人可能是个喜多厨(妖梦)，„СветаНеделия“\n\n代码组：sergey_taboritsky(塔比)，普通的苏联人，这个人可能是个喜多厨(妖梦)，coldfish987，黑白平行，华莎，乐，秋起，爽吃千早爱(战国)\n\n美术组：压缩毛巾，普通的苏联人，„СветаНеделия“，笨比瓜瓜，D_Zero，华莎，渙散，捞面，璃雲Libespe，名为有顶天的星星，宋先生蘭の花を愛する，Косыгин(天水农民)\n\n以及同样为制作过程做出不可磨灭贡献的组内观察员们：八奈见杏菜，CancerCendil，和平在2007，幻星，KangNi，洛林Rocky，ManofSteel，鸢尾花雕塑，MORTIS-ICED，OnePassage，Origami，启明星章，赛博蛋糕1968，沙地里的鸵鸟，素茫，SOVIETFISH，頹廢的聲音是傳不到彼岸的，乌兰巴托大海怪，线列步兵理论家，一个同窗，永生之⑨，☆近藤今日子☆，D.M.无相哏师\n\n(排名不分先后)\n\n如果希望讨论模组内容或报名参与制作，欢迎前往制作组官方QQ群聊：954516042。我们欢迎一切前来讨论的朋友们！"
 
 TNW_welcome_close_button_text: "开始游戏"

#二十世纪中叶的革命与战争已经让世界天翻地覆。在两🗡毁灭性的世界大战后，不列颠早在1925年就升起红旗，德意志世界帝国分裂为几块说不清归属的占领区，而社会主义国际与俄罗斯，两个庞然大物如今正蹲坐在世界两侧，至今尚未为任何未来事物做好准备。

#欧洲如今被军事分界线一刀两断。法兰西公社联邦牵头国际社会主义联合军，控制着伊利里亚到挪威的广袤领土；俄罗斯民族共和国牵头东欧防御协定，波兰、保加利亚等东欧或中欧的古国紧随其后。夹在中间，德意志的命运仍然悬而未决。中立统一已成泡影，但至今仍然没有任何一方占领者敢于迈出独自建国的最后一步。德国问题早已不是德国人自己的问题。

#东亚的裂口最新。一场仍未结束的战争把日本列岛劈成两半，北边依赖俄国援助的旧帝国，以及南边的东亚首个工人政权。往西，走出战争泥潭的中华民国仍然困于内部矛盾与经济崩溃；往南，印尼民族统一主义的号角正在惊醒独立初成的数个新国家，而他们正准备联合捍卫自己的独立。

#1948年1月1日，福岛的停战文本还没落笔，海峡的倒计时还没开始，铁幕也还没落下。《穿越灵薄狱》（Across Limbo: Hours Before Showdown）就从这一天开始，带你走进这个熟悉而又陌生的世界，展示即将升起，但也必然坠下的铁幕。

#当前版本：0.0.1公开测试；本模组尚处于开发早期，急缺开发人员，如果有感兴趣者欢迎前往水群报名；若希望讨论模组设定也欢迎前来水群联系。群号：954516042

