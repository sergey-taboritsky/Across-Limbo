# 事件文本（大韩民国 KOR 叙事链）
 TNW_KOR.1.t: "反托管运动与李承晚的转向"
 TNW_KOR.1.d: "一九四八年，美俄外长会议决定将朝鲜托管期限延长十年。这一完全无视朝鲜人民意愿的决议激起全国抗议。李承晚起初是反托管的坚定支持者，却在年末骤然转向，公开宣称要借俄罗斯之力肃清半岛上的赤色势力，并借「国会间谍案」清洗金九等反李力量。"
 TNW_KOR.1.a: "沉默地接受这一现实"
 TNW_KOR.2.t: "李承晚遇刺"
 TNW_KOR.2.d: "一九四九年六月二十六日，李承晚遭激进青年金炳律刺杀，经抢救无效身亡。李范奭为首的亲李阵营怀疑暗杀系左右联合运动乃至美国人所策划，拒不承认选举结果，率亲李派系全面转向俄罗斯。"
 TNW_KOR.2.a: "为总统举行国葬"
 TNW_KOR.3.t: "一九四九年八月大选"
 TNW_KOR.3.d: "在随后的大选中，左右联合运动推举金九为联合总统候选人并成功当选。大韩民国由此确立议会内阁制与两院制。然而李范奭拒绝承认结果，民族军与光复军在黄海道爆发冲突。"
 TNW_KOR.3.a: "金九就任大韩民国总统"
 TNW_KOR.4.t: "一九五〇年补选"
 TNW_KOR.4.d: "因议会中半数李系议员叛逃，国民议会依宪举行补选。独立党仍希望金九参与；民主主义民族战线亦推出共同提名人选。朝鲜半岛的政治前途，系于此次补选。"
 TNW_KOR.4.a: "金九参选（韩国独立党·保守主义-三均主义）"
 TNW_KOR.4.b: "金奎植参选（韩国独立党·自由主义-三均主义）"
 TNW_KOR.4.c: "赵素昂参选（韩国独立党·进步主义-三均主义）"
 TNW_KOR.4.d: "吕运亨（勤劳人民党·社会民主主义）"
 TNW_KOR.4.e: "金元凤（人民共和党·社会主义-三均主义）"
 TNW_KOR.4.f: "朴宪永（韩国共产党·共产主义-马克思列宁主义）"
 TNW_KOR.5.t: "祖国的分裂"
 TNW_KOR.5.d: "李范奭与池青天在罗先、新义州发动起义，民族军接连攻克关北五道。为避免重蹈日占覆辙，俄美协商停火。一九五〇年，双方在三十八度线附近形成对峙，半岛就此分裂。北方五道并入新生的朝鲜民族共和国。"
 TNW_KOR.5.a: "接受分裂的既成事实"
 TNW_KOR.6.t: "金九再度遇刺"
 TNW_KOR.6.d: "一九五二年，金九再度遇刺，这一次他没能躲过死神。大韩民国为其举行国葬。凭借金九的影响力，独立党再度登顶青瓦台，推尹潽善继任。"
 TNW_KOR.6.a: "为金九举行国葬"
 TNW_KOR.7.t: "一九五四年独立选举"
 TNW_KOR.7.d: "尽管南韩政局较北方更为混乱，在第一届政府和国民议会的努力下，大韩民国仍坚持到了一九五四年第二次独立选举。金九退出舞台后，独立党还能否保持优势？"
 TNW_KOR.7.a: "独立党保持优势（尹潽善·自由主义-三均主义）"
 TNW_KOR.7.b: "赵素昂另立大韩社会党（社会主义-三均主义）"
 TNW_KOR.7.c: "韩国共产党胜选（朴宪永·共产主义）"
# 事件文本（朝鲜民族共和国 KNR 叙事链）
 TNW_KNR.1.t: "池李相争"
 TNW_KNR.1.d: "民族军总司令池青天与民族自由党党魁李范奭之间的矛盾已不可调和。若李范奭的民族领袖影响力高，他将塑造个人独裁；若影响力低，朝鲜民族政权内部将生剧变。"
 TNW_KNR.1.a: "强男李范奭——一民主义，李范奭"
 TNW_KNR.1.b: "弱男李范奭——海参崴派政变，申性模"
 TNW_KNR.1.c: "弱男李范奭——池青天雪夜政变，保守主义"
 TNW_KNR.1.d: "弱男李范奭——白善烨反政变，一民主义"
