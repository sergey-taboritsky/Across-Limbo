#国策
 ALP_suppress_Aleppo: "巩固阿勒颇城区"
 ALP_suppress_Aleppo_desc: "尽管我们的革命取得了初步成功，但作为临时首都的阿勒颇城内仍有许多旧政权的官吏与大马士革的合作者反对我们的革命。现如今，全面战争随时可能爆发，我们务必尽快巩固对城区的控制。无论什么手段，说教也好，抓捕也罢，必须将旧王朝的党羽与社会民族党野心家清除出我们的心脏地带。"
 ALP_contact_radical_CHP: "联络阿达纳"
 ALP_contact_radical_CHP_desc: "紧邻我方控制区的阿达纳地区，如今掌握在土耳其工农社会党革命政权的手中，或许我们能够从中得到所需的支持。尽管安卡拉当局与我们的运动存在历史矛盾，但现如今的乱局中，任何盟友都显得弥足珍贵。"
 ALP_seek_Paris_recognition: "寻求巴黎承认"
 ALP_seek_Paris_recognition_desc: "长久以来，社会主义反殖民委员会对复兴运动远比对我方更加熟悉，而如今这种陌生导致的疏离对获取法国援助将会带来极度负面的影响。我们应当组建一个代表团联系反殖委，并申请我们所需的物资与军火援助。"
 ALP_form_united_front: "成立革命统一战线"
 ALP_form_united_front_desc: "民革党与共产党的矛盾已经初步缓解，我们政权的生存危机已然解除，是时候准备下一阶段行动，解放整个大叙利亚了。为了达成这一目标，我们应该将临时达成的统一战线正式化，让这一组织指导革命行动，从而协调原本各自为战的各革命盟友。"
 ALP_consolidate_revolution: "巩固革命政权"
 ALP_consolidate_revolution_desc: ""
 ALP_mobilize_militia: "动员人民民兵"
 ALP_mobilize_militia_desc: ""
 ALP_increase_conscription: "扩展征兵范畴"
 ALP_increase_conscription_desc: ""
 ALP_impose_levy_act: "颁布征收法令"
 ALP_impose_levy_act_desc: ""
 ALP_seek_Egyptian_support: "争取埃及支持"
 ALP_seek_Egyptian_support_desc: ""
 ALP_embassy_in_Tripoli: "遣使的黎波里"
 ALP_embassy_in_Tripoli_desc: ""
 ALP_liberate_Levant: "解放黎凡特"
 ALP_liberate_Levant_desc: "革命军队已经准备就绪，士气高昂；而南方的各路反动敌人正在陷入自相残杀的混乱中，没有什么时机比现在更适合开始军事行动了。我们将统一大叙利亚，将这片土地染上红色，并让黎凡特成为全阿拉伯革命的第一站！"
 ALP_destroy_imperial_remnant: "终结大马士革军政权"
 ALP_destroy_imperial_remnant_desc: "尽管哈希姆王国已经在1948年的内战中土崩瓦解，但扎伊姆的军事政权仍然盘踞在大马士革城中，占据着叙利亚最宝贵的沃土。我们将终结这一残暴怪物的碎片，让叙利亚从暴政中彻底解放出来。"
 ALP_attack_SSNP: "镇压社会民族党"
 ALP_attack_SSNP_desc: "向莫斯科效仿的极端主义者如今盘踞在西部海岸，推行他们疯狂的密契崇拜与种族纯净政策。他们甚至要将大叙利亚单独列为一个民族——真正的阿拉伯解放者不应当与他们为伍，我们应当立刻动员军队将这些狂想家剿灭。"
 ALP_overthrow_Hashemites: "推翻圣裔王国"
 ALP_overthrow_Hashemites_desc: "外约旦的安曼城如今成了哈希姆王室的流亡巢穴。他们自封正统与解放者，却扮演着比大马士革军政权更虚伪的压迫者，还意图用虚无缥缈的先知血缘将奴役扩展到全叙利亚。为了革命，我们将把他们无情消灭，解放其治下人民。"
 ALP_liberate_holy_city: "解放圣城"
 ALP_liberate_holy_city_desc: "占据圣城的宗教原教旨主义者向来都是社会主义与共和主义的敌人。尽管其军队狂热，但我们的工人民兵与革命军拥有更强的组织与更先进的战术，击败他们将会轻而易举。"
 ALP_cast_out_foreigners: "驱逐外来者"
 ALP_cast_out_foreigners_desc: "希伯来伊舒夫是耶路撒冷当局在巴勒斯坦二十年统治留下的伤疤，而如今南部沙漠中的伊舒夫军队无疑是这道伤疤将要化脓的征兆。在他们能够造成更多痛苦前，我们必须将其击败，让阿拉伯民族从最后的殖民主义残余中解放出来。"
 #: ""
 #_desc: ""
 ALP_event.2.t: "联络科尼亚"
 ALP_event.2.d: "革命政府的使者秘密抵达阿达纳，与土耳其工农社会党的联络人碰头。穿过边境带回的不只是承诺，还有穆斯塔法·阿里斯——工团主义老战士愿意出山入阁。"
 ALP_event.2.a: "欢迎阿里斯入阁"
 ALP_event_2_a_tt: "§Y穆斯塔法·阿里斯§! 将加入政府"
#国策（内战延伸）
 ALP_refugee_camps: "难民营安置"
 ALP_refugee_camps_desc: "数十万巴勒斯坦难民涌向北方。革命政权敞开城门登记安置——难民中的青年很快发现，革命队伍里有一份口粮、一支步枪和一个新祖国。"
 ALP_workers_control: "工厂工人管理"
 ALP_workers_control_desc: "阿勒颇的纺织厂与卷烟厂挂上了工人委员会的木牌。经理室空了，车间账本摊在机器上——工人们第一次给自己的工时定价。"
 ALP_homs_council: "霍姆斯工人代表会"
 ALP_homs_council_desc: "霍姆斯的石油工人与铁路工人在地下串联，成立了工人代表会。大马士革的军政权还不知道，他们最重要的工业城已经心向北方。"
 ALP_kirkuk_pipeline_raids: "基尔库克油管破袭"
 ALP_kirkuk_pipeline_raids_desc: "穿越叙利亚荒漠的基尔库克油管是军政府的钱袋子。游击队炸开泵站，火光照亮夜空——每一处断管都是对大马士革财政的一次放血。"
 ALP_bakdash_line: "巴格达什路线"
 ALP_bakdash_line_desc: "巴格达什主张严格的布尔什维克式建党：铁的纪律、集中的领导、对莫斯科路线的忠诚。统一战线的伙伴们皱起了眉头。"
 ALP_arab_national_line: "民族革命路线"
 ALP_arab_national_line_desc: "民革党人主张革命首先是阿拉伯的：反殖民、反封建、泛民族统一。社会主义是手段，阿拉伯的复兴才是目的——两个灵魂在同一个阵营里争吵。"
 ALP_literacy_campaign: "扫盲运动"
 ALP_literacy_campaign_desc: "革命教师团背着黑板走进村庄。夜校的油灯下，佃农们第一次拼写出自己的名字——也第一次读懂了写着他们名字的地契为什么在别人手里。"
 ALP_womens_work_teams: "妇女工作队"
 ALP_womens_work_teams_desc: "缝纫、救护、宣传、运弹药——妇女工作队撑起了革命的后方。保守的教长们愤怒地发现，反对她们的人正在变成少数。"
 ALP_railway_guerrillas: "铁路游击战"
 ALP_railway_guerrillas_desc: "汉志铁路的锈轨重新有了用处——游击队扒铁轨、炸桥洞，军政府的军列一次次脱轨在沙漠深处。"
 ALP_international_brigades: "国际主义纵队"
 ALP_international_brigades_desc: "巴黎的反殖委员会送来了志愿者与军火。带着西班牙内战记忆的老兵们训练着黎凡特的工人民兵——国际的红旗第一次飘在阿勒颇城头。"
 ALP_new_currency: "革命里拉发行"
 ALP_new_currency_desc: "革命政权宣布发行自己的钞票。纸币上的鹰徽还没干透，商人们已经在犹豫该信大马士革的金库，还是信阿勒颇的印刷机。"
 ALP_peoples_army: "人民军整编"
 ALP_peoples_army_desc: "民兵、游击队、叛逃的士兵——人民军在阿勒颇城外的校场完成整编。新的军旗升起时，老兵们说：这一次，军队属于穿军装的工人。"
 ALP_revolutionary_press: "革命报刊"
 ALP_revolutionary_press_desc: "《革命日报》与《人民之声》在铅字房里连夜开印。审读稿件的编辑说：我们的审查制度只有一条——不许替旧世界说话。"
 ALP_palestine_brigades: "巴勒斯坦旅"
 ALP_palestine_brigades_desc: "难民营里最愤怒的青年组成了巴勒斯坦旅。他们的口号写在新军旗上：先打完叙利亚的反动派，再打回去。"
 ALP_Syrian_revolution_prevail: "共同欢庆，革命胜利"
 ALP_Syrian_revolution_prevail_desc: "最后一面旧旗倒下了。大马士革的军刀、贝鲁特的金圆、安曼的王冠都进了历史博物馆——阿勒颇的墙上刷着新标语：革命在全黎凡特胜利，而这场胜利属于每一个上过街的人。"
