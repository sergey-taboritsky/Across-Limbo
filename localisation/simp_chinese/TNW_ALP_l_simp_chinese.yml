#GUI
 TNW_ALP_ideology_mech_description_textbox_tt: "由于统一战线的特殊性质，革命联盟的意识形态主张容纳了其各个主要成员的诉求。左翼希望得到社会主义，右翼则渴求泛阿拉伯民族统一，而民间对这两种思潮也有各自的看法。为了维系阵线团结，建设新国家，两种思潮的冲突必须得到调和。\n\n而如果我们未能做到，那么联盟的解体就将在所难免。"
 TNW_Syria_ALP_arab_communism_tt: "社会主义主要由民革党左翼与大叙利亚共产党所主张，他们希望模仿巴黎、伦敦等西方范式，建立工农国家，与欧美结盟。"
 TNW_Syria_ALP_arab_nationalism_tt: "民族主义主要由民革党右翼、前复兴运动成员与部分军官所主张。他们对社会主义政策并不感冒，但主张阿拉伯民族统一，使强大阿拉伯国家屹立于世界。"
 TNW_ideology_state_progressbar_tt: "社会主义倾向：\n民族主义倾向："
