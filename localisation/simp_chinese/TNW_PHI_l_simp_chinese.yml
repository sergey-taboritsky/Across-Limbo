l_simp_chinese:
 PHI_Arms_Registration: "枪与选票"
 PHI_Arms_Registration_desc: "政府要登记虎克的枪，虎克把登记簿顶在头上：枪在，选票也在。"
 PHI_Barrio_Government: "巴里奥自治"
 PHI_Barrio_Government_desc: "解放区时代的巴里奥委员会摇身变成基层政权。税、学、粮，村里人自己说了算。"
 PHI_Barrio_Militia: "乡村民兵体系"
 PHI_Barrio_Militia_desc: "巴里奥民兵扛着老式恩菲尔德守夜。虎克说：乡村的枪，该由乡村来保管。"
 PHI_CLO_Unity: "劳联大统一"
 PHI_CLO_Unity_desc: "战前的工会山头在劳联的旗帜下重新列队。西德说：工人阶级只有一只拳头。"
 PHI_Cadre_Schools: "干部学校"
 PHI_Cadre_Schools_desc: "油印教材、马灯、苇席棚——干部学校一夜之间开遍群岛。学生姓名保密，课程内容保密。"
 PHI_Cid_Mandate: "工团共和国的舵手"
 PHI_Cid_Mandate_desc: "西德第三次就任共和国主席。劳联的旗帜升上马尼拉塔——这一次，没有人和他竞争。"
 PHI_Civil_Service_Bill: "文官考试法案"
 PHI_Civil_Service_Bill_desc: "用考试而不是姓氏来决定谁替共和国记账。旧官僚集团在考卷面前发抖。"
 PHI_Collaborator_Amnesty: "大赦与和解"
 PHI_Collaborator_Amnesty_desc: "审下去只会撕碎国家。让劳雷尔们交出财产与档案，换一张回家的船票——共和国需要每一个能干活的人。"
 PHI_Collaborator_Trials: "通敌者审判"
 PHI_Collaborator_Trials_desc: "劳雷尔伪政权的名单就摆在桌上。人民要审判，虎克军要审判——把战争年代的两面人钉上耻辱柱。"
 PHI_Constitutional_Revision: "修订共和宪章"
 PHI_Constitutional_Revision_desc: "1935 年的宪章是给自治领写的，不是给社会主义共和国写的。制宪会议的任务：把工人的权利写进根本法。"
 PHI_Democratic_Alliance: "民主联盟大会"
 PHI_Democratic_Alliance_desc: "劳联、农民协会、归来的流亡者、虎克的军械库——把所有愿意建设共和国的力量拧成一股绳。"
 PHI_Development_Bank: "菲律宾开发银行"
 PHI_Development_Bank_desc: "私人银行家跑了，共和国自己当银行家：低息贷款投向工厂、码头与电站。"
 PHI_Economic_Council: "经济计划委员会"
 PHI_Economic_Council_desc: "复兴不能靠运气。委员会把每一吨水泥、每一度电都排进共和国的第一张计划表。"
 PHI_Free_Labor_Mandate: "自由工团的授权"
 PHI_Free_Labor_Mandate_desc: "劳联大会一致通过：共和国的下一程，由工会掌舵。西德整理了一下领带。"
 PHI_Guerrilla_Integration: "游击队整编之争"
 PHI_Guerrilla_Integration_desc: "虎克的枪要不要编进共和国陆军？将军们吵翻在军部——而虎克的军旗在营房外没有降下。"
 PHI_Huk_Vanguard: "虎克先锋"
 PHI_Huk_Vanguard_desc: "塔鲁克在军旗前宣誓：佃农的共和国，由握过锄头也握过枪的人来领导。"
 PHI_Insurrection_Thesis: "起义论纲"
 PHI_Insurrection_Thesis_desc: "拉瓦的论文在政治局传阅：共和国可以由选票建起，也可以由枪杆接管。这不是威胁，是论纲。"
 PHI_Internationale_Seat: "第三国际的席位"
 PHI_Internationale_Seat_desc: "法伦斯泰尔的会桌上要有菲律宾的声音：亚洲的革命经验，由这个群岛来陈述。"
 PHI_Japan_Reparations: "对日索赔使团"
 PHI_Japan_Reparations_desc: "账单寄向东京：血债折算成机床、轮船与钢铁，一笔一笔都要还。"
 PHI_Land_Reform_Corps: "土地改革公署"
 PHI_Land_Reform_Corps_desc: "丈量、登记、发照——公署把地契从高利贷的抽屉里搬进佃农的胸口口袋。"
 PHI_Lava_General_Secretary: "铁的总书记"
 PHI_Lava_General_Secretary_desc: "拉瓦当选总书记。巴黎发来贺电，马尼拉的电文却写着：同志们，斗争才刚刚开始。"
 PHI_Malaya_Goodwill: "南洋亲善使节"
 PHI_Malaya_Goodwill_desc: "轮船向南，驶向星洲与雅加达。南洋的社会主义同路人，值得一支常驻的使节船队。"
 PHI_Manila_Reborn: "马尼拉重光"
 PHI_Manila_Reborn_desc: "太平洋战争把马尼拉夷成了东方的华沙。清走瓦砾，共和国要从港口重新站起来。"
 PHI_Mass_Literacy: "全民识字运动"
 PHI_Mass_Literacy_desc: "识字班开进每一座巴里奥。会用铅笔的佃农，才看得懂分成的账目。"
 PHI_Military_Academy: "菲律宾军事学院"
 PHI_Military_Academy_desc: "碧瑶的军校重新开课。新式地图桌上摆着的不只是吕宋，还有整个南洋。"
 PHI_Minimum_Wage: "最低工资宪章"
 PHI_Minimum_Wage_desc: "八小时、最低工资、工伤赔付——宪章一贴出，马尼拉的老板们连夜算账。"
 PHI_New_Settlements: "移民垦殖计划"
 PHI_New_Settlements_desc: "无地的农民坐上南下的轮船，去棉兰老与民都洛的莽原上种出自己的田。"
 PHI_Offshore_Patrol: "近海巡逻队"
 PHI_Offshore_Patrol_desc: "七千座岛屿需要眼睛。巡逻艇带着旧雷达出港，监视每一条可疑的航道。"
 PHI_PKP_Reorganization: "党章重构"
 PHI_PKP_Reorganization_desc: "地下时代的编织小组重组为正规的民主集中制。党证换新，纪律换钢。"
 PHI_Paris_Liaison: "巴黎联络局"
 PHI_Paris_Liaison_desc: "马尼拉—巴黎专线开通。拉瓦说：国际主义的电报线，一天也不能中断。"
 PHI_Party_Congress: "党的路线之争"
 PHI_Party_Congress_desc: "联合工会、虎克军与党的三驾马车同聚一堂。路线问题不辩不明——可辩输了的人，未必认账。"
 PHI_Peasant_Leagues: "农民协会网"
 PHI_Peasant_Leagues_desc: "从邦板牙到新怡诗夏，农民协会的竹旗杆插满了吕宋平原。虎克的根，扎在田埂上。"
 PHI_Profit_Sharing: "劳资分红实验"
 PHI_Profit_Sharing_desc: "让工人坐进董事会？实验先从糖厂开始。分红单上的数字，比任何演说都动人。"
 PHI_Rice_Share_Act: "五五分成法"
 PHI_Rice_Share_Act_desc: "法典第一行：收成五五分成。地主们骂这是没收，虎克军说这仅仅是开始。"
 PHI_Roads_And_Rails: "公路与铁路"
 PHI_Roads_And_Rails_desc: "马尼拉铁路在战火里断了脊梁。铺上新的钢轨，让吕宋的米和棉兰老的麻跑起来。"
 PHI_Second_Republic: "第二共和国的黎明"
 PHI_Second_Republic_desc: "日本人走了，美国人回来了——而这一次，星条旗下升起的是一面社会主义共和国的旗。马尼拉的废墟上，第二共和国宣告自己的生日。"
 PHI_Sugar_And_Hemp: "糖与马尼拉麻"
 PHI_Sugar_And_Hemp_desc: "内格罗斯的糖田和比科尔的麻园是共和国的硬通货。糖换机器，麻换船位。"
 PHI_Taruc_Premier: "佃农的总理"
 PHI_Taruc_Premier_desc: "塔鲁克放下步枪走进总理府，卫兵是他的旧游击队员。吕宋的田埂上，鞭炮响了一整夜。"
 PHI_Tenancy_Inquiry: "佃制调查团"
 PHI_Tenancy_Inquiry_desc: "调查员背着算盘走进中吕宋：一石收成，地主拿几斗，佃户剩几升？账要当众算清楚。"
 PHI_US_Military_Mission: "美军顾问团"
 PHI_US_Military_Mission_desc: "美国教官带着新式操典回来了。有人叫他们保护人，有人叫他们太上教官。"
 PHI_US_Special_Relations: "对美特别关系"
 PHI_US_Special_Relations_desc: "美国人说：共和国的今天是我们给的。共和国说：那我们把明天也抵押给你们吗？谈判桌很长，西德很有耐心。"
 PHI_University_Restoration: "大学复课"
 PHI_University_Restoration_desc: "圣托马斯大学的走廊重新响起脚步声。被日本人烧掉的书桌，要用新书补上。"
 PHI_Veterans_Pensions: "复员与抚恤"
 PHI_Veterans_Pensions_desc: "打过巴丹、走过死亡行军的人不能被遗忘。抚恤金虽薄，账要记到最后一户。"
 PHI_amado_hernandez: "阿马多·埃尔南德斯"
 PHI_amado_hernandez_desc: "劳联名誉主席、工会诗人。他的狱中诗稿是这个共和国最锋利的良心。"
 PHI_barrio_autonomy: "巴里奥自治"
 PHI_barrio_autonomy_desc: "从巴里奥开出的权力之花：乡村的事，佃农自己议。"
 PHI_carlos_romulo: "卡洛斯·P·罗慕洛"
 PHI_carlos_romulo_desc: "亲美外交家，联合国宪章的签名者之一。在美国与巴黎之间，他是共和国最体面的掮客。"
 PHI_casto_alejandrino: "卡斯托·阿莱汉德里诺"
 PHI_casto_alejandrino_desc: "虎克军宿将，中吕宋游击区的定海针。"
 PHI_cipriano_cid: "西普里亚诺·西德"
 PHI_cipriano_cid_desc: "劳联首任主席，战前工运宿将。日占岁月里保全了工会网络，如今在美军扶植的社会主义共和国执掌航舵——一个信奉工团立国的务实派，把巴丹的伤口酿成谈判桌上的筹码。"
 PHI_claro_recto: "克拉罗·雷克托"
 PHI_claro_recto_desc: "民族主义参议员，宪法的守夜人。他既警惕华盛顿，也警惕巴黎。"
 PHI_huk_down_tt: "虎克军的§R影响力下降§!"
 PHI_huk_up_tt: "虎克军的§G影响力上升§!"
 PHI_jesus_lava: "赫苏斯·拉瓦"
 PHI_jesus_lava_desc: "党的军事委员，拉瓦家最年轻的兄弟，秘密工作的行家。"
 PHI_jose_laurel: "何塞·劳雷尔"
 PHI_jose_laurel_desc: "日占时期的前总统，被战争撕成两半的人：有人叫他叛国者，也有人叫他替菲律宾挡子弹的盾。"
 PHI_jose_lava: "何塞·拉瓦"
 PHI_jose_lava_desc: "菲律宾共产党总书记，会计出身的职业革命家。他坚信巴黎才是国际主义的灯塔，主张以铁的纪律把共和国锻造成东方的堡垒。"
 PHI_labor_charter: "劳动宪章"
 PHI_labor_charter_desc: "工团立国：工资、工时与分红写进共和国的宪章。"
 PHI_lava_down_tt: "亲巴黎派的§R影响力下降§!"
 PHI_lava_up_tt: "亲巴黎派的§G影响力上升§!"
 PHI_luis_taruc: "路易斯·塔鲁克"
 PHI_luis_taruc_desc: "虎克军总司令，吕宋佃农之子。他的游击队曾把日本人拖进中吕宋的泥沼，如今枪口未凉：五五分成不落地，虎克永不放下枪。"
 PHI_macario_peralta: "马卡里奥·佩拉尔塔"
 PHI_macario_peralta_desc: "美菲游击队出身的正规化派将领，游击队整编政策的坚定推手。"
 PHI_pedro_abad_santos: "佩德罗·阿巴德·桑托斯"
 PHI_pedro_abad_santos_desc: "社会主义长老，塔鲁克的引路人。一生清贫，佃农们只叫他卡业佩德罗。"
 PHI_pelagio_cruz: "佩拉希奥·克鲁斯"
 PHI_pelagio_cruz_desc: "空军出身的正规军少壮派，主张军队现代化高于一切。"
 PHI_reconstruction_council: "经济计划委员会"
 PHI_reconstruction_council_desc: "把废墟上的马尼拉变成图纸上的马尼拉：计划、预算与砖瓦一起上。"
 PHI_union_down_tt: "亲美工会派的§R影响力下降§!"
 PHI_union_up_tt: "亲美工会派的§G影响力上升§!"
 PHI_vanguard_party: "先锋党"
 PHI_vanguard_party_desc: "铁的纪律、铁的队伍——党指引共和国的每一个前进步伐。"
 PHI_vicente_lava: "维森特·拉瓦"
 PHI_vicente_lava_desc: "党的元老理论家，战时地下抵抗的传奇组织者。病榻上的他，论著仍是干部学校的必修课。"
