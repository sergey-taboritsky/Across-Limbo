 FRA_Pierre_Billotte: "皮埃尔·比约特"
 FRA_Pierre_Billotte_desc: "§Y出生于：§!§L1906年3月8日，法兰西共和国，巴黎§!"
 FRA_Pierre_Billotte_commander_desc: "§Y出生于：§!§L1906年3月8日，法兰西共和国，巴黎§!\n§Y人物背景：§!§L“斯通尼屠夫”皮埃尔·比约特出身军人世家，并自幼便以参军为志。在他仍读初中之时，革命爆发，公社政权建立，而其父母虽未参加革命兵变，但考虑到小比约特过于年轻不宜远行，便全家留在革命后的巴黎。\n\n1924年，比约特报名前往装甲兵学院，并于1927年毕业，同年以装甲兵志愿军的身份前往广州协助国民革命军。次年，他跟随部分国民党军官来到加尔各答，协助印度装甲部队建设。1931年初，法国因古吉拉特危机撤回驻印军事顾问团后，比约特回国担任第41坦克营的营长，并授衔上尉。1937年，由于加香政府重视装甲部队的新政策，升任少校连长。\n\n第二次世界大战初期，随着德军部队向色当进军，比约特率部在其进军路线上的斯通尼小镇驻防。在遭遇德军第八装甲团后，比约特亲自驾驶坦克带队出击，总计摧毁德军坦克33辆、反坦克炮超20门。比约特一战成名，于1940年官至准将，1942年升为少将。在战争结束时，其已因对革命的忠诚以及对装甲作战的精通而闻名，并担任法国装甲部队的总参谋长。§!"
