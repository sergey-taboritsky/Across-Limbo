 FRA_event.1.t: "维克托·塞尔日去世"
 FRA_event.1.d: "昨日深夜，富有争议的政治家维克托·塞尔日于巴黎公社医院心脏病突发而去世。\n\n塞尔日曾于臭名昭著的马索·皮韦尔政府担任内政部长，而在雪月革命后随皮韦尔一同退出政坛。此后，他加入国际志愿军，先后活跃于西班牙、阿根廷、美国等多个革命战场中。第二次世界大战期间，他冒生命危险深入前线鼓动军队士气，为对德作战做出了较大贡献。战后，他重新担任起皮韦尔留下的垂死政党——法兰西社会主义工人党的主席。\n\n目前，公社内部对他的评价较为分化，一部分人认为他已通过支援革命赎清了做部长时的罪恶，但更多人始终无法原谅皮韦尔内阁对革命犯下的罪行。无论如何，随着塞尔日去世，法兰西再次失去了一名经历过公社诞生的老革命者。值得注意的是，前来吊唁的社工党领导层再次陷入群龙无首的境地，混乱已经在其党组织内蔓延开来。"
 FRA_event.1.a: "革命的旧臣逐渐远去了。"
 FRA_event.2.t: "最后的演讲"
 FRA_event.2.d: "同志们！\n\n当战争的尘埃终于不再掩藏天空，我也终于到了向红旗告别的时候。\n\n八十年前我降生在布列塔尼的渔村，今日站在由你们铸就的社会主义法兰西心脏——这里曾匍匐着金融寡头的宫殿，如今回荡着工人合唱团的《国际歌》。我们共同书写的史诗里：当资产阶级在1919年跪倒在普鲁士铁蹄前，是革命工人筑起街垒化作刺向黑暗的投枪！在勒阿弗尔的船厂地窖，在马赛的洗衣房密室，一万个日夜的星火燎原，终让红旗飘扬在解放的法兰克福！\n\n曾经，我们也为列宁同志的失败哀悼。但这不是牺牲者的纪念碑，而是战斗者的接力棒。看那雷诺工厂的流水线——从前每小时生产资本家利润，如今每分钟诞生劳动者的尊严。我们的联邦宪章，这部浸透人民意志的文书，终结了银行家操控议会的百年闹剧。当洛林矿工的女儿走进索邦大学的课堂，当阿尔及尔港口终于升起平等的红旗，我们兑现了1794年雅各宾派未竟的理想，也让1871年的烈士们为我们骄傲。\n\n不，同志们，不要喊“加香万岁”。不，同志们，真正的奇迹在你们之间——机械师玛丽昂发明了新型拖拉机，邮差路易组建了社区医疗队。这才是社会主义的精髓：当压迫的锁链化作锻造新世界的钢水，每个普通人都将成为历史的主人。现在轮到你们守护这份荣光......警惕那些披着赤色外衣的豺狼！他们会用无数官僚机关束缚革命——就像1935年的皮韦尔政府，那些承诺革命却背叛的叛徒！但请相信年轻一代，相信新的中央委员会，他们懂得如何击败俄罗斯的野心，让社会主义的红旗最终插遍全球。\n\n这条1920年图尔大会的领巾，将随我回归布列塔尼的海风。当潮水漫过圣马洛的礁石，请记住：一个老水手最后的忠告不是停泊，而是启航！法兰西的命运永远属于奋斗者——前进吧同志们，直到世上最后一根锁链断裂，直到全人类在晨曦中同唱——"
 FRA_event.2.a: "“英特纳雄耐尔，就一定要实现！”"
 FRA_event_2_a_tt: "§R鲍里斯·苏瓦林§!将接任法兰西共产党中央委员会主席，§R艾伯特·特雷特§!将接任法兰西公社联邦公社中央理事会主席"
 FRA_event.3.t: "中央理事会一日"
 FRA_event.3.d: ""
 FRA_event.3.a: "好像苏瓦林同志讲的有些道理......"
 FRA_event.3.b: "可是特雷特同志的成绩做的不错......"

 FRA_UROE_event.1.t: "归还托管领"
 FRA_UROE_event.1.d: "自第二次世界大战结束以来，我们便对莱茵河西岸的德意志领土实行军事托管。此举不但能够确保新生的德意志共和国对巴黎忠诚，还能够提供法兰西实现其合理领土诉求的良好时机。因此，莱茵兰已经在法军占领下度过超过一年时光。\n\n不过，随着国内重建再次提速，占领军的军事开支日益显得沉重且无意义。最终，于1947年12月30日，公社中央理事会主席[FRA.GetLeader]宣布将会在近期将莱茵兰归还德国。如今，托管的结束已成定局，但我们仍有最后一件事需要决定——那就是萨尔的未来。\n\n萨尔作为莱茵兰煤炭资源最丰富，同时也最贴近法国边界的省份，向来被视为法兰西“自然疆界”的一部分。倘若我们想要，完全有能力宣布将该地作为特别自治省纳入法兰西，为后续的全面整合做准备。当然，将萨尔一并归还德国预计将可以有效加强欧洲盟友之间的凝聚力，并收获德国人的好感，同时还能节省未来整合萨尔的花费。"
 FRA_UROE_event.1.a: "萨尔将会是法兰西不可争议的领土！"
 FRA_UROE_event.1.b: "这是德国土地，理应交还德国。"
 FRA_UROE_event.2.t: "任命行政长官？"
 FRA_UROE_event.2.d: "如今，撤出莱茵兰已成定局，法兰西也将失去通过莱茵地区影响德国政治的能力。不过，在全面撤出前我们仍可进行最后一次干预，以影响即将到来的德国全国委员会选举，那就是为莱茵地区任命一位行政长官。\n\n首先是德国共产党莱茵支部的领导人奥托·尼伯格尔。他是萨尔兰红色阵线战士同盟的领导人和创建者，在莱茵地区的影响力举足轻重。与此同时，德国共产党与法兰西共产党拥有较好的党际关系，再加上此人曾在二战期间来法避难，我们能够确保他对巴黎的忠诚。与此同时，德国自由工人联合会的创始元老贝托尔德·卡恩也能胜任此项工作。他是著名的工团主义工会活动家，任命他可以获得莱茵当地占人口主要成分的工人们拥戴，还能进而获得自由工联正在执政的威斯特伐利亚的友谊。此外，德国社会主义工人党的女政治家凯特·弗兰肯塔尔也希望获得这一职位。她的政治观点相对较为温和，能够同时被大部分民众接纳，同时我们也能确保法兰克福方面能够接受这一人选。\n\n我们能够确认的是，无论做出任何任命，得到任命的行政长官都将对法兰西心怀感激，同时尽量争取他所代表的政治力量赢下德国。当然，我们也可以不做这种任命，将选择权交给莱茵本地人民，以节约我方干涉能力，促进欧洲团结。"
 FRA_UROE_event.2.a: "任命德国共产党莱茵支部的奥托·尼伯格尔。"
 FRA_UROE_event.2.b: "任命德国自由工联莱茵分支的贝托尔德·卡恩。"
 FRA_UROE_event.2.c: "任命德国社工党莱茵支部的凯特·弗兰肯塔尔。"
 FRA_UROE_event.2.e: "为什么不交给本地人自己决定呢？"

#决议
 FRA_souvarine_treint_balance_decision_category: "公社领导权争夺"
 FRA_souvarine_treint_balance_momentum_buildup_decision: "蓄势待发"
 FRA_souvarine_treint_balance_momentum_buildup_decision_desc: "随着苏瓦林同志与特雷特同志的矛盾逐渐公开化，党的干部、各公社领导人乃至广大工农群众纷纷表态，支持自己心仪的政治观点。因此，在争斗中占据上风的一方将更加容易获取支持，从而巩固自身优势地位。"
 FRA_souvarine_treint_balance_dragging_on_tt: "§R广泛的论战或许有益于公社政治健康发展，但长期处于此状态也会削弱公社的凝聚力与执行力。§!"

#GUI
 FRA_Party_Central_button_tt: "§Y法兰西共产党中央委员会§!"
 FRA_Party_Central_button_delayed_tt: "作为法兰西共产党的领导机构，中央委员会是雪月革命以来法国政治生活的心脏所在。来自各行各业、不同地区的中央委员们在此处行使权力，规范职权、决定各项要务。因此，为争取法国的全部政治领导权，获得中央委员会的支持必不可少。\n\n中央委员会§Y权重§！：[?FRA_Party_Central_weight_var]\n中央委员会§Y倾向§！：§Y[Get_FRA_Party_Central_leaning_sploc]§! [?FRA_Party_Central_leaning_showcase_var]%"
 FRA_Commune_Council_button_tt: "§Y法兰西公社联邦公社中央理事会§!"
 FRA_Commune_Council_button_delayed_tt: "公社中央理事会诞生于1920年代，也即法国革命早期。作为各公社组成的平等联邦，公社中央理事会是法国的国家立法机关，平等地代表各公社对全国范围的各项事务进行决断。\n\n中央理事会§Y权重§！：[?FRA_Commune_Council_weight_var]\n中央理事会§Y倾向§！：§Y[Get_FRA_Commune_Council_leaning_sploc]§! [?FRA_Commune_Council_leaning_showcase_var]%"
 FRA_Department_Conference_button_tt: "§Y法兰西公社联邦部长会议§!"
 FRA_Department_Conference_button_delayed_tt: "部长会议是雪月革命成功后，前工农反对派为进一步将国家革命化、防范下一次工会官僚独裁而设立的行政机关，用于代替先前的政府，而部长会议主席则取代先前的总理职务。\n\n部长会议§Y权重§！：[?FRA_Department_Conference_weight_var]\n部长会议§Y倾向§！：§Y[Get_FRA_Department_Conference_leaning_sploc]§! [?FRA_Department_Conference_leaning_showcase_var]%"
 FRA_Red_Army_High_Command_button_tt: "§Y法兰西红军最高统帅部§!"
 FRA_Red_Army_High_Command_button_delayed_tt: "红军最高统帅部曾在第二次世界大战中发挥极为重要的作用，并因对大片德意志与意大利地区领土进行托管而持续发挥着不可替代的重要功能。由于国际局势在世界大战结束后日趋紧张，取得红军的认可是成为正式领导人不可或缺的一环。\n\n最高统帅部§Y权重§！：[?FRA_Red_Army_High_Command_weight_var]\n最高统帅部§Y倾向§！：§Y[Get_FRA_Red_Army_High_Command_leaning_sploc]§! [?FRA_Red_Army_High_Command_leaning_showcase_var]%"
 FRA_Third_International_button_tt: "§Y国际工人联合会§!"
 FRA_Third_International_button_delayed_tt: "第三国际成员众多，包含的意识形态也同样纷繁复杂。尽管其约束力已随着帝国公约的崩溃而大幅下降，按派系分裂的痕迹也日渐清晰，但取得第三国际的认可仍然对团结全国乃至整个社会主义阵营有着极为重要的意义。\n\n第三国际§Y权重§！：[?FRA_Third_International_weight_var]\n第三国际§Y倾向§！：§Y[Get_FRA_Third_International_leaning_sploc]§! [?FRA_Third_International_leaning_showcase_var]%"
 TNW_FRA_leaning_neutral_tt: "中立"

 FRA_Commune_Council_leaning_decrease_tt: "§Y中央理事会§!对§Y[Get_FRA_Commune_Council_leaning_sploc]§!支持度将会降低§R[?FRA_Commune_Council_leaning_tooltip_var]%§!"
