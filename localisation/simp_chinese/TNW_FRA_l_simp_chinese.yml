#政党
 FRA_communist_party: "法兰西共产党"
 FRA_communist_party_long: "法兰西共产党(Parti Communiste Francais)\n\n§W法兰西共产党是以马克思主义为指导的共产主义工人政党，前身为第二次公社革命后组建的法国工农共产党。举世闻名的“雪月革命”后，工农共产党主席马塞尔·加香被推举为新一届公社理事会主席，并借此机会整合了一批边缘马克思主义组织，正式建立法共。\n\n该党团结在加香周边，但同时存在不同派系，如主张引入更多布尔什维克模式的苏瓦林派与主张加强党组织对国家掌控力的特雷特派等。随着加香主席年事已高，身体状况逐渐恶化，党内各派正围绕其继承人身份展开争夺。§!\n"
 FRA_syndicalism_party: "社工党/总工会-工团国际法国支部"
 FRA_syndicalism_party_long: "法兰西社会主义工人党/法兰西总工会-工团国际法国支部(Parti Socialiste Français des Travailleurs/Confédération Générale du Travail - Section Francais des Internationale Syndicaliste)"
