 FRA_Authoritarianism_party: "民族革命行动组织- 共和派"
 FRA_Authoritarianism_party_long: "民族革命行动组织 - 法兰西社会党/民主共和联盟(Action Organisation pour la Révolution Nationale - Parti Social Français/Union pour la Démocratie Française)\n\n§W即使阿尔及尔政权在国际联军登陆下化作齑粉，但得利于公社鼓励黑脚向国内移民的宽容政策，大量前政权效忠派得以更名换姓回归法国本土，并结成广泛的反社会主义地下组织，即“民族革命行动组织”(AORN)。该组织受到俄国与多瑙联邦的部分支持，尝试渗透公社政府、破坏工业生产、制造恐怖袭击等方式颠覆法兰西现政权。对于该目标完成后的新政权组织模式，参与该组织的不同派系见解迥异，但这并不影响他们在反对社会主义这一共同目标下暂时团结一致。\n\n“共和派”由前法兰西第三共和国的旧建制派政党所构成，主力是德拉罗克在阿尔及尔组建的法兰西社会党，以及激进党右派与各自由派政党联合形成的民主共和联盟。此两党希望在推翻公社政府后回归法兰西的共和传统，恢复第三共和国。§!\n"
 FRA_Absolutism_party: "民族革命行动组织 - 保皇派"
 FRA_Absolutism_party_long: "民族革命行动组织 - 法兰西行动(Action Organisation pour la Révolution Nationale - Action Française)\n\n§W即使阿尔及尔政权在国际联军登陆下化作齑粉，但得利于公社鼓励黑脚向国内移民的宽容政策，大量前政权效忠派得以更名换姓回归法国本土，并结成广泛的反社会主义地下组织，即“民族革命行动组织”(AORN)。该组织受到俄国与多瑙联邦的部分支持，尝试渗透公社政府、破坏工业生产、制造恐怖袭击等方式颠覆法兰西现政权。对于该目标完成后的新政权组织模式，参与该组织的不同派系见解迥异，但这并不影响他们在反对社会主义这一共同目标下暂时团结一致。\n\n“保皇派”是指希望恢复法兰西旧君主制或建立新王朝的一系列政治组织，其主力为持整合主义观点的法兰西行动。他们摈弃一切议会民主，并宣称法兰西应在推翻社会主义政权后回归法国大革命前的传统君主制统治。§!\n"
 FRA_Nationalism_party: "民族革命行动组织 - 激进派/民族工人党"
 FRA_Nationalism_party_long: "民族革命行动组织-法兰西复兴/法兰西民族工人党(Action Organisation pour la Révolution Nationale - Redressement Français/Parti Ouvrier National Français)\n\n§W即使阿尔及尔政权在国际联军登陆下化作齑粉，但得利于公社鼓励黑脚向国内移民的宽容政策，大量前政权效忠派得以更名换姓回归法国本土，并结成广泛的反社会主义地下组织，即“民族革命行动组织”(AORN)。该组织受到俄国与多瑙联邦的部分支持，尝试渗透公社政府、破坏工业生产、制造恐怖袭击等方式颠覆法兰西现政权。对于该目标完成后的新政权组织模式，参与该组织的不同派系见解迥异，但这并不影响他们在反对社会主义这一共同目标下暂时团结一致。\n\n“激进派”是指这一组织内最边缘、最激进的政治团体，一般既反对议会民主，也反对传统主义，而通常采用相似于萨文科夫政权的革命民族主义思想作为指导。其中，菲利普·贝当元帅亲自组织、战败后进一步激进化的法兰西复兴坚持较为“正统”的萨文科夫式战斗民族主义，而曾由公社叛逃至阿尔及尔的雅克·多里奥组建的法兰西民族工人党更加偏向莫斯利式极权主义与整体民族主义的融合。§!\n"

