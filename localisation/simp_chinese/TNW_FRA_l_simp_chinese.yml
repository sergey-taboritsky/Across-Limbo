 FRA_Charles_Tillon: "夏尔·蒂永" #海军总长
 FRA_Charles_Tillon_desc: "§Y出生于：§!§L1897年7月3日，法兰西共和国，雷恩§!"
 FRA_Charles_Tillon_navy_chief_desc: "§Y出生于：§!§L1897年7月3日，法兰西共和国，雷恩§!\n§Y人物背景：§!§L夏尔·蒂永出生于雷恩市的一个工人阶级家庭。1913年，他从职业学校毕业，并以装修工身份参加工作。1916年，他被法国海军征召，服役于吉尚号轻巡洋舰，并在一年内升任军务长。1919年，随着战争即将走向失败，蒂永带领舰上水兵发动起义，并使得该舰成为随后的法国内战中少数参加公社军队的战舰。\n\n革命胜利后，蒂永原本希望回到雷恩继续做装修工，但由于公社海军建设刚刚起步急缺人才，蒂永最终被说服留在海军服役，同时加入了加香组织的工农共产党。1935年的动荡中，蒂永是公社军队中较前开始反对皮韦尔政权的将领之一。随后，他率先表态支持新政府，并因此升任海军总长。\n\n第二次世界大战期间，蒂永指挥公社海军与英国共和海军并肩作战，共同粉碎了德国公海舰队封锁第三国际的尝试。§!"
