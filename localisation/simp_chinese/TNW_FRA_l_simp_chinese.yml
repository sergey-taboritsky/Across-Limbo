#民族精神
 FRA_Home_of_the_Revolution: "革命始源地"
 FRA_Home_of_the_Revolution_desc: "自启蒙时代以来，法兰西便是为政治变革摇旗呐喊的先锋。从1789年的共和国，到1871年的巴黎公社，再到1920年世界上首个成功的社会主义政权，激进的革命思潮向来偏好在这片土地开花结果。\n\n在如今革命盛行的时代，法兰西已经摩拳擦掌，准备将“英特纳雄耐尔”的誓言化作现实。"
 FRA_Growing_demographic_problems: "日益严峻的人口问题"
 FRA_Growing_demographic_problems_desc: "尽管最终取得对德战争的胜利，但法兰西又一次承受了难以负担的代价：数十万军人阵亡，而数倍于此的平民与退伍军人则承受着终身残疾之苦，难以负担体力劳动。自第一次世界大战结束以来刚有好转迹象的劳动力与人口问题再次浮出水面，而除了踏上人口恢复的漫漫长路外，处理此类问题别无他法。"
 FRA_Legacy_of_Levose_Cachin: "雪月遗产：工农联盟"
 FRA_Legacy_of_Levose_Cachin_desc: "如果说塑造当今法国政治体制最重要的事件是1920年的革命，那么第二重要的事件一定是1936年初的“光荣雪月”。为了推翻官僚主义缠身而愈发腐朽的工团主义工会暴政，工农共产党、无政府主义者以及各地自发行动的革命工人们将马塞尔·加香推上理事会主席之位，并随后由法国共产党重塑了公社政体。\n\n如今，尽管加香主席年迈而身体欠佳，但他仍然作为领导公社平稳度过世界大战的英明领袖而饱受爱戴。不过，随着战时改选限制于1947年解除，加香主席已经明显表示出隐退之意。"
