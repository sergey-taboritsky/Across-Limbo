#人物
 FRA_Hubert_Lyautey: "于贝尔·利奥泰"
 FRA_Hubert_Lyautey_desc: "元帅，独裁者，国家的救主，权贵阶层的傀儡；于贝尔·利奥泰的名字长期以来都被困在自由主义者和社会主义者的陈词滥调和扭曲中，以至于没人能分得清什么是真实。\n\n但正如利奥泰元帅对自己的定义那般，作为一个“有思想的行动者”，他唤起了法兰西殖民帝国在阿非利加的伟大事业与主赐的神圣的开化使命。自从圣西尔毕业以来，利奥泰总是驰骋于法兰西的海外土地，从马格里布的大漠到北圻的黄高森林，再到马达加斯加和奥兰区的堡垒。“在这里我如鱼得水”，他如此写道。\n\n在担任陆军部长的日子里，利奥泰从未怀疑过法兰西在那场大战中是否能赢得胜利。然而在骄傲的凯撒仓皇出逃后，随之而来的却是席卷半个欧洲的赤潮。共和国战胜了德国，但普恩加莱幻想中“正义的善恶有报”却被横跨欧洲的铁幕所斩断。对红色政权的继续战争并未给法国带来任何好处，反倒促成了一场使共和国近乎崩溃的“猩红之冬”，曾经同属于一个战壕的士兵刀剑相向。尽管利奥泰和其他军官们尽全力镇压了共产主义运动的西进，但法兰西民族的裂痕已经难以修补。\n\n尽管大元帅本人从未掩饰过自己对正统主义的好感和对激进共和派的厌恶，但身为一个善于变通的务实派，他在战后始终远离军队极端派系的小圈子，在正统派的军官和流亡的吉斯公爵试图通过军事政变推翻议会时，他选择站在了政府一方，也正是由于此次政变的影响，利奥泰在这之后又重新回到了政治中心。\n\n在大萧条席卷法国以后，反议会主义运动的盛行与议会中右翼建制派的全面掌权，让大元帅这个左右逢源的陆军部长成为了两方争夺的人物，正如五十年前那样，徒劳无益的政治争吵无法实现它对人民的承诺，而这种时候就需要一个强有力的领袖领导国家。在斯塔维斯基的丑闻令议员们蒙羞时，人们向大元帅发出了呼声：“去爱丽舍宫！”\n\n在右翼激进党政府因丑闻下台后，利奥泰在青年爱国者，右翼联盟，军队和首都警察的拥护下，绕开了选举程序，经过了象征性的宣誓就职后，坐上了共和国的第一把交椅。\n\n一切是如此地突兀，在许多权贵眼中，利奥泰政权只是一个过渡性的威权政府，不谙政治的老元帅充其量只是右翼技术官僚的传声筒和“单纯”的军官们用于实现其政治目标的工具。但这位昔日帝国的捍卫者真的甘心做他人的傀儡吗？"
