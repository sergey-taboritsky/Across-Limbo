 MRT_Moktar_Daddah_desc:0 "从巴黎法学院归来的年轻律师，毛里塔尼亚在新一代政治家中的门面。他兼有部落长老的正统与法式左翼的辞令，在游牧部落的毛毯与巴黎的会议室之间来去自如——所有人都说，这个年轻人的名字还会被提起很多年。"
