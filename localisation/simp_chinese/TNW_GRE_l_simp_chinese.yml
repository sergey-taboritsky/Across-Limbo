#R41 本地化整合（来源：TNW_welcome_l_simp_chinese.yml 等）
#--- TNW_welcome_l_simp_chinese.yml#welcome intro ---
 TNW_welcome_GRE_intro_text_1: "希腊曾是巴尔干半岛首个获得独立的民族国家，也曾是巴尔干半岛的首个共和国。然而，希腊的一切荣耀似乎从未与其平民人口有过任何关系。不但如此，自从第二次希土战争的失败以来，希腊的对外扩张之路便充满荆棘。\n\n希腊曾经在著名“贤相”韦尼泽洛斯带领下克服内部分裂，尝试参与世界大战，但中央同盟意料之外的胜利使得数十万希腊男儿的性命只换回一纸《萨洛尼卡条约》的无功而返。经济崩溃，民生凋敝，国王退位，共和成立，军队政变......直到康迪利斯建立军事独裁，并在五年后被民主政党推翻，希腊才重新得到些许稳定。\n\n可惜，1931年至1938年的短暂稳定发展阶段又一次被无情的炮火碾碎。为了收复马其顿，希腊站在德国一方加入世界大战，与巴尔干之主在马其顿前线对峙，耗费了无数生命，直到国民经济难以承受而工人民兵进军雅典。"
 TNW_welcome_GRE_intro_text_2: "希腊的社会党是巴尔干地区起步较早的左翼政党之一。在巴尔干战争前夕，阿夫拉姆·贝纳若亚便在萨洛尼卡组织起附属于联合进步委员会的“社会主义工人联盟”。1915年，随着国家分裂的潮汐不断撕扯希腊的肌体，社会主义工人党在这一联盟的基础上成立，并立刻成功进入议会，得到工人群体的广泛支持。\n\n1924年，经历长足发展的社工党决定重组。党内新秀潘德利斯·波利欧普洛斯高喊“布尔什维克化”口号击败创始人贝纳若亚，并迅速将党转变为革命先锋，联系工人采取激进行动。军政府时期的打压并未摧毁党内斗志，反而巩固了其作为主要反对派的地位。\n\n第二次世界大战期间的希腊作为德国在南线的重要盟友，承担了难以忍受的负担，于是在军事冒险失败后，工人民兵进军雅典，希腊工人共和国成立。如今，希腊作为红色阵营在巴尔干的落脚点，是国际重要的欧洲盟友之一。"
