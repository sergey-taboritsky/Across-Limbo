#顾问
 GRE_Pandelis_Pouliopoulos: "潘德利斯·波利欧普洛斯"
 GRE_Pandelis_Pouliopoulos_desc: "潘德利斯·波利欧普洛斯于1900年出生于底比斯。1919年他考入雅典大学进修法学，同年加入阿夫拉姆·贝纳若亚领导的希腊社会主义工人党。此时正值希腊于世界大战中战败，波利欧普洛斯发扬其口才，迅速为社工党在老兵群体中获得了支持。不过，这也让当时的希腊政府注意到了这个年轻的煽动家。1922年，他首次被捕，入狱半年后方才获释。\n\n不过，这次不幸经历远不足熄灭他的斗志。1924年，随着重组政党的声音愈发响亮，他击败党的创始人阿夫拉姆·贝纳若亚，并将党部分地布尔什维克化，极大提高了党组织的战斗力。就在此时，希腊的潘加洛斯独裁政府再次对他出手。他被以“鼓动色雷斯自治”为由宣判流放至爱琴海上的福莱甘兹罗斯岛。所幸，随着潘加洛斯在1926年倒台，他得以回归雅典。\n\n此后，他专注于促进党和工人的直接联系，并成功和希腊工总联达成选举同盟。直到1936年，雪月革命的外溢影响使他对工人运动的影响力大增，而随后希腊于第四次巴尔干战争中再次战败，他最终实现了自己的革命使命。"
