 GRE_event.9.t: "退守克里特"
 GRE_event.9.d: "没有宣战书，没有越境的坦克——只有一队队开进雅典的'志愿者'和一纸最后通牒。大陆各州转归在塞萨洛尼基成立的希腊王国临时政府，雅典的红旗随之落下。社工党中央与政府机关撤往克里特，以那里为新的首都；北爱琴与基克拉泽诸岛仍在手中，社会主义希腊没有结束，只是退到了海上。"
 GRE_event.9.a: "红旗退到海上，政府南迁克里特。"
