 GRE_Proud_winner: "骄傲的胜利者"
 GRE_Proud_winner_desc: "尽管希腊军队几乎没有出现在世界大战前线，但这场战争仍是希腊三十年来的首次军事胜利。如今，希腊军队的状态相比革命前几乎未有好转，可自满情绪却充斥着从士兵到军官的每一层级。"
 GRE_Industrial_Despair: "产业泥潭"
 GRE_Industrial_Despair_desc: "战争时期，希腊作为联军在巴尔干地区的“生产车间”，承接了许多转移自意大利与中欧地区的转移产业，从而使得工人队伍迅速膨胀起来。战争结束后，随着大量军事订单成为历史，这些新厂区反而促使原有的工农业合作社大规模破产，而这些工厂又随时可能迁回中欧与亚平宁半岛。就这样，生产过剩与生产不足同时出现在了希腊国内。" 
 GRE_The_undercurrent_of_politics: "暗流涌动的政局"
 GRE_The_undercurrent_of_politics_desc: "1938年的希腊革命从未彻底改造国家：从各种拒绝社会主义改造的地方势力到随着战争重新活跃起来的新资产阶级，各路势力如今正日趋合流，并希望挑战社工党的执政地位。与此同时，对左翼阵营的整合激发了党内本就活跃的宗派主义倾向，使得即使在党内，推行某些政策也显得举步维艰。"

