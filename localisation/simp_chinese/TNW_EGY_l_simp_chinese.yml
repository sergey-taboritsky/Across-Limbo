#国家介绍
 TNW_welcome_EGY_intro_text_1: "1916年，愚蠢的爱尔兰人悍然发动叛乱，虽然很快被征服以雷霆手段镇压，但他们还是贼心不死，竟然在3年后再次发动叛乱。那时，正是赤匪们肆虐欧洲之时，同时爆发的两场战争使得帝国陷入内忧外患的境地。那些久经沙场的一战老兵们不得不重操旧业，再次奔赴欧洲前线，所谓的黑褐部队可以说是毫无战斗力。只有爱尔兰的皇家警察部队艰难地支撑爱尔兰的局面，这群废物也根本没有办法结束这场冲突，他们简直是英格兰之耻。攻占都柏林的海关大楼更是增长了叛军这群无耻之徒的嚣张气焰，将这场冲突推向了高潮。\n\n1922年，这群可憎的恐怖分子竟然在利物浦的港口中安防炸弹，虽然并未造成大量人员和物资损失，却将大大激发了国内民众的反战情绪。数月之后，曼彻斯特又发生一起想通的爆炸案。1923年5月，新上任的斯坦利·鲍德温首相为平息民愤，不得不开始与爱尔兰当局展开谈判。经过一个月的讨论，谈判代表在首相的默许下同意了在爱尔兰北部四郡（伦敦德里郡，安特里姆郡，阿玛郡和唐郡）成立北爱尔兰，并且给予爱尔兰自治领身份的条约。\n\n随着《英爱条约》的签署，自从12世纪就作为英国固有领土的爱尔兰岛宣布独立，不过这群懒惰的爱尔兰人就算独立出去也掀不起什么风浪，他们能有今天的生活全靠帝国的恩惠。"
 TNW_welcome_EGY_intro_text_2: "与爱尔兰的叛徒议和之后，民众明没有想预想的那样平息怒火，鲍德温首相的声望反而是跌至谷底。1924年2月，工党党魁麦克唐纳承诺改善工人条件并且恢复经济，他自然是以极大的优势击败前首相，正式当选。虽然在任职演讲中，麦克唐纳公开反对苏维埃政权并承诺将不会推行社会主义政策。\n\n可是在1925年的1月，该届政府的首席财政大臣菲利普·斯诺登就开始宣扬社会主义政策，认为其能帮助英国走出战后的经济衰退，而麦克唐纳并未反对他的观点。4月，由于日益增长的财政赤字，斯诺登宣布将征收资本税。由于人们对苏维埃政权的恐惧，他的政策很快被多名议员指责，他被描述为一名意图在英国建立红色政权的卖国贼。麦克唐纳内阁被迫辞职，斯诺登在几天之后被开除工党党籍，由麦克唐纳继续担任工党领袖。这造成了工党的分裂，一些极左分子，包括斯诺登等人，很快就加入了成立不久的大不列颠共产党，简直就是一群疯子。\n\n随后，斯坦利鲍德温先生有以极大的优势击败工党，重新当选首相。而几个自由党分支则因为在支持组建一个反共产国际联盟和恰当的保护主义政策以恢复国家经济，重新组成了自由党联盟这个松散的执政联盟。这样的政策导向也帮助其在接下来的选举中获得了大量选民支持，重新成为第一大反对党。"
 TNW_welcome_EGY_intro_text_3: "时间很快来到1926年，更长的工作时间和更低的工资使得矿工们再也无法忍受，发动罢工。很快罢工就扩展到全国各大城市，许多其他行业的工人也纷纷加入进来，一场行业罢工发展成了一场总罢工。 政府很快做出反应，采取降幅并行的策略，一面排除警察维持治安，一面积极组织与工会代表展开谈判。但这群顽固不明的败类竟然与不列颠共产党那些赤匪沆瀣一气，和平的谈判也很快被暴力斗争所取代。此种情况之下，政府号召城市中的中产阶级组成志愿者，尽力保证这些真正的爱国分子们的日常生活。大规模的抗议活动在1927年初结束，但这些赤匪们并没有放弃，行业罢工和区域性罢工从未停止。\n\n鲍德温首相通过一次成功的镇压重新恢复了威望，在接下来的10年中，他与自由党密切合作，在劳资调解，失业保险和建立养老保险制度等社会福利方面做出改革。1932年，经过磋商，帝国特许制正是建立，政府通过建筑贸易壁垒的方式，使得英国本土的企业可以从海外殖民地或附属国的市场中以更低的价格获取原材料。\n\n时光荏苒，新年的钟声已然敲响，等待帝国的未来又会是什么样子呢?"

