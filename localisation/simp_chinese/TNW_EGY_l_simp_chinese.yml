 EGY_national_alliance_party_long: "国民联盟"

#新闻（英国交还苏伊士）
 EGY_news.4.t: "英国交还苏伊士运河"
 EGY_news.4.d: "开罗与伦敦同时宣布：经过数轮磋商，联合王国已同意将苏伊士运河区归还埃及，撤军将于年内完成。四十年的国耻以谈判桌上的签字告终。欧洲各国普遍将此视为大英帝国全球收缩的又一里程碑，而莫斯科则盛赞这是\"民族解放压倒殖民主义的历史性胜利\"。"
 EGY_news.4.a: "运河回家了。"
#经济线（纳赛尔·阿拉伯社会主义 / 纳吉布·门户经济）
 EGY_Econ_State_Steel: "国家的骨架"
 EGY_Econ_State_Steel_desc: "革命打破了旧世界的锁链，现在必须锻造新世界的骨架。指挥委员会的经济学家们达成共识：没有国家机器主导的工业化，埃及的独立就只是一句口号。"
 EGY_Deep_Land_Reform: "土改第二阶段"
 EGY_Deep_Land_Reform_desc: "旧帕夏的地产分完了，但分到的土地很快又在债主手里聚拢。第二步是把农户组织进合作社，让土地不再是债务的抵押品。"
 EGY_Nationalize_Banks: "银行国有化"
 EGY_Nationalize_Banks_desc: "信贷是国家经济的血液，而血液不能由外国股东掌握。米斯尔银行、各外国银行与保险公司被一夜之间收归国有。"
 EGY_Cooperatives: "合作社网络"
 EGY_Cooperatives_desc: "从尼罗河三角洲到上埃及，合作社接管了种子、化肥、信贷与收购。农民第一次以集体的名义与市场讨价还价。"
 EGY_Import_Substitution: "进口替代"
 EGY_Import_Substitution_desc: "洋布、火柴与水泥都要用宝贵的外汇去换。既然如此，就让埃及人自己来造——关税立起高墙，工厂在墙内生根。"
 EGY_Helwan_Steel: "赫勒万钢铁城"
 EGY_Helwan_Steel_desc: "在开罗以南的沙漠边缘，一座为钢铁而生的城市拔地而起。高炉的火光昼夜不熄——这是新埃及的黎明，也是它的脊梁。"
 EGY_Canal_Nationalization: "运河公司国有化"
 EGY_Canal_Nationalization_desc: "运河属于埃及——不仅领土属于埃及，公司的股份也属于埃及。苏伊士运河公司的收归国有，让流往伦敦的每一枚金币都改道开罗。"
 EGY_Free_Education: "免费教育"
 EGY_Free_Education_desc: "从乡村小学到开罗大学，学费被彻底废除。革命许诺：农民的孩子将成为工程师、医生和军官。教室比运河船闸还要拥挤，但没有人抱怨。"
 EGY_Public_Sector: "公共部门扩张"
 EGY_Public_Sector_desc: "国有化收来的工厂、银行与商店组成了庞大的公共部门。它雇佣了数以十万计的职员，也把国家的手伸进了经济生活的每个角落。"
 EGY_Five_Year_Plan: "第一个五年计划"
 EGY_Five_Year_Plan_desc: "效仿莫斯科的榜样，计划委员会把全国的钢、棉、电力与人力都填进了表格。表格上写着的不是数字，而是新埃及的时间表。"
 EGY_Aswan_Dam: "阿斯旺高坝"
 EGY_Aswan_Dam_desc: "在阿斯旺的第一瀑布之上，一道横跨尼罗河的大坝将驯服这条大河：防洪、灌溉、发电。莫斯科的工程师带来了图纸与贷款—— 这是人类自金字塔以来在埃及进行的最大工程。"
 EGY_Arab_Socialism: "阿拉伯社会主义"
 EGY_Arab_Socialism_desc: "既非莫斯科的马克思，也非伦敦的自由市场：一种植根于阿拉伯土地、以国家为引擎、以社会正义为许诺的社会主义。开罗自称它的摇篮。"
 EGY_Econ_Open_Door: "门户经济"
 EGY_Econ_Open_Door_desc: "纳吉布政府的信条朴素而坚定：埃及的财富不是被制造出来的，而是被交换出来的。打开门户，让棉花开路。"
 EGY_National_Bank: "国民银行与货币改革"
 EGY_National_Bank_desc: "一个独立的中央银行、一种稳定的埃镑、一套可信的账目。货币是国家的信用，而信用必须先于投资存在。"
 EGY_Cotton_Export: "棉花之路"
 EGY_Cotton_Export_desc: "埃及长绒棉是世界纺织业的圣杯。从亚历山大港的货栈到曼彻斯特的纺机，白色的黄金再次沿着尼罗河顺流而下。"
 EGY_Foreign_Capital: "引进外国资本"
 EGY_Foreign_Capital_desc: "门户开放的政府向欧洲的银行家们敞开了大门：法郎、英镑与美元被许以稳定的回报，工厂沿着开罗的环路生根。"
 EGY_Land_Market: "土地市场化"
 EGY_Land_Market_desc: "军政府没有没收旧地主的土地，而是把它们放回了市场。效率取代了清算——至少账面上如此。华夫脱党的旧绅士们对此颇为满意。"
 EGY_Canal_Tolls: "运河红利"
 EGY_Canal_Tolls_desc: "交还的运河重新成为摇钱树：过境费、引水费、仓储费——世界贸易的十分之一从这条水道流过，每一艘船都向开罗纳税。"
 EGY_Private_Industry: "私营工业激励"
 EGY_Private_Industry_desc: "低息贷款、免税期与廉价电力被提供给敢于办厂的实业家。国家的角色不是经营者，而是守夜人与清洁工。"
 EGY_Tourism_Nile: "尼罗河旅游"
 EGY_Tourism_Nile_desc: "金字塔、卢克索、尼罗河的落日——战后的欧洲人怀着对古老东方的向往涌向埃及。美元与法郎在游轮上、在集市里、在导游的口袋里流转。"
 EGY_Agri_Modernization: "农业现代化"
 EGY_Agri_Modernization_desc: "拖拉机、化肥与新式灌溉取代了木犁与沙希德水车。单位产量翻番的希望寄托在教科书与实验室上，而不在土地兼并上。"
 EGY_Trade_Accords: "贸易协定网"
 EGY_Trade_Accords_desc: "从贝尔格莱德到孟买，从伦敦到布宜诺斯艾利斯，埃及的签约桌上摆满了双边贸易协定。关税互惠是弱国外交最诚实的语言。"
 EGY_Open_Stock_Exchange: "重开证券交易所"
 EGY_Open_Stock_Exchange_desc: "战火中沉寂的开罗与亚历山大证券交易所重新鸣锣。股票、债券与期货在此定价——半个世界都曾在这里下单，如今轮到新的一代。"
 EGY_Financial_Hub: "区域金融中心"
 EGY_Financial_Hub_desc: "银行、交易所、保险公司与航运公会云集尼罗河畔。开罗不再是殖民地的商埠，而是三洲之间资金的十字路口。"

#经济线工具提示
 EGY_econ_nasser_root_tt: "需要：纳赛尔已在权力斗争中巩固地位"
 EGY_econ_naguib_root_tt: "需要：纳吉布已在权力斗争中巩固地位"

#经济理念
 EGY_state_steel_econ: "国家的骨架"
 EGY_state_steel_econ_desc: "国家主导的经济动员体制。工地上的口号是：先立骨架，再长血肉。"
 EGY_aswan_dam: "阿斯旺高坝"
 EGY_aswan_dam_desc: "驯服尼罗河的大坝带来电力、灌溉与民族自豪感——以及一笔要还三十年的贷款。"
 EGY_arab_socialism_cap: "阿拉伯社会主义"
 EGY_arab_socialism_cap_desc: "开罗自诩阿拉伯世界革命的心脏：国家掌舵、社会正义、以及一张写着五年时间的时刻表。"
 EGY_open_door_econ: "门户经济"
 EGY_open_door_econ_desc: "开放的市场、守信的货币与外来的资本——纳吉布政府的全部经济哲学浓缩在这四个字里。"
 EGY_foreign_capital_idea: "外国资本流入"
 EGY_foreign_capital_idea_desc: "欧洲的银行家们重新发现了尼罗河的诱惑。钱是中立的，它只追随秩序与回报。"
 EGY_nile_tourism: "尼罗河旅游"
 EGY_nile_tourism_desc: "法老们的陵墓成了国家的外汇来源。旅游部长说：先人们终于开始为子孙挣钱了。"
 EGY_financial_hub_cap: "区域金融中心"
 EGY_financial_hub_cap_desc: "开罗的金融区灯火通明。三洲的资金在这里交汇、定价、再出发——这是和平给予埃及的最高奖赏。"
#军事线（纳吉布·职业军队 / 纳赛尔·革命军队）
 EGY_Army_Professional: "职业军队"
 EGY_Army_Professional_desc: "纳吉布把军政府的第一句军事箴言写进了操典：军队是国家的盾，不是国家的头脑。革命结束了，军人的本分刚刚开始。"
 EGY_Old_Officer_Corps: "旧军官团复职"
 EGY_Old_Officer_Corps_desc: "被宫廷冷落多年的帝国陆军军官团接到了返聘书。他们未必爱革命，但他们懂行军、懂后勤、懂一条河防该怎么守。"
 EGY_Military_Academy: "军事学院改革"
 EGY_Military_Academy_desc: "开罗军事学院的课程表被重写：参谋作业、后勤学、外语。纳吉布要求军官首先是一名受过教育的国家公仆。"
 EGY_Veterans_Resettlement: "退伍军人安置"
 EGY_Veterans_Resettlement_desc: "拿枪的手放下枪之后也要有饭吃。安置署给老兵们分了地、贷了款、挂了勋章——顺便让他们记得该感谢谁。"
 EGY_Equipment_Standardization: "装备标准化"
 EGY_Equipment_Standardization_desc: "军队的仓库里躺着五六个国家的步枪，子弹互不通用。标准化委员会大笔一挥：从今往后，埃及军队只认一种口径。"
 EGY_Border_Guard: "边境警备司令部"
 EGY_Border_Guard_desc: "利比亚边境、苏丹边境、巴勒斯坦边境——三支警备部队拱卫国界。守土是防御性的任务，正如纳吉布的整个国防哲学。"
 EGY_Desert_Mobility: "沙漠机动部队"
 EGY_Desert_Mobility_desc: "在沙漠里，补给线就是生命线。机动部队学会了一件事：跑得快的军队省水的军队。"
 EGY_Naval_Modernization: "海军现代化"
 EGY_Naval_Modernization_desc: "地中海舰队得到第一批新舰。亚历山大港的船坞重新开工——红海与地中海的两扇门，都得有埃及的水兵站岗。"
 EGY_Air_Corps: "航空队重建"
 EGY_Air_Corps_desc: "飞行学院扩招了三倍的学员。教官们说：天空不认得革命，也不认得传统——它只认得谁训练得更认真。"
 EGY_Defense_Treaty: "国防合作协定"
 EGY_Defense_Treaty_desc: "与莫斯科签署的军购与训练协定落笔生效。纳吉布称之为生意而非结盟——但每个人都清楚，这生意让埃及军队焕然一新。"
 EGY_Shield_of_Republic: "共和国之盾"
 EGY_Shield_of_Republic_desc: "职业化、标准化、去政治化的军队终于成形。它不再干预政治，也不再被人干预——共和国最坚固的一面盾牌。"
 EGY_Army_New_Doctrine: "革命军队"
 EGY_Army_New_Doctrine_desc: "纳赛尔在自由军官的会议上宣布：旧军队已经死亡，新埃及需要一支新的军队——政治的、人民的、进攻性的军队。"
 EGY_Soviet_Arms: "俄式装备体系"
 EGY_Soviet_Arms_desc: "莫斯科的军火船卸下了成千上万支步枪、火炮与坦克。用俄国人的武器武装革命——这笔买卖开罗做得毫不犹豫。"
 EGY_Conscript_Army: "义务兵役制"
 EGY_Conscript_Army_desc: "征兵法把每一个埃及青年都编进了国防的名单。村庄的儿子们第一次穿上军装——革命让他们识字，也让他们扛枪。"
 EGY_Political_Commissars: "政治军官制度"
 EGY_Political_Commissars_desc: "每个营都派驻一名政治军官。他讲革命、发报纸、盯着军官的忠诚——枪杆子必须牢握在革命的手里。"
 EGY_Staff_College: "大纵深参谋教育"
 EGY_Staff_College_desc: "俄罗斯教官带来了大纵深战役的完整课程。埃及的军官们开始像俄国人一样思考战争——用地图、时钟和巨大的表格。"
 EGY_Helwan_Arsenal: "赫勒万兵工厂"
 EGY_Helwan_Arsenal_desc: "阿拉伯标准化工业组织的总厂落户赫勒万：从步枪子弹到卡车引擎，埃及要自己造自己的武器。"
 EGY_Fedayeen: "费达因网络"
 EGY_Fedayeen_desc: "志愿者的渗透队越境而出：炸药、传单与口令。他们称之为抵抗，伦敦称之为恐怖主义——开罗称之为外交政策的延伸。"
 EGY_Air_Force_Rebuild: "空军重建"
 EGY_Air_Force_Rebuild_desc: "喷气式飞机的轰鸣声第一次响彻尼罗河谷。俄国的米格与埃及的飞行学员一起，在沙漠机场上重建一支空军。"
 EGY_Navy_Canal_Defense: "运河区海防"
 EGY_Navy_Canal_Defense_desc: "鱼雷艇、岸炮与水雷构成运河区的三道锁。命令很简短：任何国家的军舰想通过，都得先问问埃及海军。"
 EGY_Sinai_Defense: "西奈防御条令"
 EGY_Sinai_Defense_desc: "总参谋部推演了最坏的情况：如果战争从东边来，西奈的每一道沙岭都要变成堑壕。防御条令把整个半岛写进了作战地图。"
 EGY_Shield_of_Nile: "尼罗河之盾"
 EGY_Shield_of_Nile_desc: "从阿斯旺到塞得港，从西奈到大漠——革命军队的旗与埃及的鹰在同一面军旗上。谁敢越过国界，谁就要面对它。"

#军事线工具提示
 EGY_mil_nasser_root_tt: "需要：纳赛尔已在权力斗争中巩固地位"
 EGY_mil_naguib_root_tt: "需要：纳吉布已在权力斗争中巩固地位"

#军事理念
 EGY_professional_army: "职业军队"
 EGY_professional_army_desc: "受过教育的军官、标准化的操典、远离政治的军营——纳吉布的国防哲学写在每一本条令的扉页上。"
 EGY_standard_arms_system: "装备标准化体系"
 EGY_standard_arms_system_desc: "一种口径、一套后勤、一本教材。标准化的军队是一台精确的机器。"
 EGY_border_guard_cmd: "边境警备司令部"
 EGY_border_guard_cmd_desc: "三支边境警备部队昼夜巡逻。守土的军队不需要冒险，只需要警觉。"
 EGY_desert_mobile_force: "沙漠机动部队"
 EGY_desert_mobile_force_desc: "快、省、忍——机动部队的三个字箴言让它们能在任何沙丘后面出现。"
 EGY_defense_treaty_idea: "国防合作协定"
 EGY_defense_treaty_idea_desc: "莫斯科的训练班与军火清单向开罗敞开。协定是纸做的，但武器是铁做的。"
 EGY_shield_of_republic: "共和国之盾"
 EGY_shield_of_republic_desc: "一支只效忠宪制的职业军队——共和国最可靠的那面盾。"
 EGY_new_doctrine_army: "革命军事学说"
 EGY_new_doctrine_army_desc: "进攻、动员、政治挂帅——新学说把战争当作革命的自然延伸。"
 EGY_soviet_arms_system: "俄式装备体系"
 EGY_soviet_arms_system_desc: "俄国的枪、俄国的炮、俄国的操典。体系一旦建立，就再难更换——但这正是它的效率所在。"
 EGY_commissar_corps: "政治军官团"
 EGY_commissar_corps_desc: "他们是军队里的教师、监察与哨兵。军官们不喜欢他们，但司令部离不开他们。"
 EGY_fedayeen_network: "费达因网络"
 EGY_fedayeen_network_desc: "越境者的网络在边境两侧呼吸。他们没有军衔，却牵动着三个国家的外交。"
 EGY_shield_of_nile: "尼罗河之盾"
 EGY_shield_of_nile_desc: "革命的军队守卫革命的国土——从地中海到努比亚，一面不可逾越的盾。"
 EGY_Wafd_Palace_Alliance: "华夫脱党-王宫联姻"
 EGY_Wafd_Palace_Alliance_desc: "1950年，塔贝特牵线搭桥，纳哈斯的华夫脱党与王宫达成心照不宣的联盟：王宫承认选举结果，华夫脱则保证不动摇王座。"
 EGY_Tabet_Pact: "落实塔贝特协议"
 EGY_Tabet_Pact_desc: "前王宫派卡里姆·塔贝特成为华夫脱与王室之间的信使——联姻条款被逐条落实，王宫第一次对内阁议程保持沉默。"
 EGY_Refuse_Haydar: "拒绝任命海达尔"
 EGY_Refuse_Haydar_desc: "纳哈斯拒不出任战争大臣，王室趁机以法令直接任命海达尔帕夏为武装部队总司令——华夫脱两年之内别想碰到陆军的一颗纽扣。"
 EGY_Integrate_Brotherhood_Special: "整合穆兄会特别行动队"
 EGY_Integrate_Brotherhood_Special_desc: "华夫脱把穆斯林兄弟会的敢死队收编为体制外的拳头——运河区的爆破声，从此有了内阁的默许。"
 EGY_Zaghloul_Camp: "扎格卢勒营"
 EGY_Zaghloul_Camp_desc: "以扎格卢勒命名的营地在运河区立起，志愿者的宿舍比兵营更拥挤，比学校更狂热。"
 EGY_Armed_Auxiliary_Police: "武装辅助警察"
 EGY_Armed_Auxiliary_Police_desc: "内政部把一千五百名辅助警察武装起来送过运河——名义上维持治安，实际上为游击队望风。"
 EGY_Breach_Army_Walls: "冲击军内壁垒"
 EGY_Breach_Army_Walls_desc: "华夫脱的特派员开始出入军校与参谋部——在海达尔的眼皮底下，年轻军官们学会了在茶会上交换眼神。"
 EGY_Liberation_Camps_Interior: "解放营交予内政部"
 EGY_Liberation_Camps_Interior_desc: "“营队指挥委员会”划归内政部节制：预备役训练营扩建，名册归档，解放营成了内阁手里的正规预备力量。"
 EGY_Lift_Gun_Restrictions: "放开持枪限制"
 EGY_Lift_Gun_Restrictions_desc: "民间持枪的禁令被悄悄放宽——数以万计的步枪流入村庄与城市街区，只等一声号令。"
 EGY_Weaponize_Political_Scandals: "武器化政治丑闻"
 EGY_Weaponize_Political_Scandals_desc: "军火丑闻的回扣名单在议会爆出——一百万元的1912年式步枪成了王室的绞索，也成了报刊的盛宴。"
 EGY_Social_Reform_Agenda: "社会改革"
 EGY_Social_Reform_Agenda_desc: "纳哈斯内阁举起了社会改革的旗帜——尽管议会的地主们磨刀霍霍，内阁仍许诺一个更公平的埃及。"
 EGY_Talent_Cabinet_Plan: "“人才内阁”的方略"
 EGY_Talent_Cabinet_Plan_desc: "塔哈·侯赛因、艾哈迈德·侯赛因、穆阿塔勒……内阁罗列的不是党棍，而是埃及最聪明的头脑。"
 EGY_PMs_Promises: "首相承诺之物"
 EGY_PMs_Promises_desc: "最低工资、养老金、免费教育与饮水工程——首相把承诺一一写在纸上，至于兑现，那是另一回事。"
 EGY_Relaunch_Land_Reform: "重启土地改革"
 EGY_Relaunch_Land_Reform_desc: "土地改革重新提上议会日程——这是自哈塔卜案以来华夫脱最接近成功的一次。"
 EGY_Municipal_Rural_Affairs: "设立城乡事务部"
 EGY_Municipal_Rural_Affairs_desc: "一个专管城市贫民窟与乡村的新部委挂牌成立——名字比预算长，但架子先搭了起来。"
 EGY_Vocational_Education: "振兴职业教育系统"
 EGY_Vocational_Education_desc: "“教育如空气和水”——塔哈·侯赛因的中等技术学校向所有贫民子弟敞开，学费全免。"
 EGY_Free_Compulsory_Education: "免费义务教育"
 EGY_Free_Compulsory_Education_desc: "义务教育的法令覆盖了尼罗河谷的每一所学校——教室不够，就轮班上课。"
 EGY_National_Economy_Ministry: "国民经济部行动"
 EGY_National_Economy_Ministry_desc: "新增设的国民经济部开始编制埃及第一份发展预算——尽管数字里有不少水分。"
 EGY_Muatale_Development_Projects: "穆阿塔勒发展项目"
 EGY_Muatale_Development_Projects_desc: "财政部长穆阿塔勒顶着抗棉花丑闻的余波推出发展项目——运河区的每一笔开支都被人用放大镜检查。"
 EGY_Welfare_Five_Year_Plan: "国民福利的五年计划"
 EGY_Welfare_Five_Year_Plan_desc: "两千万美元的养老金、教育、饮水与道路计划——纸面上的五年计划气势恢宏，国库却只闻得到棉花的味道。"
 EGY_Universal_Pension_System: "引入全民养老金体系"
 EGY_Universal_Pension_System_desc: "埃及第一个社会保险与养老金体系建成——从开罗的职员到三角洲的雇农，第一次有了养老的指望。"
 EGY_Renew_Life_Infrastructure: "翻新生活基础设施"
 EGY_Renew_Life_Infrastructure_desc: "饮水管网、乡村道路与市场翻新工程在三角洲铺开——水泥比口号更能收买人心。"
 EGY_Agri_Workers_Assembly_Strike: "农业工人的集会-罢工权"
 EGY_Agri_Workers_Assembly_Strike_desc: "农业工人的集会与罢工权法案终于走出委员会——地主的抗议声几乎掀翻议会屋顶。"
 EGY_Fifty_Feddan_Bill: "重提五十费丹法案"
 EGY_Fifty_Feddan_Bill_desc: "舒克里的五十费丹上限法案重新提交——地主们称之为对财产权的战争。"
 EGY_Hundred_Feddan_Compromise: "一百费丹的妥协"
 EGY_Hundred_Feddan_Compromise_desc: "加利的一百费丹折中案——激进派骂它懦弱，地主们骂它暴政，双方都投了反对票。"
 EGY_No_Retroactivity_Immunity: "追加不追溯与官员豁免措施"
 EGY_No_Retroactivity_Immunity_desc: "不溯及既往、大臣豁免——法案的每一个条款都在替地主和官僚松绑，改革成了空壳。"
 EGY_Rural_Social_Centers: "农村社会中心"
 EGY_Rural_Social_Centers_desc: "农村社会中心在各省铺开——诊所、扫盲班与示范农田，是华夫脱扎进乡土的桩脚。"
 EGY_Agri_Minimum_Wage_Law: "农业工人最低工资法"
 EGY_Agri_Minimum_Wage_Law_desc: "农业工人最低工资法起草完毕——但直到内阁倒台，它也没能走完议会的程序。"
 EGY_Deficit_Management: "赤字管理"
 EGY_Deficit_Management_desc: "创纪录的2.31亿预算背后是创纪录的赤字——财政部靠棉花税撑着收支的天平。"
 EGY_Cotton_Floor_Price: "设立棉花收购托底价"
 EGY_Cotton_Floor_Price_desc: "出口税翻倍，政府托市吃进125万坎塔尔——朝鲜战争的景气掩盖了资产负债表上的窟窿。"
 EGY_Wheat_Import_Export_Control: "小麦进出口管制"
 EGY_Wheat_Import_Export_Control_desc: "小麦进口与面包补贴的账单越滚越大——物价管制的名单从一种商品膨胀到四种。"
 EGY_Regulate_National_Capital: "管制民族资本的控股结构"
 EGY_Regulate_National_Capital_desc: "公司法要求企业51%股权归埃及人——外国银行与洋行的经理们第一次读起了埃及法律。"
 EGY_Trade_Union_Federation_Prep: "埃及工会总联合会筹备委员会"
 EGY_Trade_Union_Federation_Prep_desc: "104个工会、6.5万会员的总工会筹委会在开罗召开大会——没有人知道黑色星期六正在逼近。"
 EGY_New_Era_Egypt: "新时代埃及"
 EGY_New_Era_Egypt_desc: "华夫脱的埃及站在十字路口：改革的诺言、王座的阴影与军营里的低语，都将在这条路的尽头摊牌。"
 EGY_Dissolve_Old_Parties: "解散旧政党"
 EGY_Dissolve_Old_Parties_desc: "革命指挥委员会宣布政党为分裂的祸源——华夫脱、穆兄会与王宫的党羽一并被扫进历史的垃圾堆。"
 EGY_Abolish_Constitution: "废除1923年宪法"
 EGY_Abolish_Constitution_desc: "1923年宪法被中止效力——君主立宪的埃及在纸面上死亡，共和国的黎明尚未到来。"
 EGY_event.7.t: "自由军官革命"
 EGY_event.7.d: "深夜，坦克碾过开罗的街道，包围了王宫与广播电台。自由军官组织宣布接管政权——法鲁克王朝的统治在几个小时内土崩瓦解。"
 EGY_event.7.a: "军队接管了国家"
 EGY_event.8.t: "五十费丹法案之死"
 EGY_event.8.d: "舒克里的提案在议长木槌的敲击声里念完：任何人一次购地不得超过五十费丹，大地主不得再新购产业，超额的土地由政府收购，分配给无地的佃农。大厅安静了几秒钟，随后响起参差不齐的低笑。赞成这一法案的席位上坐着的人，自己名下的土地就够买空整个上埃及的村庄。法案被打发进土地委员会，一读、二读、再一读，会期像尼罗河的水位一样一点点退下去。散会后，华夫脱总书记谢拉金丁在俱乐部的阳台上对一位外国客人耸了耸肩：『我有八千费丹地，你想让埃及赤化吗？』党的机关报为法案写过几篇措辞谨慎的社论，然后转去报道运河区的枪声。入夏之前，秘书处把卷宗重新归档，标签上写着：待下届议会再议。埃及的村庄里没有人读到这些程序，佃农们只知道今年的地租一分没有减，区长办公室门前的木棍照旧靠在老地方。反对派的报纸倒是抓住机会登了一篇毒辣的评论，标题只有一句话：连买回自己身上的链子都要议会批准。主编第二天被内政部的人请去喝了一杯茶，回来之后，报纸的社论版一连三天换成了尼罗河的航运时刻表。法案死得很安静，安静得连反对它的人都觉得缺了点什么。"
 EGY_event.8.a: "意料之中"
 EGY_event.9.t: "一百费丹案同样搁浅"
 EGY_event.9.d: "加利把上限放宽到一百费丹，超额部分由地主自行出售或由政府征购——他以为这是一个谁都能接受的数目。激进派在报纸上骂它懦弱，说一半的改革等于没有改革；地主们的代表则在委员会里骂它暴政，说动私产将动摇国本。土地委员会开了七次会，征购的价格、付款的期限、豁免的条款被逐条改写，铅笔痕迹盖住了铅字。等到三读那天，法案已经面目全非：上限名存实亡，征购变成了『鼓励出售』，豁免名单越列越长。表决的时候，它同时失去了两边的票——激进派投票惩罚它的怯懦，地主们投票惩罚它曾经存在。加利在休息室里对同事苦笑，说他提议的时候就知道会是这个结局，只是没想到连记录表决结果的速记员都打了哈欠。散会后，走廊里帕夏们的司机照旧在台阶下等着，送主人回家吃午饭。开罗晚高峰的车流里，没有人谈论土地。事后有好事的历史学者翻出那七次会议的记录，发现委员会真正认真讨论过的议题只有一个：法定文书里该用『征购』还是『自愿转让』这个词。措辞争了三天，土地本身，从头到尾没有一个人碰过。那册会议记录后来在档案馆里受潮粘页，再也没有人翻开过。"
 EGY_event.9.a: "两头不讨好"
 EGY_event.10.t: "连空壳也没能通过"
 EGY_event.10.d: "这是最温和的一版：不追溯既往，已持有的地产原封不动，只约束今后的交易，内阁大臣本人还享有豁免。谢拉金丁在党团会议上把草案摊开，说这已经是华夫脱能吞下的最后一剂药。地主议员们翻了翻，什么也没说——他们不需要反驳，程序本身就是武器。草案在委员会的抽屉里躺了几个星期，没有人附议，也没有人反对，像一份被遗忘的请愿书。等到会期将尽，连它的起草者都不好意思再催。王宫方面乐得袖手旁观：当一项改革连王宫都懒得出手阻挠的时候，它就真的死了。散会那天，一个年轻的华夫脱议员在议会台阶上拦住谢拉金丁，问党的土地纲领是不是就此作罢。谢拉金丁拍了拍他的肩膀，说政治是一门等待的艺术。三个星期后，这名年轻议员退了党，回到他的律所。开罗的报纸没有注意到这件事——那几天他们正忙着讨论国王新猎鹰的价格。至于大臣豁免那一条后来怎么样了——它被单独摘出来，塞进了一份无关紧要的公务员薪俸修正案，悄悄获得了通过。改革死了，豁免活着。开罗的幽默感大抵如此，只是笑的人从来不在名单上。年轻的退党议员后来在小报上写过一篇回忆，标题起得很平静：我为什么离开他们。"
 EGY_event.10.a: "政治是等待的艺术"
 EGY_event.11.t: "最低工资法流产"
 EGY_event.11.d: "社会事务部的打字机敲了整整一个冬天。草案规定农业工人的日工资下限，禁止以实物抵薪，并设想在各省设立农村劳工监察员。艾哈迈德·侯赛因亲自把草案送到议会，附了一份运棉河边童工工钱的调查作为注脚。农场主利益的代表们甚至懒得组织一场像样的辩论：有人说棉花的成本表容不下更高的工钱，有人说佃农与东家之间是『情同父子』的自愿契约，还有人说埃及的农村没有工厂烟囱，不需要那些城市里的监察员。劳工部补充了一条技术性意见——预算里没有监察员的薪水。法案死在常设委员会的议程深处，连一次正式的表决都没有得到。第二年开春，艾哈迈德·侯赛因递交了辞呈，公开的理由是政党粗暴干预他的项目。报纸给他登了整版的赞誉，说他是廉洁的技术官僚、农民的朋友。赞誉救不回法案，也留不住他。他的办公桌搬走之后，那间办公室很快换了主人，门上挂起了新的名牌。多年以后有人向社会事务部问起这份草案的下落，得到的答复是盖着蓝章的四个字：查无此件。倒是一位退休的老科员记得，某次搬家清理档案的时候，有一整摞字迹工整的纸被按斤称给了收废品的，换来的钱给全科买了西瓜。那天天气很热，没有人记得纸上写的是什么。"
 EGY_event.11.a: "赞誉救不回法案"
 EGY_event.12.t: "动议消失在议程里"
 EGY_event.12.d: "舒克里的动议一份接一份送进议场：为小农减免税负，修订劳动法允许农业工人组织工会，承认罢工的权利，废除一切帕夏头衔。每一份动议都得到几声稀落的掌声，然后消失在议程表里。废除头衔那一项宣读的时候，大厅里有人笑出了声——由帕夏们表决是否废除自己的头衔，这大概是立宪政治最诚实的瞬间。议长以不合议程为由宣布搁置，散会的铃声恰到好处地响起来。会后舒克里在走廊里对记者摊开双手，说议会的日历上永远排满了更紧迫的事，压榨农工不算紧迫，因为它每一年都在发生。他的提案底稿后来在秘书处的柜子里积了灰，倒是在军营里流传开来——几个年轻军官把手抄本在宿舍里传阅，在很多段落下面画了线。农村的工人们不知道这些。他们只知道收割的季节到了，工钱还是老价钱，讨价还价的唯一方式仍然是给区长递一支烟。军营里那份手抄本后来换过几个主人，其中一个把它整个背了下来，多年后在一次内部听证会上，当着满屋子将军的面，逐字引用了关于罢工权的那一段。将军们面面相觑，谁也没有反驳——引用的每个字都曾经印在政府的公报里，只是从来没有兑现过。"
 EGY_event.12.a: "他们不会自断手脚"
 EGY_event.13.t: "报纸上的天堂"
 EGY_event.13.d: "纳哈斯站在弧光灯下，许诺了一笔两千万美元的大账：全民养老金、新教室、清洁的水井和通往村庄的道路。报纸在头版转载了数字，广播里播音员的声音铿锵有力，计划书印得漂亮，封面上是一幅麦浪与输电塔并立的版画。然后是预算。财政部在科目表里找不到这笔拨款——棉花税先填了运河驻军的军费和面包平价的补贴，剩下的消失在亚历山大交易所的私人账户里。财政部内部流传的笑话是：这个计划唯一准时开工的部门是印刷厂。两年过去，计划书上的数字没有一个变成工地。养老金的登记表还锁在档案柜里，水井的位置只存在于地图上的蓝点。负责宣传的官员后来学乖了，再许诺的时候只谈方向，不提数字——数字是要负责的，方向不用。老百姓给这个计划起了个名字，叫『报纸上的天堂』。这个名字比计划本身活得久。预算司长在私人场合算过一笔账：兑现计划需要两千万，而政府一年能从交易所权贵手里罚出来的钱，按最乐观的口径是三千埃镑，外加两次口头警告。他把这张草稿纸压在办公桌的玻璃板下面，一压就是好几年，直到玻璃换了新的，纸也黄得看不清数字。"
 EGY_event.13.a: "数字是要负责的"
 EGY_event.14.t: "被查禁的大会"
 EGY_event.14.d: "筹备委员会的油印机忙了整整一个秋天：一百零四个工会的代表名单，六万五千名会员的签名册，一部五章的章程，还有致各行业工友的公开信。成立大会的日子定了下来，会场租在开罗市区的一座礼堂，请柬发到了每个加盟工会的文书手里。大会前夜，内政部的公文送到了：为维持公共秩序，此次集会不予批准。第二天清晨，警察的封锁线先于代表们到了礼堂门口，筹备委员被分批传唤去『喝茶』，章程的铅版和名册一并没收。没有人被押走太久，也没有人流血——王宫的镇压向来精确而克制，像剪掉一根多余的线头。六万五千人等着的大会没有开成，工会被重新拆散成一百零四个互不相识的数字。工人们记住了两件事：宪法里的集会自由写在纸上，而礼堂门前的警笛是真的。几年后，当穿军装的人宣布保护工人权利的时候，许多人的第一反应不是欢呼，而是想起那座没有开成会的礼堂。礼堂的租约后来转给了进出口商会，他们用它办过一场波斯地毯拍卖。据看过场地的商人说，那地方的音响效果其实不坏，只是门开得太多，穿堂风一年到头不停。油墨的味道好些年都散不掉，闻见的人只当是开罗固有的尘土气，没有人追问它的来历。"
 EGY_event.14.a: "警笛是真的"
