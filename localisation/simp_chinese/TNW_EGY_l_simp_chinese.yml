#决议

#民族精神
 EGY_chained_constitution: "王冠，锁链与宪政"
 EGY_chained_constitution_desc: "早在国王与立宪派革命者达成妥协之时，埃及宪政的根基便被君主权威掌控。华夫脱党在议会内外的反对尽管对该体制稍有动摇，但埃及所谓的宪政仍然与其提出者的理想相去甚远。"
 EGY_Suez_catastrophe: "苏伊士国耻"
 EGY_Suez_catastrophe_desc: "尽管王室试图以各种方式将其包装为一场胜利，但第一次近东战争的国耻仍在困扰埃及。直到如今，埃及民间、军中乃至宫廷内部对苏伊士运河与西奈半岛的渴求已经逐渐失去控制，只待一个绝佳的机会......"
 EGY_world_falling_apart: "世界崩毁的危机"
 EGY_world_falling_apart_desc: "随着德意志帝国在世界大战中的彻底失败，埃及失去了它的宗主国和压迫者，但也失去了外来驻军的保护、欧洲的大部分市场乃至稳定的地缘关系。日渐复杂化的中东局势更是对民意和国家政策日益施加影响。"
 EGY_army_irritation: "军队离心"
 EGY_army_irritation_desc: ""
 EGY_worker_disdain: "工人不满"
 EGY_worker_disdain_desc: ""
 EGY_traditionalist_clumping: "传统主义合流"
 EGY_traditionalist_clumping_desc: "由于马希尔帕夏时期基层治理的衰退以及大动荡期的军民对立，如今的宗教保守派正在穆斯林兄弟会与青年埃及党之间合流，造成两派逐渐靠拢。伊斯兰主义与激进民族主义的低语已经弥漫在城市和乡间。"
 EGY_marchon_suez: "进军苏伊士！"
 EGY_marchon_suez_desc: ""

 EGY_namely_socialism: "名义社会主义"
 EGY_namely_socialism_desc: "随着沙漠战争以僵持告终，阵亡士兵亲属们的怒火吞没了脆弱的王国，在伦敦与巴黎的支持下，埃及军队联合各左翼发动“革命”，建立了埃及人民共和国。\n\n然而，尽管法国方面持续不断地施压要求军政府交权给左翼政治家，但共和国如今仍是军队独揽大权，承诺中的社会主义也从未带来根本层面的社会进步。"
 EGY_across_the_canals: "运河对岸"
 EGY_across_the_canals_desc: "沙漠战争初期，埃及军队曾成功占领西奈半岛，甚至有望巩固对叙利亚的控制。然而，奥斯曼帝国最终动员起来，将埃及军队推回苏伊士运河以西。直到如今，对运河东岸领土的觊觎仍是埃及政界与民间公认的国家要务。"
 EGY_left_unity_1: "左翼团结：一盘散沙"
 EGY_left_unity_1_desc: "革命前的埃及，社会主义者从来不少见，但由于其势力分散而相互敌视，埃及社会主义者从未得到内部整合的契机。所幸国际介入后，埃及左翼终于开始组建广泛政党，为政治整合奠基。\n\n如今，埃及左翼几乎与革命前的松散状态完全相同，数个彼此互不统属且互相敌视的组织分散了民间支持，导致左翼力量始终无法承担起国家的领导重任。"

#国策
 
#事件
 #新闻
 EGY_news.1.t: "纳哈斯帕夏再次于埃及组阁"
 EGY_news.1.d: "自从前首相阿里·马希尔帕夏遇刺以来，埃及政局似乎从未归于稳定。如今，随着华夫脱党在选举中取得大胜，穆斯塔法·纳哈斯帕夏被第四次任命为总理，也许促使埃及摆脱政治与经济危机的机会已经到来。\n\n纳哈斯帕夏在就职时宣布，将“重建埃及的军队与政治机构”，并最终为“埃及的彻底一统”做好准备。此举被伦敦与巴黎方面解读为对苏伊士运河现状的单边修正企图，英法两国对此呼吁克制。与此同时，俄罗斯则迅速表达了对新政府的欢迎。"
 EGY_news.1.a: "他能治理好埃及吗？"
 EGY_news.2.t: "埃及暴乱冲击苏伊士运河区"
 EGY_news.2.d: "托举纳哈斯帕夏上台的民粹主义浪潮如今正造成严重后果：近日，埃及民众不断冲击运河区，虽未能动摇驻扎此地的英法军队控制，但已经在塞得港等地造成严重骚乱。"
 EGY_news.2.a: ""
 EGY_Anwar_Sadat: "萨达特"
 EGY_Anwar_Sadat_desc: ""
#国策（1948 华夫脱-运河-军政府-双雄-苏伊士）
 EGY_Wafd_Victory: "华夫脱的胜利"
 EGY_Wafd_Victory_desc: "1948年的选举中，华夫脱党在纳哈斯帕夏的带领下大获全胜。选民们想要的不是宪政学理，而是面包、尊严与运河。"
 EGY_Peoples_Policies: "民粹法令"
 EGY_Peoples_Policies_desc: "纳哈斯政府以赤字换取掌声：补贴、限价、征地分田。掌声很响，账单更响。"
 EGY_Free_Officers: "自由军官组织"
 EGY_Free_Officers_desc: "以纳吉布与纳赛尔为核心，一批年轻军官在营房里缔结了秘密誓言：国家必须换一种活法。"
 EGY_Canal_Unrest: "运河不宣之战"
 EGY_Canal_Unrest_desc: "在政府的默许之下，游击队开始袭击运河区的英国设施。伦敦称之为恐怖主义，开罗称之为人民的怒火。"
 EGY_British_Reprisals: "英国人的报复"
 EGY_British_Reprisals_desc: "英军以搜查、宵禁与集体惩罚回应袭击。每一项报复都在为下一场袭击招募人手。"
 EGY_Cairo_Fire: "开罗大火"
 EGY_Cairo_Fire_desc: "火从运河烧到首都：开罗市中心在火光中化为焦土，而王座还在废墟上假装这一切只是意外。"
 EGY_July_Revolution: "七月革命"
 EGY_July_Revolution_desc: "装甲车开上尼罗河大桥。一夜之间，法鲁克一世的王朝成为了历史名词。"
 EGY_Revolutionary_Tribunal: "革命法庭"
 EGY_Revolutionary_Tribunal_desc: "宫廷旧吏、贪腐帕夏与告密者被逐一传唤。革命需要祭品，也需要秩序。"
 EGY_Land_Reform: "土地改革"
 EGY_Land_Reform_desc: "大地产被拆分，佃农拿到了地契。军官们很快发现，农民只关心地契上署着谁的名字。"
 EGY_Rebuild_the_Army: "重塑军队"
 EGY_Rebuild_the_Army_desc: "把王室时代的军队改造成国家的军队——先从清洗宫廷派军官开始。"
 EGY_Naguib_Camp: "纳吉布的旗帜"
 EGY_Naguib_Camp_desc: "纳吉布主张军政府与旧政党和解：立宪、选举、分享权力，用合法性巩固革命。"
 EGY_Nasser_Camp: "纳赛尔的旗帜"
 EGY_Nasser_Camp_desc: "纳赛尔主张革命不能半途而废：集权、动员、再造国家，用力量巩固革命。"
 EGY_Moscow_Overture: "转向莫斯科"
 EGY_Moscow_Overture_desc: "无论谁执掌开罗，俄国人都是唯一愿意提供军械与庇护的大国。"
 EGY_Constitutional_Question: "制宪问题"
 EGY_Constitutional_Question_desc: "军政府必须回答：革命之后，国家由谁统治、如何统治。"
 EGY_Route_Naguib: "国民联盟"
 EGY_Route_Naguib_desc: "纳吉布联合华夫脱党等传统势力组建国民联盟，以受引导的选举为军政府披上合法性的外衣。"
 EGY_Route_Nasser: "人民防卫联盟"
 EGY_Route_Nasser_desc: "纳赛尔效仿俄罗斯建立埃及人民防卫联盟：一个政党、一个领袖、一个被充分动员的民族。"
 EGY_Dual_Consensus: "双头共治"
 EGY_Dual_Consensus_desc: "谁也吃不掉谁。军政府在两位领袖的默契之下蹒跚前行。"
 EGY_Integrate_Wafd: "整合华夫脱"
 EGY_Integrate_Wafd_desc: "国民联盟的第一步：让最老牌的民族主义政党成为军政府的竞选机器。"
 EGY_Guided_Elections: "受引导的选举"
 EGY_Guided_Elections_desc: "选举重新开放——在军政府划定的跑道上。"
 EGY_Authoritarian_Consolidation: "威权民主的巩固"
 EGY_Authoritarian_Consolidation_desc: "有选举、有议会、有反对党，也有一个永远获胜的执政联盟。这就是纳吉布的埃及。"
 EGY_Vanguard_State: "民族的先锋队"
 EGY_Vanguard_State_desc: "纳赛尔的新埃及需要先锋队：军队、官僚与防卫联盟三位一体，领导民族前进。"
 EGY_Mass_Mobilization: "全民动员"
 EGY_Mass_Mobilization_desc: "学生下厂、农民入社、妇女入队——民族的身体被重新组织起来。"
 EGY_Nationalize_Industry: "工业国有化"
 EGY_Nationalize_Industry_desc: "外国资本与王室产业被一并没收，工厂的烟囱属于人民——也属于国家。"
 EGY_New_Egypt: "新埃及"
 EGY_New_Egypt_desc: "一个把纪律、尊严与棉花看得同等重要的国家，在尼罗河畔站立起来。"
 EGY_Suez_Preparations: "运河在等待"
 EGY_Suez_Preparations_desc: "军官们在地图上反复推演。运河区距开罗不过两小时的火车，但四十年来没有人敢碰它。"
 EGY_Suez_Ultimatum: "苏伊士最后通牒"
 EGY_Suez_Ultimatum_desc: "照会送往伦敦：英国军队必须离开运河区。落款是开罗，背后站着莫斯科。"
 EGY_Recover_Suez_By_Force: "武力光复运河"
 EGY_Recover_Suez_By_Force_desc: "谈判结束了。国家的历史将用刺刀书写下一页。"

#国策工具提示
 EGY_naguib_rise_tt: "纳吉布§G+12§!，纳赛尔§R-12§!"
 EGY_nasser_rise_tt: "纳赛尔§G+12§!，纳吉布§R-12§!"
 EGY_land_nasser_tt: "纳赛尔§G+5§!，纳吉布§R-5§!"
 EGY_route_naguib_avail_tt: "需要：纳吉布在军政府内的力量§Y不低于55§!"
 EGY_route_nasser_avail_tt: "需要：纳赛尔在军政府内的力量§Y不低于55§!"
 EGY_dual_avail_tt: "需要：纳吉布与纳赛尔的力量§Y均低于55§!"

#理念
 EGY_nahas_government: "纳哈斯政府"
 EGY_nahas_government_desc: "一个靠赤字与许诺支撑的民粹内阁。它在掌声中上台，也将在掌声中听不见任何警告。"
 EGY_canal_guerrilla: "运河游击战"
 EGY_canal_guerrilla_desc: "枪声在运河区此起彼伏。英国人守着铁丝网，埃及人守着枪。"
 EGY_british_reprisals: "英国人的报复"
 EGY_british_reprisals_desc: "宵禁、搜查与集体惩罚——占领的旧账又添了新的一笔。"
 EGY_cairo_fire_aftermath: "开罗大火之后"
 EGY_cairo_fire_aftermath_desc: "焦土还冒着烟。人们看着王座，第一次认真地想：它是不是也该烧一烧？"
 EGY_junta_government: "革命指挥委员会"
 EGY_junta_government_desc: "军人们许诺秩序、尊严与运河。目前为止，他们至少兑现了秩序。"
 EGY_national_alliance: "国民联盟"
 EGY_national_alliance_desc: "军政府与华夫脱党等传统势力结成的执政联盟：革命披上了议会的礼服。"
 EGY_epdu: "埃及人民防卫联盟"
 EGY_epdu_desc: "效仿俄罗斯建立的群众组织与执政机器：民族的一切都归于民族，而民族归于纳赛尔。"
 EGY_dual_power: "双头共治"
 EGY_dual_power_desc: "纳吉布与纳赛尔互相提防又互相需要。国家的两台引擎朝同一个方向轰鸣，却各自握着方向盘。"
 EGY_russian_arms: "俄制军械"
 EGY_russian_arms_desc: "莫斯科的军火清单没有附加条款——除了友谊。"

#角色
 EGY_Gamal_Abdel_Nasser: "贾迈勒·阿卜杜勒·纳赛尔"
 EGY_Gamal_Abdel_Nasser_desc: "自由军官组织的真正心脏。他相信革命不是一次政变，而是一场必须进行到底的再造。"

#事件
 EGY_event.2.t: "开罗大火"
 EGY_event.2.d: "火起于商人区的仓库，一夜之间烧穿了半个市中心。消防队的水压莫名其妙地不足，军队的救援姗姗来迟。有人说那是游击队的失误，有人说是英国人的报复，还有人说，是王宫里的人想借火光掩盖别的什么。等到天亮，成千上万的人无家可归，而他们只有一个共同的疑问：这个国家到底归谁管？"
 EGY_event.2.a: "把责任推给英国人。他们的报复烧掉了开罗。"
 EGY_event.2.b: "保持沉默。在废墟上，任何解释都是错的。"
 EGY_event.3.t: "七月革命"
 EGY_event.3.d: "黎明之前，自由军官组织的装甲部队控制了开罗的电台、桥梁与王宫。没有流血——卫戍部队早已被告知该站在哪一边。正午，电台宣布：法鲁克一世退位流亡，政权移交革命指挥委员会。街上有人欢呼，有人茫然，但没有人怀疑：君主制的埃及死在了这个夏天。"
 EGY_event.3.a: "军队接管了国家。"
 EGY_event.4.t: "苏伊士最后通牒"
 EGY_event.4.d: "照会的措辞前所未有地直白：英国军队必须撤出运河区，苏伊士的主权属于埃及。伦敦的回复比预想的更快，也更为傲慢——皇家海军不会向一群「策划叛乱的军官」让出帝国的大动脉。战争与退缩，此刻都摆在了革命指挥委员会的桌面上。"
 EGY_event.4.a: "英国人拒绝了。那么就用他们听得懂的语言说话。"
 EGY_event.4.b: "提请莫斯科斡旋。让俄国人的分量压上天平。"
 EGY_event.4.c: "隐忍不发。运河已经等了四十年，不差这几个月。"
 EGY_news.3.t: "开罗政变"
 EGY_news.3.d: "开罗来电：埃及军队今日拂晓接管首都，国王法鲁克一世流亡国外。以纳吉布将军为首的革命指挥委员会宣布废除君主制，埃及将成为共和国。欧洲各国使馆正在评估这场不流血政变对苏伊士运河区的影响。"
 EGY_news.3.a: "有意思。"
