l_simp_chinese:

#国家介绍
 TNW_welcome_EGY_intro_text_1: "随着法国宣布投降，世界大战的两大阵营领袖——大英帝国与德意志帝国，最终还是走到了谈判桌上。就在此时，埃及嗅到了自由的可能性：大英帝国已经无力作战，显然有可能放松对埃及的控制。在这样美好愿景的驱使下，萨阿德·札格卢尔率领的外交代表团奔赴法兰克福，尝试为埃及争取利益。显然，无论是英国还是德国都不希望看到一个彻底独立的埃及。尽管由于奥斯曼帝国遭到肢解，法兰克福停战协议确立了埃及在1914年取得的独立苏丹国地位，但除此之外英国人得以几乎彻底保留其在埃及的权利，仅需向德意志无条件开放苏伊士运河，废除保护国条约的行动更是只字未提。\n\n对埃及来说毫无光荣可言的“光荣和平”导致代表团领袖札格卢尔发起“华夫脱”（国民）运动，遭到驻埃英军总司令的严加斥责，并在1920年3月将其领导层逮捕，流放至马耳他岛。在此刺激下，开罗学生率先罢课反英，并要求释放札格卢尔，而这股风潮迅速扩展至学生罢课、工人罢工、商人罢市，最终引发全国性的武装起义。\n\n1922年底，英国方面宣布终止保护国条约，但仍控制埃及外交、国防等权力。然而，他们强硬地拒绝札格卢尔参与政治，并将其软禁在开罗，阻止一切立宪尝试。驻埃英军与埃及民众的矛盾日益尖锐。"
 TNW_welcome_EGY_intro_text_2: "1925年，在一场声势浩大的总罢工中，联合王国本土爆发革命，驻埃英军在不久之后被调往本土参战。失去了强力压制，立宪运动再次爆发，同时埃及民间还传出声音要求彻底废止一切外国特权。年底，随着第一次近东战争的爆发，埃及民众自发地向苏伊士运河与西奈半岛进军，宣布要夺回这些合法领土。最终，德意志帝国的干涉军将土耳其、巴勒斯坦与埃及同时列为主要打击目标，在埃及王室的邀请下德军迅速平定了暴动并进驻开罗和亚历山大港。第二次立宪运动宣告破灭。\n\n此后，埃及宪法得到制定，这是一部相当偏向君权的专制宪法，议会的权力被君主严苛地压制着。艾哈迈德·齐瓦尔成为立宪后埃及的首任首相。在此后的十年间，首相之位在阿德利·亚肯、阿卜杜勒·萨尔瓦特等人之间频繁轮换，直到1932年伊斯梅尔·西德基上台后，埃及政局方才进入为期三年的稳定阶段。在先前的政治动乱中，经济始终得不到发展，反而因英国革命、华尔街崩盘与奥地利银行危机外溢而反复受创，民意不断滑向受到压制始终无法登台的华夫脱党。"
 TNW_welcome_EGY_intro_text_3: "时间很快来到1935年，福阿德一世病重，其王太子法鲁克即将继承王位。在此期间，穆斯塔法·纳哈斯与王太子法鲁克、首相西德基和德国代表在四方会谈中达成妥协，华夫脱党将组建下一届政府。他们承诺将继续采取亲德外交，换取德国支持其重新制宪的计划，而同时将在制宪时维护王室的部分特殊地位，换取新王不反对新宪法的诞生。然而，这一看似稳定的四方关系仅持续到1937年，便因王权边界问题而宣告破裂，纳哈斯首相被迫辞职。随后，法鲁克国王启用了激进亲德的施莱歇尔主义者阿里·马希尔，其效仿施莱歇尔改革，拉拢军队和青年党，打击华夫脱导致该党进一步分裂。尽管并未参与世界大战，但埃及仍与哈希姆各王国一同稳定中东，向德国输送石油，以至于在他的主导下埃及出兵干预伊拉克，镇压了金方阵政权。直到1944年，战争已经明显分出胜负趋势时，马希尔内阁遭到解散。纳哈斯重新上台，但也在几周之内被解职。最终，马哈茂德·努克拉希被任命为新一届首相。1945年，马希尔时期曾经相对合作的穆斯林兄弟会对新的技术官僚政府日渐厌恶，在他们的组织下，首相努克拉希遇刺身亡。法鲁克国王别无选择，只得任命侯赛因·西里担任新一任首相。不过，明眼人皆知，华夫脱党难以阻挡的回归只是时间问题。"
 TNW_welcome_EGY_intro_text_4: "1925年5月12日，当代努比亚的法老、处于埃及裔文官与苏丹民族主义者之间的屏障：苏丹总督杰弗里·阿彻通过电报知晓了德军发动的普萨美提克行动。与第一任苏丹的英国统治者——戈登帕夏不同，这位1月刚上任的新总督当晚便乘班机逃往乌干达恩德培，草草结束了盎格鲁人在苏丹的统治。但在他统治的短短5个月中，他进行的重大军事调动将影响上尼罗河流域的历史走向。\n\n在1924年前，苏丹士兵在埃及军队的不同步兵营服役，由英国和埃及军官指挥。这些营根据其在苏丹境内的招募区域，被命名为“苏丹营”或“阿拉伯营”。与埃及军队通过年度征兵制招募主力不同，苏丹部队只招募长期服役的志愿者。1924年11月19日，苏丹总督李·斯塔克在埃及被几名埃及学生开枪刺杀。苏丹总督由韦西·斯特里暂时代理。几天后，喀土穆军事训练学院的苏丹军人在白旗联盟的率领下发动起义，但最终以失败告终。作为回应，英国当局残酷镇压了民族主义运动，埃及官员和参与其中的非阿拉伯裔苏丹人都成为打击目标。埃及的文职和军事人员被驱逐，埃及报纸被查禁，革命领袖被监禁或处决。英国还解散了由南苏丹成员组成的营队。\n\n杰弗里·阿彻上位后，他主持了苏丹军事体系的改革。驻扎在苏丹营的埃及军事单位和埃及军官被调回埃及。留守的苏丹军队则被编入新成立的苏丹防卫部队。此前由埃及人员担任的初级军官和士官职位，现在向“苏丹化”开放。一所军事学院在恩图曼成立，旨在培训新的苏丹军官队伍，这些军官大多来自北方的穆斯林。\n\n杰弗里·阿彻逃离苏丹后，在他之下蠢蠢欲动的苏丹防卫军士官们在第二天便会发动兵变。为首的是白旗联盟的阿卜杜拉·哈利勒，而革命者的宣言也继承自白旗联盟，倡导“尼罗河谷统一”，呼吁苏丹独立并与埃及统一，并效忠于富阿德国王。苏丹英军此时正被德军在苏伊士发动的行动所震撼，双方发生几场武装冲突后，英军便坚守在驻地堡垒中，直到德军于5月28日在开罗发表声明，承诺允许英军撤往乌干达。埃及此时也正处于混乱之中。为缓和矛盾，双方在德国调解下于8月1日在喀土穆签署协议，以富阿德一世作为国王的苏丹王国正式成立。根据1925年埃及宪法，苏丹王国设置了议会，但总督由埃及人担任。这使全面自治主义者感到不满，包括安萨尔的伊玛目阿卜杜勒·拉赫曼·马赫迪。更让局势激化的是南苏丹人要求在议会中获取更多权力。他们在杰弗里·阿彻解散南苏丹部队后便心怀怨言。苏丹暴动后，以南苏丹人为主的赤道军团脱离了防卫部队。英军撤离途中，他们将大量重武器交给赤道军团，以奖励更亲近英国统治的南苏丹人。获取更多武装后，赤道军团开始四处劫掠北方人与埃及人社区，并以南苏丹人替换非本土行政长官。目前，苏丹或埃及人都对他们毫无办法。"

