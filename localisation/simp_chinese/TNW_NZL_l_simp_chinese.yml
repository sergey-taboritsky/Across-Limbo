 NZL_michael_joseph_savage: "迈克尔·约瑟夫·萨维奇"
 NZL_michael_joseph_savage_desc: "新西兰工党创始人之一，1935—1940年任总理。领导新西兰度过二战初期，1940年病逝于任上。"
 NZL_peter_fraser: "彼得·弗雷泽"
 NZL_peter_fraser_desc: "新西兰工党领袖，1940—1949年任总理。二战期间主导征兵公投与战时经济，战后参与联合国创建。"
 NZL_walter_nash: "沃尔特·纳什"
 NZL_walter_nash_desc: "工党财政部长（1935—1949）及总理（1957—1960），长期主导工党经济路线。"
 NZL_sidney_holland: "西德尼·霍兰德"
 NZL_sidney_holland_desc: "新西兰国家党领袖，1949—1957年任总理，结束工党长期执政。"
 NZL_keith_j_holyoake: "基思·霍利约克"
 NZL_keith_j_holyoake_desc: "国家党元老，两度任总理（1957、1960—1972），以稳健保守主义著称。"
