 HAN_syndicalism_party_long: "德国社会党 - 自由工人联合会(Sozialistische Partei Deutschlands - Freie Arbeiter Union)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n自由工联前身是德国境内占主导地位的无政府工团主义组织“德国自由工人联合会”。该组织曾于1934年被帝国政府摧毁，并因此引发法国的雪月革命，但随后在新法国政府支持下，自由工联又重新组织起来。由于德国东北部莱茵河沿岸的工业集群存在大量渴望直接行动的无产阶级，早在法军尚未渡河时便有部分城市出现胜利夺权的工人起义。因此，威斯特伐利亚地区的政权组织工作被交给重新成立的自由工联，他们依据传统的工团主义理念建立了以公社为核心的工人共和国。§!\n"
 HAN_socialism_party: "社会党 - 行动派"
 HAN_socialism_party_long: "德国社会党 - 革命行动委员会(Sozialistische Partei Deutschlands - Aktionskomitee der Revolution)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n革命行动委员会是曾经德国社会民主党内部组建于1936年的不来梅革命期间并以支援革命为核心目的的一支小股激进力量。授权法通过后，社民党左翼大量遭到逮捕或噤声，于是该委员会的主要成员离开德国前往伦敦定居，并因此受到了奥斯瓦尔德·莫斯利及其思想的深刻影响。战后，他们随着英国占领军一同进入德国西北部，参与威斯特伐利亚的政治活动。§!\n"
 
 
#人物
 DDR_Paul_Frolich: "保罗·弗勒里希"
 DDR_Paul_Frolich_desc: "§Y出生于：§!§L1884年8月7日，普鲁士王国，美因河畔法兰克福§!"
 DDR_Anton_Rosinke: "安东·罗辛克"
 DDR_Anton_Rosinke_desc: "§Y出生于：§!§L1881年12月18日，普鲁士王国，维登布吕克§!"
 DDR_Otto_Grotewohl: "奥托·格罗提渥"
 DDR_Otto_Grotewohl_desc: "§Y出生于：§!§L1894年3月11日，不伦瑞克公国，不伦瑞克§!"
 DDR_Kurt_Schumacher: "库尔特·舒马赫"
 DDR_Kurt_Schumacher_desc: "§Y出生于：§!§L1895年10月13日，普鲁士王国，库尔姆§!\n§Y人物背景：§!§L库尔特·舒马赫出生于西普鲁士小城库尔姆的商人家庭，其父是德国自由党成员，同时也是本地市议员。舒马赫年轻时曾被学校誉为天才，但随着第一次世界大战的爆发，他立刻报名参军走上前线。12月，他在波兰小城别拉韦的战斗中身负重伤，右臂不得不截肢。随后，他被授予二级铁十字勋章并退役，前往哈勒、莱比锡与柏林攻读法学，于1919年毕业。\n\n1918年，在爱德华·伯恩斯坦的感召下舒马赫成为社会主义者并加入德国社会民主党。1920年，社民党派遣他前往斯图加特作当地党报主编。1924年，他入选符腾堡议会；随后在1930年进入帝国议会。1932年8月，他作为社民党议会党团最年轻的成员之一被选为社民党在议会的发言人。\n\n施莱歇尔政权时期，随着社民党不断分裂，舒马赫选择与激进派和社工党靠拢，并在第二次世界大战后期法军突破莱茵河时组织符腾堡当地的合作政府。作为与法军合作的最高级别符腾堡政治家之一，他被任命为新生的符腾堡共和国代理总统，为符腾堡的政治过渡做足准备。§!"
 DDR_Albert_Einstein: "阿尔伯特·爱因斯坦"
 DDR_Albert_Einstein_desc: "§Y出生于：§!§L1879年3月14日，符腾堡王国，乌尔姆§!\n§Y人物背景：§!§L尽管爱因斯坦曾被德皇褒奖并授予爵位，但他仍是德国社会民主党的坚定支持者。在符腾堡共和国成立后，原本与帝国科学院一同身处柏林的爱因斯坦选择回到家乡参政，并在得到巴黎方面的许可后以原社会民主党党籍被转移到新党内。如今，在市民阶层的广泛支持与社会民主党旧领导层的帮助下，爱因斯坦将会成为符腾堡的正式领导人。§!"
 DDR_Willi_Bleicher: "维利·布莱赫"
 DDR_Willi_Bleicher_desc: "§Y出生于：§!§L1907年10月27日，符腾堡王国，斯图加特-巴特坎施塔特§!"
 DDR_Georg_Elser: "乔治·埃尔塞"
 DDR_Georg_Elser_desc: "§Y出生于：§!§L1903年1月4日，符腾堡王国，黑尔马林根§!"

#精神
 DDR_Fragile_peace: "脆弱的和平"
 DDR_Fragile_peace_desc: "在1918年我们扬起红旗以反抗资本主义和帝国主义，但因为外国的干涉，最终止步于柏林一线，但在合适的时机，全德国必将得到解放，下一步，也许就是整个世界。"
 DDR_Route_battles: "绯红之翼"
 DDR_Route_battles_desc: "多年以来空军并不如海军和陆军一般受到重视，装备落后，经验不足。[DDR.GetName]的飞行员们唯一拥有的，只有自身的勇气。"
 DDR_Above_the_ruins: "在废墟中复苏"
 DDR_Above_the_ruins_desc: "因一战的失败，内战的创伤，我们的国家已然变成一片废墟，1934年的农业危机又对国家造成了新一轮的打击，尽管我们有着各种各样的困难，无产阶级在过去曾克服，也必将在未来克服，让[DDR.GetName]在废墟中崛起。"
 DDR_The_red_flag_is_already_standing: "偃旗息鼓的“祖国军”"
 DDR_The_red_flag_is_already_standing_desc: "1934年的农业危机给了我们祖国内部的反动分子有了可乘之机，他们组成了名为“祖国军“的组织骚扰着[DDR.GetName]的无产阶级，他们已经得到了镇压，然而，如果我们对反动派过于松懈，他们肯定再次会对公民们还以颜色。"
 DDR_Backward_eastern_regions: "落后的东部地区"
 DDR_Backward_eastern_regions_desc: "东部地区大多是农村，且还有许多封建残余，这导致我国的东部地区经济水平十分落后，最近几年来激进的土地改革一开始颇具成效，在后来却导致了一个较大的退步，恶性事件频发。"
 DDR_Red_Spear: "猩红之矛"
 DDR_Red_Spear_desc: "红军的前身可以追溯到起义初期的民兵组织，作为无产阶级的军队，红军不仅保卫着德国无产阶级的政权，并且还要参与到国家建设中来，绝不能像资产阶级的军队一样脱离民众，脱离生产，这也就让红军能在战时迅速的获得兵员。"
 DDR_Crimson_Ship: "绛红之舰"
 DDR_Crimson_Ship_desc: "海军在我国有着非比寻常的意义，人民不会忘记，是基尔水兵挥举起了义旗，点燃了德国革命的星星之火，战后，我们占据着原德意志帝国大部分海岸线并继承了大部分原有海军，在红色阵营中，[DDR.GetName]也是最重要的海军大国，然而，小小的波罗的海仍然是我国海军的主要活动点，即使与丹麦和瑞典的良好关系能让我们海军借过前往大海上训练，但这仍不够方便。"
 DDR_Member_States_of_the_USSR_the_German_Soviet: "苏联加盟国-德意志苏维埃" 
 DDR_Member_States_of_the_USSR_the_German_Soviet_desc: "苏维埃社会主义共和国联盟是在1922年成立的国家联盟，它的宗旨是团结起各地区的无产阶级政权，团结互助，维护无产阶级的统治，各加盟国有独立的国家主权。" 
 
 #国策
 DDR_Liebknecht_final_days: "为期不远"
 DDR_Liebknecht_final_days_desc: "1936年到来了，德意志社会主义共和国迎来了他的第十七个年头，召开第四届德国人民大会的日子即将到来，李卜克内西掌控最高权力的日子也即将结束。他仍在尽心尽力地完成这份工作，为自己的政治生涯不留遗憾。"
