 WUR_socialism_party_long: "德国社会党 - 进步阵线(Sozialistische Partei Deutschlands - Fortschrittliche Front)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n进步阵线是德国社会党成立时的主导团体。1937年，施莱歇尔政权对社民党的吸收使得该党四分五裂，其中的马克思主义激进派与残存的独立社会民主党成员和希望转向合法斗争的德国共产党右派共同组成了德国社会主义工人党。二战期间，该党将革命主张掩藏在反战活动下，并最终在战争末期成功联合各左翼势力发动多场起义，战后取得德国西部的主导权。战后，社会主义工人党与尚未被吸收的革命左翼组织组成进步阵线，推动德国社会主义事业不断前进。§!\n"
 WUR_Social_democracy_party: "社会党 - 符腾堡人民阵线"
 WUR_Social_democracy_party_long: "德国社会党 - 符腾堡人民阵线(Sozialistische Partei Deutschlands - Volksfront von Württemburg)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n符腾堡地区的社会主义者较为团结，早在法兰克福政府成立前便组织了“符腾堡人民阵线”以稳定法占符腾堡地区的生产生活秩序。在新党成立后，人民阵线被整个纳入新政党，并成为符腾堡共和国无可争议的执政党。当然，由于自由工联与共产主义者并不满意新政府的温和态度与社会改造的缓慢推进，人民阵线内部也存在许多不同声音。§!\n"
