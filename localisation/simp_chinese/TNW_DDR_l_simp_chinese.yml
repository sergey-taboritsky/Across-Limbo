 #事件
 DDR_event.1.t: "漫步于柏林郊区"
 DDR_event.1.d: "天空灰蒙蒙，鸟群盘旋在上空，落叶被冷风吹起，随后又轻轻的飘到地上，而一位杵着拐杖的老人刚好踩到了那片落叶。\n\n离开了办公室繁多的文件，离开了议会中人们喋喋不休的争吵，离开了城市的喧嚣，唯有在郊区，李卜克内西才能获得短暂的安宁。\n\n如今的他早已步入花甲之年，在某些事情上已经远不如年轻人，这一点他非常清楚，于是他在上次会议中就宣布：等这个任期结束后他便会退休，不再竞选下一任国家领导人。\n\n如果用什么词来概括他波澜壮阔的一生，那么就只有两个字：斗争。早年间他与资本主义作斗争，带领人民发动了十一月革命建立德意志社会主义共和国；而后他又与罗莎·卢森堡决裂创建了德国共产党。尽管他提出的设想与苏俄的先锋队模式有所不同，但他仍旧顶着压力在德国付诸实践，实践证明，他的设想也是正确的。\n\n在他宣布退休后，一些党员曾找过他询问他退休之后会干些什么，他本人则是笑着回应：“也许会去到农村与农民们干农活，或者到工厂里与工人们一起在流水线上劳动。哈哈，我虽然老了但不是瘫了，只要我哪天还能动，我就继续为人民服务。”\n\n当然也有人会问他想去哪些地方，他总是以一种报菜名的方式回答他们：“有很多，布达佩斯、华沙、圣彼得堡、莫斯科、察里津、赫尔辛基、基辅、明斯克……”而发问者则一脸疑惑的询问对方：“作为领导人，这些地方您不是通常去的吗？”他则会解答发问者的疑惑：“对，没错。但那些通常都是去进行政治外交行动，我只是想以普通人的身份去这些城市看看。哦顺带一提，我也许会去乌克兰的农村地方看看，学习一下他们的农业集体化所取得的成果，然后回来运用在德国农业上。”\n\n冷风再一次的刮过，李卜克内西的帽子也随之被吹飞，最终落到了几名正在玩耍的孩童脚边。“可以帮我捡一下帽子吗？谢谢。”孩童们回应了老者的请求，将帽子捡起还给他。“这天气真冷对吧？今年的寒意比往年冷上了不少。”老者接过帽子后将其戴上。"
 DDR_event.1.a: "“是的，先生。”"
 DDR_event.2.t: "红军未来改革方向"
 DDR_event.2.d: "根据上一次苏联革命军事委员会第五次会议以及德国工农红军革命军事委员会第三次会议所讨论的结果，我有必要向革命军事委员会提交一份有关于苏联各国工农红军未来改革方向建议书：\n\n1.在现有的实验装甲师的基础上增加3个装甲师组建实验装甲集群。\n\n2.改组第1步兵师、第4步兵师、第8步兵师为第14、15、16摩托化步兵师，并与组建的实验装甲集群展开联合军事演习。\n\n3.最新的装甲师编制内下辖2个装甲团，每个团由2个装甲营组成，每营下辖2个装备实验性主力坦克装甲连、1个装备实验性支援型坦克装甲连以及1个装备II号坦克装甲连，共16个连，每个连的至少装备数量为15辆，其中旅、团、营中各级指挥部的直属单位不算在内的话每个装甲师至少应该拥有主力坦克120辆，支援型坦克60辆、II号坦克60辆。\n\n4.实验性主力坦克最终取名“III号坦克”；实验性支援型坦克最终取名“IV号坦克”，两款坦克将在德意志人民机械制造设计局敲定最后生产设计图纸后交由共产国际机车工厂（183厂）进行首批型号的量产。\n\n5.上述联合军事演习将在东普鲁士一带，由海因茨·古德里安同志担任装甲集群指挥员、弗伦德里希·保卢斯同志担任军指挥员，与第8俯冲轰炸机中队以及波兰第5步兵师、第9步兵师、第12摩托化步兵师和第14骑兵师联合进行。\n\n6.工农红军有必要的进行机械化改革，坦克将在未来的战争中充当主要角色，而空中的俯冲轰炸机将会配合地面机械化部队打击敌对目标，并使用坦克撕开并突破敌军防线，在敌军反应过来前占领战略目标，迫使敌军投降。\n\n7.上述方案将在德国进行实验，如取得重大成果，则应立刻向苏联各国工农红军进行推广。\n\n                                                                       德国工农红军革命军事委员会副主席\n                                                                                         苏联革命军事委员会成员"
 DDR_event.2.a: "£Guderian_signature"
 DDR_event_2_custom: "§Y此建议书将在提交德国工农红军革命军事委员后三天内提交至苏联革命军事委员。§!"
 DDR_event.3.t: "人民之花"
 DDR_event.3.d: "“啊施里芬同志，请坐。”列奥·约基希斯啜了一口手中的咖啡，示意着眼前刚刚进入办公室的年轻人坐下。\n\n“保罗很快就会来。咖啡还是茶？”“咖啡，谢谢。”坐在办公桌前的老者起身为年轻人倒上一杯速溶咖啡，并从抽屉里抽出了一份文件递给他。“卡尔在上一次会议中说了，他不会参加下一次国家主席的竞选，”"
