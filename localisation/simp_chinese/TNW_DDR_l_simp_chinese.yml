l_simp_chinese:
#国家介绍
 TNW_welcome_DDR_intro_text_1: "多年以后，面对德国国会，卡尔·李卜克内西会想起屈从于党的纪律而投票被迫支持第一次战争拨款的那个下午，当时，德国社民党正在蒸蒸日上，每次大选获得的票数都在增加，党内也没有明显的裂痕，社民党似乎只是一个暂时的反对党，在下一次大选中便能成为内阁的脊柱。\n\n血与火的巨兽迅速吞噬了虚假的繁荣，战争毫无在圣诞节前结束的迹象，李卜克内西成为唯一反对第二次战争拨款的议员，随后他开始不断地团结反战人士，建立并扩大了国际集团（后改称“斯巴达克同盟”），反战的声音开始一浪高过一浪，两年后，他被逐出议会，随后又被抓进监狱。俄国革命的胜利似乎给他们带来了一线火光，然而拳击行动很快便掐灭了这一切。\n\n东线不亮西线亮，德国的无限制潜艇战战术只是令美国感到恼火，英国佬并没有做出例如截获一份重要的电报来诱因美国直接参战的行动，但没有直接参战的美国最终还是出于报复开始了对协约国的大规模支援。西线战场仍在僵持着，1918年的春季攻势又是一次无意义的既不成功也不失败的战役，德国士兵得不到像对面的协约国一样的支援，饥饿成为了的前线的主旋律。"
 TNW_welcome_DDR_intro_text_2: "反战的浪潮开始席卷德国，出于安抚民心，1918年10月23日，李卜克内西等人得到了释放。但不久后，在基尔港的一次“寻常”的游行中，警察向示威群众开枪，死伤数十人，民众的怒火被迅速点燃，港里的每一艘军舰似乎都是下一个阿芙乐尔号，革命迅速向帝国的边境地带蔓延。11月9日，李卜克内西在柏林宣布成立德意志社会主义共和国，到11月25日，几乎所有小邦君主都被迫宣布退位，但德皇仍不愿意放弃权力。\n\n帝国一开始只是想同时挥舞萝卜和大棒，边镇压边安抚革命者，毕竟这些参与革命政治家们并没有一个统一的目标和行动，从李卜克内西代表的斯巴达克同盟，到考茨基或者伯恩施坦代表的“修正主义者”，再到社民党右派和天主教人士，绝大部分民主主义者都或多或少地参与了进去。然而，德国的情报系统百密一疏，1919年年初，对于李卜克内西和卢森堡的刺杀行动被抓了个现行，萝卜被发现只是泡沫，而大棒也有气无力，严重影响了前线的士气。\n\n最终，同盟国不得不向协约国签署和平条约以腾出手来解决国内起义，东部大量的傀儡国被释放，德意志帝国仍然得到了保留，巴伐利亚起义，鲁尔起义，汉堡起义接连不断地发生，阿尔萨斯洛林地区和许多殖民地也趁乱被英法占领。"
 TNW_welcome_DDR_intro_text_3: "一战结束后，毕苏斯基率领波兰独立，但他心中一直有一个建立海间联邦的梦想，在协约国的支持和支援下，波兰开始向西发动边境冲突，与此同时，出于援助更多国家的社会主义运动，解放前俄罗斯帝国疆域的需求，苏俄也开始向东扩大革命，双方于6月爆发了第一次大型冲突，毕苏斯基心中已有计划。 \n\n然而7月很快爆发了黑天鹅事件，似乎稳定下来的奥匈帝国中的外莱塔尼亚部分独立了，匈牙利苏维埃成立了，随后俄国也将余力用于赞助德国的左翼革命者，改良派和自由派开始对此感到恐惧开始退出革命，在往后的几年内逐渐逃往西德，剩下的人则已经勉强团结在了同一面旗帜之下，毕苏斯基陷入了三面环敌的境地，然而协约国既不能也没有意识到要给波兰更多的援助，新生的波兰共和国迅速落败，12月，俄国红军成功解放华沙，第二年6月，在红军的支持下，起义军一路直插柏林，最后的皇帝威廉二世被迫退位，将政府交给多数社民党人士。\n\n柏林的沦陷终于给还在做春秋大梦的协约国敲响了警钟，西德政府也愿意承认现状来换取协约国和美国支援镇压，日本也在远东增兵进行策应，终于，在8月，干涉军在莱茵河前稳住了战线，随后开始进行反扑，这场战役被称作“莱茵河奇迹”，战线一度推进至斯德丁，然而，协约国国内的赤色抗议此起彼伏，也并没有提供更多的支援提供给德国去收复全部故土，苏俄也在远东疲于应付日本的干扰，双方又开始了持续两年多的僵持反复与和平谈判，最终战线稳定在奥德河-尼斯河一带。早在1922年，德国便加入了苏联和共产国际，1923年9月，协约国和苏联双方代表签订结束冲突的和平协议，在西方建立起了德意志共和国，在东方则继承了五年前的德意志社会主义共和国。"
 TNW_welcome_DDR_intro_text_4: "在战争结束后的1924年，德意志社会主义共和国正式召开了第一届大会，由李卜克内西担任社会主义共和国主席，恢复秩序，稳定经济，审判反动分子，在这期间他对共产主义的认识也越来越深刻，通过将集体自治、劳工委员会、苏维埃民主等思想融合形成了委员会共产主义思想，这时，卢森堡跟他的政治主张之间的裂痕也越来越深，于是他脱离了独立社会民主党，组建了新的德国共产党。\n\n在1928年的第二届大会上，新组建的德共取得了全面的胜利，李卜克内西再次当选苏维埃主席，同时颁布了新的宪法，在这期间，内战后的德国经济已经达到了稳步重建的阶段，社会主义经济体制也广泛确立起来，然后又开始了激进的土地改革，并且似乎卓有成效，随后1929年的大萧条冲击了西德的工业和农业，但德国的工人和农民的生活却没有受到什么影响，这似乎更加证明了他的理论的优越性，随后的1932年的大会选举不出意料又是一场大胜，似乎没有什么能在德国阻止新兴的德国共产党。\n\n直到1934年，那年的农业气候不是很好，影响了粮食收成，部分地方出现了粮食紧缺的情况，与此同时名为“祖国军”的右翼军事团体也开始了大规模骚乱，德国无产阶级生活受到严重影响，多起前地主勾结农村党员的恶性事件也曝光成绩。于是，各种指责和反对的声音也纷至沓来，列宁主义者们开始指责李卜克内西不搞民主集中制，多年的战友卢森堡则指责他放弃了民主原则，受害的农民们尤其是普鲁士地区也组织起来成立了普鲁士农民协会，像西里西亚和巴伐利亚的同僚那样并加入了德国农民党，天主教徒和新教徒也联合起来成立了基督教民主联盟跃跃欲试。李卜克内西最终承认激进的土地改革措施实际上收效甚微，在他接下来的任期里，农业灾害基本得到消除，“祖国军“大部分转入地下，农村腐败现象也得到遏制，对于自己的政策也不是很满意，虽然他仍受到广泛的欢迎。\n\n时年已是1936年，社会主义前进的道路上抖生曲折，德国即将迎来她的第四届大会，但光明的前途犹在眼前，§R让我们继续前进吧！伟大、光荣、英雄的德国人民万岁！§!"
#国家名字
 DDR: "联合占领德国"
 DDR_DEF: "工人国际德意志联合占领区"
 DDR_socialist_republic: "德意志社会主义联盟"
 DDR_socialist_republic_DEF: "德意志社会主义联盟"
 DDR_ADJ: "德意志"
 DDR_communist_party: "社会党 - 斯巴达克同盟"
 DDR_communist_party_long: "德国社会党 - 斯巴达克同盟(Sozialistische Partei Deutschlands - Spartakusbund)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n“斯巴达克同盟”得名于第一次世界大战期间活跃的同名组织，前身是由旧斯巴达克同盟与社民党内“不莱梅左派”等激进势力联合组成的德国共产党。第二次世界大战期间，该党发动过多次暴动，但也导致遭到帝国政府强力镇压，多名领导人遇害。如今，斯巴达克同盟已经接受新德国的政治秩序，并表示准备通过民主程序获取新德国领导权。§!\n"
 DDR_syndicalism_party: "社会党 - 自由工联"
 DDR_syndicalism_party_long: "德国社会党 - 自由工人联合会(Sozialistische Partei Deutschlands - Freie Arbeiter Union)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n自由工联前身是德国境内占主导地位的无政府工团主义组织“德国自由工人联合会”。该组织曾于1934年被帝国政府摧毁，并因此引发法国的雪月革命，但随后在新法国政府支持下，自由工联又重新组织起来。第二次世界大战结束后，在社会党成立时，自由工联接受了党官方工人组织的地位，同时也相当于成为新德国的全国总工会。如今，自由工联不再追求革命，而是希望以温和的工人运动促进德国社会主义改造的进行。§!\n"
 DDR_socialism_party: "社会党 - 进步派"
 DDR_socialism_party_long: "德国社会党 - 进步阵线(Sozialistische Partei Deutschlands - Fortschrittliche Front)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n进步阵线是德国社会党成立时的主导团体。1937年，施莱歇尔政权对社民党的吸收使得该党四分五裂，其中的马克思主义激进派与残存的独立社会民主党成员和希望转向合法斗争的德国共产党右派共同组成了德国社会主义工人党。二战期间，该党将革命主张掩藏在反战活动下，并最终在战争末期成功联合各左翼势力发动多场起义，战后取得德国西部的主导权。战后，社会主义工人党与尚未被吸收的革命左翼组织组成进步阵线，推动德国社会主义事业不断前进。§!\n"
 DDR_Social_democracy_party: "社会党 - 爱国派"
 DDR_Social_democracy_party_long: "德国社会党 - 民族爱国联盟(Sozialistische Partei Deutschlands - Nationalpatriotisches Bündnis)\n\n§W德国战败后，在国际联军占领的西部地区，各左翼组织在德国社会主义工人党主导下走向合并，形成新的德国社会党。该党总体主张民主社会主义与反军国主义，争取将德国西部顺利过渡到社会主义。此外，党章规定党内民主与平台化，也即允许党内派系拥有公开组织。\n\n民族爱国联盟的主要组成部分是1937年社会民主党分裂时的大部分中间派与少部分施莱歇尔主义右派。该组织大部分成员都在世界大战中支持帝国政府，但随着帝国在战场上陷入颓势，大批社会党人在法国号召下来到西部法占区，为占领区临时政府服务。这一派系因其与德国合作而备受鄙夷，但由于其对奥地利和俄罗斯占领下的德国领土有着相当程度的影响力，这些人仍然能够参与新德国的政治生活。§!\n"
