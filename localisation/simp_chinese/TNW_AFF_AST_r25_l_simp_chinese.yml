l_simp_chinese:
 #R25 派别民族精神
 TNW_AFF_pacific_beacon_spirit: "太平洋自由灯塔"
 TNW_AFF_pacific_beacon_spirit_desc: "自由党温和派把战后秩序理解为议会法治与开放贸易：撤销战时管制、恢复新闻与预算监督，并以南太平洋的商贸往来取代阵营对抗。代价是重建期消费品占用上升、国内稳定度承压。"
 TNW_AFF_united_australia_spirit: "团结的澳大利亚"
 TNW_AFF_united_australia_spirit_desc: "国家党以乡村与小州的补贴、关税和州权为纲领，把各州重新拴回一个联邦：基建与民生产能得到优先，但关税与补贴推高消费品占用，战争支持度因动员松绑而回落。"
 TNW_AFF_anti_radical_labour_spirit: "反激进主义工人运动"
 TNW_AFF_anti_radical_labour_spirit_desc: "民主工党以劳资仲裁、教派学校补助与工会登记为纲领，试图在承认工人组织的同时把激进派排除在外：民用工业与稳定度获得组织红利，代价是产能调度被仲裁程序拖慢。"
 TNW_AFF_anti_communist_nationalism_spirit: "反共民族主义"
 TNW_AFF_anti_communist_nationalism_spirit_desc: "极端派自由党主张延长紧急权力、把街头动员带进常设体制，并以反社会主义划线重整军备：军工厂产能提高，但社会动员持续消耗稳定度与消费品。"
 TNW_AST_party_ideal_spirit: "实现建党理想"
 TNW_AST_party_ideal_spirit_desc: "工党温和派坚持议会道路与渐进社会化：以制宪、组阁和预算程序兑现建党纲领。民用工业与消费品供给获得组织红利，但渐进路线在战时与战后都承受稳定度压力。"
 TNW_AST_socialist_republic_spirit: "社会化共和国"
 TNW_AST_socialist_republic_spirit_desc: "工党激进派要求把工场管理权直接交给生产者，并以社会化法令把国有化判决争议转化为共和国体制：建造与工业产能提高，代价是战争支持度与社会承受力下降。"
 TNW_AST_commune_union_spirit: "公社联合体"
 TNW_AST_commune_union_spirit_desc: "工会理事会以工场委员会、市镇公社与联合会串起地方生产：基建与消费品供给改善，但公社之间的协商成本压低国内稳定度。"
 TNW_AST_council_system_spirit: "澳大利亚委员会制"
 TNW_AST_council_system_spirit_desc: "澳共在恢复公开活动后以委员会表决、结社法案与新任期授权重构地方权力：军备产能提高，但船坞与对外贸易所需的集中调度被委员会程序削弱。"
 #R25 开局介绍
 TNW_welcome_AFF_intro_text_1: "1946 年的新西兰分治危机把澳大利亚撕成两半。为维系与社会主义美国的关系，堪培拉的奇夫利工党政府承认各自治领高度自治；次年，银行业国有化的尝试被高等法院判为违宪，宪法危机接踵而至。孟席斯借「赤色威胁」发难，自由党、国家党与民主工党在东岸都会带结成联盟，悉尼、布里斯班与珀斯尽入囊中。1948 年，内战以爱国者略占上风的态势爆发，东澳大利亚联邦自视为名分所在的一方。"
 TNW_welcome_AFF_intro_text_2: "东岸阵营不是一块铁板。孟席斯的自由党主张撤销战时管制、把行政权交回议会；法登的国家党带着乡村与小州的补贴、关税和州权要求；桑塔马里亚与麦克马纳斯的民主工党靠劳资仲裁与教派学校补助组织工人；休斯领导的极端派自由党则要求延长紧急权力、把街头动员带进战后政治。四条组阁路线互斥——大选之后只能由其中一派组阁，而制宪议程会随人选改变。"
 TNW_welcome_AFF_intro_text_3: "国策树从战时开始：东线、本土、战时经济与对外航线四条战线各自推进，汇合于全线就绪，再进入复员与大选。战后先由胜出的派别完成组阁，随后各派在共同段汇入制宪。制宪完成后还要回答最后一个问题：恢复澳大利亚联邦的君主制，还是改行澳大利亚共和国——国号会随之改写，国旗也与开局的东澳大利亚旗不同。"
 TNW_welcome_AFF_intro_text_4: "再往后是经济、军事与外交三条并行的战后线：处置国有化资产、把战时动员改造成职业军队、对社会主义阵营重新划线。外交末端将在冷战二元格局中站定位置。你此刻握着的是战时内阁，前线的补给、港口与征粮仍要一件件安排；内战的胜负不只决定澳大利亚的颜色，也会顺着南洋航线，决定大洋洲如何参与这场席卷全球的冷战。"
 TNW_welcome_AST_intro_text_1: "1946 年的新西兰分治危机之后，奇夫利工党政府为维系与社会主义美国的同盟承认各自治领高度自治，右翼怒火中烧；1947 年银行业国有化立法被高等法院判为违宪，宪法危机接踵而至。孟席斯借「赤色威胁」煽动倒阁，自由党—国家党—民主工党联盟在东岸都会带崛起并与共和国政府兵戎相见。1948 年，堪培拉手里还握着与社会主义美国的同盟，却必须先赢下这场决定国运的内战。"
 TNW_welcome_AST_intro_text_2: "工党阵营内部同样分成四股。温和派坚持议会道路与渐进社会化；激进派要求把工场管理权直接交给生产者；工会理事会要的是工场委员会、市镇公社与联合会；恢复公开活动的澳共则主张以委员会制重构地方权力。政治树从四个派别席位开始，先把各自的支持度抬出为零的开局，再让四条派别链一路走到各自的定型国策，最后才在共和体制上汇合。"
 TNW_welcome_AST_intro_text_3: "其余四棵字面树与政治树并排铺开：战时线负责西线、堪培拉防务与战时生产；经济线在社会化与公社化之间互斥二选一，随后汇入共享政策；军事线从步兵改革走到防卫白皮书；外交线走的是法伦斯泰尔国际的经贸、技术与文化往来。战后四棵树的入口要等到内战落幕、对手不复存在之后才会打开。"
 TNW_welcome_AST_intro_text_4: "内战结束后，国号将改为澳大利亚民主共和国，制宪、政治秩序、经济秩序、防卫秩序与外交秩序依次收束。你要从战时应急内阁开始：一边守住堪培拉与前线，一边决定四派在共和国里各自占多大分量。这个国家没有可以指望的外援，能依靠的只有它自己的港口、工场与那条通往社会主义美国的航线。"
