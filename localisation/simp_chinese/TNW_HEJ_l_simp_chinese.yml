l_simp_chinese:
 HEJ_ali_bin_hussein: "阿里一世"
 HEJ_ali_bin_hussein_desc: "汉志国王，先知圣裔、两圣城的守护者，大起义老王侯赛因的长子。先王归真后接掌汉志王座，守着麦加、麦地那两座圣城和一条从不消停的朝觐财路。如今他年近七旬，把朝政一寸寸交给王储，只在沙漠里的部落王公们蠢蠢欲动时才亲自出马。"
 HEJ_abd_al_ilah: "阿卜杜勒·伊拉王储"
 HEJ_abd_al_ilah_desc: "汉志王储，阿里一世之子。温和、圆滑、精于算计，是圣城宫廷里少有的懂钱的人——他打理朝觐收入与圣裔家族的瓦克夫地产，用部落长老听得懂的话谈税，用部落长老看不懂的账本收钱。"
