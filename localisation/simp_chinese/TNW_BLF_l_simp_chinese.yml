 BLF_Left_wing_coalition_government:0 "左翼联合政府"
 BLF_Left_wing_coalition_government_desc:0 "工党的失败大家有目共睹，难道这些起义的左派分子不知道这可能重蹈覆辙吗？——这是英国民众普遍对解放阵线的看法。\n\n在世界大战爆发之前，整个不列颠就已经爆发了大规模的工人运动。由于工党的失败，工人的权利无法保障，任由威斯敏斯特的老爷们榨取，工人们过着度日如年的黑暗生活。他们不是没想过武装斗争，但总有那么一两个工贼为了那丰厚的报酬从而出卖自己的同伴，陆陆续续导致各地秘密行动的失败——转入地下工作的大不列颠共产党深有体会。英国人并不想让英国成为一个苏维埃政权，所以除了亲苏政党，他们一直拒绝着来自共产国际的秘密援助，想靠着自己的能力去改变或者推翻当局现状。不过一场位于中欧的小冲突打破了他们日常的斗争。\n\n第二次世界大战爆发了，英国政府在对外全力抗击共产主义的同时，对内也在更加严重的打压着工人阶级，强制要求他们两班倒为前线生产所需物资。很讽刺，不是吗，由无产阶级亲手造出来的枪炮弹药被送上战场，然后由士兵们将其射向无产阶级——无论对内还是对外。孰可忍孰不可忍，这场资本主义与共产主义的大战就是他们翻身做主人的绝佳机会，而想要做到推翻当局，单靠他们各自的力量很难做到，必须联合起来，只有联合内外势力才能做到推翻当局，随即各个左翼政党在伯明翰的秘密基地里达成协议，成立联合政府，并且愿意接受来自共产国际的援助。无论前线战况如何，跟他们没有任何关系，目前他们要做的就是，组建工人卫队，策反部队与水兵——尽管这一举措极难实现，等待时机，最后发动起义。\n\n现在，由左翼联合政府领导的不列颠解放阵线已经发动起义，他们会不惜一切代价推翻资产阶级政府，废黜那个躲在白金汉宫里的君主。§R全英国无产阶级联合起来！§!"
