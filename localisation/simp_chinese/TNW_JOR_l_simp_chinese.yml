l_simp_chinese:
 JOR_SYR: "叙利亚王国（流亡）"
 JOR_DEF: "叙利亚王国"
 JOR_ADJ: "叙利亚王政派"

#领导人
 JOR_Ghazi_bin_Faisal: "加齐·本·费萨尔"
 JOR_Ghazi_bin_Faisal_desc: "哈希姆王朝的叙利亚国王。他在政变的凌晨仓皇出逃，如今在安曼的流亡宫廷里等待王座复归的那一天。"

#政党名字
 JOR_communist_party: "人民解放党"
 JOR_communist_party_long: "叙利亚人民解放党"
 JOR_syndicalism_party: "工联会安曼支部"
 JOR_syndicalism_party_long: "叙利亚工会总联合会安曼支部"
 JOR_socialism_party: "复兴运动委员会"
 JOR_socialism_party_long: "阿拉伯复兴运动安曼委员会"
 JOR_Social_democracy_party: "宪政会"
 JOR_Social_democracy_party_long: "叙利亚宪政会"
 JOR_Liberalism_party: "人民党（王政派）"
 JOR_Liberalism_party_long: "叙利亚人民党王政派"
 JOR_Conservatism_party: "部落长老会"
 JOR_Conservatism_party_long: "外约旦部落长老会"
 JOR_Authoritarianism_party: "王国军事参议院"
 JOR_Authoritarianism_party_long: "叙利亚王国军事参议院"
 JOR_Absolutism_party: "圣裔王庭"
 JOR_Absolutism_party_long: "哈希姆圣裔王庭"
 JOR_Nationalism_party: "民族同盟"
 JOR_Nationalism_party_long: "叙利亚民族同盟（王政派）"

#民族精神
 JOR_desert_doctrine: "沙漠作战学说"
 JOR_desert_doctrine_desc: "机动、水源、部落政治——阿拉伯军团把沙漠的规律写成了操典。在阿拉伯的荒野里，会算水的军官比会算弹道的更重要。"
 JOR_levant_kingdom: "圣裔黎凡特"
 JOR_levant_kingdom_desc: "从阿勒颇到安曼，圣裔的鹰旗重新连成一片。这个在流亡中誓言、在血火中兑现的名字，重新写上了地图。"

#事件
 JOR_event.1.t: "欣纳维的口信"
 JOR_event.1.d: "密使从大马士革带回欣纳维将军的密函：这位总参谋部里的实权人物对扎伊姆的独断早有积怨，愿意在关键时刻为国王打开城门。信的末尾只有一句——王冠之下，须有他的位置。"
 JOR_event.1.a: "承诺王冠之下有他一席"
 JOR_event.1.b: "再观望观望"

#国策
 JOR_court_in_exile: "流亡宫廷"
 JOR_court_in_exile_desc: "安曼的王宫挤下了整个叙利亚的流亡朝廷。加齐国王在阳台接受旧臣朝拜——距离大马士革两百公里的山城，成了哈希姆王朝最后的阵地。"
 JOR_iraqi_stipend: "巴格达津贴"
 JOR_iraqi_stipend_desc: "巴格达的津贴按季到账，附带条件的清单越来越长。王庭上下都明白：兄长之国买的不是王朝复辟，而是外约旦的顺从。"
 JOR_arab_legion: "阿拉伯军团"
 JOR_arab_legion_desc: "由伊拉克教官整训的阿拉伯军团是这片战场上最精锐的部队。军团整齐的操典与王庭的流亡气象形成刺眼的对比——但国王知道，这是他唯一的家底。"
 JOR_hashemite_council: "圣裔家族会议"
 JOR_hashemite_council_desc: "家族会议在安曼连夜召开。巴格达的叔父们、汉志的堂亲们发来贺表与账单——流亡的圣裔第一次发现，血统的价码可以如此具体。"
 JOR_hijaz_loan: "汉志朝觐贷款"
 JOR_hijaz_loan_desc: "汉志商团批准了特别贷款。附带的条件是海关与朝觐路权益的担保——复国的代价，从借款合同的第一行就开始计息。"
 JOR_glubb_doctrine: "格拉布学说"
 JOR_glubb_doctrine_desc: "沙漠作战学说成文下发：机动、水源、部落政治。在阿拉伯的沙漠里，战争的规则由沙漠自己书写——军团只是学会了阅读它。"
 JOR_iraqi_umbilicus: "巴格达脐带"
 JOR_iraqi_umbilicus_desc: "巴格达的军火沿沙漠公路西运。伊拉克的摄政与努里·赛义德许诺：哈希姆的血不会流干——只要安曼记得谁是长房。"
 JOR_prophet_lineage: "圣裔血统"
 JOR_prophet_lineage_desc: "宣传部门重新翻出先知后裔的谱牒。清真寺的讲道里，加齐是圣裔护教者——王座的神圣性，是流亡政权最后的免税品。"
 JOR_crown_prince_education: "幼储教育"
 JOR_crown_prince_education_desc: "幼小的王储费萨尔在教师的陪同下诵读谱牒与战报。宫廷教师说：王储的功课里没有童话——他的每一课都是复国。"
 JOR_bedouin_cavalry: "贝都因骑兵"
 JOR_bedouin_cavalry_desc: "贝都因部落的骑兵在阅兵式上扬起沙尘。军团军官们对部落的忠诚度不抱幻想——但沙漠里的战争，离不开沙漠的儿子。"
 JOR_tribal_battalions: "部落营"
 JOR_tribal_battalions_desc: "部落营成军：谢赫们的儿子任军官，族人领饷。古老的部落义务第一次变成按月结算的军饷——王朝用金库重构了沙漠的忠诚。"
 JOR_border_raids: "边境袭扰"
 JOR_border_raids_desc: "军团的巡逻队越过边境，袭扰大马士革的外围哨所。每一次越境都是一次试探——试探共和军的防线，也试探列强的耐心。"
 JOR_legion_modernization: "军团现代化"
 JOR_legion_modernization_desc: "巴格达运来的炮与新式装备换装军团。伊拉克教官的操典翻到新的一页——复国之师不能只靠马刀与荣耀。"
 JOR_amman_bazaar: "安曼巴扎"
 JOR_amman_bazaar_desc: "安曼的巴扎挤满了大马士革来的流亡商人。市场在流亡中繁荣起来——税收官第一次发现，难民的口袋也是税源。"
 JOR_maan_pilgrim_route: "马安朝觐线"
 JOR_maan_pilgrim_route_desc: "马安的朝觐驿路重新修整。每年圣路上的人流既是收入，也是王座合法性的游行——朝觐者们亲眼看见圣裔在守护圣路。"
 JOR_desert_policing: "沙漠警备队"
 JOR_desert_policing_desc: "沙漠警备队的巡逻线向北延伸。他们缉私、护路、收编迷路的溃兵——沙漠的秩序，就是王朝的边境。"
 JOR_hijaz_broker: "汉志调停人"
 JOR_hijaz_broker_desc: "安曼特使往返于汉志诸王之间。哈希姆家事家谈：复国大业需要全家族同心协力——哪怕账单各付各的。"
 JOR_exile_diplomacy: "流亡外交团"
 JOR_exile_diplomacy_desc: "流亡外交团走访开罗与阿拉伯各宫廷。带去的国书抬头是叙利亚王国，收到的回函措辞一次比一次谨慎——但门没有被关死。"
 JOR_royalist_underground: "王党地下网"
 JOR_royalist_underground_desc: "王党地下网络在大马士革与霍姆斯重建。旧官吏、部落长老与被清算的富商向安曼传递情报——共和国的心脏里，埋着忠于国王的暗线。"
 JOR_hinnawi_pact: "欣纳维密约"
 JOR_hinnawi_pact_desc: "密使带回欣纳维的口信：这位总参谋部里的将军愿意为国王打开大马士革的城门——条件是王冠之下，须有他的位置。"
 JOR_palestine_card: "巴勒斯坦牌"
 JOR_palestine_card_desc: "王庭宣布对圣城肩负监护之责。对耶路撒冷的姿态既是宗教牌，也是与贝鲁特和革命政权争夺阿拉伯世界话语权的先手。"
 JOR_holy_city_march: "圣城进军"
 JOR_holy_city_march_desc: "军团的作战地图添上了南下箭头。圣城必须握在圣裔手中——这是复国叙事的最后一环，也是最危险的一步。"
 JOR_iraqi_volunteers: "伊拉克志愿军"
 JOR_iraqi_volunteers_desc: "巴格达默许伊拉克青年自发越境从军。志愿军穿着没有徽记的军装渡过幼发拉底——哈希姆的战争，用哈希姆的人。"
 JOR_constitutional_charter: "复国宪章"
 JOR_constitutional_charter_desc: "国王颁布复国宪章：还都之日，召开议会，还政于宪政。安曼的流亡者们热泪盈眶——尽管没人能担保宪章在王座复归后还有效。"
 JOR_fertile_crescent: "新月计划"
 JOR_fertile_crescent_desc: "努里·赛义德的新月计划摆上桌面：叙利亚、外约旦、伊拉克结成哈希姆联邦。地图上的新月很美——只是新月两端的人还没被征询。"
 JOR_reclaim_damascus: "收复大马士革"
 JOR_reclaim_damascus_desc: "复国之师拔营北上。加齐国王在全军团面前宣誓：不收复先辈的都城，誓不解除战袍。"
 JOR_reclaim_beirut: "收复贝鲁特"
 JOR_reclaim_beirut_desc: "海岸的民族主义政权同样窃据着王国的领土。军团的下一站是贝鲁特——大叙利亚的窗口必须归位。"
 JOR_march_on_aleppo: "北上阿勒颇"
 JOR_march_on_aleppo_desc: "红旗盘踞的阿勒颇是复国路上最硬的骨头。军团参谋部把北上作战命名为收割行动——去北方收割革命。"
 JOR_reclaim_throne: "王座复归"
 JOR_reclaim_throne_desc: "军团踏进大马士革的那个清晨，国王在倭马亚清真寺礼拜。流亡经年的王座回到王宫——这一次，他发誓再不离开。"
 JOR_hashemite_levant: "圣裔黎凡特"
 JOR_hashemite_levant_desc: "从阿勒颇到安曼，圣裔的鹰旗重新连成一片。哈希姆黎凡特——这个在流亡中誓言、在血火中兑现的名字，重新写上了地图。"
