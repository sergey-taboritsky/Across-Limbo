l_simp_chinese:
PRODUCTION_MATERIALS_FOOD: "粮食"
food_desc: "人不吃，就会死"
ACROSSLIMBO_NAME: "穿越灵薄狱"
ACROSSLIMBO_DESC: "所谓\"灵薄狱\"的概念发源于犹太教，并在文学领域被进一步拓展为指代悬而未决、处于边缘或过渡的状态。这一概念尤以但丁《神曲》的引用最为著名，在诗人笔下，此处点缀着青翠草坡，流淌着美丽小河，处于地狱最外层而并无刑罚。\n\n当今时局暗合这一状态久矣：随着毁灭性的世界大战宣告终结，俄罗斯国与社会主义国际围绕意识形态与地缘因素关系不断恶化，人类仿佛也正由理想与现实交织成的贝雅特丽齐所提携，漫步在灵薄狱正中央......只是无人知晓行进方向究竟是向美丽人间，抑或是地狱深层。"

FRA_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n自巴黎公社与雪月革命以来，法兰西便是工人运动的始源地；苏维埃俄国沦陷后，它成为世界上第一个站稳脚跟的社会主义国家。第三国际的心脏与欧洲工人联军总部都设在巴黎，而不列颠盟友与它并肩粉碎了德意志世界帝国。\n\n胜利的同袍情谊却随中欧与东亚的突发意外迅速消散。法兰西曾经赢得了最后一场大战，但如今他或许将要面对更为艰难的对峙。"
USA_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n大萧条之后，美利坚在社会主义旗帜下重组为自治公社联合体，合作社与工会取代了旧日的托拉斯。它既属法伦斯泰尔国际，也长期把注意力留在大洋此岸。\n\n然而，其孤立态势已经随参与世界大战和大太平洋战争而打破，东京会战之后美国遂成为占领日本的主导力量；中美友好同盟条约把南京与底特律拴在一起，巴黎与底特律也放下成见共同支持亚洲盟国。孤立主义的躯壳还在，美国却已被推到远东对峙的最前线。"
ENG_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n自1925年红旗飘上白金汉宫，不列颠确立了社会主义制度；1936年莫斯利总统上台后，工党重塑了议会。它与法兰西并肩作战，粉碎了人类有史以来最为庞大的世界帝国。\n\n胜利没有带来安宁。以高额关税隔绝欧陆的莫斯利主义经济让各地工会重新骚动，政府内部也绝非铁板一块。不列颠应对这些新挑战的能力，将决定这个战胜国在下一场对峙里还剩多少分量。"
CHI_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n北伐大业既成，国民党在中华民国的主导地位已经延续了超过二十年，而随着抗战以美俄联军全歼日本在大陆的军队告终，这一地位看似得到了彻底的巩固。\n\n然而淮水以北如今只听北平的号令，实质上的南北分治既成；经济崩溃、国民党内斗、1俄罗斯对北部边疆的渗透，一齐挤进训政即将告终时新政府的组阁时刻。南京背后是大洋彼岸的友谊与庇护，前方却是尚未结束的战争。"
RAJ_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n自从与英国革命近乎同期的孟买与加尔各答大起义以来，掌控印度河流域的自由印度曾被视为世界革命在亚洲最大的盟军，而其也未曾辜负英法的期待，在世界大战期间向东西南三面的德国势力发起猛攻。\n\n但如今掌控印度国民大会党的右翼反社会主义派系正使得加尔各答不断靠近莫斯科，俄罗斯的援助经中亚、印度与印度洋抵达。"
PER_ACROSSLIMBO_DESC: "新伊朗党诞生于民族危难之际，国破家亡之时，在1925年惨烈的内战后夺取共和国政权。出于革命民族主义者的惺惺相惜，伊朗不断靠拢萨文科夫俄罗斯，直到莫斯科最终反噬了党——1939年俄国扶植军政府上台，用稳定与秩序的话语掩盖其帝国主义操弄。\n\n如今总统年迈病危，党内各派的目光都盯在最高委员会的表决桌上；人民党的传单贴满德黑兰大学，石油工人罢工、大不里士与库尔德山区也同时散发着不安气氛。"
RUS_ACROSSLIMBO_DESC: "§R该国目前尚未制作完成，暂时不予发布，敬请期待后续版本！§!\n\n俄罗斯曾经蒙受屈辱，其土地遭到剥夺，人民被布尔什维克裹挟，而随后又陷入软弱的\"民主\"迷梦中，但这一切都随着第二次世界大战的烈火化为灰烬。如今，鲍里斯·萨文科夫缔造的俄罗斯民族共和国是东欧无可置疑的盟主。世界大战终结之后，它与社会主义国际围绕意识形态与地缘的关系不断恶化，把冷战从中东铺到东亚与南洋。\n\n鲍里斯·萨文科夫年迈，世人皆知国家的缔造者即将去世，而继承权悬而未决；未竟的土地改革与偏激的工业化仍在啃噬国力。莫斯科的手伸得越来越远，但他的内部能否继续支撑其世界野心呢？"

MAL_ACROSSLIMBO_DESC: "星洲联邦建立于世界大战末期马来半岛的混乱之中，而在印支战争中凭借与泰国的军事联盟得以巩固。然而，随着和平降临，党内、政府中、议会内外均响起了不同的声音，而马六甲海峡对岸的敌意日渐加深。随着世界逐渐步入未知，星洲联邦的存续或将取决于南京方面的局势。"
JAP_ACROSSLIMBO_DESC: "旧的日本帝国本应在世界大战中灰飞烟灭，而南日本如今也这样宣称。随着二一总蜂起与长达两年的战争，福岛以南出现了一个新生工人政权，日本就此陷入南北对峙。\n\n远东委员会现由中美两大集团掌控，国民革命军已显露撤出之兆，而劳动自卫队只有一万常备军与落后装备。占领军理想中的共产主义天国，能否在如今日本南部的一片废墟之上建立起来？"
PHI_ACROSSLIMBO_DESC: ""
TUR_ACROSSLIMBO_DESC: "土耳其的近代史充满了背叛与屈辱。先是第一次世界大战中被同盟国盟友出卖，沦为\"光荣和平\"菜单上的佳肴，失去全部阿拉伯地区，之后又是二战中遭俄罗斯偷袭惨败，色雷斯被保加利亚吞并，海峡与君士坦丁堡沦于军管。\n\n在全部道路均被宣告失败后，在1946年左翼民兵突袭科尼亚夺取了全国政权，截至到1947年底，土耳其社会主义劳工共和国才算基本巩固。不过，海峡非军事区仍在俄军手中，特拉比松宣布独立，库尔德叛乱与旧政权的复仇主义同时逼近......安卡拉已向第三国际求援，而俄国军舰出现在马尔马拉海的地平线上，只是时间问题。"
SYR_ACROSSLIMBO_DESC: "哈希姆圣裔在光荣和平后加冕于大马士革，而在英国革命并退出中东后却是德式操典训练出的军官团、德国资本的铁路与港口，德国的驻军与保护承诺共同撑起了王国的门面。\n\n1945年柏林战败，军械供应一夜中断、海外市场随之蒸发，宫廷失去全部外援。1948年的大马士革表面秩序仍在运转，但其岌岌可危的态势似乎预示着哈希姆帝国的心脏即将沦为野心家与革命者的战场。"
IRQ_ACROSSLIMBO_DESC: "1921年在英德共同监护下立国的伊拉克哈希姆王国，靠基尔库克的石油与新管线把黑金直送地中海。1945 年柏林投降，德伊条约化作废纸，开往巴勒斯坦的三个旅也带着远征的账单归国。\n\n随着军队内部的不稳定因素逐渐发酵，俄罗斯和社会主义者的影响力也在加速渗透中东，伊拉克的王室政权能撑多久犹未可知。"
EGY_ACROSSLIMBO_DESC: "法鲁克一世的君权立宪王国曾在第一次近东战争里占下西奈，又被推回苏伊士运河以西。德意志帝国战败，让埃及同时失去了宗主国、压迫者，以及外来驻军的保护。\n\n\"埃及的施莱歇尔\"马希尔帕夏于1945年遇刺，如今回归宪政体系的埃及已经无力阻止华夫脱党在下次选举中回归。然而，当前状态下的华夫脱党和埃及，真的能够支撑纳哈斯帕夏的改革理念吗？"
INS_ACROSSLIMBO_DESC: "1946年2月，印度尼西亚共和国在东京亲手扶植的躯壳里醒来；战败的前宗主荷兰已坍成社会主义共和国，无舰队跨海，可红白旗也只飘在爪哇与苏门答腊南部，政令几乎越不过龙目岛。\n\n国父病床前的心跳日渐微弱，政党机器与街头组织分属不同派系，党内倾轧与党外清洗的阴影压在雅加达。从沙璜到马老奇，大印度尼西亚的梦想或许将在下一代领导人手中实现，但也可能彻底化作梦幻泡影。"
AST_ACROSSLIMBO_DESC: "战争落幕，澳大利亚却没迎来和平。为维系与社会主义美国的关系，奇夫利政府承认新西兰高度自治，右翼怒火中烧；国有化银行业的立法被高等法院判为违宪，宪法危机接踵而至。\n\n孟席斯借\"赤色威胁\"煽动倒阁，自由党—国家党—民主工党联盟在东岸都会带崛起并与共和国政府兵戎相见。工党政府手里还握着堪培拉与社会主义美国的同盟，却必须先赢下这场决定国运的内战。"
AFF_ACROSSLIMBO_DESC: "两年前的新西兰分治危机后，工党政府为维系与社会主义美国的关系承认各自治领高度自治，名为澳大利亚的合法政府，实则早已成为美国人的忠犬；银行业的国有化尝试更是暴露了工党和奇夫利本人的布尔什维克本质。\n\n随着自由党—国家党—民主工党联盟在东北海岸崛起，悉尼、珀斯、布里斯班尽入囊中，内战以爱国者略占上风的局势爆发。内战的胜负不只决定澳大利亚的颜色，也会顺着南洋的航线，决定大洋洲将会如何参与这场席卷全球的冷战。"
