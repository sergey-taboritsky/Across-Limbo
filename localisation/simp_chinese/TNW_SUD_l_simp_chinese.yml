l_simp_chinese:
 #角色
 SUD_Farouk: "法鲁克一世"
 SUD_Farouk_desc: "埃及与苏丹的国王。在开罗，他是被锁链宪政捆住的君主；在喀土穆，他却是1925年协议授予的王冠本身。"
 SUD_Farouk_sudan_desc: "苏丹王国的国王。对北方穆斯林精英而言，王冠是自治领合法性的最后一根支柱——而这根支柱如今正随着开罗的政局一同摇晃。"
 SUD_Abdallah_Khalil: "阿卜杜拉·哈利勒"
 SUD_Abdallah_Khalil_desc: "1925年率苏丹防卫军兵变迎接富阿德国王的白旗联盟老兵，如今的苏丹首相。他既是“迎王”功臣，也是恩图曼军校军官团的主人，毕生事业就是在开罗与喀土穆之间维持那根摇摇欲坠的天平。"
 SUD_Abdel_Rahman_Mahdi: "阿卜杜勒·拉赫曼·马赫迪"
 SUD_Abdel_Rahman_Mahdi_desc: "安萨尔教派的伊玛目、马赫迪之子。二十余年来他始终是自治领体制最显赫的批评者，安萨尔信众遍布科尔多凡与白尼罗河。他要求的是一个彻底独立的苏丹王国——由他的家族加冕。"
 SUD_Ismail_Azhari: "伊斯梅尔·阿扎里"
 SUD_Ismail_Azhari_desc: "毕业生大会的旗手，戈登学院出身的报人。“尼罗河谷统一”在他口中不是开罗的官话，而是苏丹知识阶层自己的口号。他相信苏丹的前途在与埃及的合并之中。"
 SUD_Hussein_Fahmy: "侯赛因·法赫米"
 SUD_Hussein_Fahmy_desc: "埃及派驻苏丹的总督，开罗贵族出身。他的衙门继承了英国人留下的整套机构——也继承了英国人的困境：喀土穆的电报能发到青尼罗河的每个角落，却管不到白尼罗河以南一步。"
 SUD_Ali_Mirghani: "阿里·米尔加尼"
 SUD_Ali_Mirghani_desc: "哈特米亚教派的赛义德。米尔加尼家族怕马赫迪复辟甚于怕开罗，因此二十余年来始终是自治领体制最可靠的教派盟友。"
 #开局精神
 SUD_sect_divide: "教团对峙"
 SUD_crown_union: "王冠联合"
 SUD_protocol_1925: "1925年喀土穆协议"
 SUD_sdf: "苏丹防卫部队"
 SUD_gezira: "杰济拉棉田体系"
 SUD_south_neglect: "南方弃置"
 #结算精神
 SUD_settlement_cairo: "自治条款：开罗主导"
 SUD_settlement_1925: "自治条款：1925年现状"
 SUD_settlement_sudanized: "自治条款：苏丹化自治"
 SUD_standoff_crisis: "王冠悬置"
 SUD_south_uprising: "南方暴乱"
 SUD_independence_era: "独立的苏丹"
 #决议组
 TNW_nile_unification_category: "尼罗河谷统一"
 TNW_nile_unification_category_desc: "统一主义思潮：[?EGY.EGY_nile_unification_var]\n埃及在苏丹的影响力：[?EGY.EGY_egypt_influence_var]\n赤道军团的力量：[?EGY.EGY_equatoria_power_var]\n\n一条尼罗河，一个民族——这条口号究竟会通向喀土穆的王冠，还是青尼罗河以南的战火，取决于两岸的每一份报纸、每一支驻军和每一笔贿赂。"
 EGY_nile_propaganda: "宣扬尼罗河谷统一"
 EGY_nile_propaganda_desc: "报纸、广播、教科书——让“一条尼罗河、一个民族”从官话变成信仰。"
 EGY_nile_advisors: "派驻苏丹顾问团"
 EGY_nile_advisors_desc: "财政、灌溉、警务——开罗的顾问将坐进喀土穆的每个衙门。"
 EGY_nile_water: "尼罗河水委员会"
 EGY_nile_water_desc: "共管尼罗河水的测量与分配。水是最诚实的纽带——也是最容易被政治化的纽带。"
 EGY_nile_deescalate: "搁置统一争议"
 EGY_nile_deescalate_desc: "把“统一”从官方口径中暂时撤下，换取喀土穆的信任与安稳。"
 EGY_nile_pressure: "武力威慑赤道军团"
 EGY_nile_pressure_desc: "向南方边界调动部队，提醒赤道军团：白尼罗河不是国界。"
 EGY_nile_bribes: "收买南方部族"
 EGY_nile_bribes_desc: "盐、布匹、步枪与头衔——对付南方，喀土穆与开罗都学会了英国人的老办法。"
 SUD_nile_union_movement: "宪政统一运动"
 SUD_nile_union_movement_desc: "议会内外的统一派将发起请愿与结盟，让“与埃及合并”成为喀土穆的官方议程。"
 SUD_nile_loyalty: "迎合开罗"
 SUD_nile_loyalty_desc: "向开罗表明姿态：自治领是王冠忠实的半边。忠诚是能兑换影响力的货币。"
 SUD_nile_autonomy_demand: "自治诉求"
 SUD_nile_autonomy_demand_desc: "要求修订1925年协议：总督由苏丹人出任，议会掌握实权。"
 SUD_nile_ansar_dialogue: "与安萨尔对话"
 SUD_nile_ansar_dialogue_desc: "哈利勒与马赫迪的私人会谈。两个“迎王”时代的老对手围炉而坐——谈的必然是王冠落地之后的事。"
 SUD_nile_sudanization: "军队苏丹化深化"
 SUD_nile_sudanization_desc: "把防卫部队里最后几个埃及名字从花名册上划掉。军队只应效忠于喀土穆。"
 SUD_nile_pacify: "南方绥靖"
 SUD_nile_pacify_desc: "与赤道军团的军需官们做交易：贸易特权换取枪口朝天。"
 #决议提示
 TNW_nile_unif_up_tt: "尼罗河谷统一主义思潮上升（§G+10§!）"
 TNW_nile_unif_up_small_tt: "尼罗河谷统一主义思潮上升（§G+5§!）"
 TNW_nile_unif_down_tt: "尼罗河谷统一主义思潮下降（§R-10§!）"
 TNW_nile_unif_down_small_tt: "尼罗河谷统一主义思潮下降（§R-5§!）"
 TNW_nile_inf_up_tt: "埃及在苏丹的影响力上升（§G+10§!）"
 TNW_nile_inf_up_small_tt: "埃及在苏丹的影响力上升（§G+5§!）"
 TNW_nile_inf_down_tt: "埃及在苏丹的影响力下降（§R-10§!）"
 TNW_nile_inf_down_small_tt: "埃及在苏丹的影响力下降（§R-5§!）"
 TNW_nile_eq_down_tt: "赤道军团的力量下降（§G-10§!）"
 TNW_nile_eq_down_big_tt: "赤道军团的力量下降（§G-15§!）"
 SUD_settlement_effect_tt: "自治条款的精神已经生效，自治等级已按开罗的意旨调整。"
 EGY_naguib_sudan_tt: "§Y纳吉布的特使已启程前往喀土穆：§!埃及在苏丹的影响力上升（§G+10§!），苏丹将在七天后对王冠悬空作出答复"
 EGY_nasser_sudan_tt: "§Y革命的统一口号已传遍河谷：§!尼罗河谷统一主义思潮上升（§G+15§!），赤道军团的力量下降（§G-5§!），苏丹将在七天后对王冠悬空作出答复"
 #事件
 SUD_event.1.t: "王冠悬空"
 SUD_event.1.d_stay: "开罗的枪声停下来之后，喀土穆在沉默中清点了自己的处境。总督府的电报机响了一夜——开罗的新主人给出了他们的条件，而议会大厅里，哈利勒、马赫迪与阿扎里的代表们轮番发言到天明。统一主义思潮：[?EGY.EGY_nile_unification_var]\n埃及在苏丹的影响力：[?EGY.EGY_egypt_influence_var]\n赤道军团的力量：[?EGY.EGY_equatoria_power_var]\n\n最终，天平倒向了维持联合的一侧：苏丹将留在王冠的继承者身边——条件另议。"
 SUD_event.1.d_independence: "开罗的枪声停下来之后，喀土穆在沉默中清点了自己的处境。总督府的电报机响了一夜——开罗的新主人没有给出任何条件。统一主义思潮：[?EGY.EGY_nile_unification_var]\n埃及在苏丹的影响力：[?EGY.EGY_egypt_influence_var]\n赤道军团的力量：[?EGY.EGY_equatoria_power_var]\n\n马赫迪的鼓手已经走上科尔多凡的街头，阿扎里的学生们在喀土穆悬挂起了苏丹旗。天平彻底倒向了另一侧：苏丹要与那顶落地的王冠一同成为历史。"
 SUD_event.1.d_standoff: "开罗的枪声停下来之后，喀土穆在沉默中清点了自己的处境。总督府的电报机响了一夜——开罗的新主人给出了含糊其辞的答复。统一主义思潮：[?EGY.EGY_nile_unification_var]\n埃及在苏丹的影响力：[?EGY.EGY_egypt_influence_var]\n赤道军团的力量：[?EGY.EGY_equatoria_power_var]\n\n没有人宣布联合，也没有人宣布决裂。总督府、议会与安萨尔在等待中互相试探——而等待本身就是这个国家最昂贵的东西。"
 SUD_event.1.a: "历史在喀土穆合流。"
 SUD_event.2.t: "自治条款"
 SUD_event.2.d_cairo: "新协议的墨迹未干：埃及顾问坐进了财政、灌溉与警务的每一间办公室，关税与外交悉数听命于开罗，总督府的埃及旗帜换了一块新呢料。自治领的躯壳还在——但苏丹人都看得见里面的主人换成了谁。"
 SUD_event.2.d_1925: "新协议几乎就是1925年协议的复写本：王冠悬空的部分由开罗的“革命政府”继承，其余一切照旧。哈利勒在议会的表决中投了赞成票，只在私下里说了一句：“它至少没有变得更坏。”"
 SUD_event.2.d_sudanized: "开罗的答复出乎所有人意料：苏丹人将接管总督府的实权，防卫部队只效忠喀土穆，自治领向自治王国迈进了一步。安萨尔派嫌它不够，统一派嫌它太过——但哈利勒知道，这是开罗能给的全部了。"
 SUD_event.2.a: "条件另有细则。"
 SUD_event.3.t: "独立的宣言"
 SUD_event.3.d: "议会在凌晨通过了独立决议。白尼罗河与青尼罗河交汇处的钟声敲响时，马赫迪的绿旗与新的苏丹国旗一同升上总督府的旗杆。1925年喀土穆协议被正式撕毁——苏丹王国第一次以自己的名义站在世界上。"
 SUD_event.3.a: "苏丹属于苏丹人。"
 SUD_event.4.t: "悬而未决"
 SUD_event.4.d: "开罗的答复被总督府“误递”了三次，议会的特别会议开了又散。哈利勒以健康为由闭门谢客，马赫迪回了恩图曼，阿扎里的报纸开始连载《1925年的教训》。联合与独立都在嘴边，却谁也没有说出口。"
 SUD_event.4.a: "再等等看。"
 SUD_event.5.t: "南方燃起战火"
 SUD_event.5.d: "赤道军团再次拿起了英国人留下的重武器。朱巴与托里特的行政长官被驱逐，商队被劫掠，教堂的钟声与战鼓声混在一起。这一次他们不再满足于白尼罗河以南的“默契”——南方的使者放话：要求把北方的驻军、税吏和总督永远赶过白尼罗河。"
 SUD_event.5.a: "南方问题再也拖不下去了。"
 SUD_event.7.t: "喀土穆的抉择"
 SUD_event.7.d_stay: "四个月的等待之后，统一思潮的声浪淹没了犹豫。议会在欢呼中通过决议：苏丹接受开罗的条件，留在联合之中。"
 SUD_event.7.d_independence: "四个月的等待耗尽了最后一丝耐心。统一派的支持者纷纷倒戈，议会通过决议：苏丹走向完全独立。"
 SUD_event.7.d_standoff: "四个月的等待之后，僵局依旧。开罗的摇摆让喀土穆的怒火又深了一层——而僵持本身，正在一天天消耗掉所有人对“联合”的信心。"
 SUD_event.7.a: "沉默也是一种回答。"
 EGY_event.6.t: "来自喀土穆的答复"
 EGY_event.6.d_stay: "苏丹的议会在激烈辩论后接受了开罗的条件——自治领将留在联合之中。纳吉布在地图上苏丹的位置画了一个圈：“河谷还是完整的。”"
 EGY_event.6.d_independence: "电报只有短短一行：苏丹宣布独立。1925年协议被撕毁，总督府的埃及旗降了下来。尼罗河谷统一的梦想，在一个凌晨变成了地图上的两条国界。"
 EGY_event.6.d_standoff: "喀土穆既不接受，也不拒绝。总督府与开罗之间的电报越来越短，而南方边境的部队报告说，赤道军团的巡逻比往年更加频繁。"
 EGY_event.6.a: "河谷的命运尚未写完。"
