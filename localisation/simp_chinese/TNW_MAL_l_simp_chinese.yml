#领导人
 MAL_Li_Zhendian: "李振殿"
 MAL_Li_Zhendian_desc: "§Y出生于：§!§L1874年1月29日，大清帝国，福建省漳州府海澄县海沧镇§!\n\n§Y人物背景：§!§L福建帮侨领，中华总商会与筹赈会财政。战时他守着"义捐不换公债"的规矩——筹赈会的每一分钱都是义款，不作政治交易；战后他守着商界的账本，政府首脑的位置是商界与党各让一步的结果。§!"
 MAL_Chen_Chunan: "陈楚楠"
 MAL_Chen_Chunan_desc: "§Y出生于：§!§L1884年，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L同盟会新加坡元老，《图南日报》创办人，星洲国民党的实权党主席。虚位总统制的设计者与最大受益人——林文庆的名字挂在总统府门口，而党机器的每一颗螺丝都拧在他的手里。§!"
 MAL_Chen_Jiageng: "陈嘉庚"
 MAL_Chen_Jiageng_desc: "§Y出生于：§!§L1874年10月21日，大清帝国，福建省泉州府同安县集美社§!\n\n§Y人物背景：§!§L南侨总会主席，战时南洋动员的第一人。1940年率团访问延安后通电反对蒋介石，与重庆正式决裂——如今他是星洲华社无可争议的道义权威，血债清算线的旗帜，任何政权都得在他的祠堂前低头。§!"
 MAL_Lin_Wenqing: "林文庆"
 MAL_Lin_Wenqing_desc: "§Y出生于：§!§L1869年9月5日，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L海峡土生名医与儒学领袖，日据期间被迫出任华侨协会主席——这份履历是他一生的污点，也是他总统宝座的抵押品。他是华人内部和解的标杆，也是党主席随时可以握住的把柄：虚位总统，实为质子。§!"
 MAL_Li_Guangqian: "李光前"
 MAL_Li_Guangqian_desc: "§Y出生于：§!§L1893年10月18日，大清帝国，福建省泉州府南安县芙蓉乡§!\n\n§Y人物背景：§!§L南益橡胶创办人，陈嘉庚的女婿。橡胶与锡的景气是他的江山——他信市场，也信党，前提是党信市场。§!"
 MAL_Peng_Zemin: "彭泽民"
 MAL_Peng_Zemin_desc: "§Y出生于：§!§L1877年11月7日，大清帝国，广东省肇庆府清塘镇白沙村§!\n\n§Y人物背景：§!§L国民党左派元老，隆市派与南洋民主劳动党的共主。南京的中原棋局是他的天时——若民主劳动党在大陆得势，他动员支持者进军星洲市的那一天，就是联邦国运的分水岭。§!"
 MAL_Fu_Daqing: "傅大庆"
 MAL_Fu_Daqing_desc: "§Y出生于：§!§L1900年，大清帝国§!\n\n§Y人物背景：§!§L中共国际派的南洋老手，中共中央南洋事务委员会的旗手。战争年代他替马共与延安之间架线，档案与电台都过他的手——如今中共-南委的旗号与马革共联并排挂在工会的墙上，他监督这两面旗不倒。§!"
 MAL_Yang_Guo: "杨果"
 MAL_Yang_Guo_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地§!\n\n§Y人物背景：§!§L马革共联的第二领袖。组织里的老实人——档案干净、资历完整、没有山头，这恰恰是他在前任们接连出事之后还站在这里的原因。§!"
 MAL_He_Wei: "何敬贤" #何畏
 MAL_He_Wei_desc: "§Y出生于：§!§L1900年，大清帝国，广西省太平府龙州厅§!\n\n§Y人物背景：§!§L早期马共的组织者之一，老资格的地下工作者。大战后他本已奉调北上，却在最后关头留了下来——如今他替中共南委统领南洋民兵：一支没有番号、却有规矩的队伍。忠诚是他的本钱，也是党内始终有人嘀咕的本钱。§!"
 MAL_Liu_Yao: "刘尧"
 MAL_Liu_Yao_desc: "§Y出生于：§!§L1915年7月31日，中华民国，广东省琼崖道琼海县加积镇§!\n\n§Y人物背景：§!§L马来人民抗日军第一纵队司令，战后出任星洲人民义勇军总参谋长——义勇军里唯一镇得住三族军官的名字。琼崖纵队的老底子，丛林战的行家。他知道自己排在某份清除名单的前列，依然每天巡视军营：义勇军上下都赌他不会出事。§!"
 MAL_Dato_Onn_Jaafar: "拿督·翁惹化"
 MAL_Dato_Onn_Jaafar_desc: "§Y出生于：§!§L1895年1月12日，柔佛，新山§!\n\n§Y人物背景：§!§L柔佛贵族，战时整合马来团体的组织天才。联邦立国后他越走越远——从争取特权一路走到铁杆伊斯兰主义：清真寺成了他的议会，"马来人的土地只在真主的法度下"是他的纲领。训政权起初把他的激进当作凝聚马来人的福气，直到他的布道开始谈到武装。§!"
 MAL_Musa_Ahmad: "慕沙阿莫"
 MAL_Musa_Ahmad_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，雪兰莪§!\n\n§Y人物背景：§!§L马来国民党总书记，从民族主义左翼一路走到马革共联的过桥人物——他替马来青年在左翼运动里找位置，也替左翼运动翻译马来人的怒气。两个阵营都叫他同志，两个阵营都不完全信他。§!"
 MAL_Abdullah_CD: "阿杜拉西迪"
 MAL_Abdullah_CD_desc: "§Y出生于：§!§L1923年11月2日，海峡殖民地，雪兰莪§!\n\n§Y人物背景：§!§L人民抗日军第十支队（马来支队）指挥官，马革共联的马来人面孔。日军与英方的清剿都没能抓住他——如今他统领着义勇军中纪律最严明的马来部队，也在替一场"马来人同样能革命"的证明押上自己的军旗。§!"
 MAL_Ishak_Haj_Muhammad: "伊沙哈芝穆哈默"
 MAL_Ishak_Haj_Muhammad_desc: "§Y出生于：§!§L1910年11月，彭亨§!\n\n§Y人物背景：§!§L马来左翼民族主义者，作家与报人，《马来亚先驱报》的笔杆。他是解放阵线里最不像极端派的人——主张马来人与移民族群在平等基础上立国，也因此成了阵线诸翼中唯一还能与联邦坐下来谈的领袖。§!"
 
#介绍
 TNW_welcome_MAL_intro_text_1: "国民党在马来半岛的发展历程大致可分为四阶段：自同盟会在南洋落地生根，至1925年南洋国民党遭禁；再到1932年，一纸协议挣得了南洋华人独立参加国民党的许可；到1946年，随着日德远东殖民政府的总崩溃，国民党在马来半岛建立起独立政权，最后到如今。国民党在组织模式、思想纲领等方面已经发生了剧烈的变化，而这趋势正主导着脆弱的星洲联邦，或是无情鞭策其进军，或是威胁将其彻底倾覆......\n\n早在1912年12月23日，当同盟会重组为国民党仅四月有余，当全体华人正被辛亥革命的“胜利”鼓舞之时，最早的国民党分支机构便在马来亚注册成立。此时，英国殖民官僚期待将同盟会合法化的举动能够稳定马来亚华人的骚动，并最终将其群体置于彻底控制之下。然而，随着刺宋案与中华革命党的成立，超过半数支部如烈日中的雪花般迅速消融。\n\n1921年，广州国民政府成立。随后的几年间，随着国民党对北伐的军事准备日渐充分，对海外华侨进行动员以招兵敛财的需求日渐上涨，而广州国民政府攻占海南也使得大量海南汉人出走南洋，为南洋国民党提供了相当一部分新鲜血液，最终国民党在新马再次复兴。日渐公开的活动使得国民党中央决定于1924年3月对南洋国民党进行重组，以原星岛支部为总部。同时，国民党以各地华文学校、报社与华人工会组织为基地，向外大肆宣传，规模日渐庞大。"
 TNW_welcome_MAL_intro_text_2: "1924年10月，英属马来亚殖民政府向本土发信，矛头直指国民党在广州与共产主义者的联合。次年3月，柏林正式回信——即刻查禁国民党在南洋的全部组织。自此，国民党在南洋的影响力因无法公开活动而迅速消散，华人群体内部的影响力尽管仍然维持，但存在相当艰难。\n\n令人意想不到的是，仅仅一年后，英国本土便率先爆发革命，而随后德意志帝国对英属远东的接管造成的短暂混乱也让国民党得以恢复在马活动。当然，这一态势在1926年北伐正式启动后很快遭受打击，不过随着德国在华干涉的成功以及柏林-武汉关系的重大转折，国民党终于恢复了全部在马来亚的行动自由。\n\n1933年的满洲事变对华人群体造成了极大的震撼，国民党支部恢复和南京的联络后，也加紧了救亡动员，而这进一步恶化了其与德意志帝国的关系。"
 TNW_welcome_MAL_intro_text_3: "经过短暂的谈判后，德国于1941年答应了东京的要求，将南洋暂时转让于日本帝国。随后，日军进军马来半岛，华人生活立刻艰辛起来。国民党的少数地下组织遭到进一步打压，而华商财产也多被劫掠、剥夺，而日本给予马来民族主义合作者的支持则导致民族冲突日益尖锐。面对如此困局，南洋各个社会主义组织首先团结起来，由泛马来亚劳工大会组织各地工农进行抵抗，马来抗日义勇军正式登台。随后，由南洋民主劳动党牵线，国民党与义勇军结为同盟，并由南京提供了义勇军难以获取的资金与部分武器装备。随着义勇军逐渐壮大，华人在其队伍中的作用愈发明确。"
 TNW_welcome_MAL_intro_text_4: "随着1945年德国在欧洲战场的彻底失败，南洋殖民机构同样因此陷入混乱。日军正向本土进行收缩，而美、印、澳多国联军趁势进入荷属东印度，驱逐日本殖民机构。得到消息的国民党星岛党部当即联络义勇军向吉隆坡、星岛等重镇进军。随后，南洋民主劳动党、国民党与中国共产党的南洋事务委员会达成合作，在星岛宣布建国，并在1946年日本投降后与南京达成合作，由国军出兵保护星洲。\n\n很快，印支战争的烈火吞噬了中南半岛，而星洲通过和泰国的结盟实现了对马来半岛大部分地区的吞并，星洲联邦得以成立和巩固。建国后，国民党的星马支部与南洋民主劳动党顺应华北与南京的合作姿态，重新合并，星洲国民党就此诞生。如今，党内按照地域与出身分为许多派系：\n  “九州集团”得名于森美兰州的别称“九州”，乃是南洋国民党元老邓泽如及其门生故旧组成的党内掌权集团。\n  “吾庐俱乐部”是党内中间派，以星洲市（新加坡）本地商业精英为主，与九州集团藕断丝连，关系密切。\n  “隆市派”得名于核心成员彭泽民及其雪州支部。作为实质上南洋民主劳动党的国党内部分支，该派与左翼多有联系，并对基层党部有着相当影响力，只是在党的最高层支持者寥寥。\n 除去这三个主要派系，还包括诸如槟城系这样的地方派系，以及张永福、陈嘉庚之类独立政治人物。党内错综复杂的局势也是星洲联邦形势的缩影。"

