 MAL_party_muslim_peoples_long: "穆斯林人民党\n\n§W马来伊斯兰革命会在联邦立法院的合法外皮。布哈鲁丁·阿尔-海米以清真寺与工会为讲坛，但要在星洲的政党注册册上取得席位，就得换一个能过书记官那关的名字——于是有了这个党章温和、选民名单却与革命会高度重合的组织。§!"
