 MAL_Gerald_de_Cruz: "杰拉尔德·德克鲁兹"
 MAL_Chen_Liushi_desc: "§Y出生于：§!§L1897年，大清帝国，福建省泉州府同安县§!\n\n§Y人物背景：§!§L福建帮巨贾，华侨银行主席。南洋支部的钱袋子之一，霹雳州派背后的大金主——他信橡胶也信华文，办学校的手笔和做生意的胃口一样大。§!"
 MAL_Lian_Yingzhou_desc: "§Y出生于：§!§L1905年，大清帝国，广东省潮州府潮阳县§!\n\n§Y人物背景：§!§L华侨银行创办人，战时任国民参政会参政员——星洲与南京之间最体面的管道。他放贷看信用，也看旗号。§!"
 MAL_Zhang_Yongfu_desc: "§Y出生于：§!§L1871年，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L晚晴园主人，同盟会南洋别部的东道主。日据期间出任华侨协会要职——战后清算名单上他的名字排在很前面，而他赌当局需要体面多于需要人头。§!"
 MAL_Dai_Kuisheng_desc: "§Y出生于：§!§L1892年，大清帝国，福建省泉州府南安县§!\n\n§Y人物背景：§!§L国民党海外部系侨领，南京在南洋的耳目与喉舌。他不掌兵也不掌钱，掌的是电报——支部与党部之间的公文都从他手里过。§!"
 MAL_Chen_Ping_desc: "§Y出生于：§!§L1924年10月21日，海峡殖民地，霹雳州实兆远§!\n\n§Y人物背景：§!§L马来共产党总书记，抗日军里升上来的少年政委。抗战时拿过英方勋章，1947年接掌全党后把组织收缩进地下——他不信任任何合法斗争，只信武装、工会和纪律。§!"
 MAL_A_Yan_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地§!\n\n§Y人物背景：§!§L马共政治局委员，"阿焰"是地下工作中的化名。真名连党内档案都语焉不详——他是组织纪律的化身，负责让不同意的人变成同意的人。§!"
 MAL_Liu_Ping_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，霹雳州§!\n\n§Y人物背景：§!§L马共吡叻北区负责人，地下交通线与联络站的建立者。他记得辖区内每一条山径和每一个信箱——比记得自己的生日还牢。§!"
 MAL_Zhuang_Huiquan_desc: "§Y出生于：§!§L1902年，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L136部队马来亚区副区长，战时情报网的副掌门。战争教会他一件事：情报是穷人的军队。如今他坐镇退伍军人协会的会所，等一个让情报体系国家化的机会。§!"
 MAL_Lin_Mousheng_desc: "§Y出生于：§!§L1909年4月27日，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L136部队马来亚区区长，银行家之子。1944年吡叻狱中的酷刑没能杀死他——如今他活着的每一天都是对日据档案的一记耳光。战时他管情报网，战后他管的是记忆。§!"
 MAL_Hu_Yuzhi_desc: "§Y出生于：§!§L1896年，大清帝国，浙江省绍兴府上虞县§!\n\n§Y人物背景：§!§L《南侨日报》主笔，流亡南洋的老出版家。他的报纸发行两万份，是党报的两倍半——当局容忍这份容忍，因为他还写南京愿意看的东西。§!"
 MAL_Yu_Dafu_desc: "§Y出生于：§!§L1896年12月7日，大清帝国，浙江省杭州府富阳县§!\n\n§Y人物背景：§!§L化名赵廉在苏门答腊开酒厂，躲过了宪兵的名单。劫后余生的他比谁都懂"身份"二字的分量——他那本论双重国籍的小册子，如今是公民权法案论战双方共同引用的圣经。§!"
 MAL_Wang_Renshu_desc: "§Y出生于：§!§L1901年，大清帝国，浙江省宁波府奉化县§!\n\n§Y人物背景：§!§L笔名巴人。战时文化界工作团的组织者，如今在槟城教书、写小说、等船——他的行李里一半是书稿，一半是印尼语的语法书。§!"
 MAL_Han_Suyin_desc: "§Y出生于：§!§L1917年，中华民国，河南省信阳§!\n\n§Y人物背景：§!§L混血医生与作家，随夫婿居柔佛山区行医。她的诊所治胶工的疟疾，她的稿纸记胶工的账——知识界都说她的笔比听诊器更懂半岛。§!"
 MAL_Lin_Lianyu_desc: "§Y出生于：§!§L1901年，大清帝国，福建省泉州府永春县§!\n\n§Y人物背景：§!§L华文教师出身的华教旗手。他主张"各族平等、母语教育"——温和的词句底下是一根不肯弯的脊梁。教总还只是同人们的私下议论，旗子已经在他肩上。§!"
 MAL_John_Eber_desc: "§Y出生于：§!§L1908年，锡兰，科伦坡§!\n\n§Y人物背景：§!§L峇峇律师，马来亚民主同盟的理论家。他在法庭上为园丘劳工辩护，在报告里为平等公民权立法——槟城商会叫他"危险的理想主义者"，他收下这枚勋章。§!"
 MAL_Philip_Hoalim_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L医生，马来亚民主同盟主席。诊所开在牛车水，病人三教九流——他把工会的诊室当俱乐部，把政治当另一种出诊。§!"
 MAL_Burhanuddin_desc: "§Y出生于：§!§L1911年，海峡殖民地，霹雳州§!\n\n§Y人物背景：§!§L记者出身的马来民族主义者，朝觐途中接触泛伊斯兰思潮。他是解放阵线里伊斯兰革命会的掌门人——用圣训的语言谈民族，用民族的语言谈革命，清真寺和工会都是他的讲坛。§!"
 MAL_Ibrahim_Yaacob_desc: "§Y出生于：§!§L1911年，海峡殖民地，霹雳州金宝§!\n\n§Y人物背景：§!§L大马来主义的旗手，战时与日军合作换独立筹码，战后从雅加达归来。他要的不只是一个马来亚，而是从安达曼海到巽他群岛的整个马来世界。§!"
 MAL_Tunku_Abdul_Rahman_desc: "§Y出生于：§!§L1903年2月8日，吉打，亚罗士打§!\n\n§Y人物背景：§!§L吉打王室子弟，剑桥出身的律师。苏丹们与训政权都信任他——前者因为他姓王室，后者因为他只想要可以谈判的东西。§!"
 MAL_Abdul_Razak_desc: "§Y出生于：§!§L1922年3月11日，彭亨，北根§!\n\n§Y人物背景：§!§L彭亨王室旁支出身的年轻技术官僚，法学文凭在手。他把行政当工程做——联邦的农民登记册和乡村发展草图，一半出自他的办公室。§!"
 MAL_Zaba_desc: "§Y出生于：§!§L1895年，森美兰，瓜拉庇劳§!\n\n§Y人物背景：§!§L马来知识界的中兴人物，教师与文法学家。他编的马来语课本养大了整整两代马来学生——他相信民族的解放从正确的语法开始。§!"
 MAL_Sultan_Ibrahim_Johor_desc: "§Y出生于：§!§L1873年9月17日，柔佛，新山§!\n\n§Y人物背景：§!§L柔佛苏丹，天猛公王朝之主。他把州宪当生意做，把顾问当账房用。联邦立国后他收敛锋芒，但新山的王宫里从未停止计算：联邦散伙的那一天，柔佛就该是柔佛人的柔佛。§!"
 MAL_Sultan_Abu_Bakar_Pahang_desc: "§Y出生于：§!§L1904年，彭亨，北根§!\n\n§Y人物背景：§!§L彭亨苏丹。在四位王叔摄政的阴影下长大，深谙沉默的价值——联邦的共和派叫他做"立宪的装饰"，可彭亨的山林与锡矿只认他的旗号。若半岛有变，"共和国"与"苏丹国"之间隔着的不过是一纸宣言。§!"
 MAL_John_Thivy_desc: "§Y出生于：§!§L1904年，海峡殖民地，马六甲§!\n\n§Y人物背景：§!§L律师，战时印度独立同盟的成员，如今是印度裔宪政派的代言人——他要让园丘里的泰米尔劳工学会用选票说话。§!"
 MAL_RG_Balan_desc: "§Y出生于：§!§L1921年，海峡殖民地，雪兰莪§!\n\n§Y人物背景：§!§L泛马劳工大会的总舵手，马共中央委员。他谈判时的武器是罢工统计表——数十万工时的损失数字比任何宣言都响亮。§!"
 MAL_Veerasenan_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地§!\n\n§Y人物背景：§!§L园丘工运领袖，泰米尔劳工的嗓子。宪兵与代理人的枪口都上过他的名字——他照旧巡回、照旧集会，把每一次死里逃生都讲成下一场罢工的动员。§!"
 MAL_Ponnudurai_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，槟城§!\n\n§Y人物背景：§!§L槟城印度商会会长，分离运动筹委会两主席之一。自由港是他的信仰——"让槟城做生意，别让槟城养联邦"，这句酒桌上的话已成商会决议。§!"
 MAL_D_A_Mackay_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，槟城§!\n\n§Y人物背景：§!§L槟城西商会会长，欧裔与海峡精英的钱袋代表。他与波努鲁里的联合宣言让星洲的部长们第一次发现：分离可以从资产负债表开始。§!"
 MAL_Rajaratnam_desc: "§Y出生于：§!§L1915年，锡兰，贾夫纳§!\n\n§Y人物背景：§!§L《马来亚论坛报》的年轻主笔。他写社论两面讨好又两面得罪的本事，让左右两翼都不得不订阅他的报纸。§!"
 MAL_Gerald_de_Cruz_desc: "§Y出生于：§!§L1914年，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L欧亚裔左翼，工会里的演说家。他自称"半岛的孤儿"——三个族裔都不完全认他，这让他成了唯一能在任何社区讲台上出现的人。§!"
 MAL_He_Wei_commander_desc: "南洋民兵总管。他练兵不讲花哨，只讲两条：听命令，守纪律。"
 MAL_Liu_Yao_commander_desc: "义勇军总参谋长。第一纵队的老底子——他的参谋作业一半是军事，一半是政治。"
 MAL_communist_party: "马来民族解放阵线 - 马革共联/中国共产党 - 南委"
