#1948 星洲将领介绍（2026-11-12 第十轮；出生信息据史料考据，人物背景按本仓世界观改写）
MAL_Lin_Mousheng_commander_desc: "§Y出生于：§!§L1909年4月27日，大清帝国，福建省泉州府南安县梅林后埔村§!\n\n§Y人物背景：§!§L南安建筑商林路之子，鼓浪屿英华书院、莱佛士书院出身，港大商科未竟即承父业。战前以中华总商会董事与筹赈会骨干的身份，主持龙运铁矿华工罢工与星洲劳工动员。战时受命主持德属东亚华人志愿兵团在半岛的地下联络网，德军弃援之后仍靠侨商商号把线撑到光复；吡叻狱中的酷刑没能折断他。如今志愿兵团的旧档案与旧部一并归入星洲情报系统，他把商会那套账本与联络办法带进了新军队。§!"
MAL_Zhuang_Huiquan_commander_desc: "§Y出生于：§!§L1900年，大清帝国，福建省泉州府同安县厦门（祖籍安溪县龙门）§!\n\n§Y人物背景：§!§L安溪籍厦门人，父为旅厦安溪公会会长，兄庄希泉、弟庄朝松皆以办报兴学名闻南洋。幼肄业玉屏书院，弱冠南渡，在华校与侨报之间奔走二十年；1938年亲赴丁加奴龙运铁矿，发动近三千华工罢工。战时任德属东亚华人志愿兵团副区长，林谋盛出事之后接掌马来亚情报网。光复后他替殉难者办集体鸣冤，又把志愿兵团的旧名册交进义勇军序列——党证送到手上的那一夜，他把它压在茶杯下想了很久。§!"
MAL_Long_Chaoying_commander_desc: "§Y出生于：§!§L出生年月不详，籍贯无载§!\n\n§Y人物背景：§!§L德属东亚华人志愿兵团首批潜返半岛的五名华人情报员之一，入伍前还是高中二年级学生，只跟母亲说要回国深造。1943年自海上登陆霹雳后，他剪发、雇黄包车、用海南话在咖啡摊攀同乡，替日军做工两月换来一张良民证，再以香烟摊作掩护。德军弃援、电台中断之后，这类没有补给、只靠身份与口音活着的联络点撑起了半岛的耳目。如今他以丛林侦察与伪装渗透见长，编入星洲的本土军官团。§!"
MAL_Li_Hanguang_commander_desc: "§Y出生于：§!§L出生年月不详，籍贯无载§!\n\n§Y人物背景：§!§L又名李阿青、亚清，德属东亚华人志愿兵团首批潜返的军事情报员，战前在商行做事。潜回半岛后借渔民的船传递消息，把商行那套账目与货单用成了交通线的暗号；1944年情报网被破，他在押往怡保途中脱身，随即钻进林子，直到光复。他不是带兵出身，本事全在化名、路线与交接上；统计调查局重铺联络线时，用的还是他当年那套办法。§!"
MAL_Tan_Xianyan_commander_desc: "§Y出生于：§!§L1918年，英属马来亚，霹雳州怡保§!\n\n§Y人物背景：§!§L怡保侨生，化名韩礼文、亚韩，战前替筹赈会义务募款。1940年返国入军校受训两年，是这批人里少有受过完整正规军事教育的一个；战时编入德属东亚华人志愿兵团龙一队首批潜回半岛，在美罗山的丛林里待了两年三个月，逐日写下的战地日记后来成了旧部回忆那几年的底本。光复后三军重编操典，党军的突击条例与国军的阵地教范之外，丛林那一部分由他这样的人补上。§!"
MAL_Wu_Zaixin_commander_desc: "§Y出生于：§!§L出生年月不详，籍贯无载§!\n\n§Y人物背景：§!§L又作吴再新，化名吴明才、亚吴，长于广州富商之家。德属东亚华人志愿兵团首批潜返者之一，战时以商人身份在怡保开商栈，明面上做大米、机油与黄金，实则替地下情报网收转消息；宴席上日方军政官员的酒后失言，自有同席的人一一记下。德军弃援之后，是商号的账与面子让这条线没有断。统计调查局接收旧暗探档案、重铺联络线时，他这类既认得码头又认得人的人最不好替代。§!"
MAL_Lin_Qingnian_commander_desc: "§Y出生于：§!§L1893年，大清帝国，福建省泉州府安溪县新康里罗岩乡§!\n\n§Y人物背景：§!§L字少颖，安溪茶商世家，北大毕业后返乡办民团，1925年前后南渡创林金泰茶庄，把茶叶、汇兑与橡胶做成一张网。任新加坡福建会馆教育科主任时首倡华校国语教学与中小学会考；战时主持筹赈、以平社剧团义演募款，撤离后长期在侨务一线替南京办事。光复后他回南洋重整茶行——党军缺的从来不只是枪，还有能把华社的账、人与子弟一并点齐的本事。§!"
MAL_Huang_Zhijie_commander_desc: "§Y出生于：§!§L出生年月不详，籍贯无载§!\n\n§Y人物背景：§!§L中国国民党马来亚支部党员，姓名一作黄志杰。1941年底星洲华侨抗敌动员总会成立，民众武装部由林江石主事、他任副主任，招募与编组华人义勇队伍守城。星洲陷落前后，相当多的武装人员退入密林，后来正是这些人成了抗日义勇军的骨架。他不带主力，专管名册、粮秣与街巷布防；自卫队与三城防御预案里，那套按街区征发、就地编队的办法还在用。§!"
MAL_Chen_Tian_commander_desc: "§Y出生于：§!§L1923年8月25日，海峡殖民地，新加坡单边街（祖籍广东澄海）§!\n\n§Y人物背景：§!§L本名高才杰，党内用名陈田、庄声。海产干料商人之子，端蒙学校与华文中学出身，1941年通过剑桥九号考试，说得一口流利英语。战时从新加坡学生支部转入柔佛丛林，历第三支队与中央特别队，1945年接掌第四支队。光复后他办过退伍同志会的机关报，一手撑起队里的油印与宣传；如今随义勇军编入星洲序列，通双语与办报的本事之外，与左翼的旧关系让他常在忠诚评估的名单上多待一行。§!"
MAL_Zhang_Lingyun_commander_desc: "§Y出生于：§!§L1921年3月9日，英属马来亚，彭亨州淡马鲁县直凉（祖籍福建）§!\n\n§Y人物背景：§!§L原名章传庆，化名小张、小章、阿苏、林文、烽云，丛林里换过太多名字，旧部索性只记他是第六支队的党代表。彭亨贫农独子，私塾四年，马六甲培风中学念书时进了学联，1938年由团转党。战时在上彭亨拉起游击队，1942年石山脚突围腿上中弹，被人架着冲过双溪多河；1943年第六支队成立，他公开用烽云之名主持党务直到终战。光复后以政工与丛林组织见长。§!"
MAL_Chen_Tianqing_commander_desc: "§Y出生于：§!§L出生年月不详，籍贯无载§!\n\n§Y人物背景：§!§L抗日义勇军第一支队首任队长。1942年初在雪兰莪北郊双文丹的义山亭集结成军，成立会还没开完就遇空袭，队伍当场撤进山区；此后一年多，第一支队靠雪州北部的村镇与丛林立足，人数不多却始终是日军清剿名单上的头一个。史料里连他的生年籍贯都没有留下，旧部记得的只有点名时的口令。光复后第一支队的老人被并进星洲人民义勇军，番号没了，口令还在。§!"
MAL_Lai_Laifu_commander_desc: "§Y出生于：§!§L1922年，英属马来亚，霹雳州实兆远§!\n\n§Y人物背景：§!§L又名赖来福、来福，党内化名杜龙山。实兆远土生，中正学校与南华中学出身，战前教书兼做记者，中英巫三语都通。1937年后在抗敌后援会里带学生与锡矿工，战时先在森美兰组第二支队，1942年北上霹雳接掌第五支队，把它带成北马主力。石山脚突围时他停下手给腿部中弹的同志包扎、又领人冲过河，这段旧事在义勇军里讲了很多年。光复后三语与动员的本事，比枪更用得上。§!"
MAL_Hu_Tiejun_commander_desc: "§Y出生于：§!§L1914年，中华民国，福建省汀州府永定县下洋镇下坪村§!\n\n§Y人物背景：§!§L原名胡知芳，闽西客家人，大埔中学毕业后入军校受训三年，战前在《星洲日报》做编辑，九一八之后以版面替国内募过百余万元。星洲保卫战中任华人义勇军副司令，裕廊十八碑首战、武吉知马一路守到解散；陷落后化装蛰居内地山间四十一个月。光复后他编成《星华义勇军战斗史》，也把阵地防御那一套带进了三军重编的操典——国军的阵地教范本就缺一本讲败仗的教材。§!"
MAL_Lin_Jiangshi_commander_desc: "§Y出生于：§!§L1916年，中华民国，广东省广州府增城县§!\n\n§Y人物背景：§!§L原名黄伯遂，因肤色得名老黑。幼年丧父随母南渡，在霹雳锡矿做过看车工，战前已是工运干部；1940年前后调星洲主持市委，法庭上的抗辩一度轰动侨界。战时任星洲华侨抗敌动员总会民众武装部主任，募组华人义勇军守城，城陷后转入地下。光复后旧部并入星洲人民义勇军，他与左翼的旧关系，让名字长期留在忠诚评估名单的第三栏。§!"
MAL_Zheng_Guyue_commander_desc: "§Y出生于：§!§L1880年，大清帝国，福建省泉州府金门县浯坑§!\n\n§Y人物背景：§!§L八岁丧父，十一岁才入私塾，二十出头南渡，在直落亚逸的九八行从月薪两元的杂工做起，后来办起自己的土产行与公共汽车公司，五度任金门会馆会长。1941年底星洲华侨抗敌动员总会成立，六十一岁的他主持保卫团部：每条街设岗，防空、救护、救火、收殓都归这里，丹戎巴葛米仓中弹时他带人进火里抢粮。光复后他替死难者眷属办集体鸣冤；星洲的自卫队与三城疏散预案，仍照他当年按街区编队的法子。§!"
MAL_Guo_Yinan_commander_desc: "§Y出生于：§!§L1919年，砂拉越王国，古晋§!\n\n§Y人物背景：§!§L砂拉越古晋土生，潮州籍，父业医，本人曾返华南学医，在南京、汉口、广州一带行医，1941年到北婆罗洲哲斯顿开诊所。日据期以医生身份走乡串镇，把救华会改组成神山游击队；1943年双十之夜，亚庇与斗亚兰同时动手，一度光复港市，三日后援军不至，队伍退入山区。为保住山东村四百口人，他自己走了出去。光复后北婆的旧部与德属东亚留下的油库、炮台一并，归入星洲的防务。§!"
MAL_Zhao_Jiquan_commander_desc: "§Y出生于：§!§L出生年月不详，祖籍大清帝国福建省泉州府安溪县金谷§!\n\n§Y人物背景：§!§L安溪金谷赵氏南渡的第二代，父赵德王与叔赵德茅组织华工与土民开发了北婆罗洲斗亚兰，镇上主街至今以其父为名。日据期他在斗亚兰组织华侨响应神山游击队，双十之夜带队取下镇上的警察局；两地张灯结彩、把食物送到队伍手里的光景只维持了几天。他的生年、职衔，族谱一概无载，只留下带队起义这一句。光复后北婆侨社与星洲防务接头，靠的仍是这一族留下的街巷与人名。§!"

#民族精神

 MAL_Sunrise_State: "朝阳国度"
 MAL_Sunrise_State_desc: "尽管马来原住民的权利不被完全尊重，但星洲联邦作为百年以来马来半岛的首个真正的独立国家仍然代表着半岛上的政治新风。共和主义、民族主义与部分社会主义政治原则在半岛上扎下根来，星洲国内一时之间隐有日出东方之朝气，技术与治理的进步趋势在此处几乎随处可见。"
 MAL_Party_Factionalism: "统治集团的分裂"
 MAL_Party_Factionalism_desc: "星洲国民党作为曾经中国国民党的南洋支部，与其国内总部一样存在形形色色的内部分歧。左翼与右翼，革命与保守，乃至最为常见的利益之争，无处不在的争斗威胁着撕裂党的躯干，并威胁将如今的星洲付之一炬。\n\n更为严重的是，党内各派均能在遥远的南京庙堂之上寻到盟友与支持者，而难以预测、风云变幻的中国政局则随时可能反过来造成星洲国内的重大变故。"
 MAL_Three_Armies: "一国三军"
 MAL_Three_Armies_desc: "星洲的武装部队主要分为三派，互不统属：星洲国民革命军效仿中华民国，但其名为党军，实则同样陷于派系纷争与兵员缺额，战力难测；驻星洲国军由南京方面直接派遣，忠于党内最高领袖，但人数不足，难以依凭；星洲人民义勇军，即原马来亚人民抗日义勇军，人数众多但华人士兵比例极低，且与左翼联络密切，若非星洲缺少部队，实在难信。如今三派尚能相安无事，但若有朝一日这一脆弱平衡被打破，那么星洲防务恐将难以为继。"
 MAL_Liberation_Front_Insurgency: "烽烟四起"
 MAL_Liberation_Front_Insurgency_desc: ""
 TNW_Archipelago_Contest_Winner: "南洋争霸的胜利者"
 TNW_Archipelago_Contest_Winner_desc: "雅加达或马尼拉的电台终于不再提「大南洋」，而是改口谈论关税与通航。赢得群岛争霸的政权把海峡、港口与商会重新串成一张网：出口与政府投资随之扩张，军队也终于不必再对着每一条水道数对手的舰影。"
 MAL_kmt_dominant_lodge: "中执委主导：星洲交通部"
 MAL_kmt_dominant_lodge_desc: "陈楚楠以1912年星洲交通部的旧班底执掌中执委，党务机器运转顺畅。"
 MAL_kmt_dominant_overseas: "中执委主导：南京海外部"
 MAL_kmt_dominant_overseas_desc: "李振殿与南京党务系统连成一气，技术干部与经费随之而来，星洲本位的声音则被压低。"
 MAL_kmt_dominant_wulu: "中执委主导：吾庐俱乐部"
 MAL_kmt_dominant_wulu_desc: "李光前与商界、书报社的旧交主导议事，营建与拨款最见成效。"
 MAL_kmt_dominant_longshi: "中执委主导：隆市派"
 MAL_kmt_dominant_longshi_desc: "彭泽民把劳工大会的组织力带进中执委，动员有余而秩序不足。"
 MAL_kmt_dominant_guild: "中执委主导：同业公会"
 MAL_kmt_dominant_guild_desc: "陈六使以商会账本治党，厂房盖得快，学理与研发就顾不上了。"
 MAL_kmt_dominant_nanqiao: "中执委主导：南侨同志会"
 MAL_kmt_dominant_nanqiao_desc: "张永福以晚晴园元老资格主持党务，人事妥帖，军政却缺乏锐气。"
 MAL_kmt_dominant_pingzhang: "中执委主导：平章会馆"
 MAL_kmt_dominant_pingzhang_desc: "槟城三社团借平章会馆入主中执委，地方安抚优于中央集议。"
 MAL_penang_strike: "槟城总罢市"
 MAL_penang_strike_desc: "乔治市的码头第一次安静下来。吊机停摆、锡锭压仓、商店落闸，连当铺都挂出歇业的木牌——槟城在用一百年的商业信誉对星洲说：不。"
 MAL_One_Army: "一国一军"
 MAL_One_Army_desc: "义勇军、自卫队与驻防军的番号并成一个序列。老臂章缝进内衬，新军旗升上旗杆——星洲终于有了唯一的军队，军队也终于只知道一个国家。"

#事件

 MAL_penang_crisis.1.t: "槟城的宣言"
 MAL_penang_crisis.1.d: "西商会会长麦卡与印度商会会长波努鲁里在乔治市联合署名，宣布筹组槟城脱离筹备委员会，主张以宪制途径脱离星洲联邦、维持自由港地位。文告里没有一个华字——签名的两位甚至都不是华人，可连署的账本后面站着整个槟城的福建帮。电报送到星洲时，内阁正在为关税表吵到深夜。有人把这封电报念出声，会议室安静了几秒：所有人都听懂了，这不是一次抗议，这是一份账单。"
 MAL_penang_crisis.1.a: "事态已经无法忽视"
 MAL_penang_crisis.2.t: "全槟总罢市"
 MAL_penang_crisis.2.d: "罢市像瘟疫一样从码头蔓延到全岛。吊机停摆，胶锡压仓，商店落闸，连当铺都挂出歇业的木牌。槟城人没有喊口号——他们只是停止了做生意，而做生意正是这座城唯一会说的语言。星洲的贸易报表连续三周飘红，财政部连夜测算损失，海军部则在估算另一个更可怕的问题：如果海峡对岸的马六甲也学会了这一手。"
 MAL_penang_crisis.2.a: "看谁先撑不住"
 MAL_penang_crisis.3.t: "槟城人民会议"
 MAL_penang_crisis.3.d: "两百零八个名字，来自会馆、商会、学校、报馆乃至宗祠，在平章会馆的大厅里坐成一张长桌——槟城人民会议宣布自己是这片土地利益的代言人，决议只有一条：脱离星洲，自治自决。没有人再谈折中。星洲的特使被挡在会场外的骑楼下，听着里面用闽南语、泰米尔语和英语交替进行的表决，一个个音节都像钉子。"
 MAL_penang_crisis.3.a: "决不让步"
 MAL_dissolution.1.t: "联邦的分水岭"
 MAL_dissolution.1.d: "南京的旗帜换了颜色，联邦的国运也走到了彭泽民说过的那道分水岭。立法院的马来人协会与穆斯林人民党两团集体退席，柔佛的王宫升起了自己的九重日月旗，彭亨的丛林里响起了共和国的号角——星洲联邦就此成为历史，地图上只剩下一个名字：星洲地方。"
 MAL_dissolution.1.a: "分水岭已过"
 MAL_dissolution.2.t: "驻星国军返乡"
 MAL_dissolution.2.d: "中原大战的炮声传到南洋，驻星国军连夜在码头集结——祖国的战局，容不下置身事外的客人。兵舰解缆北上，码头上只剩宪兵的哨音和未散的煤烟。星洲的海风里，第一次没有了北方军旗的味道。"
 MAL_dissolution.2.a: "目送兵舰北上"
 MAL_dissolution.3.t: "驻星国军归来"
 MAL_dissolution.3.d: "北方的战事终于落幕，航船的汽笛再次在樟宜外海响起。驻星国军回来了——甲板上的老兵黑了、瘦了，枪械的保养却比走时更好。星洲的码头挤满了欢迎的人群，而乔治市的官员们连夜清点营房：军队回来了，老问题也跟着回来了——这支军队听南京的，还是听星洲的？"
 MAL_dissolution.3.a: "欢迎国军归建"
 MAL_nra.1.t: "驻星国军，归建！"
 MAL_nra.1.d: "黄埔的口音混着新加坡的汽笛声——两个乙种师的建制在星光码头完完整整地交割回星洲当局手中。南京的电令写得客气：\"该部久戍外岛，着即归建，以固海疆。\"但每个军官都清楚，这两支部队从踏上栈桥的那一刻起，问题就不再是他们何时回来，而是他们回来之后，枪口究竟听谁的。"
 MAL_nra.1.a: "欢迎回家。"

 MAL_confrontasi_event.1.t: "新人入主雅加达"
 MAL_confrontasi_event.1.d: "按照雅加达传出的公开消息，随着新总统的上任，印度尼西亚先前短暂瘫痪的扩张政策如今即将卷土重来。作为两极格局在南洋的特殊表现形式，我星洲与印度尼西亚共和国或将陷入欧陆、东北亚般的冷战状态。由于反对印尼扩张的各方，包括工党澳洲、红色菲律宾与素来仰赖中华民国支援的我国均对外表现出亲近社会主义国际的外交方针，尤其是在民国如今也与美利坚深度经济绑定的当下，俄罗斯方面据称已经加紧与雅加达接触，试图通过支持印度尼西亚民族主义者吞并整个南洋群岛来遏制中美在西太平洋的影响力。\n\n更有甚者，由于印度近期同样不断靠近俄罗斯方面，如今的印度尼西亚已经能够通过海参崴-北日本-西太平洋与中亚-印度-印度洋两条路线得到俄罗斯的大批援助，而印度本身也因半岛印度裔的政治代表问题而与我素来不睦。因此，如今只有对内控制民族问题、对外遏制印度尼西亚扩张，方能确保我国在未来的基本生存，而若此事以失败告终，则星洲恐将陷于雅加达之手，更遑论在南洋争霸中求胜。"
 MAL_confrontasi_event.1.a: "是时候行动了。"

 #对峙事件链（2026-11-11 增补）
 MAL_confrontasi_event.2.t: "海参崴来的货轮"
 MAL_confrontasi_event.2.d: "情报处把三封电报并排钉在板上：一艘挂北日本旗的货轮在丹戎不碌卸下七千吨钢材，一批经中亚与印度转运的机床在泗水报关，加尔各答的银行则替雅加达结清了一笔说不清用途的账。两条路线在爪哇汇成同一句话——俄罗斯人不是来做生意的，是来把「大南洋」从广播词变成预算表。\n\n内阁争的却是一件更小的事：要不要在海峡上把这些船拦下来查验。拦，等于把通航权这张牌提前打出去；不拦，账本上就又多一行别人家的军舰。海军部只问了一句：查验条例是写给谁看的？"
 MAL_confrontasi_event.2.a: "逐船查验，把条例立起来"
 MAL_confrontasi_event.2.b: "照常放行，把税留在手里"
 MAL_confrontasi_event.2.c: "按包围网条例直接扣押"
 MAL_confrontasi_event.3.t: "加尔各答的账本"
 MAL_confrontasi_event.3.d: "顺的那条线查下去，查到了加尔各答。印度人替雅加达垫的款，走的竟是星洲市区几家印裔商号的担保；马印国大党的账房与泛马劳工大会的干事在同一个茶室里用同一本簿子记工时。彭泽民的人把复印件摊在立法院桌上，九州派的人只说了一句：这不是间谍案，是选票案。\n\n于是问题又回到那个老地方——印裔社区究竟是要按住，还是要养住。按住，账单明天就干净；养住，账单会变长，但签字的人会变多。"
 MAL_confrontasi_event.3.a: "先掐线头"
 MAL_confrontasi_event.3.b: "以工代煽"
 MAL_confrontasi_event.4.t: "望加锡的回信"
 MAL_confrontasi_event.4.d: "苏拉威西通道打通后的第三周，密使带回三封信：米纳哈萨的联邦派要一份港口章程，戈瓦的王室后裔要一面能挂出去的旗，努沙登加拉的港务长老只问一句——星洲的船能不能不经过雅加达就直接靠岸。三封信都没提「站队」，但每一封都在问同一件事：这张海图上，谁来画航线。\n\n商会算的是运费，外交部算的是票数，参谋部算的是如果把这三处都写进同一张图，雅加达的舰队要绕多远。"
 MAL_confrontasi_event.4.a: "把港口写进同一张海图"
 MAL_confrontasi_event.4.b: "只谈生意，不谈站队"
 MAL_confrontasi_event.5.t: "白澳与红菲之间"
 MAL_confrontasi_event.5.d: "堪培拉的工党内阁在议会里替星洲说了两句话，第三句就撞上了自己后座的白澳派；马尼拉的电台则把这两句话反复播了整晚，语气里带着一点看热闹的亲热。南京的电报更短：中美之间的账，不宜由南洋替他们添新的行。\n\n星洲这才看清自己在两极里的位置——它不是一极，而是那一道被两边同时拿来量距离的海峡。影响力涨上去之后，可以挑的不再只有主意，还有先给谁递话。"
 MAL_confrontasi_event.5.a: "联菲制澳"
 MAL_confrontasi_event.5.b: "先稳住堪培拉"
 MAL_confrontasi_event.6.t: "雅加达的枪声"
 MAL_confrontasi_event.6.d: "爪哇的电台先停了六个小时，再开口时已经换了呼号。西利旺义师团与游击派在城郊交火的传闻顺着货轮传到星洲，情报处的第一份判断只有一行字：扩张政策暂时无人执行。\n\n参谋部主张趁虚推进，外交部主张一字不发。前者说这是十年才有一次的窗口，后者说窗口也是别人家的丧事，站得太近会被记进账里。而群岛争霸的计票器，正在这一夜悄悄改了数。"
 MAL_confrontasi_event.6.a: "不干涉，先把网收紧"
 MAL_confrontasi_event.6.b: "公开站队"
 MAL_confrontasi_event.7.t: "分水岭之后"
 MAL_confrontasi_event.7.d: "柔佛的王宫升起了自己的旗，彭亨的丛林里响起了共和国的号角，立法院的马来人协会与穆斯林人民党两团集体退席——联邦散了，剩下星洲地方这个名字和一张缩了水的地图。马尼拉的报纸没有幸灾乐祸，只是把「海峡另一端」这个说法从社论里删掉，换成了「海峡这一端」。\n\n外交部把旧档案重新编了号：过去所有以星洲名义签下的通航、关税与情报协定，如今都要重新问一遍，还认不认。答案大多不在星洲手里了。"
 MAL_confrontasi_event.7.a: "把海峡交给马尼拉"
 MAL_confrontasi_event.7.b: "星洲仍在桌上"
 MAL_confrontasi_event.8.t: "公告见报"
 MAL_confrontasi_event.8.d: "胜负一旦写进公告，就不再是谁的推断。雅加达或马尼拉的电台终于不再提「大南洋」，改口谈关税、通航与船期；那些在海峡两岸押过注的商会，开始把旧合同翻出来重新算汇率。\n\n赢的人要做的第一件事，是把名分折成账面上的东西；输的人要做的第一件事，是把账本合上，免得下一届立法院拿它当证据。只有海峡照旧涨落，从不问公告上写的是谁。"
 MAL_confrontasi_event.8.a: "把红利折成账面上的东西"
 MAL_confrontasi_event.8.b: "把账本收起来"

