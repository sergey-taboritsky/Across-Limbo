 MAL_kmt_annual_congress.1.d: "党章规定的年度党会。七派实力重新登记，中央执行委员会二十一席按实力重划；这是本年度唯一一次席次变动。"
 MAL_kmt_annual_congress.1.a: "按实力重划中执委席次"
