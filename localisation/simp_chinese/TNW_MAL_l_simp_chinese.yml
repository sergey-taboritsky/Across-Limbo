 MAL_socialism_party: "星洲国民党 - 隆市派/南洋民主劳动党"
 MAL_socialism_party_long: "星洲国民党/南洋民主劳动党\n\n§W马来半岛的国民党支部历史悠久，其命运与中国本土的总部息息相关。早在联法、联共的北伐准备期，国民党的马来亚支部便通过渗透工会组织、组织华人劳工运动等方式配合粤府行动。“清党”时期，左右翼分裂也同样撕裂了这些前“同志”们的行伍。如今，随着星洲政权的建立，星洲国民党以独立政党的身份组建政府开启训政，可原本存在的派系分野并未消弭。\n\n在吉隆坡白手起家的党内元老彭泽民是国民党马来亚支部的左翼代表人物。中国民主劳动党成立时，马来亚的左翼国民党成员大多投奔彭泽民组建的“南洋民主劳动党”，隆市派系就此形成。该派并无过多实权，但对基层党部及劳工运动的把控相当深入，同时与星洲建国时依仗的抗日义勇军关系密切，甚至与共产党乃至马来民族主义者也多有联络。§!\n"
 MAL_Social_democracy_party: "马来民族解放阵线 - 马来国民党"
 MAL_Social_democracy_party_long: "马来亚马来国民党"
 MAL_Liberalism_party: "马来人协会"
 MAL_Liberalism_party_long: "马来人协会(Persatuan Melaya)"
 MAL_Conservatism_party: "星洲国民党 - 霹雳州派"
 MAL_Conservatism_party_long: "星洲国民党\n\n§W马来半岛的国民党支部历史悠久，其命运与中国本土的总部息息相关。早在联法、联共的北伐准备期，国民党的马来亚支部便通过渗透工会组织、组织华人劳工运动等方式配合粤府行动。“清党”时期，左右翼分裂也同样撕裂了这些前“同志”们的行伍。如今，随着星洲政权的建立，星洲国民党以独立政党的身份组建政府开启训政，可原本存在的派系分野并未消弭。\n\n霹雳州是国民党在南洋真正的“龙兴之地”。早在政党注册时，霹雳一州便能组建27个支部，其人心向背可见一斑。以此地盘根错节的基层组织为后盾的霹雳州系党员在最高层名声不显，但对党的各个基层党部颇有影响。他们一般属党内中间派，既不亲近社会主义运动，也不支持邓泽如及其集团对左翼派别的打压，并认为此举破坏党内平衡与党部的控制力。§!\n"
 MAL_Authoritarianism_party: "星洲国民党 - 九州派“吾庐俱乐部”"
 MAL_Authoritarianism_party_long: "星洲国民党\n\n§W马来半岛的国民党支部历史悠久，其命运与中国本土的总部息息相关。早在联法、联共的北伐准备期，国民党的马来亚支部便通过渗透工会组织、组织华人劳工运动等方式配合粤府行动。“清党”时期，左右翼分裂也同样撕裂了这些前“同志”们的行伍。如今，随着星洲政权的建立，星洲国民党以独立政党的身份组建政府开启训政，可原本存在的派系分野并未消弭。\n\n森美兰因其马来语直译“九”而别名“九州”，此地是南洋同盟会元老邓泽如的故乡，而其门生故旧则是星洲建国时党内的主导派系。尽管邓泽如本人早已溘然长逝，但其弟子李振殿得以出任星洲联邦首任政府首脑，足以见其派阀实力之雄厚。\n\n在如今掌管马来半岛的星洲诸公中，吾庐俱乐部是党国高层的一个隐秘聚集地，李光前与商界、书报社的旧交多在此叙会。§!\n"
