#民族精神
 MAL_Sunrise_State: "朝阳国度"
 MAL_Sunrise_State_desc: "尽管马来原住民的权利不被完全尊重，但星洲联邦作为百年以来马来半岛的首个真正的独立国家仍然代表着半岛上的政治新风。共和主义、民族主义与部分社会主义政治原则在半岛上扎下根来，星洲国内一时之间隐有日出东方之朝气，技术与治理的进步趋势在此处几乎随处可见。"
 MAL_Party_Factionalism: "统治集团的分裂"
 MAL_Party_Factionalism_desc: "星洲国民党作为曾经中国国民党的南洋支部，与其国内总部一样存在形形色色的内部分歧。左翼与右翼，革命与保守，乃至最为常见的利益之争，无处不在的争斗威胁着撕裂党的躯干，并威胁将如今的星洲付之一炬。\n\n更为严重的是，党内各派均能在遥远的南京庙堂之上寻到盟友与支持者，而难以预测、风云变幻的中国政局则随时可能反过来造成星洲国内的重大变故。"
 MAL_Three_Armies: "一国三军"
 MAL_Three_Armies_desc: "星洲的武装部队主要分为三派，互不统属：星洲国民革命军效仿中华民国，但其名为党军，实则同样陷于派系纷争与兵员缺额，战力难测；驻星洲国军由南京方面直接派遣，忠于党内最高领袖，但人数不足，难以依凭；星洲人民义勇军，即原马来亚人民抗日义勇军，人数众多但华人士兵比例极低，且与左翼联络密切，若非星洲缺少部队，实在难信。如今三派尚能相安无事，但若有朝一日这一脆弱平衡被打破，那么星洲防务恐将难以为继。"
