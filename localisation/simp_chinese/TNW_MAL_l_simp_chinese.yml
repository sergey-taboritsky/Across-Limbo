 MAL_Unify_Nation_tt1: "终结与印尼的阵营对抗"
 MAL_Unify_Nation_tt2: "整合半岛各族，巩固联邦架构"
 MAL_Unify_Nation_tt3: "大幅提升稳定度与战争支持度"
 MAL_Unify_Nation_tt4: "夺取全部争议领土的核心归属"
 MAL_Counter_Confrontation_Tactics_tt1: "研发针对游击与对峙的反制作战条令"
 MAL_Counter_Confrontation_Tactics_tt2: "陆军与海军经验大幅提升"
 MAL_Counter_Confrontation_Tactics_tt3: "本土防御效率显著提高"
 MAL_Formalize_Archipelago_Cordon_tt1: "将临时群岛防线转为常设国防体系"
 MAL_Formalize_Archipelago_Cordon_tt2: "马六甲海峡防务固若金汤"
 MAL_Formalize_Archipelago_Cordon_tt3: "持续获得稳定度与战争支持度"

 MAL_Tactical_Doctrine_Training: "战法训练"
 MAL_Tactical_Doctrine_Training_desc: "三军合并后第一件事，是把三套互相看不起的操典撕掉重编。亚历山大军营里，参谋班把党军的突击条例、国军的阵地教范和义勇军的丛林经验摊在同一张桌上，谁也不许再拿「我们从前」开头。"
 MAL_Commission_Young_Officers: "启用青年军官"
 MAL_Commission_Young_Officers_desc: "三十岁以下、没在旧三军里沾过派系的尉官被成批提到营、团主官的位置。老军官们在俱乐部里冷笑，但军令确实第一次不经过任何派系驻京代表，就直接送到了连部。"
 MAL_Deploy_Model_Division: "部署模范师"
 MAL_Deploy_Model_Division_desc: "以原国民革命军教导团为骨架，编成一个满员师：南京援助的步枪、本地兵工厂修好的机枪、以及从三支旧部队里挑出来重新混编的兵员，第一次在同一面军旗下点名。"
 MAL_Establish_Singapore_Admiralty: "建立星洲海军部"
 MAL_Establish_Singapore_Admiralty_desc: "海峡两边都有人盯着，星洲却连一间像样的海军衙门都没有。海军部暂借旧港务局二楼办公，第一份公文是给每一条在籍船只重新编号——包括那些只有名字、没有舰体的船。"
 MAL_Homeland_Air_Defense_Conference: "国土防空会议"
 MAL_Homeland_Air_Defense_Conference_desc: "空军、防空兵、民防处与港务局被叫到同一张桌子上。会议吵了三天，最后只定下一件事：从今往后，半岛上任何一座机场、任何一台雷达，都不再由某个军种单独说了算。"
 MAL_Claim_Japanese_Warship_Reparations: "申请部分日舰赔偿"
 MAL_Claim_Japanese_Warship_Reparations_desc: "东京方面送来的赔偿清单里，还挂着几艘没沉的旧舰。星洲要的其实不是船，是「战胜国」这三个字落在纸面上——顺便把谈判桌上的赔款折成国库里的一笔现钱。"
 MAL_Restore_German_East_Asia_Arsenal: "修复德属东亚兵工厂"
 MAL_Restore_German_East_Asia_Arsenal_desc: "德国人在战时留下的兵工厂，厂房还在，机床被拆走大半。修复款从国库里一笔划出，换来一处随机选定的地块上两座重新点亮的军用工厂与两个新开的建筑位——以及一条终于能自己走下去的军工线。"
 MAL_Recruit_Former_Singapore_Generals: "招揽前驻星将领"
 MAL_Recruit_Former_Singapore_Generals_desc: "南京撤回的驻星将领散在华南与南洋，有人赋闲，有人替商会看仓库。聘书一封封发出去，条件写得很直白：不带旧部、不带派系，只带参谋作业的本事。"
 MAL_Build_Hidden_Airfields: "增设隐蔽机场"
 MAL_Build_Hidden_Airfields_desc: "在彭亨与柔佛的橡胶园深处，几条能藏进树冠的跑道被悄悄铺了出来。它们不进民航图、不挂灯，战时却能在一夜之间变成前沿机场——代价是，雷达网的预算得再等一等。"
 MAL_Consolidate_Radar_And_AA: "巩固雷达和防空火力"
 MAL_Consolidate_Radar_And_AA_desc: "英军撤离时丢下的雷达站被重新架起来，高炮阵地沿着海峡与港口一圈圈排开。账房把隐蔽机场的方案划掉了：与其把飞机藏起来，不如先让来犯者在天上就被看见。"
 MAL_Purchase_Retired_US_Warships: "购买退役美舰"
 MAL_Purchase_Retired_US_Warships_desc: "美国人正把太平洋舰队里成排的旧舰挂牌出售。星洲买不起最好的，但买得起够用的：几艘退役舰连同随舰交付的护航船与配件一起入籍，海军终于有了能开出去点名的东西。"
 MAL_Domestic_Armored_Cars_And_Artillery: "自产装甲车与火炮"
 MAL_Domestic_Armored_Cars_And_Artillery_desc: "兵工厂复工后第一批下线的不是步枪，是装甲车底盘与山炮。零件仍要靠进口，可装配、试射与维修第一次能在本地完成，账面上也因此少了整整一笔外汇。"
 MAL_Secure_Troop_Supplies: "保障军队生活物资"
 MAL_Secure_Troop_Supplies_desc: "军饷、口粮、被服与热带药品改由军需署统一采办，不再让各部队自己向商会赊账。仓库里第一次有了可查的账，前线也第一次不必靠「就地筹措」四个字过日子。"
 MAL_Invite_New_Chinese_Cadets: "邀请新一批中国军校生"
 MAL_Invite_New_Chinese_Cadets_desc: "南京中央军校又一批毕业生登上了南下的船。他们带来的不只是参谋教材，还有一整套测绘、军制与后勤的表册——星洲的军官教育终于有了成体系的课本。"
 MAL_Purchase_US_Aircraft: "购置美军战机"
 MAL_Purchase_US_Aircraft_desc: "用橡胶配额与一笔现金换来一批美军退役的战斗机。飞机运到时连涂装都还是星条旗，地勤在机库里刷了一整夜漆——从这天起，半岛的天空才算有了自己的第一道牙口。"
 MAL_Recruit_Civilian_Pilots: "征募民间飞行员"
 MAL_Recruit_Civilian_Pilots_desc: "飞行俱乐部的会员名册被直接当成了征兵册。这些人在周末开过教练机、看得懂风向标，缺的只是编队与军纪；比起从头教起，这已经是星洲能拿到的最短捷径。"
 MAL_Pahang_Naval_Training_Base: "成立彭亨州水兵训练基地"
 MAL_Pahang_Naval_Training_Base_desc: "彭亨海岸的老码头改成了水兵训练基地：宿舍是旧货仓，教练船是一条修了三次的拖轮。首批学员在退潮时练绳结，在涨潮时练登舰，海军的规矩就这么从潮汐里长了出来。"
 MAL_Militarize_Penang_Harbor: "军事化槟城商港"
 MAL_Militarize_Penang_Harbor_desc: "槟城商港的泊位、仓库与引航道全部纳入军管，商船仍可进出，但优先顺序改由海军部排定。港口后侧腾出的一块地随即新建了船坞，修船不必再看新加坡船厂的档期。"
 MAL_Philippine_Naval_Exercise: "菲律宾海军联演"
 MAL_Philippine_Naval_Exercise_desc: "马尼拉派来两艘护卫舰，与星洲新编舰队在南海做第一次联合演训。通信口令对了一整天才对上，但至少从此以后，海峡以东的航道上多了一支愿意回无线电的友军。"
 MAL_Beginning_Of_Centennial_Navy: "百年海军的开端"
 MAL_Beginning_Of_Centennial_Navy_desc: "几艘二手舰、一间水兵学校、一座能修自己的船坞——舰队规模还写不进任何一本年鉴，但星洲终于有了自己的海军纪年。典礼上没有新舰下水，只有一份被郑重存档的编制表。"
 MAL_Stabilize_Military_Deployment: "稳定军事部署"
 MAL_Stabilize_Military_Deployment_desc: "把各派部队的防区、补给线与轮换表钉死在纸上，谁也不能再靠一通电话调动一个营。参谋本部第一次能回答「哪个师在哪、吃谁的粮」这种最基础的问题。"
 MAL_Advanced_Jungle_Warfare_Training: "丛林战特训"
 MAL_Advanced_Jungle_Warfare_Training_desc: "在柔佛与彭亨的雨林里，模范师被拆成连队反复拉练：雨季行军、无路补给、近距离遭遇。回来的人瘦了一圈，但再没人把「丛林」当成地图上那一片绿色空白。"
 MAL_Promote_Allied_Party_Officers: "重用友党军官"
 MAL_Promote_Allied_Party_Officers_desc: "友党系统里带过兵的人被重新授衔，条件是先把党证锁进抽屉。此举在立法院吵了半个月，却在参谋作业上立刻见效：终于有人能把几支互不统属的部队排进同一张计划表。"
 MAL_Prioritize_Overseas_Intervention_Force: "重视海外干涉军"
 MAL_Prioritize_Overseas_Intervention_Force_desc: "参谋本部主张把钱花在能上船的部队上：一支编有摩托化与两栖单位的干涉军，随时可以投到群岛任何一处正在起火的港口。至于半岛的工事，等打完再说。"
 MAL_Build_Peninsula_Defense_System: "构建半岛防卫体系"
 MAL_Build_Peninsula_Defense_System_desc: "另一派主张把钱埋进半岛的钢筋水泥里：纵深工事、备用水源、分区指挥所，一寸也不让。他们不关心能不能打到苏拉威西，只关心万一有人打上门来，星洲能撑多久。"
 MAL_NRA_Southern_Extension: "国军的南方延申"
 MAL_NRA_Southern_Extension_desc: "第三派人只看着南京：把星洲军队直接编进国军的南方序列，番号、条令、补给一概对齐。好处是装备与教官随调随到，代价是此后每一道军令，都要先过一遍北边的桌子。"
 MAL_Establish_Civilian_Flying_Clubs: "建立民间飞行俱乐部"
 MAL_Establish_Civilian_Flying_Clubs_desc: "政府出钱把各地的飞行俱乐部串成一张网：统一教练机、统一课时、统一体检表。名义上是体育，实际上是把预备飞行员的名单提前十年写好。"
 MAL_Recruit_Flying_Tigers_Instructors: "招募飞虎队飞行教官"
 MAL_Recruit_Flying_Tigers_Instructors_desc: "陈纳德的旧部里有人愿意留下来教书。他们带来的不是飞机，是一整套从实战里抠出来的编队、俯冲与逃生动作——这些在军校课本上一页也找不到。"
 MAL_Command_Peninsula_Airspace: "掌控半岛空域"
 MAL_Command_Peninsula_Airspace_desc: "雷达站、隐蔽机场、飞行俱乐部与请来的教官，终于连成一整套空防。作战室的图上第一次能同时标出己方每一架飞机与每一个来向：半岛的天空，从这天起不再是别人的走廊。"
 MAL_leg_focus_bill_tt: "法案列入联邦立法院议程，须在立法院决议组内提交表决。"

#其他

 MAL_singapore_federal_defense_dm: "星洲联邦防卫军"
 MAL_singapore_federal_defense_dm_desc: "一国一军之后，星洲的武装力量第一次有了统一的名号。它起初只是一张空白的编制表：每一次整训、每一座复工的兵工厂、每一架购入的战机，都会把新的加成写进这身军装。"
 MAL_sfdf_dummy: "星洲联邦防卫军"
 MAL_focus_wip_desc: "开发暂时未完成，敬请期待后续制作。"

 MAL_guerilla_leader_trait: "游击队员"
 MAL_guerilla_leader_trait_desc: "战时带过丛林里的队伍，靠分散的小队与地形活下来。"
 MAL_chinese_communist_trait: "中共干部"
 MAL_chinese_communist_trait_desc: "在党组织里做过干部，队伍的名册与口令都经他的手。"
 MAL_german_eastasia_trait: "德东志愿兵"
 MAL_german_eastasia_trait_desc: "德属东亚华人志愿兵团出身，战时经营半岛的地下联络网。"
 MAL_xingzhou_volunteer_trait: "星华义勇军"
 MAL_xingzhou_volunteer_trait_desc: "1941年底星洲保卫战里编成的华人义勇队伍。"
 MAL_expatriate_selfdefense_trait: "华侨自卫队"
