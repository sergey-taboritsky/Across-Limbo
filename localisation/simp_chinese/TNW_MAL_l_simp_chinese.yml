#介绍
 TNW_welcome_MAL_intro_text_1: "国民党在马来半岛的发展历程大致可分为四阶段：自同盟会在南洋落地生根，至1925年南洋国民党遭禁；再到1932年，一纸协议挣得了南洋华人独立参加国民党的许可；到1946年，随着日德远东殖民政府的总崩溃，国民党在马来半岛建立起独立政权，最后到如今。国民党在组织模式、思想纲领等方面已经发生了剧烈的变化，而这趋势正主导着脆弱的星洲联邦，或是无情鞭策其进军，或是威胁将其彻底倾覆......\n\n早在1912年12月23日，当同盟会重组为国民党仅四月有余，当全体华人正被辛亥革命的“胜利”鼓舞之时，最早的国民党分支机构便在马来亚注册成立。此时，英国殖民官僚期待将同盟会合法化的举动能够稳定马来亚华人的骚动，并最终将其群体置于彻底控制之下。然而，随着刺宋案与中华革命党的成立，超过半数支部如烈日中的雪花般迅速消融。\n\n1921年，广州国民政府成立。随后的几年间，随着国民党对北伐的军事准备日渐充分，对海外华侨进行动员以招兵敛财的需求日渐上涨，而广州国民政府攻占海南也使得大量海南汉人出走南洋，为南洋国民党提供了相当一部分新鲜血液，最终国民党在新马再次复兴。日渐公开的活动使得国民党中央决定于1924年3月对南洋国民党进行重组，以原星岛支部为总部。同时，国民党以各地华文学校、报社与华人工会组织为基地，向外大肆宣传，规模日渐庞大。"
 TNW_welcome_MAL_intro_text_2: "1924年10月，英属马来亚殖民政府向本土发信，矛头直指国民党在广州与共产主义者的联合。次年3月，柏林正式回信——即刻查禁国民党在南洋的全部组织。自此，国民党在南洋的影响力因无法公开活动而迅速消散，华人群体内部的影响力尽管仍然维持，但存在相当艰难。\n\n令人意想不到的是，仅仅一年后，英国本土便率先爆发革命，而随后德意志帝国对英属远东的接管造成的短暂混乱也让国民党得以恢复在马活动。当然，这一态势在1926年北伐正式启动后很快遭受打击，不过随着德国在华干涉的成功以及柏林-武汉关系的重大转折，国民党终于恢复了全部在马来亚的行动自由。\n\n1933年的满洲事变对华人群体造成了极大的震撼"
 TNW_welcome_MAL_intro_text_3: "\n\n经过短暂的谈判后，德国于1941年答应了东京的要求，将南洋暂时转让于日本帝国。随后，日军进军马来半岛，华人生活立刻艰辛起来。国民党的少数地下组织遭到进一步打压，而华商财产也多被劫掠、剥夺，而日本给予马来民族主义合作者的支持则导致民族冲突日益尖锐。面对如此困局，南洋各个社会主义组织首先团结起来，由泛马来亚劳工大会组织各地工农进行抵抗，马来抗日义勇军正式登台。随后，由南洋民主劳动党牵线，国民党与义勇军结为同盟，并由南京提供了义勇军难以获取的资金与部分武器装备。随着义勇军逐渐壮大，华人在其队伍中的作用愈发明确。"
 TNW_welcome_MAL_intro_text_4: "随着1945年德国在欧洲战场的彻底失败，南洋殖民机构同样因此陷入混乱。日军正向本土进行收缩，而美、印、澳多国联军趁势进入荷属东印度，驱逐日本殖民机构。得到消息的国民党星岛党部当即联络义勇军向吉隆坡、星岛等重镇进军。随后，南洋民主劳动党、国民党与中国共产党的南洋事务委员会达成合作，在星岛宣布建国。得到联军承认后，星洲联邦向北吞并一众小国，占据大半个马来半岛，并在1946年日本投降后与南京达成合作，由国军出兵保护星洲。\n\n建国后，国民党的星马支部与南洋民主劳动党顺应华北与南京的合作姿态，重新合并，星洲国民党就此诞生。如今，党内大致分为三大派系：\n  “九州派”得名于森美兰州的别称“九州”，乃是南洋国民党元老邓泽如及其门生故旧组成的党内掌权集团。\n  “霹雳州派”是党内中间派，依靠霹雳州的大量华人小企业主与手工业者掌握党的部分经济话语权，倾向自由主义。\n  “隆市派”得名于核心成员彭泽民及其雪州支部。作为实质上南洋民主劳动党的国党内部分支，该派与左翼多有联系，并对基层党部有着相当影响力，只是在党的最高层支持者寥寥。"

