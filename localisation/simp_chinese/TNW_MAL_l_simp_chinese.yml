#领导人

 MAL_Li_Zhendian: "李振殿"
 MAL_Li_Zhendian_desc: "§Y出生于：§!§L1874年1月29日，大清帝国，福建省漳州府海澄县海沧镇§!\n\n§Y人物背景：§!§L福建帮侨领，中华总商会与筹赈会财政。战时他守着\"义捐不换公债\"的规矩——筹赈会的每一分钱都是义款，不作政治交易；战后他守着商界的账本，政府首脑的位置是商界与党各让一步的结果。§!"
 MAL_Chen_Chunan: "陈楚楠"
 MAL_Chen_Chunan_desc: "§Y出生于：§!§L1884年，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L同盟会新加坡元老，《图南日报》创办人，星洲国民党的实权党主席。虚位总统制的设计者与最大受益人——林文庆的名字挂在总统府门口，而党机器的每一颗螺丝都拧在他的手里。§!"
 MAL_Chen_Jiageng: "陈嘉庚"
 MAL_Chen_Jiageng_desc: "§Y出生于：§!§L1874年10月21日，大清帝国，福建省泉州府同安县集美社§!\n\n§Y人物背景：§!§L南侨总会主席，战时南洋动员的第一人。战时统筹南侨总会的赈款与机工动员，后因侨务主导权与南京当局渐生龃龉——如今他是星洲华社无可争议的道义权威，血债清算线的旗帜，任何政权都得在他的祠堂前低头。§!"
 MAL_Lin_Wenqing: "林文庆"
 MAL_Lin_Wenqing_desc: "§Y出生于：§!§L1869年9月5日，海峡殖民地，新加坡§!\n\n§Y人物背景：§!§L海峡土生名医与儒学领袖，日据期间被迫出任华侨协会主席——这份履历是他一生的污点，也是他总统宝座的抵押品。他是华人内部和解的标杆，也是党主席随时可以握住的把柄：虚位总统，实为质子。§!"
 MAL_Li_Guangqian: "李光前"
 MAL_Li_Guangqian_desc: "§Y出生于：§!§L1893年10月18日，大清帝国，福建省泉州府南安县芙蓉乡§!\n\n§Y人物背景：§!§L南益橡胶创办人，陈嘉庚的女婿。橡胶与锡的景气是他的江山——他信市场，也信党，前提是党信市场。§!"
 MAL_Peng_Zemin: "彭泽民"
 MAL_Peng_Zemin_desc: "§Y出生于：§!§L1877年11月7日，大清帝国，广东省肇庆府清塘镇白沙村§!\n\n§Y人物背景：§!§L国民党左派元老，隆市派与南洋民主劳动党的共主。南京的中原棋局是他的天时——若民主劳动党在大陆得势，他动员支持者进军星洲市的那一天，就是联邦国运的分水岭。§!"
 MAL_Fu_Daqing: "傅大庆"
 MAL_Fu_Daqing_desc: "§Y出生于：§!§L1900年，大清帝国§!\n\n§Y人物背景：§!§L中共国际派的南洋老手，中共中央南洋事务委员会的旗手。战争年代他替马共与延安之间架线，档案与电台都过他的手——如今中共-南委的旗号与马革共联并排挂在工会的墙上，他监督这两面旗不倒。§!"
 MAL_Yang_Guo: "杨果"
 MAL_Yang_Guo_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地§!\n\n§Y人物背景：§!§L马革共联的第二领袖。组织里的老实人——档案干净、资历完整、没有山头，这恰恰是他在前任们接连出事之后还站在这里的原因。§!"
 MAL_He_Wei: "何敬贤" #何畏
 MAL_He_Wei_desc: "§Y出生于：§!§L1900年，大清帝国，广西省太平府龙州厅§!\n\n§Y人物背景：§!§L早期马共的组织者之一，老资格的地下工作者。大战后他本已奉调北上，却在最后关头留了下来——如今他替中共南委统领南洋民兵：一支没有番号、却有规矩的队伍。忠诚是他的本钱，也是党内始终有人嘀咕的本钱。§!"
 MAL_Liu_Yao: "刘尧"
 MAL_Liu_Yao_desc: "§Y出生于：§!§L1915年7月31日，中华民国，广东省琼崖道琼海县加积镇§!\n\n§Y人物背景：§!§L马来人民抗日军第一纵队司令，战后出任星洲人民义勇军总参谋长——义勇军里唯一镇得住三族军官的名字。琼崖纵队的老底子，丛林战的行家。他知道自己排在某份清除名单的前列，依然每天巡视军营：义勇军上下都赌他不会出事。§!"
 MAL_Dato_Onn_Jaafar: "拿督·翁惹化"
 MAL_Dato_Onn_Jaafar_desc: "§Y出生于：§!§L1895年1月12日，柔佛，新山§!\n\n§Y人物背景：§!§L柔佛贵族，战时整合马来团体的组织天才。联邦立国后他越走越远——从争取特权一路走到铁杆伊斯兰主义：清真寺成了他的议会，\"马来人的土地只在真主的法度下\"是他的纲领。训政权起初把他的激进当作凝聚马来人的福气，直到他的布道开始谈到武装。§!"
 MAL_Musa_Ahmad: "慕沙阿莫"
 MAL_Musa_Ahmad_desc: "§Y出生于：§!§L出生年月不详，海峡殖民地，雪兰莪§!\n\n§Y人物背景：§!§L马来国民党总书记，从民族主义左翼一路走到马革共联的过桥人物——他替马来青年在左翼运动里找位置，也替左翼运动翻译马来人的怒气。两个阵营都叫他同志，两个阵营都不完全信他。§!"
 MAL_Abdullah_CD: "阿杜拉西迪"
 MAL_Abdullah_CD_desc: "§Y出生于：§!§L1923年11月2日，海峡殖民地，雪兰莪§!\n\n§Y人物背景：§!§L人民抗日军第十支队（马来支队）指挥官，马革共联的马来人面孔。日军与英方的清剿都没能抓住他——如今他统领着义勇军中纪律最严明的马来部队，也在替一场\"马来人同样能革命\"的证明押上自己的军旗。§!"
 MAL_Ishak_Haj_Muhammad: "伊沙哈芝穆哈默"
 MAL_Ishak_Haj_Muhammad_desc: "§Y出生于：§!§L1910年11月，彭亨§!\n\n§Y人物背景：§!§L马来左翼民族主义者，作家与报人，《马来亚先驱报》的笔杆。他是解放阵线里最不像极端派的人——主张马来人与移民族群在平等基础上立国，也因此成了阵线诸翼中唯一还能与联邦坐下来谈的领袖。§!"

