#决议

 MAL_econ_treasury_audit: "国库稽核"
 MAL_econ_treasury_audit_desc: "把军票清算后的账册逐州重核一遍。行政机器因此多出一分条理，代价只是一笔簿记开销。"
 MAL_econ_treasury_audit_tt: "国库储备 -1；行政进度 +6；行政月度增速 +1；可重复执行，需自付国库开销。"
 MAL_econ_penang_relief: "槟城赈济拨款"
 MAL_econ_penang_relief_desc: "向槟城拨付米粮与复工款，把街头的怨气按下去。这是不依赖任何国策、开局即可动用的常备手段。"
 MAL_econ_penang_relief_tt: "国库储备 -4；富裕进度 +4；槟城动荡 -8；可重复执行，需自付国库开销。"
 MAL_econ_rubber_tin_quota: "胶锡出口配额"
 MAL_econ_rubber_tin_quota_desc: "胶锡景气之后，政府第一次有能力替出口定价。配额批文换回的是实打实的国库与华商富裕。"
 MAL_econ_rubber_tin_quota_tt: "国库 -6；雪兰莪橡胶 +8。整理橡胶园与锡矿场的一次性拨款。"
 MAL_econ_free_port_dues: "自由港吨税"
 MAL_econ_free_port_dues_desc: "自由港地位既已确立，按吨征收的港务费便成了稳定财源，海峡上的每一艘船都在为星洲纳税。"
 MAL_econ_free_port_dues_tt: "国库 +5；富裕与每月增速上升、槟城动荡下降；槟城增建一座船坞。"
 MAL_econ_transit_levy: "转口过境费"
 MAL_econ_transit_levy_desc: "转口贸易国的名分落到账面上，就是一整套报关、验货与稽征的行政体系。"
 MAL_econ_transit_levy_tt: "国库储备 +7；行政进度 +6；一次性结算，完成后不再可用。"
 MAL_econ_sin_tax_rebate: "殖民苛税返还"
 MAL_econ_sin_tax_rebate_desc: "把殖民时代遗留的饷码与苛捐按比例发还华商与种植园。府库要出血，市面却会立刻活过来。"
 MAL_econ_sin_tax_rebate_tt: "国库储备 -6；富裕进度 +12；稳定度 +0.02；一次性结算，完成后不再可用。"
 MAL_econ_bank_consortium: "银行团联合放款"
 MAL_econ_bank_consortium_desc: "银行协调既成，几家华资银行合组银团，把分散的侨汇集中投向厂房与机器。"
 MAL_econ_bank_consortium_tt: "国库储备 +5；工业化进度 +10；一次性结算，完成后不再可用。"
 MAL_econ_central_bank_reserve: "央行准备金划拨"
 MAL_econ_central_bank_reserve_desc: "统一央行之后，各州发行准备金归入星洲。一次划拨既充实国库，也让这套新官僚体系真正转起来。"
 MAL_econ_central_bank_reserve_tt: "国库储备 +8；行政进度 +8；行政月度增速 +1；一次性结算，完成后不再可用。"
 MAL_econ_pioneer_subsidy: "先锋工业补贴"
 MAL_econ_pioneer_subsidy_desc: "给先锋工业补机器、补厂房、补贷款利息。槟城的商会会抗议，但工业化的曲线不会等他们。"
 MAL_econ_pioneer_subsidy_tt: "国库 -6；星洲（新加坡）增建一座民用工厂，工业化上升。"
 MAL_econ_land_redemption_fund: "土地赎买基金"
 MAL_econ_land_redemption_fund_desc: "以赎买代替没收，地主拿到价款、佃农拿到地契。农政因此推进，府库与旧地主的钱包却同时缩水。"
 MAL_econ_land_redemption_fund_tt: "国库 -10；农业与稳定度上升、富裕下降；柔佛橡胶 +6 并增建一级基础设施。"
 MAL_econ_plantation_wage_board: "种植园工资评议会"
 MAL_econ_plantation_wage_board_desc: "让园主、工会与政府坐到一张桌上定工价。开销不大，却能把种植园劳工的怨气换成可见的市面繁荣。"
 MAL_econ_plantation_wage_board_tt: "国库储备 -5；富裕进度 +8；稳定度 +0.01；可重复执行，需自付国库开销。"
 MAL_econ_fiscal_autonomy_settlement: "财政自主结算"
 MAL_econ_fiscal_autonomy_settlement_desc: "与南京清算完最后一笔军费与借款，星洲从此自己收税、自己记账。账目落定的那一刻，国库也一并落定。"
 MAL_econ_fiscal_autonomy_settlement_tt: "国库储备 +10；行政进度 +10；一次性结算，完成后不再可用。"
 MAL_econ_land_privilege_compensation: "废特权补偿金"
 MAL_econ_land_privilege_compensation_desc: "废除马来土地特权后给旧领主一笔了断钱，换他们不再阻挠工厂征地。"
 MAL_econ_land_privilege_compensation_tt: "国库 -6；工业化与稳定度上升；雪兰莪与霹雳各增建一座民用工厂。"
 MAL_econ_malay_reserve_survey: "马来保留地清丈"
 MAL_econ_malay_reserve_survey_desc: "保留地改革要落地，先得有人把地界一亩一亩量清楚：农业与行政体系同时受益。"
 MAL_econ_malay_reserve_survey_tt: "国库储备 -3；农业进度 +6、行政进度 +4；可重复执行，需自付国库开销。"
 TNW_archipelago_assert_influence: "彰显影响力"
 TNW_archipelago_assert_influence_desc: "以国库储备为筹码，在群岛各港埠铺开领事、商会与电台。影响力是结算资格与拉拢诸邦的门槛，也是对手最先盯上的数字。"
 TNW_archipelago_trade_offensive: "商贸攻势"
 TNW_archipelago_trade_offensive_desc: "用一船船低于市价的胶锡与米粮挤进邻港，出口账目换来的不只是影响力，还有国内的富裕水平与其月度增速。"
 TNW_archipelago_industrial_mission: "工业援助团"
 TNW_archipelago_industrial_mission_desc: "把工程师与机床一并送出去，账记在国库头上；换回来的是本国工业化进度的跃升，以及一条每月都在扩大的产能曲线。"
 TNW_archipelago_court_small_states: "争取群岛诸邦"
 TNW_archipelago_court_small_states_desc: "尚未站队的小国是冷战计票器上最便宜的一格。按本国所属阵营把它们纳入体系，月度阵营实力随即改写。"
 TNW_archipelago_cordon_dividend: "包围网红利"
 TNW_archipelago_cordon_dividend_desc: "常设化的海岸炮、巡逻艇与预备役体系开始反哺财政：行政机器随之扩张，海峡通行费不再只是一项支出。"
 TNW_archipelago_sulawesi_corridor: "苏拉威西通道"
 TNW_archipelago_sulawesi_corridor_desc: "密使带回的不仅是长老的问候。绕过大雅加达的海路一旦打通，望加锡与星洲的影响力一同上扬。"
 TNW_archipelago_settle_ins_civilwar: "结算·印尼内战"
 TNW_archipelago_settle_ins_civilwar_desc: "雅加达自顾不暇之时，群岛霸权已无悬念。由影响力达标的一方收网，星洲取得「南洋争霸的胜利者」。"
 TNW_archipelago_settle_mal_split: "结算·星洲分裂"
 TNW_archipelago_settle_mal_split_desc: "星洲退出棋局后，马尼拉顶替为对抗极。菲律宾接过海峡另一端的话语权与胜利者名分。"
 TNW_archipelago_coldwar_dominance: "冷战压倒性胜利"
 TNW_archipelago_coldwar_dominance_desc: "当本方阵营在群岛诸国中占据压倒多数、且本国影响力遥遥领先时，不必再等一场内战——争霸就此定局。"
 TNW_archipelago_proclaim_victory: "宣布南洋争霸胜利"
 TNW_archipelago_proclaim_victory_desc: "对峙进入下一阶段后，星洲终于有资格把胜负写成公告。胜利判定的具体条件尚待拟定，此决议目前保持不可点；公告一旦发出，群岛诸邦便会按这份名分重新站队。"
 TNW_archipelago_victory_dividend: "胜利红利"
 TNW_archipelago_victory_dividend_desc: "把胜利折成账面上的真东西：国库回补、富裕与工业化进度推进，影响力定格在群岛之巅。"
 MAL_kmt_faction_lodge: "深耕星洲交通部"
 MAL_kmt_faction_lodge_desc: "以1912年星洲交通部的旧班底为骨干，把书报社、俱乐部与工会重新串成一条党务线。陈楚楠在中执委每推进一步，星洲本位的分量便重一分。"
 MAL_kmt_faction_lodge_tt: "星洲交通部：实力 +5、路线向星洲本位 -5。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_overseas: "接洽南京海外部"
 MAL_kmt_faction_overseas_desc: "李振殿承邓泽如、胡汉民一脉，与南京的党务系统保持热线。海外部拿到名分与经费，党内南京本位的票数随之上涨。"
 MAL_kmt_faction_overseas_tt: "南京海外部：实力 +5、路线向南京本位 +5。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_wulu: "走访吾庐俱乐部"
 MAL_kmt_faction_wulu_desc: "李光前在吾庐俱乐部摆一桌茶，把商界与书报社的旧交请回来。中间派不谈路线，只看谁能让账本好看。"
 MAL_kmt_faction_wulu_tt: "吾庐俱乐部：实力 +5、路线不变。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_longshi: "串联隆市派"
 MAL_kmt_faction_longshi_desc: "彭泽民与劳工大会的组织网络仍是星洲左翼最扎实的一块。往星洲本位再走一步，也意味着离南京更远一步。"
 MAL_kmt_faction_longshi_tt: "隆市派：实力 +5、路线向星洲本位 -5。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_guild: "拜会同业公会"
 MAL_kmt_faction_guild_desc: "陈六使以商会与同业公会为根，胶锡行情、会馆账目与学校董事会都在他手里。他不问主义，只问生意能不能做下去。"
 MAL_kmt_faction_guild_tt: "同业公会：实力 +5、路线不变。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_nanqiao: "重整南侨同志会"
 MAL_kmt_faction_nanqiao_desc: "张永福以晚晴园主人与同盟会南洋支部首任副会长的资格召集旧友。汪精卫未附日，这批流亡苏门答腊后归来的元老便不必背负落水的名声。"
 MAL_kmt_faction_nanqiao_tt: "南侨同志会：实力 +5、路线向星洲本位 -5。实力在年度党会上决定席次重划。"
 MAL_kmt_faction_pingzhang: "联络平章会馆"
 MAL_kmt_faction_pingzhang_desc: "槟城三社团借平章会馆议事，海峡另一头的分离情绪与党务纠在一起。让他们留在中执委里，总比让他们去街头强。"
 MAL_kmt_faction_pingzhang_tt: "平章会馆：实力 +5、路线向星洲本位 -5。实力在年度党会上决定席次重划。"
 MAL_kmt_nanjing_subsidy: "拨付南京党务津贴"
 MAL_kmt_nanjing_subsidy_desc: "从国库划一笔经费给海外部，换南京的承认、干部与电台时段。钱花在党部，账记在国库。"
 MAL_kmt_nanjing_subsidy_tt: "国库 -4；南京海外部实力 +5、路线向南京本位 +3；改善与南京的关系。"
 MAL_kmt_court_wulu: "争取吾庐俱乐部背书"
 MAL_kmt_court_wulu_desc: "主席地位不稳时，先请李光前点头。吾庐俱乐部的席位暂计入主席阵营，代价是一笔不写在预算里的茶钱。"
 MAL_kmt_court_wulu_tt: "国库 -2；吾庐俱乐部忠诚 +8，主席可用委员随之增加。"
 MAL_kmt_court_guild: "争取同业公会背书"
 MAL_kmt_court_guild_desc: "陈六使要的不是官位，是胶锡配额与学校拨款。谈成了，同业公会的席位就暂时不再骑墙。"
 MAL_kmt_court_guild_tt: "国库 -2；同业公会忠诚 +8，主席可用委员随之增加。"
 MAL_kmt_purge_longshi: "整肃隆市派"
 MAL_kmt_purge_longshi_desc: "调查彭泽民的劳工大会之后，党部有了动手的由头。把左翼组织从中执委挤出去，稳定度也要付一点代价。"
 MAL_kmt_purge_longshi_tt: "隆市派实力 -6、忠诚 -12；政治点数 +25、稳定度 -1%。"
 MAL_kmt_chair_program: "推行主席路线"
 MAL_kmt_chair_program_desc: "由主席派系出面推动党务，须先稳住中执委过半委员。"
 MAL_kmt_chair_program_tt: "现任主席所属派系实力 +2。"
 MAL_leg_register_kmt_voters: "办理国民党选民登记"
 MAL_leg_register_kmt_voters_desc: "新增公民先落进星洲国民党的册子，空缺议席相应减少。册子上的名字，日后都会变成党团手里的票。"
 MAL_leg_register_kmt_voters_tt: "星洲国民党 +2 席、空缺议席 -2 席。"
 MAL_leg_reconcile_malay_parties: "安抚马来政党"
 MAL_leg_reconcile_malay_parties_desc: "马来人协会与穆斯林人民党退席后回到议事厅，条件是一笔地方拨款与不再重提的旧账。国库出血，院内回温。"
 MAL_leg_reconcile_malay_parties_tt: "国库 -2；马来人协会与穆斯林人民党忠诚各 +8、结束集体退席。"
 MAL_leg_mic_caucus: "组织国大党议会党团"
 MAL_leg_mic_caucus_desc: "把约翰·蒂维的印裔宪政派收进一个党团，补上一席空缺，也让院内多一支可动员的力量。"
 MAL_leg_mic_caucus_tt: "马来印度人国大党 +1 席、忠诚 +6、空缺议席 -1 席。"
 MAL_leg_mu_consultation: "咨商马来人协会"
 MAL_leg_mu_consultation_desc: "马来人协会要的是体面与程序。多请他们进议事厅几次，表决时便少些意外。"
 MAL_leg_mu_consultation_tt: "马来人协会忠诚 +6。"
 MAL_leg_conciliate_left: "安抚国民党左翼党团"
 MAL_leg_conciliate_left_desc: "南洋民主劳动党的议员与党部同源却不同票。拨款与委员会席位能让党鞭的电话有人接——但彭泽民在中执委的分量才是真正的刻度。"
 MAL_leg_conciliate_left_tt: "国库 -1；左翼党团党鞭 +8。"
 MAL_leg_fill_vacancies: "补选空缺议席"
 MAL_leg_fill_vacancies_desc: "空缺拖得越久，法定人数越难凑。由国库出钱办补选，国民党与国大党各补两席。"
 MAL_leg_fill_vacancies_tt: "国库 -1；空缺 -4 席、星洲国民党 +2 席、马来印度人国大党 +2 席。"
 MAL_leg_whip_kmt: "加强国民党党鞭"
 MAL_leg_whip_kmt_desc: "党部把 whip 派进议员休息室。党鞭加成叠加在党内力量对比之上，主席阵营一旦过半，党团本就完全配合。"
 MAL_leg_whip_kmt_tt: "星洲国民党党鞭 +6（上下限 ±30）。"
 MAL_leg_citizenship_bill: "表决公民权法案"
 MAL_leg_citizenship_bill_desc: "公民权法案列入议程，交付立法院表决。出席与可动员席位均过法定人数才能通过。"
 MAL_leg_citizenship_bill_tt: "按出席席位与可动员席位判定：通过则行政能力上升、马来两党团退席；否决则稳定度与党鞭受损；不足法定人数则流会、法案留在议程。"
 MAL_leg_republic_bill: "表决共和案"
 MAL_leg_republic_bill_desc: "共和案列入议程，交付立法院表决。过半可动员席位才能通过。"
 MAL_leg_republic_bill_tt: "按出席席位与可动员席位判定：通过则苏丹世袭两席交回议会；否决则稳定度与党鞭受损；不足法定人数则流会。"
 MAL_leg_quorum_review: "复核法定人数"
 MAL_leg_quorum_review_desc: "院内票数不够时，先把国民党两个党团与国大党的纪律拉起来，再谈法案。"
 MAL_leg_quorum_review_tt: "政治点数 +20；国民党党鞭 +8、左翼党团党鞭 +6、国大党忠诚 +6。院内出不了法定人数或可动员票不足时可用。"
