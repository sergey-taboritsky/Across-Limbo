l_simp_chinese:
#介绍

 TNW_welcome_MAL_intro_text_1: "国民党在马来半岛的发展历程大致可分为四阶段：自同盟会在南洋落地生根，至1925年南洋国民党遭禁；再到1932年，一纸协议挣得了南洋华人独立参加国民党的许可；到1946年，随着日德远东殖民政府的总崩溃，国民党在马来半岛建立起独立政权，最后到如今。国民党在组织模式、思想纲领等方面已经发生了剧烈的变化，而这趋势正主导着脆弱的星洲联邦，或是无情鞭策其进军，或是威胁将其彻底倾覆......\n\n早在1912年12月23日，当同盟会重组为国民党仅四月有余，当全体华人正被辛亥革命的“胜利”鼓舞之时，最早的国民党分支机构便在马来亚注册成立。此时，英国殖民官僚期待将同盟会合法化的举动能够稳定马来亚华人的骚动，并最终将其群体置于彻底控制之下。然而，随着刺宋案与中华革命党的成立，超过半数支部如烈日中的雪花般迅速消融。\n\n1921年，广州国民政府成立。随后的几年间，随着国民党对北伐的军事准备日渐充分，对海外华侨进行动员以招兵敛财的需求日渐上涨，而广州国民政府攻占海南也使得大量海南汉人出走南洋，为南洋国民党提供了相当一部分新鲜血液，最终国民党在新马再次复兴。日渐公开的活动使得国民党中央决定于1924年3月对南洋国民党进行重组，以原星岛支部为总部。同时，国民党以各地华文学校、报社与华人工会组织为基地，向外大肆宣传，规模日渐庞大。"
 TNW_welcome_MAL_intro_text_2: "1924年10月，英属马来亚殖民政府向本土发信，矛头直指国民党在广州与共产主义者的联合。次年3月，柏林正式回信——即刻查禁国民党在南洋的全部组织。自此，国民党在南洋的影响力因无法公开活动而迅速消散，华人群体内部的影响力尽管仍然维持，但存在相当艰难。\n\n令人意想不到的是，仅仅一年后，英国本土便率先爆发革命，而随后德意志帝国对英属远东的接管造成的短暂混乱也让国民党得以恢复在马活动。当然，这一态势在1926年北伐正式启动后很快遭受打击，不过随着德国在华干涉的成功以及柏林-武汉关系的重大转折，国民党终于恢复了全部在马来亚的行动自由。\n\n1933年的满洲事变对华人群体造成了极大的震撼，国民党支部恢复和南京的联络后，也加紧了救亡动员，就在此时，德意志帝国的远东外交政策从对抗革命彻底转向遏制日本的扩张，进而在和国民政府协商后赋予马来半岛华商组建商团保卫武装的权力。也正是在这种背景下，华人武装参与了抵抗日本在马来半岛登陆行动的战斗，并在德军被迫退守新加坡时有相当多的武装人员进入密林。"
 TNW_welcome_MAL_intro_text_3: "远东德军尽管装备精良，但仍然难以抵挡占据数量和后勤绝对优势的山下奉文，新加坡最终还是以陷落告终。德军退往南印度，并且组织了作为游击队中枢的\"德属东亚华人志愿兵团\"——经过短暂的谈判后，德国于1943年答应了东京的要求，将南洋暂时转让于日本帝国。随后，德军几乎完全放弃支援德属东亚华人志愿兵团，抵抗力量遭到重大打击，华人生活立刻艰辛起来。国民党的少数地下组织遭到进一步打压，而华商财产也多被劫掠、剥夺，而日本给予马来民族主义合作者的支持则导致民族冲突日益尖锐。面对如此困局，南洋各个社会主义组织完成了团结和整合，由泛马来亚劳工大会中的华人工会动员劳工参军，以部分仍在抵抗的华人义军和德属东亚华人志愿兵团余部为教官进行整训，马来抗日义勇军正式登台。随后，由南洋民主劳动党牵线，国民党与义勇军结为同盟，并由南京提供了义勇军难以获取的资金与部分武器装备。随着义勇军逐渐壮大，华人在其队伍中的作用愈发明确。此外，义勇军的几个与南京联系更深的纵队得到了南京方面的直接援助，并以此为核心组建了\"星洲国民革命军\"。"
 TNW_welcome_MAL_intro_text_4: "随着美军席卷太平洋反攻菲律宾，日本的南洋殖民机构因此陷入混乱。日军正向本土进行收缩，而得到消息的国民党星岛党部当即联络义勇军向吉隆坡、星岛等重镇进军。随后，南洋民主劳动党、国民党与中国共产党的南洋事务委员会达成合作，在星岛宣布建国，并在1946年日本投降后与南京达成合作，由国军出兵保护星洲。\n\n很快，印支战争的烈火吞噬了中南半岛，而星洲通过和泰国的结盟实现了对马来半岛大部分地区的吞并，星洲联邦得以成立和巩固。建国后，国民党的星马支部与南洋民主劳动党顺应华北与南京的合作姿态，重新合并，星洲国民党就此诞生。如今，党内按渊源与路线分作七派：\n  “星洲交通部”承 1912 年星洲交通部的旧名，由同盟会新加坡分会首任会长陈楚楠主持。他既与孙中山一脉相始终，又深耕南洋华社与各州基层党部，门生故旧遍布党务、书报社与商会，是党内实力最厚的一派；其立场偏于星洲本位，对南京凡事留三分余地。\n  “南京海外部”以李振殿为首。南京方面由李宗仁承胡汉民的政治衣钵，海外部便是这层关系在星洲的延伸：邓泽如旧部、森美兰与所谓九州府的党务元老多归于此处，主张党国一体、事事以南京马首是瞻，是党内最坚定的南京本位派。\n  “吾庐俱乐部”是李光前与星洲市本地商业精英的聚会之所，名义上是俱乐部与书报社，实为党内中间派。它与南京海外部藕断丝连，却不甘只做附庸，常在两强之间充当调停人。\n  “隆市派”得名于彭泽民及其雪州支部，是南洋民主劳动党并入星洲国民党后留下的左翼党团。该派深耕基层党部与工会，在最高层却支持者寥寥；一旦其势力坐大，党内的路线之争便再难掩盖。\n  “同业公会”由陈六使领衔，以各业公会、商会与华校董事会为根基，主张把党务让位于实业与教育，是党内最讲实际票数的一派。\n  “南侨同志会”由张永福领导。汪精卫既未附日，张永福也始终不曾投伪：日据期间他与陈嘉庚流亡苏门答腊，战后归来，聚拢一批亲汪而偏社会自由主义的南侨元老，成为党内最富声望却不掌实权的一派。\n  “平章会馆”是槟城三社团合组的地方派系，惯于以槟州利益与华社自治为筹码，在中央执行委员会里左右逢源。\n  党章定额的二十一张中执委席位就在这七派之间流转，而党内错综复杂的局势，也正是星洲联邦形势的缩影。"

