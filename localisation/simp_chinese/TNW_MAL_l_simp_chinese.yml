 MAL_Kuomintang_Governance_category: "星洲国民政府"

#国策
 MAL_Dual_Nationality: "确立星华双国籍制度"
 MAL_Dual_Nationality_desc: "星洲国民党政权最核心的合法性工程：以"星洲华族"为新国民身份，同时保留中国国籍法上的公民地位。对南京而言这是南洋支部的忠诚凭证，对马来人而言这几乎是"中国代理"的自供状，而在槟城与马六甲的峇峇中间，它又被视作迟到了半个世纪的公道。"
 MAL_New_Citizenship_Act: "通过新公民权法案"
 MAL_New_Citizenship_Act_desc: "以双国籍制度为骨架的成文公民权法案：凡在星洲出生或居住满五年之华族、印度裔及欧亚裔居民，一律登记为星洲公民。法案在立法院几乎未遇阻力——因为马来议员早已全体退席。"
 MAL_Repatriate_Mechanics: "接收滞渝机工"
 MAL_Repatriate_Mechanics_desc: "抗战期间经滇缅公路与湘桂线回国的南侨机工，战争结束后数千人滞留重庆、昆明，贫病交加。星洲政府派船分批接回南洋，予以复员安置与抚恤——这是新政权的第一笔人情债，也是第一笔民心账。"
 MAL_Malay_Reserve_Reform: "改革马来保留地制度"
 MAL_Malay_Reserve_Reform_desc: "1913年以来的马来保留地制度把最肥沃的土地锁进了苏丹与贵族的地契里。改革案一提上日程，华人资本家盯着保留地外的每一亩橡胶园，马来公会在清真寺里敲响了动员的钟。"
 MAL_Abolish_Land_Privilege: "废除马来地主的土地特权"
 MAL_Abolish_Land_Privilege_desc: "一纸法令废除马来地主的土地特权：保留地全面开放交易，债役与徭役残余一并革除。华人资本下乡的锣鼓声里，是马来乡村震动山野的怒火——这份怒火，将来是要还的。"
 MAL_Land_Redemption_Exchange: "赎买与交换土地"
 MAL_Land_Redemption_Exchange_desc: "不搞废除，搞赎买：政府发行土地债券，按市价赎回保留地中的佃租权，再与马来村社置换零散地块。钱烧得肉疼，但苏丹们保住了面子，华资拿到了地，乡村维持了体面的平静。"
 MAL_Declare_Republic: "宣布星洲为共和国"
 MAL_Declare_Republic_desc: "在双国籍与土地问题的废墟之上，立法院通过共和案：星洲不再是英王冠上的一颗珠子，也不再是任何苏丹的采邑，而是一个共和国。至于共和国姓什么——那是下一场争吵的题目。"
 MAL_Sultan_Representation: "保留苏丹世袭国大代表身份"
 MAL_Sultan_Representation_desc: "共和国不等于赶尽杀绝：各州苏丹保留世袭的国民大会代表身份，作为"民族团结的历史象征"。王室保住了俸禄与礼遇，训政党换来了马来人社会最后一丝合作意愿。"
 MAL_Purge_Malacca_Royals: "清洗马六甲王室"
 MAL_Purge_Malacca_Royals_desc: "共和案的另一半逻辑：马六甲王室被指在日据期间与军政监部合作，aleza旧账被翻出，王族财产充公，末代苏丹流亡。各州王室噤若寒蝉——柔佛与彭亨的宫廷里，流亡的种子已经埋下。"
 MAL_Plantation_Labor: "处理园丘工人运动"
 MAL_Plantation_Labor_desc: "园丘里的印度劳工仍过着战前的生活：工资以卢比计，学校没有，契约的幽灵未散。政府成立园丘劳工委员会——先是调查，一切都有得谈。"
 MAL_Indian_Labor_Rights: "印度劳工的平权措施"
 MAL_Indian_Labor_Rights_desc: "园丘委员会的结论化作平权法案：最低工资线、园丘小学、废除契约劳工残余。种植园主们骂娘，印度劳工社群则把星洲政府第一次当成了自己的政府。"
 MAL_Compromise_KMT_Congress: "对马印国大党妥协"
 MAL_Compromise_KMT_Congress_desc: "对马印国大党妥协：承认印度独立同盟与国大党系在星洲的合法地位，交换条件是工运降温、维拉塞南一系止步于谈判桌。稳妥，体面，也不痛不痒。"
 MAL_Handle_Veerasenan: "处理维拉塞南"
 MAL_Handle_Veerasenan_desc: "维拉塞南和他的罢工委员会被请进了警局，又从后门放了出来——政府选择把他吸纳进园丘委员会，给工运一个体制内的位置。左翼欢呼叫好，种植园主连夜写信给党部。"
 MAL_Chinese_Official_Language: "采纳华文为官方语言"
 MAL_Chinese_Official_Language_desc: "华文与马来文并列为官方语言——实际执行中，公文的四分之三用华文起草。马来语国族主义者怒不可遏，华社则把这天当成了第二个春节。"
 MAL_Second_Language_Referendum: "接纳第二国语公决"
 MAL_Second_Language_Referendum_desc: "把语言地位交给票箱：全民公决第二国语归属。投票率创下共和国纪录，结果显示华文以悬殊优势胜出——这也是马来人社会最后一次相信这个政权会听他们说话。"
 MAL_Chinese_School_Subsidy: "政府承担华校津贴"
 MAL_Chinese_School_Subsidy_desc: "政府预算第一次把华校列入公办教育序列：津贴按月拨付，教师领政府的薪水，林连玉们奔走相告。华教旗手们说这是"侨教百年未有之局"，马来学校的老教师们看着自己的旧课本，一言不发。"
 MAL_Chinese_Secondary_System: "规定华文中学的学制"
 MAL_Chinese_Secondary_System_desc: "华文中学学制正规化：六年制、统一会考、升学直通南洋义塾与南京的大学。华社子弟从此不必再挤英文学校的窄门。"
 MAL_Tighten_Textbook_Review: "收紧公立学校教材审查"
 MAL_Tighten_Textbook_Review_desc: "教育部设立教材审查委员会，公立学校课本统一送审——名为防赤化，实为防一切不听话的字句。槟城的华社报纸用整版社论回敬：这是把刀架在了华教的脖子上。"
 MAL_Fund_English_Malay_Schools: "继续资助英文与马来文学校"
 MAL_Fund_English_Malay_Schools_desc: "华校拿了津贴，英文学校与马来学校也一样有份——教育预算按人头平均分配。钱不多，但家家有份的公平让各方的火气都小了一截。"
 MAL_Chinese_Reconciliation: "鼓励华人社区的内部和解"
 MAL_Chinese_Reconciliation_desc: "战争结束了，账要算，但人也要活。政府号召华侨社会内部和解：附逆者悔过登记，受害者家属领抚恤，旧账翻篇。林文庆总统亲自站台——他比谁都清楚这道赦令救的是谁。"
 MAL_Prosecute_Huaqiao_Assoc: "公诉华侨协会旧骨干"
 MAL_Prosecute_Huaqiao_Assoc_desc: "华侨协会的旧骨干被一一公诉：献金经手人、奉仕主持人、检证协力者。法庭外，受害者家属举着遗像；法庭内，辩方律师反复念叨同一个名字——总统阁下当年也在协会的名单上。"
 MAL_End_Rationing: "解除配给制"
 MAL_End_Rationing_desc: "配给制的最后一批米票作废。市面重新热闹起来的那天，牛车水的夜市排到了半夜——"朝阳国度"的底气，一半是这么吃回来的。"
 MAL_War_Crimes_Trials: "审判战犯与马来合作者"
 MAL_War_Crimes_Trials_desc: "战犯与马来合作者审判开锣：宪兵队酷吏、检证执行军官、附逆的马来官僚一一过堂。第三国际的观察员坐在旁听席上——南日本的同行们对"审判旧同僚"这件事讳莫如深。"
 MAL_Patriotic_Sanitation: "爱国公共卫生运动"
 MAL_Patriotic_Sanitation_desc: "爱国卫生运动：清渠、灭蚊、种痘、改水厕。工作队挨街挨户发石灰，华侨互助会出人出钱——战时的动员机器，战后第一次用来对付疟疾而不是日本人。"
 MAL_Recognize_MinLao: "承认民劳党的南洋延伸"
 MAL_Recognize_MinLao_desc: "中国民主劳动党的南洋支部获得合法地位：承认民劳党星洲党务，与南京的党务系统并轨。星洲国民党的隆市派闻讯连夜开会——引狼入室，还是借鸡生蛋？"
 MAL_Nurture_New_Left: "扶持本土新左翼"
 MAL_Nurture_New_Left_desc: "与其等南京的党空降，不如扶持自己的左翼：本土出身的社会民主团体、工运干部、峇峇宪政派被请进咨政体系——一支不听南京也不听马共的新左翼。"
 MAL_PanMalaya_Federation: "接纳泛马工会联合会为国家工会"
 MAL_PanMalaya_Federation_desc: "泛马工会联合会获承认为全国总工会：PMFTU 的档案从地下转到地面，巴兰的谈判桌从茶室搬进了经济部。资方称之为"灾难的开端"，工人称之为"迟到的承认"。"
 MAL_Mediate_Press_Dispute: "调停新闻界纷争"
 MAL_Mediate_Press_Dispute_desc: "党报系与《南侨日报》系的笔战打了两年，政府终于出面调停：新闻纸配额、印厂纸张配给、电台时段，一样一样摆上桌面谈。"
 MAL_Party_Press_Broadcast: "支持党报和官方广播"
 MAL_Party_Press_Broadcast_desc: "调停的结果偏向党部：官方广播网扩建，党报获得纸张与邮政的优先权，《南侨日报》被"建议"缩减版面。舆论的天平重新校准——朝着党部的方向。"
 MAL_Nanyang_Daily_Competition: "接受《南侨日报》的合法竞争"
 MAL_Nanyang_Daily_Competition_desc: "调停的结果出人意料地开明：政府承认《南侨日报》的合法竞争地位，报纸配额按发行量说话。胡愈之在头版写了篇《说真话的时代》——党部宣传部连夜开会到天亮。"
 MAL_Migration_Labor_Control: "规范化移民与劳工管制"
 MAL_Migration_Labor_Control_desc: "新移民条例颁布：华工入境实行配额，劳工招募须经政府许可。商界抱怨劳动力吃紧，马来人社群则头一次为这个政权说了句好话。"
 MAL_Secret_Society_Security: "整治会党治安难题"
 MAL_Secret_Society_Security_desc: "私会党问题摆上台面：堂口林立，赌饷烟档，警匪一家。治安委员会成立——先摸底，再动手。"
 MAL_Society_Forces_Public_Security: "将会党的武力纳入公安系统"
 MAL_Society_Forces_Public_Security_desc: "招安：愿意合作的堂口整编为公安辅助队，堂口大佬换制服当队长。街上是太平了，公安局的名册也越来越看不懂了。"
 MAL_Sweep_Gangs: "扫荡拒绝合作的帮会"
 MAL_Sweep_Gangs_desc: "扫荡：拒绝合作的帮会遭遇连锅端式的清剿，烟档赌馆一夜查封。治安好转的代价是一连串火并与血案——黑钱不会乖乖进账本。"
 MAL_Blood_Debt_Compensation: "血债赔偿"
 MAL_Blood_Debt_Compensation_desc: "血债登记与赔偿法案：检证蒙难者遗属登记造册，日据死难者公祭立碑，赔偿基金立法设立。这是新政权的民意之池，也是它手里最沉的一张道义牌。"
 MAL_Military_Scrip_Liquidation: "清算日据军票"
 MAL_Military_Scrip_Liquidation_desc: "日据军票在抽屉里躺了三年，现在政府宣布限期登记清算——以日产处置收入为担保，军票按比率折兑新币。握着废纸的遗属们终于等来了一个说法。"
 MAL_Scrip_Victim_Compensation: "补偿军票持有人中的受害者"
 MAL_Scrip_Victim_Compensation_desc: "清算收入的第一个去向：军票持有人中最贫困的受害者家庭优先全额补偿。钱不多，但老人捧着新币的手一直在抖。"
 MAL_Colonial_Sin_Taxes: "处置殖民时期烟酒税源"
 MAL_Colonial_Sin_Taxes_desc: "鸦片、酒、赌饷——殖民财政的三大脏来源被逐一处置：鸦片专卖立即停办，酒税保留，赌饷缩编为有限的公共彩票。财政出了一次血，道义账上添了一大笔。"
 MAL_Banking_Coordination: "设立经济部银行统筹委员会"
 MAL_Banking_Coordination_desc: "经济部设立银行统筹委员会：华侨银行系、四大汇丰与渣打的遗产、林林总总的银庄汇兑庄，全部纳入统筹。李光前与连瀛洲在委员会里分坐左右——这是福建帮与南京纽带的合流。"
 MAL_Central_Bank_Unification: "中央银行与币制统一"
 MAL_Central_Bank_Unification_desc: "中央银行成立，星洲元统一发行：海峡货币的旧账、马来各邦的杂钞、军票清算的余款，尽数兑新。币制统一那天，经济部大楼挂出了"南洋金融从此自立"的横幅。"
 MAL_Overseas_Remittance: "整理侨汇与对华公债"
 MAL_Overseas_Remittance_desc: "侨汇与对华公债整理案：战前华侨认购的祖国公债、侨汇渠道的陈年旧账，逐一登记核算。这项工作枯燥至极，却让星洲与南京之间的钱流第一次有了总账。"
 MAL_Underwrite_Nanjing_Bonds: "承兑承销南京公债"
 MAL_Underwrite_Nanjing_Bonds_desc: "南京发行南洋建设公债，星洲政府全额承兑承销。财政部长在签约式上说"侨胞与祖国同呼吸"，市井的评论更直白：这是把民间的血汗钱押给了宗主国的赌桌。"
 MAL_Donation_Ethics: "重提"义捐不换公债"伦理"
 MAL_Donation_Ethics_desc: "政府重提战前筹赈会的老规矩："义捐不换公债"——捐出去的钱是义款，不折成债权。承销南京公债的议案被搁置：星洲人的钱，先花在星洲人身上。"
 MAL_Rubber_Tin_Boom: "管理橡胶与锡矿景气"
 MAL_Rubber_Tin_Boom_desc: "北方大战的军需订单让胶锡价格一飞冲天，星洲的出口账面三个月翻了一倍。经济部成立景气管理委员会：出口税、收储、再投资，钱要花在刀刃上——泡沫破的时候也要有人接盘。"
 MAL_Malacca_Chokepoint: "利用马六甲咽喉"
 MAL_Malacca_Chokepoint_desc: "马六甲海峡是帝国的喉咙，而星洲扼着喉咙的锁骨。港务局扩建锚地、灯塔与补给站——过路的每一条船，都要给星洲留下点什么。"
 MAL_Free_Port_Status: "强化星洲与槟城的自由港地位"
 MAL_Free_Port_Status_desc: "自由港地位不但保留，还写进宪法：星洲与槟城全境免关税，靠转口服务费与storage仓租吃饭。槟城的商会放了一整天的鞭炮——这是他们用了一百年才等来的承诺。"
 MAL_Fiscal_Autonomy: "财政自主优先"
 MAL_Fiscal_Autonomy_desc: "财政自主优先：星洲设立关税边界，转口贸易抽税养财政。国库充盈了，槟城的商会炸了锅——自由港是他们最后的护身符，现在被政府亲手撕了。"
 MAL_Transit_Trade_Nation: "转口贸易立国"
 MAL_Transit_Trade_Nation_desc: "转口贸易立国：把自己变成东方与西方之间最大的中转柜台。仓库、驳船、保险、报关行——每一个环节都是税收，每一张提单都是国本。"
 MAL_Pioneer_Industries: "建设先驱工业"
 MAL_Pioneer_Industries_desc: "先驱工业法案：对新兴制造业免税五年，进口替代优先。罐头厂、纺织厂、轮胎厂在星洲郊区立起烟囱——而槟城的转口商看着关税墙，一言不发。"
 MAL_Penang_Autonomy_Crisis: "应对槟城自治危机"
 MAL_Penang_Autonomy_Crisis_desc: "统计调查局的周报再也无法当作例行公文处理：西商会会长麦卡与印度商会会长波努鲁里联合署名的宣言摆上了内阁长桌。自由港、税权、驻军、学制，每一项都要摊牌。"
 MAL_penang_unrest_rise_tt: "§R槟城的不满在滋长§!"
 MAL_penang_unrest_fall_tt: "§G槟城的不满有所平息§!"
 #: ""
 #_desc: ""
 MAL_Criticize_Ponnudurai: "大力批评波努鲁里宣言"
 MAL_Criticize_Ponnudurai_desc: "党报连日刊发社论，把印度商会会长的分离宣言钉在殖民遗产的耻辱柱上。星洲的部长们相信，只要把波努鲁里描绘成旧时代的遗老，槟城的怒火就烧不过海峡。"
 MAL_Mobilize_Wulu_Club: "动员吾庐俱乐部"
 MAL_Mobilize_Wulu_Club_desc: "九州派的老机器重新上油：吾庐俱乐部的干员揣着党员登记册和赏金单登上北上的轮船。在槟城的会馆与码头，星洲国民党要证明自己不只会收税，还组织得起人手。"
 MAL_Guard_Malay_Separatism: "防范巫族分离势力"
 MAL_Guard_Malay_Separatism_desc: "槟城若走，威斯利省的马来聚居区怎么办？安全会议连夜划出警戒区，两边往来的马来职员被反复盘问忠诚——防范分离的命令，正在制造它声称要防止的怨恨。"
 MAL_Strangle_Penang_Industry: "绞杀槟城商会的半岛产业"
 MAL_Strangle_Penang_Industry_desc: "经济部翻出商会名下在半岛的胶园、锡场与货栈，执照、航运配额、银行授信一样样收紧。要让槟城明白：分离的账单，要用半个世纪的积累来付。"
 MAL_Business_Compromise: "商界联系的妥协方案"
 MAL_Business_Compromise_desc: "星洲的银行家密会槟城的钱袋们：自由港可以谈，特权可以留，只要分离两个字收回桌下。生意人对生意人，话说完就明白。"
 MAL_Deny_Peoples_Assembly: "否认人民会议合法性"
 MAL_Deny_Peoples_Assembly_desc: "两百票的人民会议在官方文告里只是一场商会集会。政府拒绝承认它的任何决议——不承认，就无需谈判；无需谈判，也就无从让步。"
 MAL_Calm_Strike_Wave: "平息罢市浪潮"
 MAL_Calm_Strike_Wave_desc: "码头重新开闸，米粮平价抛售，警察奉命对纠察线只看不抓。政府的算盘很清楚：罢市靠的是怒气，而怒气撑不过账期。"
 MAL_Arrest_Mackay: "拘捕麦卡"
 MAL_Arrest_Mackay_desc: "西商会会长在自己俱乐部的酒窖前被带走，罪名是煽动叛离。星洲以为拔掉了钱袋就断掉了运动——他们忘了烈士比财主更有号召力。"
 MAL_Martial_Law_Volunteers: "出动义勇军维持戒严"
 MAL_Martial_Law_Volunteers_desc: "义勇军的马来兵连被派上槟城街头，闽籍店员与巫籍士兵在骑楼下彼此戒备。用一支心向北方军旗的军队去守一座心向海洋的城，这道命令本身就是火种。"
 MAL_Negotiate_TanChengLock: "与陈祯禄谈判"
 MAL_Negotiate_TanChengLock_desc: "政府派专机接来峇峇元老陈祯禄：他是唯一一个槟城商会信、国民党用、南京也不反感的人。谈判没有议程，只有茶——而槟城的一切都取决于这壶茶怎么凉。"
 MAL_Free_Port_Legislation: "推动自由港地位立法"
 MAL_Free_Port_Legislation_desc: "自由港地位写入联邦宪法草案：槟城全境免关税，百年承诺，一字千钧。商会在鞭炮声里收回了宣言——买卖人终究是买卖人。"
 MAL_Pingzhang_KMT_Merger: "平章会馆与槟城党部合流"
 MAL_Pingzhang_KMT_Merger_desc: "平章会馆的绅商集体加入槟城党部，分离派的钱柜一夜之间成了国民党的金库。陈祯禄说：让他们从抗议者变成东家，火自然就熄了。"
 MAL_Penang_Vote: "槟州立法会议表决"
 MAL_Penang_Vote_desc: "槟州立法议会二十五席全部到场，分离动议付表决。十一个月的对峙、三轮罢市、两份宣言，最后归结为计票员手里的一叠纸。"
 MAL_Separatism_End: "分离运动的终结"
 MAL_Separatism_End_desc: "动议被否决。麦卡与波努鲁里在雨中的码头上对记者说完最后一段话，各自登上去欧洲的邮船。槟城分离运动，始于资产负债表，也终于资产负债表。"
 MAL_Bitter_Failure: "惨痛失败"
 MAL_Bitter_Failure_desc: "表决通过了。乔治市的钟楼挂出了槟城的旗帜，电报雪片般飞向南京与伦敦——而星洲的部长们还在等着一场按剧本来演的胜利。"
 MAL_Dissolve_Sep_Committee: "解散槟城自治筹备委员会"
 MAL_Dissolve_Sep_Committee_desc: "筹委会的牌子被当众摘下，账册封存，十五人委员会的名单送进档案库。政府用一场干脆的行政了结，宣告这场危机从未发生过。"
 MAL_Local_Autonomy_Principle: "维护地方自治原则"
 MAL_Local_Autonomy_Principle_desc: "立法议会保住了它全部的旧权利，行政放权的白皮书随后公布。星洲用让步换来了体面——以及一个此后每一次预算季都要重吵一遍的先例。"
 MAL_Receive_German_Bases: "接收德属东亚军事基地"
 MAL_Receive_German_Bases_desc: "德意志帝国把樟宜的船坞、亚庇的油库与炮台的钥匙交还南京，南京转手塞进星洲的口袋。从此南洋的海图上，星洲第一次有了自己的锚地。"
 MAL_Reorganize_German_Intel: "整理德意志帝国的暗探组织"
 MAL_Reorganize_German_Intel_desc: "帝国情报网在撤退前烧掉了一半档案，剩下的一半被星洲的统计调查局整箱接收。收编旧暗探、重铺联络线——新国家的耳目，是用旧帝国的耳朵改装的。"
 MAL_Invite_ZhuangHuiquan: "邀请庄惠泉入党"
 MAL_Invite_ZhuangHuiquan_desc: "136部队的老上校收到一枚烫金党证。他在战时替国民党管过情报，如今党反过来请他管党——庄惠泉把党证压在茶杯下，想了整整一夜。"
 MAL_136_Volunteer_Corps: "136部队编入义勇军"
 MAL_136_Volunteer_Corps_desc: "旧136部队的名册并进义勇军序列，老兵们领到新番号和旧薪饷。仪式上没人提日据，也没人提英属——只提了一句：这次，我们为自己打仗。"
 MAL_Share_Nanjing_Aid: "分享南京的美国军援"
 MAL_Share_Nanjing_Aid_desc: "南京的美国军火在星洲码头卸下三分之一，票据上的名目是训练器材。感谢谁？文件用了双语——中文谢南京，英文谢华盛顿。"
 MAL_Model_Division: "组建模范师"
 MAL_Model_Division_desc: "全军最好的装备、最硬的老兵和最红的政治干部凑成一个师。模范师不驻前线，专驻阅兵场和叛乱地图的圆圈中心。"
 MAL_Statistics_Bureau: "星洲统计调查局"
 MAL_Statistics_Bureau_desc: "统计局明面上管人口与物价，暗抽屉里管每个人的信件、汇款与照相簿。槟城的商会最先体会到：新政府的账本，比宪兵队记得还细。"
 MAL_Army_Artillery_Doctrine: "效仿国军集团军炮兵"
 MAL_Army_Artillery_Doctrine_desc: "国军顾问团带来整建制炮兵操典，星洲军官第一次学会在地图上调动一个基数的火力。缺点也有：操典每三页提一次南京。"
 MAL_Local_Officer_Corps: "补充本土军官团"
 MAL_Local_Officer_Corps_desc: "华人子弟、马来头人之子与印度职员被送进同一间士官学校。军官团的合影里三种制服并排立着——这是星洲军队最像军队的一天。"
 MAL_Northern_Defense_Line: "面向北四邦构筑防线"
 MAL_Northern_Defense_Line_desc: "吉打到玻璃市一线的丛林里推起工事，防线面向北方。作战地图上没有写敌人是谁，只标了四个方向——每一个都通向曼谷的影子。"
 MAL_Assess_Left_Generals: "评估左倾将领的忠诚"
 MAL_Assess_Left_Generals_desc: "人事局连夜整理军官与左翼工会的合影、书信与旧部关系。名单分三栏：可靠、存疑、观察。第三栏最长。"
 MAL_Reorganize_Volunteers_Ethnic: "按族裔重组义勇军"
 MAL_Reorganize_Volunteers_Ethnic_desc: "义勇军按族裔拆分整编：华人支队、马来支队、印度支队各归各营。效率确实高了——部队之间也确实不再说话了。"
 MAL_Volunteer_Integration: "确保义勇军混编"
 MAL_Volunteer_Integration_desc: "混编令下到连队：每个营必须三种族裔掺编，军官互调，伙房合并。摩擦的报告与友谊的野餐一同增加。"
 MAL_Militia_Reserve: "训练自卫队与预备役"
 MAL_Militia_Reserve_desc: "工厂下工后的操场上，账房先生和三轮车夫端起了老套筒。自卫队不发饷，只发一句口号：这座城，自己守。"
 MAL_City_Defense_Plan: "星隆槟重点防御措施"
 MAL_City_Defense_Plan_desc: "星洲、吉隆坡、槟城三城的防空、巷战与疏散预案一次成文。图纸角落有参谋的铅笔小字：若三城同乱，无兵可调。"
 MAL_NRA_Returns: "驻星国军归来"
 MAL_NRA_Returns_desc: "中原的硝烟散尽，驻星国军奉命归建，军旗上添了星月徽记。庆典礼炮未落，星洲的参谋们已在清点一个更要紧的问题：这支军队听南京的，还是听乔治市的？"
 MAL_Fight_NRA_Factionalism: "打击国民革命军的派系主义"
 MAL_Fight_NRA_Factionalism_desc: "国军带来的不只是装备，还有黄埔、政训处的老山头。整军报告第一页只有一句话：星洲养不起第二个中央。"
 MAL_Merge_Chinese_Units: "融合义勇军中的华人单位"
 MAL_Merge_Chinese_Units_desc: "义勇军华人支队打散并入国防序列，老兵与新兵在同一个灶上吃饭。有人骂忘本，有人松了口气——不管哪种，都得先学会新口令。"
 MAL_Localize_Garrison: "本土化部分驻军单位"
 MAL_Localize_Garrison_desc: "驻军单位成建制换上本地兵员与本地番号，军饷从乔治市财政直接走账。南京的教官还留在营区，只是教鞭换成了顾问聘书。"
 MAL_One_Nation_One_Army: "一国一军"
 MAL_One_Nation_One_Army_desc: "三军并成一军，义勇军、自卫队、驻防军同旗同饷同军法。授旗那天，老义勇军把旧臂章缝进了内衬——国家要一支军队，他们留一个念想。"
 MAL_Foreign_Path: "确定外交路线"
 MAL_Foreign_Path_desc: "外交部清点家底：一位宗主、一群邻居、两个都想拉拢的大洋。星洲第一次以国家的身份填写外交答卷，而第一题就是站队。"
 MAL_Follow_Nanjing: "追随南京"
 MAL_Follow_Nanjing_desc: "泰国翻脸之后，海峡南岸只剩一个可以依靠的背影。星洲把国书递到南京：南洋支部永远姓党国——这句话一半是忠诚，一半是投名状。"
 MAL_Party_Ties: "强调党际联系"
 MAL_Party_Ties_desc: "与南京的纽带不走使馆走党部：南洋支部书记的密电直通中央党部海外部。外交是外交，家事是家事——星洲对南京，两者都是。"
 MAL_Reclaim_War_Debts: "收回部分抗战债务"
 MAL_Reclaim_War_Debts_desc: "南洋华侨抗战时期的捐款与公债账册重新摊开，追讨团带着发黄的电汇存根北上。欠债的和新立国的坐上一张桌子——谈的是钱，算的是恩。"
 MAL_US_Recognition: "争取美国与国际承认"
 MAL_US_Recognition_desc: "星洲的护照需要签证页，而签证页需要承认。外交信使飞往华盛顿：一个自由港城邦对华尔街而言，比一打内陆共和国都好谈。"
 MAL_Fu_Daqing_Europe: "任命傅大庆出使欧洲"
 MAL_Fu_Daqing_Europe_desc: "老革命傅大庆领到国书，赴欧洲开辟外交线。他的行李一半是礼服，一半是二十年没公开用过的旧国际人脉。"
 MAL_He_Military_Mission: "何氏军事观察团"
 MAL_He_Military_Mission_desc: "以何氏为首的军事观察团出发考察各国军制。报告的题目拟得很谦虚：论小国的军队如何不成为大国的次要部分。"
 MAL_Cope_Calcutta: "应对加尔各答"
 MAL_Cope_Calcutta_desc: "加尔各答的广播每晚上演慷慨的演说，马来亚的印度侨工听得入神。星洲的对策第一版只有四个字：以工代煽。"
 MAL_Indian_Left_Labor: "动员印裔参与左翼工运"
 MAL_Indian_Left_Labor_desc: "把印度劳工从民族主义会场接进工会会所：同一批人，换一面旗帜，换一套简章。维拉塞南的名字重新出现在传单上。"
 MAL_Weaken_Malay_Indian_Congress: "削弱马印国大党"
 MAL_Weaken_Malay_Indian_Congress_desc: "查账、约谈、劝退，三件套轮着用。马印国大党的集会人数一月少过一月——报告写：成效显著。附页还有一行：仇怨亦然。"
 MAL_Pan_Indonesia_Shock: "泛印尼主义的冲击"
 MAL_Pan_Indonesia_Shock_desc: "群岛那边的电台日夜鼓吹大印尼，从苏门答腊一路喊到柔佛海峡。星洲的马来人听得心热，华人听得心寒——同一段广播，两种失眠。"
 MAL_Islands_Encirclement: "统筹群岛包围网"
 MAL_Islands_Encirclement_desc: "外交通报、海军巡航、情报共享，一张针对泛印尼主义的网在海峡铺开。网眼很密，唯一的隐患是织网的人各有各的线头。"
 MAL_PH_VN_Partners: "与菲律宾和越南的伙伴联系"
 MAL_PH_VN_Partners_desc: "马尼拉的商会、西贡的政权，被星洲的特使挨个拜访。不谈主义，只谈航运、关税与共同讨厌的邻居——这已经足够签三份备忘录。"
 MAL_penang_strike: "槟城总罢市"
 MAL_penang_strike_desc: "乔治市的码头第一次安静下来。吊机停摆、锡锭压仓、商店落闸，连当铺都挂出歇业的木牌——槟城在用一百年的商业信誉对星洲说：不。"
 MAL_One_Army: "一国一军"
 MAL_One_Army_desc: "义勇军、自卫队与驻防军的番号并成一个序列。老臂章缝进内衬，新军旗升上旗杆——星洲终于有了唯一的军队，军队也终于只知道一个国家。"
 MAL_penang_crisis.1.t: "槟城的宣言"
 MAL_penang_crisis.1.d: "西商会会长麦卡与印度商会会长波努鲁里在乔治市联合署名，宣布筹组槟城脱离筹备委员会，主张以宪制途径脱离星洲联邦、维持自由港地位。文告里没有一个华字——签名的两位甚至都不是华人，可连署的账本后面站着整个槟城的福建帮。电报送到星洲时，内阁正在为关税表吵到深夜。有人把这封电报念出声，会议室安静了几秒：所有人都听懂了，这不是一次抗议，这是一份账单。"
 MAL_penang_crisis.1.a: "事态已经无法忽视"
 MAL_penang_crisis.2.t: "全槟总罢市"
 MAL_penang_crisis.2.d: "罢市像瘟疫一样从码头蔓延到全岛。吊机停摆，胶锡压仓，商店落闸，连当铺都挂出歇业的木牌。槟城人没有喊口号——他们只是停止了做生意，而做生意正是这座城唯一会说的语言。星洲的贸易报表连续三周飘红，财政部连夜测算损失，海军部则在估算另一个更可怕的问题：如果海峡对岸的马六甲也学会了这一手。"
 MAL_penang_crisis.2.a: "看谁先撑不住"
 MAL_penang_crisis.3.t: "槟城人民会议"
 MAL_penang_crisis.3.d: "两百零八个名字，来自会馆、商会、学校、报馆乃至宗祠，在平章会馆的大厅里坐成一张长桌——槟城人民会议宣布自己是这片土地利益的代言人，决议只有一条：脱离星洲，自治自决。没有人再谈折中。星洲的特使被挡在会场外的骑楼下，听着里面用闽南语、泰米尔语和英语交替进行的表决，一个个音节都像钉子。"
 MAL_penang_crisis.3.a: "决不让步"
 MAL_dissolution.1.t: "联邦的分水岭"
 MAL_dissolution.1.d: "南京的旗帜换了颜色，联邦的国运也走到了彭泽民说过的那道分水岭。立法院的马来议员集体退席，柔佛的王宫升起了自己的九重日月旗，彭亨的丛林里响起了共和国的号角——星洲联邦就此成为历史，地图上只剩下一个名字：星洲地方。"
 MAL_dissolution.1.a: "分水岭已过"
 MAL_dissolution.2.t: "驻星国军返乡"
 MAL_dissolution.2.d: "中原大战的炮声传到南洋，驻星国军连夜在码头集结——祖国的战局，容不下置身事外的客人。兵舰解缆北上，码头上只剩宪兵的哨音和未散的煤烟。星洲的海风里，第一次没有了北方军旗的味道。"
 MAL_dissolution.2.a: "目送兵舰北上"
 MAL_dissolution.3.t: "驻星国军归来"
 MAL_dissolution.3.d: "北方的战事终于落幕，航船的汽笛再次在樟宜外海响起。驻星国军回来了——甲板上的老兵黑了、瘦了，枪械的保养却比走时更好。星洲的码头挤满了欢迎的人群，而乔治市的官员们连夜清点营房：军队回来了，老问题也跟着回来了——这支军队听南京的，还是听星洲的？"
 MAL_dissolution.3.a: "欢迎国军归建"
 MAL_local_government: "星洲地方"
 MAL_local_government_DEF: "星洲地方"
 MAL_local_government_ADJ: "星洲"
 MRP_Ishak_Haj_Muhammad: "伊沙·哈芝穆哈默"
 MRP_Ishak_Haj_Muhammad_desc: "§Y出生于：§!§L1910年11月，彭亨§!\n\n§Y人物背景：§!§L马来左翼民族主义者，作家与报人，《马来亚先驱报》的笔杆。他是解放阵线里最不像极端派的人——主张马来人与移民族群在平等基础上立国，也因此成了阵线诸翼中唯一还能与联邦坐下来谈的领袖。如今，谈判桌换成了共和国的总统府。§!"
 JHR_Sultan_Ibrahim_Johor: "苏丹易卜拉欣"
 JHR_Sultan_Ibrahim_Johor_desc: "§Y出生于：§!§L1873年9月17日，柔佛，新山§!\n\n§Y人物背景：§!§L柔佛苏丹，天猛公王朝之主。他把州宪当生意做，把顾问当账房用。联邦立国后他收敛锋芒，但新山的王宫里从未停止计算：联邦散伙的那一天，柔佛就该是柔佛人的柔佛。§!"
 MAL_nra.1.t:0 "驻星国军，归建！"
 MAL_nra.1.d:0 "黄埔的口音混着新加坡的汽笛声——两个乙种师的建制在星光码头完完整整地交割回星洲当局手中。南京的电令写得客气：\"该部久戍外岛，着即归建，以固海疆。\"但每个军官都清楚，这两支部队从踏上栈桥的那一刻起，问题就不再是他们何时回来，而是他们回来之后，枪口究竟听谁的。"
 MAL_nra.1.a:0 "欢迎回家。"

