 #顾问
 POL_Edward_Rydz_Smigly: "爱德华·雷兹-希米格维"
 POL_Edward_Rydz_Smigly_desc: ""
 POL_Konstantin_Rokossovsky:0 "康斯坦丁·罗科索夫斯基"
 POL_Konstantin_Rokossovsky_desc:0 "罗科索夫斯基生于火车司机家庭，收入尚丰，家境不错；父亲是波兰人，母亲是俄罗斯人，童年可谓宁静而无忧无虑，但父亲因工伤病故，家境剧变，母亲担起养家的重担，1910其母亲积劳成疾，次年去世，所以刚上完市立学校4年级的罗科索夫斯基只好辍学去当工人。1912年华沙工人举行了大规模的罢工和示威游行，他加入了工人斗争的行列。一战开始后谎报年龄，勉强入伍，1917年，他站到了苏维埃政权一边。\n\n后来参与了解放华沙和柏林的战争。在战后，应铁木辛哥的要求，仍留在俄罗斯军队，1930年，为中东路事件的失败收尾，发挥出色，1934年初升任军长，1935年受命回到波兰成立军政府止暴制乱。\n\n然而，回到阔别已久的祖国并不能使他感到宽慰，在俄国，他常常因为自己的波兰人身份而受到隐性的歧视，而在波兰，他又被认为是俄国人的傀儡，罗科索夫斯基的心态从未如此的失衡，他也许还能处理好物质上的事务，但是精神上的崩溃，也许就在明天。"
 POL_Mental_imbalance:0 "心态失衡"
 POL_Julian_Leschinski:0 "朱利安·莱斯钦斯基"
 POL_Julian_Leschinski_desc:0 "莱斯钦斯基出生在一个工人阶级家庭，1905年便因参与学校的罢课而被开除，次年就加入了波兰王国和立陶宛社会民主党，一战前夕被沙皇逮捕，与捷尔任斯基关押在一起，1917 年秋，莱什琴斯基与捷尔任斯基、约泽夫·温施利希特等人一起，从布尔什维克党的名单中进入了所谓的预议会和制宪会议。在这里，他以演说家和宣传家的身份脱颖而出。\n\n波兰苏维埃成立后，他主要负责教育和宣传工作。本来他无缘权力的巅峰，然而约泽夫·温施利希特对动乱失败的处理给了他机会，让他成为也许就在不远的将来，他将有机会一展拳脚。"
 POL_Biting_publicist:0 "辛辣的宣传家"
 POL_Stanislaw_Patek:0 "斯坦尼斯瓦夫·帕特克"
 POL_Stanislaw_Patek_desc:0 "1889年，帕特克从华沙大学法学院毕业。 1903 年起，他开始参与为政治犯提供法律援助的工作，并自此在沙皇的法庭上为许多被控持不同政见的波兰人辩护。作为波兰的主要律师，他在使被告免于死刑方面有着无与伦比的业绩，而且经常使被告无罪；于是，他开始受到沙俄的针对。1908 年，他被指控与被告有联系被捕并被短暂监禁了一个月，1910 年，他又因 “在审判中使用不当用语”、“密谋更改证词”、“加入秘密非法组织 ”等罪名受到纪律处分；地区法院宣布他无罪，但检方又对他提起诉讼或对判决提出上诉。最后在1911 年，尽管波兰和俄罗斯的律师提出抗议，他还是“出于政治考虑”被从沙俄的律师名单中除名。\n\n1920年波兰苏维埃建立后，鉴于他是波兰最杰出的律师之一，他参与了波兰新法律体系的创建工作，后来协助波兰苏维埃开展外交工作，在莫斯科担任大使进行谈判工作，1934年因为腿部病情回国，担任人民委员的工作，作为一名德高望重的前法律工作者，他仍然受到人们景仰，作为保卫人民与公民权利联盟的名誉领袖，也许这份景仰能在有一天引领波兰走出这二十年来的阴霾。"
 POL_Excellent_defender:0 "出色的辩护人"

 
