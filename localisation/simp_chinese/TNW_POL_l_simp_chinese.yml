#ideas
 POL_In_a_haze:0 "合法性：阴霾笼罩"
 POL_In_a_haze_desc:0 "作为1919年毕苏斯基失败军事投机的遗产，[POL.GetName]的合法性一直是个难以解决的问题，许多人认为当前的波兰苏维埃不过是莫斯科之新傀儡，亦或者是柏林委员们的鹰犬，纵使捷尔任斯基如何鞠躬尽瘁，他也无法完全扫除围绕在波兰人民头上的阴霾，在他过世之后，他的努力大多化为了泡影。"
 POL_The_divided_political_enemies_of_the_bourgeoisie:0 "四分五裂的资产阶级政敌"
 POL_The_divided_political_enemies_of_the_bourgeoisie_desc:0 "波兰苏维埃固然称得上失败，但资产阶级流亡政府也很难谈论自己的成功，伦敦的联邦主义者和巴黎的民族主义相互对立争执不休，即使是在西方的波兰侨民也深深地对流亡政府政府感到不信任。"
 POL_Military_coercion:0 "军事高压"
 POL_Military_coercion_desc:0 "捷尔任斯基的逝去给了国家带来了巨大动荡，隐藏于平稳表面下的不安顿时爆发出来，于是十年之内波兰只好迎来了第二次军事政府，我们只有像捷尔任斯基在十年前那样以无情的态度对付各种敌人和反革命，才能保卫国家。"
 POL_Military_coercion_text:0 "§R不能训练部队，解散部队或编辑部队模板!§!"
 POL_Polish_Soviet:0 "苏联加盟国-波兰苏维埃"
 POL_Polish_Soviet_desc:0 "苏维埃社会主义共和国联盟是在1922年成立的国家联盟，她的宗旨是团结起各地区的无产阶级政权，团结互助，维护无产阶级的统治，各加盟国有独立的国家主权。"

#介绍
 TNW_welcome_POL_intro_text_1:0 "虽然直到1919年1月波兰才通过协约国和同盟国的临时停战协定中正式独立，但早在前一年的11月，德奥两国已经忙于处理内乱而丧失了对波兰会议王国和加利西亚地区的控制。在毕苏斯基信步从监狱大门走出，看着报纸上李卜克内西于前一天宣布赤色德国成立的新闻之时，他脑子里只想着解决东加利西亚问题，还没有预料到这件事后续的影响。\n\n转眼已经到了1919年6月，毕苏斯基也正虎视眈眈地谋求海间联邦的建立，在军事指挥部夜以继日的起草着战争计划。而在立陶宛、白罗斯、乌克兰，这些前波立联邦的领土上，红军已经占据了白军的上风。为了尽快打通支援德国革命者的路上走廊，红军暂缓了对于芬兰和拉脱维亚、爱沙尼亚的解放战争，前两者直到1922年才垮台，爱沙尼亚则将在萨列马岛上坚守到1924年。进攻的矛头优先转向了波兰，双方爆发了激烈的碰撞。\n\n但在战争正式爆发的第二个月，便爆发了黑天鹅事件，奥匈帝国割肉加利西亚并未使它获得稳定，匈牙利苏维埃建立起来，毕苏斯基突然发现自己陷入了三面环敌的境地，一切计划均被打乱。然而协约国正兴奋地瓜分着德意志帝国的残羹剩饭，他们真正意识到大难临头还要等到第二年六月柏林和维也纳被攻陷，现在则完全无意于支援毕苏斯基，就像他们之前也忘了需要支援邓尼金等白军，于是战争的天平迅速地倒向了红军，在圣诞节的夜幕下，红军列队进入华沙城。\n\n波兰的资产阶级流亡政府在伦敦建立起来，然而，战争的形势已不容许他们回到柏林以东的任何地方，像德莫夫斯基这样的右翼民族主义分子对他的军事投机表示雷霆大怒，1928年，流亡政府发生分裂，支持德莫夫斯基的人士转移到了巴黎，1931年，与毕苏斯基同盟的人民党（解放）一部分人转投了温岑蒂·维托斯的人民党（皮雅斯特），即使西方的波兰侨民深深的对波兰流亡政府感到失望，1935年，毕苏斯基孤独的卧在病榻上，身边只剩下多年的战友加布里埃尔·纳鲁托维茨能传达遗嘱。"
 TNW_welcome_POL_intro_text_2:0 "作为东欧战争最大的发起国和战败国，她的共产主义政党——波兰共产主义工人党起初并没有什么影响，在波兰全境被红军占领后，捷尔任斯基、门任斯基、温斯利希特等人又建立了波兰临时革命委员会，来镇压波兰境内的反动派，这个战时组织成为了未来几年波兰工作的重心，并未给党派本身带来任何好处。\n\n1925年，波兰镇压反动派的任务基本结束，这个组织终于解散，并入了波兰共产主义工人党，然而，党派的合法性却因此遭到了广泛质疑，许多人都认为波兰不过是莫斯科或者柏林的傀儡，执政的唯一理由似乎是赢得了与海外的流亡政府比烂大赛。\n\n但至少，党的首脑捷尔任斯基仍广受资产阶级分子以外的民众欢迎。凭借忠实与廉正的性格，捷尔任斯基用无情而严厉的手段领导着这个国家，似乎只要“钢铁的菲力克斯”还存在一天，波兰苏维埃就能继续稳定的持续下去。"
 TNW_welcome_POL_intro_text_3:0 "所以，当1934年糟糕的天气折断钢铁之时，波兰混乱的风暴便再一次旋起，在这之前，捷尔任斯基的副手门任斯基已经去世，约瑟夫·温斯利希特开始掌控大局，虽然温斯利希特是波共工党最早的成员，也是波兰政府最早的主要负责人之一，但他当时捷尔任斯基的合作就并不愉快。正如托洛茨基所说，他是一个“野心勃勃但缺乏才干的阴谋家“，温斯利希特完全无法处理捷尔任斯基逝世后连绵不绝的示威游行和反社会恶性事件。\n\n阴霾笼罩在波兰人民头上，随后不稳定蔓延至了东德和西乌克兰，加剧了东德粮食紧缺、“祖国军”的崛起，也造成了东加利西亚民间的大规模暴力冲突。约瑟夫·温斯利希特抵不住国内此起彼伏的反对声势，在向苏联其他国家寻求援助。然后在巨大的压力下黯然辞职，将权力交给了军队，由罗科索夫斯基将军在波兰成立军政府，附带上前属乌克兰的发生了大规模暴力冲突的东加利西亚地区，一并止暴制乱。\n\n十年之前，波兰刚不用再认识军事高压，却常年处在属于莫斯科还是柏林的质疑之中，十年之后，状况在改善之后又迅速恶化，军事戒严再一次问候了波兰。在好不容易结束了三次瓜分迎来了独立之后，波兰仍然前途未卜，未来迷茫。"

