#决议组
 TNW_Balkan_Powderkeg_decision_category: "巴尔干火药桶"
 TNW_Balkan_Powderkeg_decision_category_desc: "巴尔干地方，历代大规模征战五十余次，是非曲直，难以论说。但史家无不注意到，正是在这个古半岛，决定了多少代王朝的盛衰兴亡、此兴彼落，所以古来就有问鼎巴尔干之说。\n\n当年，先帝令沙俄军分三路会合索菲亚，兴师南下，光复马其顿的第二天，奥斯曼帝见大势已去，宣告投降。一九一六年四月，也正是在贝尔格莱德城郊，我有幸亲率数十万健儿征讨塞尔维亚国王、首相，大获全胜！\n\n我不明白，为什么大家都在谈论着君十一被困君堡，仿佛这巴尔干古战场，对我们注定了凶多吉少。二十年前，我从索菲亚踏上征途，开始了第二次巴尔干战争，保加利亚矩形，遂归于一统。本王本军所到之处，民众竭诚欢迎，真可谓占尽天时，那种勃勃生机、万物竟发的境界，犹在眼前。短短二十年之后，这里竟至于一变而成为我们的葬身之地了么？\n\n无论怎么样，会战兵力是以八十万对六十万，优势在我！\n\n巴尔干各国国力分数：\n[BUL.GetNameWithFlag]：国土分数[global.TNW_balkan_territory_score_BUL]；博弈分数[global.TNW_balkan_diplomacy_score_BUL]\n[GRE.GetNameWithFlag]：国土分数[global.TNW_balkan_territory_score_GRE]；博弈分数[global.TNW_balkan_diplomacy_score_GRE]\n[ALB.GetNameWithFlag]：国土分数[global.TNW_balkan_territory_score_ALB]；博弈分数[global.TNW_balkan_diplomacy_score_ALB]\n[ROM.GetNameWithFlag]：国土分数[global.TNW_balkan_territory_score_ROM]；博弈分数[global.TNW_balkan_diplomacy_score_ROM]\n[SER.GetNameWithFlag]：国土分数[global.TNW_balkan_territory_score_SER]；博弈分数[global.TNW_balkan_diplomacy_score_SER]\n如今巴尔干霸权属于[Get_TNW_balkan_hegemon]\n\n§Y点选地图上存在冲突（黄色）的地块，以获取冲突现状并加以干涉§!"
 TNW_balkan_hegemon_BUL: "[BUL.GetNameWithFlag]"
