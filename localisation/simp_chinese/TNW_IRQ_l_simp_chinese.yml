l_simp_chinese:
 IRQ_German_Legacy: "德伊条约的遗产"
 IRQ_German_Legacy_desc: "柏林倒台的消息比冬天的头一场雨来得还早。旧盟约成了一沓废纸，德国顾问留下的空椅子还没来得及搬走，欠柏林债行的账单已经摆上了国王的办公桌。宫廷决定认账——王座还想要人扶，可原来扶着的那只手已经不在了。"
 IRQ_Seek_New_Patron: "寻找新金主"
 IRQ_Seek_New_Patron_desc: "旧的靠山塌了，日子还得过。苏黎世的银行家、莫斯科的商务参赞、甚至安曼的堂兄弟，都在巴格达的客厅里进进出出。宫廷的算盘很简单：谁出价高就同谁跳舞——只要别把灵魂也一并典当出去。"
 IRQ_Foreign_Credit: "银行团的贷款"
 IRQ_Foreign_Credit_desc: "苏黎世财团的代表带着算盘和条约来敲门。贷款的条件一行比一行苛刻：关税担保、石油优先认购权，还有财政顾问的常驻席位。账房先生们说这是救命钱，军人们说这是卖身的定金。"
 IRQ_Arms_Brokers: "军火掮客的价目表"
 IRQ_Arms_Brokers_desc: "旧金主塌台之后，军械只能满世界零买。意大利的步枪、法国的机枪、不知倒了几手的火炮，口径对不上就先用锉刀锉。军官们抱怨口径杂乱，军士们只抱怨弹药太少——这一点倒是和从前一样。"
 IRQ_Crown_League: "王冠同盟"
 IRQ_Crown_League_desc: "巴格达向安曼递出了手：同样的家族、同样的敌人、同样空空如也的国库。两位国王约定，王座若有难，另一把王座不能坐视。开罗的革命报纸嘲讽这是旧制度的互助会。"
 IRQ_Settle_Old_Treaties: "废除旧约特权"
 IRQ_Settle_Old_Treaties_desc: "新政权把王朝签下的条约、特许权和借款合同摊上长桌，一条一条当众撕掉。外国顾问的行李被扔上卡车，码头上的洋行仓库贴了封条。这一手让莫斯科连夜发来贺电。"
 IRQ_Nuri_Strongman: "努里·赛义德主政"
 IRQ_Nuri_Strongman_desc: "老宰相第无数次组阁。他了解每一张选票的价格，也了解每一支步枪的脾气，唯独不了解街头。"
 IRQ_Constitutional_Facade: "宪政门面"
 IRQ_Constitutional_Facade_desc: "议会照常开幕，选举照常舞弊。门面要紧——银行团的照会喜欢看见这些仪式。"
 IRQ_Tribal_Levies: "编练部落民团"
 IRQ_Tribal_Levies_desc: "政府给谢赫们发枪发饷，换取平原上的秩序。城市里的法官管不了河边持枪的人。"
 IRQ_Fertile_Crescent: "沃土新月计划"
 IRQ_Fertile_Crescent_desc: "把巴格达、安曼和大马士革串成一顶王冠——哈希姆家族的旧梦在公文里又活了一遍。约旦宫廷拍手叫好，其余所有人保持沉默。"
 IRQ_Liberal_Cabinet: "自由派组阁"
 IRQ_Liberal_Cabinet_desc: "米德法伊的老朋友们拿到几个部长位子。报纸谨慎地欢呼『新风气』，宫廷在等待收回成命的时机。"
 IRQ_Party_Legislation: "政党合法化试探"
 IRQ_Party_Legislation_desc: "结社法修订案悄悄通过，各色政治俱乐部登记在册。特务的名单比登记簿厚得多。"
 IRQ_Free_Press: "新闻自由试探"
 IRQ_Free_Press_desc: "报馆重新敢登反对派的讲话了。检察官的剪刀放宽了一寸，牢房随时留着位置。"
 IRQ_Union_Tolerance: "容忍工运"
 IRQ_Union_Tolerance_desc: "工会获得半合法地位。伊共的干部在纺织厂里比在印刷所里更活跃，内政部为此夜不能寐。"
 IRQ_IPC_Renegotiation: "重谈石油分成"
 IRQ_IPC_Renegotiation_desc: "对伊拉克石油公司的谈判持续了整个雨季。五五分成的先例一旦打开，账房里的数字会好看得多。"
 IRQ_Kirkuk_Pipeline: "基尔库克输油管"
 IRQ_Kirkuk_Pipeline_desc: "新管线把北方的原油直送地中海。过境费、关税、雇工名额，每一项都是可以讨价还价的主权。"
 IRQ_Development_Board: "石油发展委员会"
 IRQ_Development_Board_desc: "石油收入第一次被法定用于建设而非供养宫廷。工程师们画的蓝图比任何党纲都更能打动人。"
 IRQ_Diyala_Dams: "迪亚拉灌溉工程"
 IRQ_Diyala_Dams_desc: "大坝锁住春汛，渠网铺向平原。省长们把剪彩当作头等大事，农民只问水费多少。"
 IRQ_Agri_Mechanization: "农业机械化"
 IRQ_Agri_Mechanization_desc: "拖拉机替代了犁和骡子，也替代了佃农的活计。产量上去了，村子里的人心却未必。"
 IRQ_Denaturalization_Law: "撤销国籍法"
 IRQ_Denaturalization_Law_desc: "政府立法把犹太人赶出国籍册，行李和黄金一起过境以色列。商界一夜之间空了半条街。"
 IRQ_Schools_Expansion: "扩建巴格达学府"
 IRQ_Schools_Expansion_desc: "新校舍沿河而起，乡村教师被成批派往什叶部落区。毕业生的第一份工作常常是上街游行。"
 IRQ_Communists_Crackdown: "镇压人民党"
 IRQ_Communists_Crackdown_desc: "内政部对伊共收网。印刷所被捣毁，干部成串入狱，总书记法赫德在秘密地点落网。"
 IRQ_Palestine_Expedition: "远征巴勒斯坦"
 IRQ_Palestine_Expedition_desc: "三个旅开往巴勒斯坦替约旦国王救场。士兵们在异国的山口流血，为的不是伊拉克。"
 IRQ_Army_Modernization: "陆军现代化"
 IRQ_Army_Modernization_desc: "新编制、新操典、新军营。军官们从巴勒斯坦的溃败里学到的东西，比任何德国顾问都多。"
 IRQ_Officer_Academy: "扩建军官学校"
 IRQ_Officer_Academy_desc: "军校向中下阶层子弟敞开大门。未来的上校们此刻正在食堂里朗诵诗集，抱怨军饷。"
 IRQ_Barzan_Campaign: "清剿巴尔赞山区"
 IRQ_Barzan_Campaign_desc: "空军轰炸了巴尔赞的村庄，把毛拉们的族人赶进平原。山里安静了，仇恨没有。"
 IRQ_Royal_Guard: "扩建王室卫队"
 IRQ_Royal_Guard_desc: "宫廷给卫队换装新车。保卫王朝的最后一件兵器，最后往往一枪未发。"
 IRQ_Qasim_Revolution: "卡塞姆革命"
 IRQ_Qasim_Revolution_desc: "自由军官组织接管了国家。哈希姆王朝在一夜之间化为历史名词。"
 IRQ_Peoples_Tribunal: "人民法庭"
 IRQ_Peoples_Tribunal_desc: "革命法庭开审王朝的旧臣。有人被枪决，有人坐牢，更多的人交出财产后销声匿迹。"
 IRQ_Republican_Army: "整编共和国陆军"
 IRQ_Republican_Army_desc: "旧军队的番号被打乱重编，可疑的军官被勒令退役。人民民兵在街头与营房之间来回巡逻。"
 IRQ_Oil_Sovereignty: "石油主权之争"
 IRQ_Oil_Sovereignty_desc: "伊拉克石油公司的合同摊在革命委员会的桌上。国有化、分成还是驱逐，三种声音吵成一片。"
 IRQ_ASU_Founding: "成立阿拉伯社会主义联盟"
 IRQ_ASU_Founding_desc: "卡塞姆把各左翼政党、工会和军官团代表请进同一间礼堂，宣布成立阿拉伯社会主义联盟。图章是新的，座位是抢出来的。"
 IRQ_Left_Unity: "左翼统一战线"
 IRQ_Left_Unity_desc: "共产党人、社会民主派和纳赛尔主义者在联盟的旗帜下勉强同桌。共同的敌人刚死，共同的路线还没找到。"
 IRQ_Workers_Militia: "工人民兵"
 IRQ_Workers_Militia_desc: "联盟把武器发给工会纠察队。将军们皱眉，工厂主们逃亡，街头的秩序第一次属于穿工装的人。"
 IRQ_Internationalist_Course: "加入国际大家庭"
 IRQ_Internationalist_Course_desc: "巴格达的新主人向第三国际递上申请书。莫斯科的贺电晚到了六个小时——它在等巴格达先向开罗表态。"
 IRQ_Peoples_Democracy: "人民民主阵线"
 IRQ_Peoples_Democracy_desc: "未遂政变之后，共产党成了共和国唯一的 organizing 力量。军官委员会被改组，农民协会接管了乡村。"
 IRQ_Party_State: "党国体制"
 IRQ_Party_State_desc: "党的支部建进每一个村庄和兵营。干部们背诵新宪法，宪法的第一条写着党的领导。"
 IRQ_Planned_Economy_Start: "计划经济起步"
 IRQ_Planned_Economy_Start_desc: "第一个五年计划把石油收入钉进账目。工程师不够，报表来凑。"
 IRQ_Arif_Purge: "阿里夫清洗"
 IRQ_Arif_Purge_desc: "阿里夫的兵在凌晨包围了党的总部。口号从『人民』换成了『民族』只用了六个小时。"
 IRQ_Army_First: "军队至上"
 IRQ_Army_First_desc: "国家的一切为军队让路。将军们说这叫稳定，政治犯们说这叫另一座监狱。"
 IRQ_Neutral_Course: "不结盟路线"
 IRQ_Neutral_Course_desc: "阿里夫拒绝莫斯科的条约，也拒绝第三国际的援助。『伊拉克人的伊拉克』成了唯一的国策。"
 IRQ_Old_Elites_Return: "旧精英回朝"
 IRQ_Old_Elites_Return_desc: "盖拉尼带着旧共和派和部族长老进入巴格达。王朝死了，王朝的人事档案还活着。"
 IRQ_Moscow_Station: "莫斯科的经停站"
 IRQ_Moscow_Station_desc: "盖拉尼在起义的旧旗上缝上了新里子：俄国顾问、俄国军械、俄国贷款。老起义者的新主人。"
 IRQ_talal: "塔拉勒王储"
 IRQ_nuri_as_said: "努里·赛义德"
 IRQ_jamil_al_midfai: "贾米勒·米德法伊"
 IRQ_hamdi_al_pachachi: "哈姆迪·帕查奇"
 IRQ_rashid_ali_algaylani: "拉希德·阿里·盖拉尼"
 IRQ_abdullah: "阿卜杜拉一世"
 IRQ_ali_abn_hussein: "阿里·本·侯赛因"
 IRQ_abd_almalik_ibn_hisham: "阿卜杜勒-马利克·伊本·希沙姆"
 IRQ_fahmi_said: "法赫米·赛义德"
 IRQ_taha_al_ahmani: "塔哈·艾哈迈尼"
 IRQ_bakr_sidqi: "贝克尔·西德基"
 IRQ_ali_mahmud_al_shaykh: "阿里·马哈茂德·谢赫"
 IRQ_iskandar_al_shami: "伊斯坎德尔·沙米"
 IRQ_abdullah_al_tell: "阿卜杜拉·特尔"
 IRQ_mustafa_al_quidsi: "穆斯塔法·古德西"
 IRQ_khaled_al_dalabeeh: "哈立德·达拉比"
 IRQ_ali_ben_jawad: "阿里·本·贾瓦德"
 IRQ_fawsi_al_kaukji: "法齐·卡伍吉"
 IRQ_abd_al_karim_qasim: "阿卜杜勒-卡里姆·卡塞姆"
 IRQ_abd_al_salam_arif: "阿卜杜勒·萨拉姆·阿里夫"
 IRQ_yusuf_salman_yusuf: "优素福·萨尔曼·优素福"
 IRQ_abdullah_desc: "伊拉克国王，哈希姆家族在两河的开国之君。汉志老王侯赛因的次子，大起义的老兵——按家族当年的分工，叙利亚归三弟费萨尔，两河归他。他在巴格达的王座上坐了四分之一个世纪：送走了垮台的德国金主，看着粮价起落、议会空转、军团里的年轻人眼睛越来越亮。他老了，可家族的事业还没有完。"
 IRQ_talal_desc: "伊拉克王储，阿卜杜拉一世的长子。体弱、敏感、寡言，在柏林养病求学的岁月里读了两边都不讨好的书——宫廷嫌他软弱，军团当他透明，而他安静地等着一个证明自己的机会。"
 IRQ_rashid_ali_algaylani_desc: "一九四一年起义的领袖，半生流亡，老了以后决定回来收账。"
 IRQ_abd_al_karim_qasim_desc: "自由军官组织首领，革命的执行者。『唯一的领袖』——至少纸面上是。"
 IRQ_abd_al_karim_qasim_desc2: "整合各左翼力量后的卡塞姆：军装外面套着社会主义者的纲领。"
 IRQ_abd_al_salam_arif_desc: "泛阿拉伯主义的激进军官，相信军队、口号和自己的直觉。"
 IRQ_yusuf_salman_yusuf_desc: "人称法赫德。共产党总书记，坐过王朝的牢，也坐过流亡的冷板凳。"
 TNW_IRQ_development_board: "石油发展委员会"
 TNW_IRQ_development_board_desc: "石油收入的每一个第纳尔都要花在工地上。"
 IRQ_arab_socialist_union: "阿拉伯社会主义联盟"
 IRQ_arab_socialist_union_desc: "军队、工会与左翼政党的不稳定联姻，目前还在一起生活。"
 IRQ_event.1.t: "卡塞姆革命"
 IRQ_event.1.d: "一月的一个阴冷清晨，正在换防名义下开进巴格达的第十九旅没有去靶场。卡塞姆上校和阿里夫中校的吉普直接停在了国防部大楼门前，哨兵认出了他们，没有人开枪。电台在一小时内易手，拉希德街的兵营相继倒戈，王宫卫队长在电话里只说了一句：『我们不出门。』正午，广播里宣读了自由军官组织的第一份公报：哈希姆王朝的腐败统治结束了，伊拉克共和国成立。国王和亲王在出逃的路上被巡逻队截住，枪声很短。努里·赛义德的消息第二天才传来，有人说他化装混出了城，也有人说尸体已经在河边认领。街上有年轻人朝天上放枪，也有老店主默默把王室照片从橱窗里摘下来，收进抽屉最深处。伦敦、莫斯科和开罗在同一天夜里亮着灯。没有欢呼的胜利是不寻常的。军官们原以为要打巷战，弹药箱在国防部院子里堆了一整夜没有打开。外国记者问卡塞姆将军是否会审判王室，他把问题递给了身边的阿里夫；阿里夫笑着说，历史已经审判过了。傍晚的巴格达出奇地安静，只有河面上拖船的汽笛照常响起，仿佛这个国家只是换了一面旗，明天还要上班。"
 IRQ_event.1.a: "军队接管了国家。"
 IRQ_event.2.t: "共和国的方向"
 IRQ_event.2.d_asu: "革命委员会的会议室里，卡塞姆做了一件所有人都没料到的事：他把共产党代表团、工会领袖、独立左翼军官和几个社会民主党人请到同一张桌子前，宣布各派别并入一个统一的阿拉伯社会主义联盟。他说军队是人民的军队，石油是人民的石油，剩下的问题只是谁先承认这一点。共产党代表在协议上签字时要求保留自己的报纸，卡塞姆批了，还多给了纸张配给。外国使馆的报告写着同一句话：巴格达的新政权既不完全听开罗的，也不完全听莫斯科的，但肯定不再听旧金主的。第三国际的总书记处连夜开了会，决定给这个不走常规路线的学生递上一把椅子。联盟的第一次全体会议开了九个小时。共产党要求土地改革立刻上马，纳赛尔派要求先和开罗合并，工会的人只关心八小时工作制。卡塞姆坐在主席位上听完所有人的话，最后只拍板了一件事：联盟的军徽和党徽并用。散会时有人听见他嘀咕，说这比打仗难多了。莫斯科的观察员在报告里写道：这是一个还不知道自己要去哪里的政权，但它愿意朝我们这边看。"
 IRQ_event.2.d_communist: "阿里夫的政变只撑了六个小时。他调动的两个营还没出营房就散了架——电话总机的接线员把每一道调动命令都抄送给了党的办公桌。政变失败当夜，革命委员会里的共产党人不再是客人：党的干部从监狱和地下印刷所里走出来，接管了内政部、宣传部和每一个关键省份的省长办公室。优素福·萨尔曼·优素福——党内的同志都叫他法赫德——从藏身的寓所走进宣传部大楼时，走廊里的年轻军官向他敬礼，敬得笨拙而真诚。卡塞姆保留了一个名义上的国防委员会，所有人都明白那是给历史看的摆设。莫斯科发来贺电，字里行间是长辈式的满意。接管后的第一个星期，巴格达经历了奇怪的平静：粮价被党的物价小组压了下去，晚报开始连载苏联小说，清真寺照常礼拜——党在第一号通告里谨慎地写着宗教信仰自由。军官们私下议论，说革命被偷走了；工人们私下议论，说革命终于来了。法赫德本人在讲话里留了一句余地：共和国的旗帜上有伊拉克的颜色。莫斯科的顾问们还没到，先到的是成箱的理论著作和印刷机。"
 IRQ_event.2.d_arif: "卡塞姆以为清算了王朝就清算了危险，阿里夫用刺刀纠正了他。政变发生在一个星期四的凌晨，忠于阿里夫的部队封锁了国防部和电台，把卡塞姆和他的参谋们按在办公室的椅子上签字。随后是雷厉风行的清洗：人民民兵被缴械，共产党的报纸停刊，几个部长在逃跑途中被截回。阿里夫在电台里说得直白：军队是国家的脊梁，谁也别想把政治塞进兵营。他拒绝了莫斯科的条约草案，也冷淡地打发走伦敦的特使，把『伊拉克人的伊拉克』写进新宪法第一条。将军们满意了，街上的报纸零售商们发现，能卖的版面少了一半。阿里夫的统治从第一天起就带着军营的味道：五点半起床号通过电台向全国播放，内阁会议穿着军装开，部长们的任命令用公报体发布。他喜欢在演讲里引用诗句，也从不在乎引用得对不对。美国人和俄国人轮流来试探，他给两边的回答一模一样：伊拉克不欠谁的。亲信们说他夜里睡不着，反复念叨卡塞姆的名字；也有人说，他只是想念军营里的简单日子。至于被赶下台的老上司，他下令保留军衔，不许动一根头发。"
 IRQ_event.2.d_ghailani: "共和国的第二年，巴格达已经没人再提革命。粮价翻了两番，军官委员会在两年里换了四届主席，人民民兵和宪兵在街头互相搜查。就在所有人等着下一次政变的时候，一辆黑色的旧轿车穿过检查站，车里坐着拉希德·阿里·盖拉尼——一九四一年起义的领袖，流亡了半辈子的老人物。他带来了部族长老的联署、老共和派的拥戴，以及一份没人明说但所有人都知道的莫斯科背书。这一次没有流血：卡塞姆的卫队在最后一刻倒戈，老 人只对着电台说了一句话：『旧主子还没回来，我们先把自己人杀光了。』俄罗斯大使在第三天递交国书，随行清单里有军械和贷款。盖拉尼的政府像一件拼起来的旧袍子：部族长老、旧官僚、被清编的军官，各占一边袖子。他把石油谈判重新交回老手，把电台审查交给侄子。各国公使等着看笑话，俄国人等着看诚意。老人自己倒是不急，他每天照旧在老城做礼拜，对记者说：我这一辈子就做对了一件事——没有让外国的老爷们舒服过。至于莫斯科，他说，朋友就是朋友，主人不是主人。"
 IRQ_event.2.a: "革命指出了方向。"
 IRQ_event.3.t: "瓦特白起义"
 IRQ_event.3.d: "王国政府为了换取新贷款，承认了旧金主留下的一切债权，偿债时刻表见报当天，巴格达的学生走上了街头。商人和律师随后加入，抗议在三天里变成总罢工。警察开了枪，第一具尸体倒在拉希德街——恰恰以首相的家族命名。宫廷在电话里问：能不能谈？"
 IRQ_event.3.a: "镇压：秩序高于一切。"
 IRQ_event.3.b: "让步：宣布赖账缓偿。"
 IRQ_event.4.t: "远征军的账单"
 IRQ_event.4.d: "从巴勒斯坦回来的运输船靠岸了。棺材、伤员和欠饷一起下了船。军官们发现他们的伤亡换不来一枚像样的勋章，士兵们发现抚恤金还不够买一台收音机。军营里的怨气，比运送它们的咸水更难倒掉。"
 IRQ_event.4.a: "士兵们的信写进了档案。"
 IRQ_event.5.t: "法赫德落网"
 IRQ_event.5.d: "特务们在卡拉达区的一间地下室里逮住了共产党政治局。总书记法赫德藏得最深，还是没能逃过名单。报纸只登了一行小字，但每一个地下支部都记住了这一天。王朝的监狱再一次变得拥挤。"
 IRQ_event.5.a: "名单上还有更多名字。"
 IRQ_news.1.t: "巴格达政变"
 IRQ_news.1.d: "巴格达来电：伊拉克军队今日拂晓接管首都，哈希姆王朝统治结束。以卡塞姆上校为首的军官委员会宣布成立共和国，王室成员下落不明。各国使馆正紧急评估这一变故对中东石油与同盟体系的影响。"
 IRQ_news.1.a: "中东变天了。"
