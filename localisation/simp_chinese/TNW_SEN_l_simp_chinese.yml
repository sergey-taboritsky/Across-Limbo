 TNW_SEN_Lamine_Gueye_desc:0 "圣路易出身的混血律师，法国社会党塞内加尔支部的创始人，法兰西国民议会与共和国议会里塞内加尔的第一声嗓音，达喀尔市的现任市长。他相信通往解放的路要用法语、经由巴黎的议会走廊来走——这条路线在左翼内部同样不乏论敌。"
