l_simp_chinese:
 TNW_straits_news.1.t: "君士坦丁堡海峡危机"
 TNW_straits_news.1.d: "莫斯科发表措辞强硬的声明：俄罗斯绝不承认希腊与土耳其两个社会主义政权对爱琴海的非法封锁，要求两国立即开放海域、恢复通航。声明同时宣布，俄罗斯将向塞萨洛尼基周边的希腊白军游击队提供全面支援。地中海的空气骤然紧张起来。"
 TNW_straits_news.1.a: "密切关注事态发展。"
 TNW_straits_news.2.t: "海峡危机结束，希腊分裂"
 TNW_straits_news.2.d: "在莫斯科与伦敦、巴黎的来回电报之后，妥协方案落笔签字：社会主义希腊割让马其顿、伊庇鲁斯与色萨利一线五州，希腊王国临时政府在建有拜占庭城墙的塞萨洛尼基宣告成立。爱琴海重新对俄罗斯商船开放，白军游击队放下了枪，领了新政府的委任状。"
 TNW_straits_news.2.a: "和平——至少是纸面上的。"
 TNW_straits_news.3.t: "海峡危机结束，俄军进入雅典"
 TNW_straits_news.3.d: "调停破裂后，俄罗斯志愿军越过保加利亚边境开进希腊北部，雅典未做任何有效抵抗。希腊王国摄政委员会在卫城脚下宣誓就职，大陆各州与爱奥尼亚群岛尽数归入临时政府治下。社会主义希腊的政府机关南撤，以克里特为新的首都，继续控制北爱琴与基克拉泽群岛。红旗没有降下，只是退到了海上。"
 TNW_straits_news.3.a: "巴尔干的火药桶又响了一声。"
