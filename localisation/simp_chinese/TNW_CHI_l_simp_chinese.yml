 CHI_Stabilize_Nanyang: "稳定南洋"
 CHI_Stabilize_Nanyang_desc: "先前国府因华北战乱而颜面扫地之时，无论赤逆如何来势汹汹，星洲作为我三民主义同路人仍坚定支持国府讨逆。如今赤逆既平，国府自当奖赏其忠心，向南洋增派国军，以提供其最为急需的安全保障。此外，星洲与中国的特殊关系也理应得到一纸条约正式承认。自星洲始，我方影响力将不局限于中原一隅，而能够经由南洋传遍四方。"
 CHI_Reorganize_Nanyang: "重塑南洋政权"
 CHI_Reorganize_Nanyang_desc: "先前大战之中，南洋星洲政权曾全力支持桂匪政权，如今桂匪失势，星洲政权不稳，是时候报一箭之仇了。应当于星洲复制国内之胜利，命南洋民主劳动党发动各民族工农齐进军，将星洲国民党打翻在地方可算做胜利。\n\n当然，若星洲进展不顺，我们总有另一条路可选......"
