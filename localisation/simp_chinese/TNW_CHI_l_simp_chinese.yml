 CHI_news_event.7.t: "朝鲜战争"
 CHI_news_event.7.d: "随着朝鲜国与大韩民国之间的矛盾日渐加深，双方陈兵数十万对峙的边境线上终于擦枪走火。据悉，朝韩两国已经正式开启全面战争，并分别表示己方将“完成半岛统一的历史大业”。\n\n由于朝韩双方与俄罗斯和第三国际分别具有众所周知的紧密联系，据预测这场战争的影响或许将迅速外溢。同样处于分裂中的中国和日本各政府已经开始动员军队，准备驰援其盟友。"
 CHI_news_event.7.a: "亚洲何时能够太平呢？"
 CHI_news_event.8.t: "日本内战"
 CHI_news_event.8.d: "在北日本-俄国安保条约引发危机以来，南方政权便紧盯其对手的政局变化，伺机而动。如今，随着北日本境内出现大规模动乱，南方军队已经挥师北上，准备完成日本统一。\n\n俄国对此反应剧烈，西伯利亚的大批俄军部队已经开始向北海道岛集结，随时准备南下干预。与此同时，南日本的战略盟友——汉城与南京则也加强了军事动员。或许，这场内战将会演变成规模远超想象的庞大战争。"
 CHI_news_event.8.a: "亚洲何时能够太平呢？"
 CHI_news_event.9.t: "大亚洲战争"
 CHI_news_event.9.d: "起源于中日韩三国的内战如今已经外溢为包含大半个亚洲的大规模全面战争。俄国支持的奉天-平壤-仙台政权与印度集团达成同盟，尝试南北两线夹击亲第三国际的南京-首尔-东京集团，而国际势力则在西亚、马来群岛等方向上予以回击。\n\n巴黎和底特律已经互相放下成见，共同支持其亚洲盟国，而俄罗斯则再次开动其二战期间建设的庞大军工体系向外输出物资。按最悲观的假设，或许第三次世界大战已经在路上了。"
 CHI_news_event.9.a: "这是世界大战的先声吗？"

