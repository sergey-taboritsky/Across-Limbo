#事件
 CHI_event.10.t: "华北行辕的终局"
 CHI_event.10.d: "依据《国忌日协定》残存的妥协条款，华北行辕于今日正式撤销建制：华北各省的民政权力移交华北人民政府，行辕治下的军政机构就地解散。北平方面在通电中重申华北“仍为中华民国不可分割之地方政权”，仍将承认南京的法统地位。\n\n但没有谁真的相信这套说辞。南京的军队没有被允许北上接收防务，而华北人民政府的部队则稳步开进行辕旧辖各省。名义上的隶属关系仍在，实质上的南北分治已经完成——长江以北，如今只听北平的号令。"
 CHI_event.10.a: "至少，他们还没有撕破脸。"
 CHI_event.11.t: "分崩离析"
 CHI_event.11.d: "华北事变的余波尚未平息，地方实力派们已经做出了各自的选择。短短数日之内，西北、西南、蒙古与满洲的督军、主席与王公们相继通电全国，宣布地方“自治”，中止对南京的一切钱粮与兵员解送。\n\n中华民国中央政权的政令，一夜之间退出了大半个中国。勉强握在南京手里的，只剩东南的几个富裕省份，与一支派系庞杂的国军。"
 CHI_event.11.a: "树倒猢狲散。"
 CHI_event.12.t: "中原大战"
 CHI_event.12.d: "华北人民政府今日正式宣布与南京国民政府决裂：北平方面通电全国，指责南京政权“纵容党阀、背弃宪政、出卖抗战死难者之遗志”，并已下达总动员令，人民军各纵队正沿津浦、平汉两线南下。\n\n南京方面随即宣布华北“叛乱”，勒令各省勤王。自1930年以来的第二次中原大战，就此爆发。这一次，再没有任何调停人能挡在两府之间。"
 CHI_event.12.a: "誓死保卫民国法统！"
 CHI_event.13.t: "华北的崩溃"
 CHI_event.13.d: "开战至今已满三个月，战线却在华北平原上彻底凝固：人民军渡不过黄河，国军也无力北上。但僵局对双方的消耗从来不是对称的——华北的财政与兵源已然枯竭，观望的地方实力派不再掩饰他们的讥笑，而南京的背后还站着大洋彼岸的物资。\n\n今日，北平方面终于放出试探：华北人民政府愿意无条件停火，接受南京的全部条件，只求保留诸公的身家性命。"
 CHI_event.13.a: "接受和平，接受统一。"

 CHI_news_event.1.t: "中原大战爆发"
 CHI_news_event.1.d: "华北人民政府今日正式对南京宣战，中国自1946年以来的政治危机以全面内战的形式总爆发。北平与南京两府的军队正在中原大地上相对而进，曾宣布自治的各省则纷纷作壁上观。\n\n这场战争的胜负，将决定此后数十年东亚的秩序。"
 CHI_news_event.1.a: "民国到了最危险的时候。"
 CHI_news_event.1.b: "中国与内战，真是一对毫不奇怪的搭配。"
 CHI_news_event.2.t: "中原大战落幕"
 CHI_news_event.2.d: "持续数月的中原大战终于分出了胜负。[winning_country.GetNameDef]的军队已取得决定性胜利，战败方已接受无条件停战，中国内战至此告一段落。\n\n无论各方愿意与否，中国的未来都将由这场战争的赢家来书写。"
 CHI_news_event.2.a: "中原已定。"
 CHI_news_event.2.b: "中国的命运已经揭晓。"
 CHI_news_event.3.t: "华北崩溃，南北重归一统"
 CHI_news_event.3.d: "在三个月的僵持之后，华北人民政府终究支撑不住：北平方面宣布无条件停火，接受南京的全部和平条件。南京国民政府的军队将开进华北各地，曾宣布自治的各省政权也将重新回到民国的旗帜之下——唯有满洲与新疆例外，它们将继续保持自己的道路。"
 CHI_news_event.3.a: "统一大业，终成于此。"
 CHI_news_event.3.b: "中国重新统一了。"

