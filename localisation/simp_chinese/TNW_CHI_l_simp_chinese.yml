 CHI_army_faction_1_tt: "钢军 - 保定系（[?TNWCHI_army_faction_baoding_var]%）"
 CHI_army_faction_1_delayed_tt: "国民革命军的中坚派系，主要由夏威的第七军发展而来。自1927年以来，第七军作为李宗仁麾下王牌部队，受到重点培养，不断吸纳各地的保定生加入，实力不断得到扩充。其军官将佐受宠，不断升职，在抗战中在各地独当一面。该系虽以受过军事教育的保定生为中心，但因长期居于军内优势地位，且主要将佐已届老年，对军事改革的重要性虽心知肚明，但多加反对。\n\n该系是黄绍竑的重要政治盟友，实力雄厚，但正面临其他派系的围攻。\n\n技术兵器改革（-[?TNWCHI_army_faction_baoding_var]d）\n官佐素质改革（+[?TNWCHI_army_faction_baoding_var]d）\n卫生勤务改革（+[?TNWCHI_army_faction_baoding_var]d）\n尖端作战改革（+[?TNWCHI_army_faction_baoding_var]d）\n结构改革改革（-[?TNWCHI_army_faction_baoding_var]d）"
 CHI_army_faction_2_tt: "钢军 - 黄埔系（[?TNWCHI_army_faction_whampoa_var]%）"
 CHI_army_faction_2_delayed_tt: "国民革命军的次要派系，主要由黄埔学员发展而来。虽然黄埔军校于1924年开办之后，就作为国民革命军主要的军事院校，但由于国民党长期的内斗与黄埔军人的政治属性，黄埔军人不受以保定军人为主的国内主流军系欢迎，迫使大量人物投奔民主劳动党或中共。直到1933年以后，在甘丽初等黄埔一期广西军官的管理下，黄埔系逐步开始复兴。在抗战中，黄埔健儿表现出了远比保定军官更强的灵活性和韧性，从而在战时异军突起。他们大力支持军事改革，但是因为保定军官长期掌握重要的上升渠道和位置，他们更愿意先扫干净屋子再请客。\n\n技术兵器改革（+[?TNWCHI_army_faction_whampoa_var]d）\n官佐素质改革（-[?TNWCHI_army_faction_whampoa_var]d）\n卫生勤务改革（-[?TNWCHI_army_faction_whampoa_var]d）\n尖端作战改革（-[?TNWCHI_army_faction_whampoa_var]d）\n结构改革改革（+[?TNWCHI_army_faction_whampoa_var]d）"
 CHI_army_faction_3_tt: "桂系（[?TNWCHI_army_faction_guangxi_var]%）"
 CHI_army_faction_3_delayed_tt: "国民革命军的次要派系，主要由国军高级军官中的广西人组成。作为当代中国政坛上的主角群体，即使李宗仁，黄绍竑等强调消除畛域之分，促进国家统一，但正所谓举贤不避亲，和李黄白有特殊关系的广西人因国民党政权的发展巩固而大量涌入政府与军队，成为中华民国的支柱。但比起有技术优势的保定系军官或有意识形态优势的黄埔系军官，广西将领们的素质和能力实在是不够看。于是广西将领们死守着自己的一亩三分地，掌握着军政，警宪事务不放，并竭力参与各种政治事务，以延续自己作为派系的存在。\n\n该系虽小，对军务干涉不多，但掌握着大量隐秘方面的资源，有超乎想象的能量。\n\n技术兵器改革（-[?TNWCHI_army_faction_guangxi_var]d）\n官佐素质改革（+[?TNWCHI_army_faction_guangxi_var]d）\n卫生勤务改革（+[?TNWCHI_army_faction_guangxi_var]d）\n尖端作战改革（+[?TNWCHI_army_faction_guangxi_var]d）\n结构改革改革（-[?TNWCHI_army_faction_guangxi_var]d）"
 CHI_army_faction_4_tt: "设计系（[?TNWCHI_army_faction_designer_var]%）"
 CHI_army_faction_4_delayed_tt: "国民革命军的次要派系，主要由韦永成的第四十八军发展而来。韦永成是李宗仁弟李宗义的妻弟，曾先赴法，后赴德留学，并在德国入军事院校进行学习。在抗战中，被安排为苏祖馨的副手，后升任为军长。在军长任上，韦逐步聚拢了一批新潮军人，建立了军政部技术设计委员会，号召拥护李宗仁，通过建成总动员国家，通过抗战绩效来凝聚各派，而非通过战时行宪来饮鸩止渴。抗战以后，这一派人员普遍更进一步，实际掌握了参谋本部和几个新锐美械部队。\n\n设计系对军事改革十分狂热，只是苦于军中乱斗，只要谁能稳定军内，他们就会拥护谁。\n\n技术兵器改革（-[?TNWCHI_army_faction_designer_var]d）\n官佐素质改革（-[?TNWCHI_army_faction_designer_var]d）\n卫生勤务改革（-[?TNWCHI_army_faction_designer_var]d）\n尖端作战改革（-[?TNWCHI_army_faction_designer_var]d）\n结构改革改革（-[?TNWCHI_army_faction_designer_var]d）"
