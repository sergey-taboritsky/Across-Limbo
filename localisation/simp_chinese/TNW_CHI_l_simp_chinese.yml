#民族精神
 TNW_CHI_national_armed_forces: "中华民国国军"
 TNW_CHI_national_armed_forces_desc: "中华民国国军起源于国民革命军，它于珠江畔的黄埔怒涛中崛起，既继承了保定风骨而苦进兵学，又发扬本党主义来救国救民，从而能扫荡反动军阀，实现护党救国，保卫民主宪政。神圣抗日战争爆发后，在李宗仁、何成濬等国军将领的指挥下，更是能以白梃以挞日寇之坚甲利兵，在困境中不断精进国军，终使日寇屈服于中美同盟之下，达成国家之统一，民族之复兴。历尽艰难险阻，保定军人和后继受保定模式培养出的黄埔军人们掌握了中华民国国军，带领中国军队完成自1912年以来未尽的军事现代化大业。"
 TNW_CHI_state_of_economy: "国家经济状态"
 TNW_CHI_constitutional_transition: "宪政过渡期"
 TNW_CHI_constitutional_transition_desc: "随着1944年战时行宪共识的达成，以及1946年国民政府还都南京，宪政进程迈入了一个崭新的阶段。国民大会已完成选举，各省市的宣传报道争前恐后，风波之强空前绝后，倪文亚甚至在发布会上笑着表示这是一场深刻的革命。当新闻记者追问革谁的命时，他当即回复国民政府即将“革了自己的命”。然而，以选举立法委员、省长乃至中华民国总统为核心的各方派系，正争分夺秒地进行着紧张的政治妥协与交易。与此同时，长期存在的国共合作与异军突起的工团党、民主党，面对原本有限的政治资源瞬间扩大，正想尽一切办法进行瓜分与吞噬。前汪派、前白崇禧派，乃至江西的熊式辉、新进的甘乃光等人，都无时无刻不贪婪地觊觎着政府即将的重组，伺机而动。同时，作为既有政权的组织者，黄绍竑在联合基础的问题上犹豫不决——究竟以谁为依托，方能令世人觉得新政府焕然一新，而非延续过去十年来被外界讥讽为“广西军政府”的旧貌。正因如此，新一届政府显得尤为关键，其构成与动向，吸引了举国上下的目光……"
 TNW_CHI_untamed_kuomintang: "国民党：党员，党阀与党争"
 TNW_CHI_untamed_kuomintang_desc: "国民党之特色即派系代理政治。在长达十八载的李汪斗争当中，双方为了自己的利益，放任乃至资助党内有利于自己的山头势力的形成。李宗仁资助甘乃光重回政坛，以争夺民众运动。汪精卫与王公度眉来眼去，以离间北平与南京。多年来，党内各山头势力和国民政府政权内部所衍生的宗派主义，才是有志于上升之梯的国民党人们从事政治竞争的主要凭借。当然，这些派系也就居间拓展了个别的团体与私人利益，并且进一步扮演了国民党在各个统治领域中的主要代理人角色。\n\n汪精卫于1945年在昆明逝世后，真可谓树倒猢狲散，支持李宗仁的派系终于统治了全党，最终支持他实现战时行宪，确立其中国辛辛纳图斯的地位。但国民党并未如李宗仁设想那样驯服顺从，回归平静，各派系虽无挑战其最高地位之野心，但已形成自己的党阀割据与混战模式，在宪政的新形势下，权力的争夺与分配前所未有的风起云涌。"
 TNW_CHI_april_accords: "国忌日协定"
 TNW_CHI_april_accords_desc: "1944年底宣布战时行宪后，国共两党与民主劳动党代表在重庆展开谈判，于国父逝世二十周年之国忌日形成协定。当中最重要的是，国共两党承认民主劳动党，不再将其成员视为叛党而追捕通缉，并承认民主劳动党在华北所建立政权，但华北之省县级政府在抗战结束后需服从中央政府。国忌日协定作为一个会议纪要，虽然长期被赋予了规范民劳与政府间关系的特殊意义，但是随着宪政实施，双方在华北政权前途上矛盾日深，提出既通过大法官会议释宪，打破民劳在华北的省宪与政权的合法性，又通过解散各行辕，配置国军进入华北之政治，军事手段相互配合的建议以彻底降伏民主劳动党的声音正喧嚣尘上。"
 TNW_CHI_leftists_split: "中国左翼的分裂"
 TNW_CHI_leftists_split_desc: ""
 TNW_CHI_stalled_talks_with_russia: "搁置中的中俄谈判"
 TNW_CHI_stalled_talks_with_russia_desc: "1946年底，俄罗斯出乎意料的出兵中国东北与内蒙，在两个月内横扫日军。如何与不请自来的俄国熊共同处理日本及其帝国，成为了中美与俄国之间的讨论焦点。1947年初，双方初步形成了承认韩国独立，尊重中国在满洲和内蒙的主权，俄国撤往沈阳以北，允许国民政府派员进入建立政府的协定。\n\n但1947年3月，日本突然向俄国投降，加入俄国阵营，随后爆发俄美之间的东京会战，与俄国之间的谈判就此告终，对辽宁、热河外的其他东北省份的改组也被迫结束。目前，虽然日本列岛已经停火，但是因应俄军压力而仓皇设立的各行辕政务委员会已成为酝酿着赤化和分离的独立王国。恢复中俄间的谈判已迫在眉睫，不解决俄国问题，无从在军事和政治上解决他们。"
 TNW_CHI_economic_ruin_countdown: "经济崩溃倒计时"
 TNW_CHI_economic_ruin_countdown_desc: ""
 
