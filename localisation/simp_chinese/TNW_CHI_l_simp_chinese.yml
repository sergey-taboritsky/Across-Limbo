l_simp_chinese:
#介绍
 TNW_welcome_CHI_intro_text_1: "1927年3月，正因北伐东路军的“清党”行动而日益分裂的武汉国民政府收到了晴天霹雳般地噩耗：德属东亚干涉军已在上海登陆，并与东路军发生激烈交火，总司令蒋介石在战斗中当场身亡。顿时，国民党内部一片混乱。德意志帝国是全球霸主，无可匹敌的世界帝国，而国民革命军纵有钢铁般的意志，却实在无法与如此强敌作战。最终，北伐军撤离江浙，向北的攻势也暂时停止，全中国的目光都放在了上海飘扬的黑白红旗上。\n\n就在这一时刻，桂军出身的李宗仁察觉到了国民政府的妥协与脆弱。在他的指导下，第七军迅速进入武汉，国民政府主席汪精卫被驱逐，他自封北伐军临时总司令。同时，在日本的帮助下，李宗仁指挥北伐军与奉系达成停火，德军也随之逐渐撤出。\n\n然而，国民大革命的另一位参与者——中国共产党，并未选择追随李宗仁，而是逐渐与黄埔军校内的左翼将官合流，推邓演达为国民革命军总司令，并在广州迎回汪精卫。自此，“粤汉对峙”彻底撕裂了国民党的左右两翼。德军一经撤离，北伐军便再次展开行动，粤府军队向福建进发，最终夺取浙江，而汉府则顺江东下再度攻克南京。\n\n就在此时，湖南农军不满国民党的征收政策，发动暴乱。以此为导火索，粤汉战争似乎一触即发。不过，汪精卫与李宗仁最终达成妥协，进行清党但同时保留国共合作，只将党内分歧归咎于临时行动委员会。最终，勉强达成统一的国民政府于1930年促成东北易帜，同时形成了国内四个大型军事集团——桂军，粤军，奉鲁军与晋军。"
 TNW_welcome_CHI_intro_text_2: "1931年，以长江大水为契机，国民政府迁往南京。此时的国民政府以胡汉民为主席，汪精卫为党主席，而李宗仁与桂系则掌握湖北与安徽等地省政，专心地方治理。同时，党内也与临时行动委员会分子暂时和解。汪精卫通过与中国共产党加强合作，不断强化国民党的基层组织，以期形成牢固的党国体制。这一时期，中国共产党迎来飞速发展，但同时无政府工团主义者与部分工会活动家从党内出走，效仿西欧建立中国工团主义者联盟。\n\n一切美好幻想均在1933年化为泡影。日本侵略东三省，制造了骇人听闻的“满洲事变”，而汪精卫主席只得坐视不管，最终在民怨沸腾中胡汉民支持桂系军队发动兵谏，汪氏黯然下台。随后，为统合党内，邓演达与孙科组建了一个大帐篷政府，国民党几乎全部派系均得以参与。不过，随着邓演达尝试联络中共和中工盟实行激进社会主义改革，党内右派再次出手，引来桂系军队推翻并杀死邓演达，而一切左翼政党均被宣布非法。左翼黄埔系军官与临时行动委员会共同出走，成立中国民主劳动党，与共产党一起进入武装割据状态，同时再度于广州推举汪精卫另立国民党中央。自此，建立党国的一切努力宣告失败，而赤白对立则随着汪桂内战的余波扩散到全国。"
 TNW_welcome_CHI_intro_text_3: "1936年胡汉民逝世后，面对国防危机和已经崩溃的党国体制，桂系尝试建设一个凝聚各派系实力的非党举国一致国民政府，放弃国民党既有的党治训政思路，以凝聚实力。通过剿匪军事，桂系与杨永泰合作，逐步架空各地省政府与理论上监督的党部，代之以战地行政；逐步在制度层面上放弃国民党一党专政，多次重组国民政府，修订国民政府组织法，并逐步与赤方进行和谈，允许赤方在一些非战地的省份选出代表，进入当地政府。\n\n同样是这段时期，因为桂系对日妥协以及党国体系崩坏，中共与中国民主劳动党迎來新发展。中国民主劳动党右派通过接受来自日本的援助，建立了较为强大的武力。相反，中共拒绝了来自日本的援助，但同样建立起小而精锐的武装力量。\n\n1937年，在桂系和汪精卫和解後，以汪精卫为担保人，中共率先完成与南京国民政府的和解。1938年，中国民主劳动党同样达成和解，回归国民党。1938年，经过长时间意见收集后的民二十七年宪草发布，并计划于1939年首次进行全国大选，选出制宪国民大会。"
 TNW_welcome_CHI_intro_text_4: "1939年，就在宪政即将实现的紧要关头，日本发动全面南侵，迅速占领了东部广大地区。雪上加霜的是，1941年，前民主劳动党右派与国民政府部分高官公开投日，在南京建立伪国民政府，举国哗然。同时，民主劳动党左翼放弃与桂系的和解，脱离国民党，转而与中国共产党北方局达成进一步合作。民主劳动党掌握了华北行辕的名义领导权，而华北游击队则多半加入中国共产党，双方在行辕下成立联合政府，通过华北人民代表会议选出南京体系之外的省长与代表。\n\n迁往武汉的国民政府同样没有放弃行宪。1944年，战时制宪国民大会在华北代表缺席的情况下召开，制定出一部代议制与地方分权为主要纲领的宪法。次年，由于日本占领区不断萎缩，武汉宣布战时行宪，但首届选举将在战后局势稳定之时举行。\n\n1946年，随着美俄联军全歼日本在亚洲大陆上的军队，对中华民国而言，战争正式结束了。不过，满目疮痍的中华大地仍有许多悬而未决的疑案：华北人民代表会议是否合法？东北的奉军与俄军能否安于现状？宪政时期桂系的权力又该如何行使？一切仿佛都是未知数。"

