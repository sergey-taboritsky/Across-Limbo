 CHI_civil_war_preparation_decision_category: "风暴前夜"
 CHI_civil_war_preparation_decision_category_desc: "1946年5月，中国国民党第六次全国代表大会在南京举行。这本应成为抗日战争胜利后国民党走向新篇章的钟声，但如今，它或许已经成为我们的丧钟——孙科、李宗仁等党内非邓派的大佬们对其派系在中执委和中监委的席位占比表示强烈不满，进而开始否定整场会议的合法性。为了表面上“调和矛盾”，实则篡夺党内领导权，阎锡山提出举行包含国民党历届全会全部在世代表的“扩大会议”，以代替第六次大会的合法性。当然，这一饱含恶意的建议是我们不能忍受的，全国政治危机就此爆发。对此，宋主席在各势力间游走，期望各方保持冷静，而邓主席则联络可靠的盟友，防止最坏的结果发生时被打得措手不及。\n\n§Y两位主席的行动分别会拖延冲突最终爆发的时间以及加强国民政府对冲突的准备度。为了国民革命的未来，请务必做好应对最坏结果的万全准备。§!"
 CHI_civil_war_preparation_mission_decision: "国民党第七次全国代表大会"
 CHI_civil_war_preparation_mission_decision_desc: "当一切拖延手段均已失效，我们便别无选择，只能听从反对派的部分意见，宣布第六次大会结果无效并召开第七次大会。\n\n§R不过，倘若此举仍未起效，我们又该如何是好呢？§!"
 CHI_civil_war_preparation_name_opposition_delegates_decision: "任命反对派委员"
 CHI_civil_war_preparation_name_opposition_delegates_decision_desc: "中执委与中监委的部分席位总会出现空缺——代表患病，退休或亡故，意外随时可能发生。将其中几个空缺席位增补给政治反对派，或许能够暂时平息其愤怒。"

