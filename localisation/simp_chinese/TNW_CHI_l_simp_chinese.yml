#事件
 CHI_event.1.t: "广东省的新主席？"
 CHI_event.1.d: "国民革命的发源地，两次北伐期间国民政府的驻所广东，近期被又一场政治风波席卷全省。作为众所周知的左翼将领，广东省主席张发奎对南京国府的忠诚无人质疑，但他近期通电行政院，表示其被当地“赤党暴徒”污蔑为“有附逆之心”，并期望南京方面下达指令允许他清洗广东赤党。然而，中共、中工盟等诸多左翼友党均表示对此不知情，并请求国府不予干涉以保护广东党组织。\n\n完全听从张发奎的意见并无可能，在此紧要关头绝不能主动破坏党组织的基层力量。不过，有人提议张发奎应当被调往中央，前往军事委员会任职，以调和其与友党的关系。当然，我们也可以选择增派一小批部队前往张发奎手下任职，以期安抚其情绪。毕竟，讨要部队很可能就是他的本意。"
 CHI_event.1.a: "调任张发奎，广东省应选择他们自己的新主席。"
 CHI_event_1_a_tt: "§Y在国内紧张局势的影响下，广东省政局可能会进一步激进化§!"
 CHI_event.1.b: "多给他几个师，一切都会没事的。"
 CHI_event_1_b_tt: "§Y张发奎对南京的效忠无可动摇......但愿如此。§!"
 CHI_event.2.t: "意料之外的结果"
 CHI_event.2.d: "随着广东省举行省选，近期惹得前主席张发奎被调任的省内社会主义政党与工人运动似乎逐渐平静，其报告中罢工的工人、罢课的学生、罢市的商贩乃至哗变风险日增的兵士们也走向投票箱，选择了新的省主席。\n\n选举结果出乎意料之外，但又在情理之中。中工盟与国民党的两党元老，激进的社会主义者谭平山在暴涨的工农投票率下被选为新主席。他宣布将组建涵盖中共、中工盟、国民党在内的全左翼联合政府，致力扶助工农，并建设广东的社会主义经济。尽管本地企业主对此多有不满，但大多数广东民众已经接受了这一新领导人。"
 CHI_event.2.a: "情理之中，也是个不错的选择。"
 CHI_event.3.t: "两座京城，两场会议"
 CHI_event.3.d: "尽管中央一直期待党内团结能够随时间恢复，尤其是听从阎锡山的建议重新召开大会，但由于“扩大会议”一说实在荒谬而无法实行，反对派们仍对这次新会议采取彻底抵制的态度。如今，南京对这些反对声音的长期姑息已经引发事态进一步恶化：阎锡山、李宗仁、孙科等人已经在北平特别市举行另一场完全由其派系领导的对立会议，并宣布南京七大“非法”。\n\n此次事件后，中央必将颜面扫地，而地方各省军队已经出现不听指挥的现象。因此，绝不能放任事态进一步发展，必须抢在反对派造成更大破坏前扫清党内的右翼余毒与军阀主义倾向，将国家重新扭转到战后重建与建设的轨道上来。"
 CHI_event.3.a: "立刻！开除北平非法会议参与者的党籍！"
 CHI_event.4.t: "临界点"
 CHI_event.4.d: "晋逆与桂逆组织的北平的“国民政府”已经引发各省与各党内派系响应，叛乱爆发的瞬间，中央已经陷入被动。广西加入叛乱队伍早在预料之中，但何应钦在贵州、熊克武在川东响应叛乱直接切断了川滇两省与南京的陆地联系，而西安由于军事对峙态势紧张，暂时难以回援。现在，中央虽有基层党部与工农群众的广泛支持，但军队庞杂而互不统属，仅少部分军队拥有高水平战斗力，而北平方面则得到了桂军精锐支持。\n\n所幸，并非所有盟友都离我们而去。赤党执政的数个省份，包括江西与湖北，均表示将动员赤卫队与农民民兵支援中央，以缓解如今的人手不足问题。此外，尽管身处敌军包围之中，但四川省主席吴玉章也再次表示对中央的忠诚，以及中共方面对南京的全面支持。"
 CHI_event.4.a: "事已至此，别无出路。"
 CHI_event.5.t: "广东附逆！"
 CHI_event.5.d: "晋、桂逆叛乱以来，广东方向曾被认为有张发奎坐镇，必将万无一失。可是，省主席张发奎近日宣布南京为“非法独裁政府”，并引桂军进入广州。广东全省境内的基层党部与工会、农会成员正在遭遇屠杀，而粤、桂联军正沿粤汉线北上，企图占领湖南乃至湖北。失去国民革命的摇篮是对我方合法性的重大打击，而先前几乎从未设防的湘粤、闽粤边界如今则急需调动防卫部队。"
 CHI_event.5.a: "该死！"
 CHI_event.6.t: "广东革命！"
 CHI_event.6.d: "桂军向东开进的同时，粤军的数支部队也尝试着夺取广州城，投奔北平政府。可是，省主席谭平山已经依靠效忠于省政府的工人赤卫队击退了尝试政变的部队，而随后激动的工农群众则要求广东彻底扫清“资本主义与军阀成分”。应当地民众要求，谭平山已经宣布成立新政权“广东工农联合公社”，并宣布将优先铲除省内反动势力。中共与中工盟两党已经对该政权表示同情，但也再次声明将继续支持我方。"
 CHI_event.6.a: "至少比叛乱好些。"
 CHI_event.7.t: "武汉陷落"
 CHI_event.7.d: "尽管国民革命军英勇奋战，后方民众鼎力支持，但广州、武汉等地纷纷落入叛军之手，中央已经毋庸置疑地落入下风。如今，北平方面已经开出条件，宣布愿意不追究邓演达及其政治盟友的责任——前提是他们流亡出国。尽管对这一羞辱性质的条款深感愤懑，但这有可能是他所能得到的最好条件了。"
 CHI_event.7.a: "我们别无他法，只得同意......"
 CHI_event.7.b: "我们必须离开南京，越快越好！"
 CHI_event_7_b_tt: "§Y宋、邓两位主席骤然失踪，可能导致南京§!§R陷入混乱§!"
 CHI_event.8.t: "接管"
 CHI_event.8.d: "在湖北省全境随武汉三镇一同陷落后，残余的鄂省军队与赤色民兵便随省主席董必武一同撤退到江西休整。如今，随着南京政府即将投降的消息传来，中共中央已经下定决心主动出击，以把握全党与中国革命的命运。\n\n就在邓演达、宋庆龄两主席失去联系，南京群龙无首之际，赣省军队已经在沿途工农赤卫队的帮助下畅通无阻地进入南京，湖北省主席董必武、江西省主席方志敏已经分别“暂代”行政院长与革命军事委员会主席之职。仍在南京控制下的各省左翼民兵则分别动员起来，宣誓“保卫革命”，而取得政权的中国共产党则与中工盟、中华民主联合战线等原本在国民政府内居于次席的政党达成协议，相约组建跨党派联合政府。"
 CHI_event.8.a: "这是又一次革命吗？"
 CHI_event.9.t: "得胜"
 CHI_event.9.d: "随着国民革命军在中原、川东等地的一系列胜利，损兵折将、精锐尽失的北平政府已经于近期随阎锡山转移至太原，孙科、李宗仁则选择流亡印度。经此一役，国内绝大多数反对力量均被消灭，国民政府终于能够将精力集中在重建与经济发展层面。\n\n邓主席一边下令军队继续向太原进发，另一边则筹备起国府的下一阶段任务。无论如何，中国的未来将与这些党内叛徒毫无关系。"
 CHI_event.9.a: "万岁！"

 CHI_forpol_event.1.t: "陈部长的南洋行"
 CHI_forpol_event.1.d: "星洲市，晚晴园。与五年前类似紧急的抗战动员会议不同，此次会面的气氛显得更为沉重而复杂。国民党中央执行委员会海外部长陈庆云对面坐着的是历经日据时期磨难、建国战争洗礼而神色愈发坚韧的星洲联邦总理李振殿，墙上的孙中山遗像仿佛正凝视着这个他曾经倾注心血、并深刻改变了中国命运的地方。\n\n“陈部长，您能来，侨胞们心里便踏实几分。”李振殿的声音带着一丝疲惫。“只是，如今的局面，比日本人来之前更让人心忧。星洲建国一事，已让马来民族主义团体愤懑不平，他们视我们为殖民经济的帮凶与继承人。我等辛苦重建的家业，努力十数载方能安居的星洲国，恐将成为无根之浮萍。”陈庆云微微颔首。他此行前，已详尽研读了相关报告。国内乱局初定，国力空虚，外交上亦需仰赖美国支持。直接干预南洋内政，包揽其全部防务，既无实力，也缺法理。然而，南洋财富曾是战时经济的重要补剂，为内战之最终胜利付出颇多，数百万侨胞更是如今与工人国际裂痕愈发明显的国民党政权在国际舞台上的重要支持者，绝不能坐视其利益受损而不顾。\n\n“廷芳兄，所言俱是实情。”陈庆云缓缓说道，指节轻叩桌面，“中央对此极为关切。然我如今之地位，已非战时可比。当务之急，是需谋一良策，既能护星洲百万侨胞身家性命、合法权利，又不至授人以柄，陷国家于外交被动。如今，最好便是由星洲直接提议合作，国府得以增派驻南洋部队，足以保星洲长治久安。”"
 CHI_forpol_event.1.a: "李总理看了看面前的部长，轻轻地点了下头。"
 CHI_forpol_event.2.t: "《告南洋人民书》"
 CHI_forpol_event.2.d: "致星洲华人之正义者、马来民族之受压迫者，以至星洲联邦全体国民，无论其族裔分别：\n\n劳动阶级以其艰辛劳作创造了南洋的财富，却住在木板搭成的棚屋里，吃着星洲政府配给的霉米。当你们的孩子因疟疾无药可医时，那些穿着丝绸长衫的“体面人”们，正肆意挥霍你们创造的财富，出卖孙先生“天下为公”的遗训，出卖华侨劳工百年来用性命开拓南洋的苦难史。他们将宗亲会、同乡会变为控制劳务、压榨工资的工具；他们将华文报社的笔锋对准一切要求提高待遇的罢工工人。这不是我们的同胞，这是戴着华人面孔的资本家，是旧世界帝国主义在热带最忠实的走狗与最后的卫道士。\n\n今天，在南京，一个真正属于工人、农民和各民族劳动者的新政府已经建立。我们宣布：华人解放之路，必须首先斩断这套由国民党当局与买办资产阶级共谋的压迫锁链。\n\n我们呼吁：\n\n一、拒绝“星洲国民党”操控的伪总工会，建立自愿往来的工农互助会、医疗社与识字班。\n二、撕毁奴役性劳动合同，在真正左翼同志领导下，成立跨族群、跨行业的统一斗争联盟。\n三、华工当与马来、印度裔劳工兄弟携手，认清我们共同的敌人不是彼此，而是国民党压迫者。\n\n南洋的解放，只能来自你们。而中国的新政府将与你们站在一起。我们不仅提供道义声援，更将通过一切可能渠道，为你们的斗争提供必要的支持。让革命的火种，从扬子江畔蔓延到马六甲海峡。\n\n打倒买办资产阶级！\n全马劳动人民万岁！"
 CHI_forpol_event.2.a: "——中国民主劳动党海外行动部\n南洋民主劳动党"

 CHI_news_event.1.t: "中国国民党第七次全国代表大会"
 CHI_news_event.1.d: "自从1946年的国民党第六次全国代表大会引发前所未有的政治危机以来，南京国民政府与其政治反对派已经水火不容。尽管国民党中执委主席邓演达已经同意仅隔两年便召开第七次全国代表大会，但反对派仍对其支持者霸占代表名单的多数席位而感到不满，并已在两年的政治整合中提出了他们自己的理念。\n\n因此，国民党第七次全国代表大会在南京和北平分别举行，双方互不承认。国民政府主席宋庆龄与国民党中执委主席邓演达均谴责了北平方面“罔顾团结与战后重建之大局”，而阎锡山、孙科牵头举行的北平大会则反向谴责邓演达“背叛党义，篡夺政权”。可以肯定的是，刚刚经历战火洗礼的中国即将再次陷入分裂。"
 CHI_news_event.1.a: "难道他们就不能顾全党国团结的大局吗？"
 CHI_news_event.1.b: "中国的分裂似乎永无止境。"
 CHI_news_event.2.t: "平宁分裂"
 CHI_news_event.2.d: "在国民党第七次全国代表大会以严重的党内分裂收场后，急转直下的中国事态终于来到了沸腾的临界点。就在今日，随着南京方面将北平会议的大部分主要参与者开除出党，阎锡山已经宣布南京政府非法，并在北平特别市组织起对立政府。北平国民政府以阎锡山为主席，孙科为行政院长，并已得到山西、广西等地以及国民革命军多支精锐队伍的效忠。\n\n平府与宁府已经开始公开动员军队，为即将到来的全面内战做准备。如今，究竟是南京依靠其民众支持击败挑战者，还是北平利用其精锐迅速推翻旧政权，战争的结果仍未可知。不过，这极有可能是决定国民党中国乃至全东亚未来命运的关键一战。"
 CHI_news_event.2.a: "这将是对反动势力的最后一战！"
 CHI_news_event.2.b: "中国与内战，真是一对毫不奇怪的搭配。"
 CHI_news_event.3.t: "华北联军入主南京"
 CHI_news_event.3.d: "国民党中国突然爆发的内战似乎已经分出胜负。与许多观察者预料到的不同，尽管南京方面拥有兵力与装备优势，但随着北平军队攻陷南京，原本国际普遍承认的国民党政权已经颜面扫地，并在无与伦比的军事失败中走向崩溃。国民党中执委主席李宗仁与政府总理黄绍竑均在乱军中丧命，而其麾下要么转投北平，要么流亡海外，北平方面的军队则迅速向全国各地开进，期望尽早结束内战状态，准备实现曾经邓演达的愿景。\n\n即将入主南京的华北人民政府由民主劳动党、共产党与工团主义者共同组成，对紧密注视着中国局势的各方来说，这或许意味着亚洲权力平衡的重大转变。"
 CHI_news_event.3.a: "赤旗飘扬在南京上空。"
 CHI_news_event.3.b: "出人意料的发展。"
 CHI_news_event.4.t: "南京政府粉碎华北叛乱"
 CHI_news_event.4.d: "尽管北平军队来势汹汹，但南京国民政府仍凭借其精锐部队将叛军消耗殆尽，随后进入北平粉碎所谓“华北人民大会”。随着民主劳动党军队主力在战争中被摧毁，李宗仁及其桂军已经无可置疑地成为国民党乃至全中国唯一的主导力量。\n\n国民政府主席张知本为此发表演讲，宣布中国将转向战后重建工作，尽力恢复被世界大战和内战破坏的国民经济。预计，在左翼反对力量失势后，南京将迅速推动宪政，并加深对海外亲国民党势力的政治影响。对此，华盛顿与莫斯科均表示将“密切关注”。"
 CHI_news_event.4.a: "他们能够稳定中国局势吗？"
 CHI_news_event.4.b: "出人意料的发展。"
 CHI_news_event.5.t: "星洲-南京条约"
 CHI_news_event.5.d: "就在华北叛乱得到粉碎后，南京国民政府带来了最新的外交行动——中华民国与星洲联邦迅速就马来半岛局势达成协议，南京方面增加驻南洋国军的数量，保障星洲国民党政权安全以换取其加入南京的军事同盟。\n\n在中华民国国军的压力下，马来半岛各抵抗势力正逐渐被压制，而随着民国陆海军进驻星岛、雪州、槟州等地的军港，星洲政权似乎已经彻底稳固。不过，有传言称，加尔各答方面正在鼓动马来半岛为数不少的印度裔民众反对华人统治，也许半岛上的政权危机远未解除。"
 CHI_news_event.5.a: "中国影响力的复苏。"
 CHI_news_event.6.t: "中国吞并星岛"
 CHI_news_event.6.d: "随着民主劳动党夺取南京，其立即开始将影响力散播到原属国民党势力范围的东亚各国，其中就包括马来半岛上的星洲联邦。据悉，新成立的中华民国人民政府成功鼓动星洲左翼与人民义勇军发动政变攻入星岛，但战火破坏了星洲市对国家其余地区的掌控，最终导致星洲联邦解体，星洲与马六甲成为中国海外领土。\n\n中国的扩张行为已经在东南亚引起轩然大波，而新生的各个半岛马来人国家则对中国相当疏远。这一事件对南洋地区的平衡存在何种影响，仍未可知。"
 CHI_news_event.6.a: "中国影响力的复苏。"
 CHI_news_event.7.t: "朝鲜战争"
 CHI_news_event.7.d: "随着朝鲜国与大韩民国之间的矛盾日渐加深，双方陈兵数十万对峙的边境线上终于擦枪走火。据悉，朝韩两国已经正式开启全面战争，并分别表示己方将“完成半岛统一的历史大业”。\n\n由于朝韩双方与俄罗斯和第三国际分别具有众所周知的紧密联系，据预测这场战争的影响或许将迅速外溢。同样处于分裂中的中国和日本各政府已经开始动员军队，准备驰援其盟友。"
 CHI_news_event.7.a: "亚洲何时能够太平呢？"
 CHI_news_event.8.t: "日本内战"
 CHI_news_event.8.d: "在北日本-俄国安保条约引发危机以来，南方政权便紧盯其对手的政局变化，伺机而动。如今，随着北日本境内出现大规模动乱，南方军队已经挥师北上，准备完成日本统一。\n\n俄国对此反应剧烈，西伯利亚的大批俄军部队已经开始向北海道岛集结，随时准备南下干预。与此同时，南日本的战略盟友——汉城与南京则也加强了军事动员。或许，这场内战将会演变成规模远超想象的庞大战争。"
 CHI_news_event.8.a: "亚洲何时能够太平呢？"
 CHI_news_event.9.t: "大亚洲战争"
 CHI_news_event.9.d: "起源于中日韩三国的内战如今已经外溢为包含大半个亚洲的大规模全面战争。俄国支持的奉天-平壤-仙台政权与印度集团达成同盟，尝试南北两线夹击亲第三国际的南京-首尔-东京集团，而国际势力则在西亚、马来群岛等方向上予以回击。\n\n巴黎和底特律已经互相放下成见，共同支持其亚洲盟国，而俄罗斯则再次开动其二战期间建设的庞大军工体系向外输出物资。按最悲观的假设，或许第三次世界大战已经在路上了。"
 CHI_news_event.9.a: "这是世界大战的先声吗？"

