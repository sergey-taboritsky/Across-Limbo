l_simp_chinese:
### WEST EUROPE ###
 RULE_GROUP_TNW_RULES_WS_EUROPE: "西欧"
 FRA_PATH: "红色世界的新舵手"
 RULE_OPTION_FRA_PATH_RANDOM: "随机"
 RULE_OPTION_FRA_PATH_RANDOM_DESC: "马塞尔·加香主席在战时紧急状态下得以连任三届，但其年事已高，隐退之心人尽皆知。在宣布退休前，他将公社中央理事会交给艾伯特·特雷特，并将法兰西共产党交给鲍里斯·苏瓦林，希望借此弥合日渐显现的党内分歧。然而，两派间的理念之争不可调和，两位新主席最终将决出一位胜者。"
 RULE_OPTION_FRA_PATH_SOUVARINE: "鲍里斯·苏瓦林"
 RULE_OPTION_FRA_PATH_SOUVARINE_DESC: "作为党内激进左翼的代表，鲍里斯·苏瓦林向来主张强化马克思主义与列宁式先锋队对公社的领导作用，并对泛欧合作抱有极高的兴趣。在其§c布尔什维主义§!执政计划中，工团主义之乡或将与工团国际渐行渐远......"
 RULE_OPTION_FRA_PATH_TREINT: "艾伯特·特雷特"
 RULE_OPTION_FRA_PATH_TREINT_DESC: "在党内较为温和的一派中，艾伯特·特雷特是其中相对强硬的代表人物，这也使得他能够团结党内大部分成员，承接马克思、盖得与加香的革命遗产，延续注重广泛团结的§c马克思主义§!道路。不过，其对外、尤其是对俄的强硬态度必将在扑朔迷离的冷战局势中搅动风云......"
 ENG_PATH: "书记处丑闻的后果"
 RULE_OPTION_ENG_PATH_RANDOM: "随机"
 RULE_OPTION_ENG_PATH_RANDOM_DESC: "作为不列颠联盟党务工作的核心，工党中央书记处被发现从事腐败、泄密乃至违反党内莫斯利主义路线等多项罪恶活动。作为对该事件负有直接领导责任的第一责任人，长期以来多次与莫斯利主席意见相左的中央书记处第一书记乔治·卡特林被迫退休，而该位置如今处于空缺状态。"
 RULE_OPTION_ENG_PATH_STRACHEY: "中央书记约翰·斯特雷奇"
 RULE_OPTION_ENG_PATH_STRACHEY_DESC: "前不管部长，莫斯利的长期战友约翰·斯特雷奇在内部会议中取得上风，被莫斯利主席任命为新的工党第一书记。作为准则派中的左翼，他拥有总理安奈林·贝文的鼎力支持，并宣布将整顿党务工作与党纪作为未来工党的工作重心，并致力于促进工党在国际社会主义事业中的行动与地位。"
 RULE_OPTION_ENG_PATH_JOAD: "中央书记西里尔·乔德"
 RULE_OPTION_ENG_PATH_JOAD_DESC: "前工党宣传委员会主席，追随莫斯利十余年的老战友西里尔·乔德在会面中打动了莫斯利本人，被选为工党第一书记。他是准则派中少数的和平主义者，背后拥有工会主席杰克·琼斯帮助。他的工作重心是加强党际联络，尤其是与俄罗斯及其势力范围的半官方外交沟通，以促进东西方持久和平与贸易通畅。"
 RULE_OPTION_ENG_PATH_MITFORD: "中央书记戴安娜·米特福德夫人"
 RULE_OPTION_ENG_PATH_MITFORD_DESC: "奥斯瓦尔德·莫斯利主席不满于党内对第一书记职位的公开争夺，遂任命其夫人、工党议会党团主席戴安娜·莫斯利为新的第一书记。作为莫斯利进一步集权的尝试，此举相当于总统直接掌管党部而必然遭遇反对意见，但莫斯利夫人在妇女与不列颠民族主义者中的人望也有助于其政策推行。"
### CENTRAL NORTH EUROPE ###
 RULE_GROUP_TNW_RULES_CN_EUROPE: "中欧及北欧"
 RHI_PATH: "撤出托管领"
 RULE_OPTION_RHI_PATH_RANDOM: "随机"
 RULE_OPTION_RHI_PATH_RANDOM_DESC: "在当地人民的要求下，法兰西红军将会撤出其直接管理的最后一片德国领土——莱茵兰。不过，他们依旧能够发挥最后的影响力，决定即将独立建国的莱茵兰第一任领袖。在诸多左翼力量中，究竟哪一支能够取得巴黎的青睐？"
 RULE_OPTION_RHI_PATH_SPD: "社工党人民阵线"
 RULE_OPTION_RHI_PATH_SPD_DESC: "显然，德国社会主义工人党(莱茵支部)作为比较温和的左翼力量能够取得所有人接纳。为了莱茵兰的稳定，凯特·弗兰肯塔尔将会建立一个§S民主社会主义§!政府。"
 RULE_OPTION_RHI_PATH_FAUD: "工人直接管理"
 RULE_OPTION_RHI_PATH_FAUD_DESC: "作为德国最为密集的工业区，莱茵兰工人在托管时期便掌握了许多政治话语权。最终，德国自由工人联合会(莱茵分部)在贝托尔德·卡恩的领导下建立了§s无政府工团主义§!政府。"
 RULE_OPTION_RHI_PATH_KPD: "斯巴达克同盟归来"
 RULE_OPTION_RHI_PATH_KPD_DESC: "早在第一次世界大战时期，斯巴达克同盟便在莱茵工人群体中具有相当影响力。如今，他们以德国共产党的名义归来，并凭借书记奥托·尼伯格尔与巴黎的良好关系得以建立§c马克思主义§!政府。"
### EAST EUROPE ###
 RULE_GROUP_TNW_RULES_ESE_EUROPE_CENTRAL_ASIA: "东欧及南欧"
 RUS_VOZHD_DEATH: "伟大元首之终局"
 RULE_OPTION_RUS_VOZHD_DEATH_RANDOM: "随机"
 RULE_OPTION_RUS_VOZHD_DEATH_RANDOM_DESC: "尽管被尊奉为近神，但俄罗斯元首鲍里斯·萨文科夫仍是一介凡人，而且生活作息向来与健康不沾边。终有一日，他虚弱老迈的身躯将成为他征程的最后阻碍，而俄罗斯也将会走向命定的轨道......"
 RULE_OPTION_RUS_VOZHD_DEATH_THOUGHTRULE: "思想统治"
 RULE_OPTION_RUS_VOZHD_DEATH_THOUGHTRULE_DESC: "萨文科夫中风去世后，党内“三巨头”组成了临时国务委员会以暂时统治俄罗斯。不过，这一联盟终将破裂，最终杀出重围接任元首之位的是党内少数高级知识分子之一，著名的欧亚主义者彼得·萨维茨基。他将维护官方的§o斯沃博达主义§!路线，同时尝试整合势力范围，建立真正的§B欧亚联盟国§!。"
 RULE_OPTION_RUS_VOZHD_DEATH_CENTER: "中道得胜"
 RULE_OPTION_RUS_VOZHD_DEATH_CENTER_DESC: "萨文科夫中风去世后，党内“三巨头”组成了临时国务委员会以暂时统治俄罗斯。不过，这一联盟终将破裂，最终杀出重围接任元首之位的是党务系统长期以来的操盘手，保卫联盟中央书记卡罗尔·文贾戈利斯基。他将在进一步整合其§P民族协作主义§!盟友的同时，尽可能保证§o斯沃博达主义§!正统。"
 RULE_OPTION_RUS_VOZHD_DEATH_HARDLINER: "战鼓轰鸣"
 RULE_OPTION_RUS_VOZHD_DEATH_HARDLINER_DESC: "萨文科夫中风去世后，党内“三巨头”组成了临时国务委员会以暂时统治俄罗斯。不过，这一联盟终将破裂，最终杀出重围接任元首之位的是前彼得格勒市长，萨文科夫的宠臣维克多·拉里奥诺夫。他将尝试彻底政党化全国军政机构，并在时机恰当之时发动§o斯沃博达主义§!对西方无神论者的最终之战。"
 RULE_OPTION_RUS_VOZHD_DEATH_WWIII: "死神之畏"
 RULE_OPTION_RUS_VOZHD_DEATH_WWIII_DESC: "萨文科夫尽管经历中风，但却在抢救下奇迹般地恢复了部分健康。为确保其愿景得以贯彻落实，元首将在清洗一切党内反对声音后立刻发动§Y第三次世界大战§!，无论这一决定是否将毁灭人类文明。"
### EAST ASIA ###
 RULE_GROUP_TNW_RULES_EAST_ASIA: "东亚"
 CHI_PATH: "长虹贯日"
 RULE_OPTION_CHI_PATH_RANDOM: "随机"
 RULE_OPTION_CHI_PATH_RANDOM_DESC: "抗日战争胜利了，但中华民国内部的裂痕却与日俱增。最终，一切理念之争都将化为枪炮轰鸣，华北人民政府与南京国民政府之间将在中原爆发战争。内战的烈火不但会再度撕碎中华大地，也必将决定这片土地未来的命运。"
 RULE_OPTION_CHI_PATH_RCKMT_HOLD_ON: "南京屹立不倒"
 RULE_OPTION_CHI_PATH_RCKMT_HOLD_ON_DESC: "随着南京政府的部队进入北平，国民党最终取得胜利，而中国民主劳动党及其政府成为历史。中国将在§C三民主义§!带领下致力实现宪政。"
 RULE_OPTION_CHI_PATH_BEIPING_VICTORIOUS: "北平最终得胜"
 RULE_OPTION_CHI_PATH_BEIPING_VICTORIOUS_DESC: "依仗精锐部队的支持，曾盘踞华北的中国民主劳动党成功入主南京，施行先总理理想中的左翼训政与党国制度。中国将在§P邓演达主义§!的指引下走向未来。"
 JAP_BORDER_CONFLICT_PATH: "上越侵攻的命运"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_RANDOM_DESC: "日本南方自战争结束以来便因帝国军队撤退时实行的焦土政策而赤地千里。近期由于其激进路线，南日本在政治层面也陷入动荡，北日本的前帝国军方则希望利用这一完美机遇夺回新潟县，进而威胁东京。他们的攻势能否成功呢？"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_JAP: "新潟保卫战"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_JAP_DESC: "尽管南方军队多为民兵，且受到政治动荡的影响，但仍凭借其不屈意志与源源不断的国际援助守住了上越市，最终逼迫北方退兵。自此，日本南北双方实力差距进一步拉开，北方则陷入政治危机中。"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_IAS: "上越征服"
 RULE_OPTION_JAP_BORDER_CONFLICT_PATH_IAS_DESC: "即使南方军队拼死抵抗，但北方的老兵部队仍凭借其专业性与悍不畏死的“武士道精神”成功夺取上越，进而占据全部新潟县。自此，北方得以通过铁路迅速突袭东京，而战败的南方则陷入政治危机中。"
 JAP_PATH: "工团主义实验田"
 RULE_OPTION_JAP_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_PATH_RANDOM_DESC: "随着国际联军占领日本列岛大部，远东国际委员会主席托马斯·亚瑟·比森与民政局劳动科长爱奥多尔·科恩制定了庞大而激进的政治、经济与社会改造计划，以期将南日本转变为总工会领导下的无政府工团主义公社联盟。然而，日本本土左翼大多抵制这一方案，改造计划能否在重重阻碍中突破重围尚未可知。"
 RULE_OPTION_JAP_PATH_BISSON_SUCCESS: "工团主义山巅"
 RULE_OPTION_JAP_PATH_BISSON_SUCCESS_DESC: "在全国政治委员会主席选拔阶段，比森授权§s山川均§!成为全国政治委员会主席。在接纳社会主义革命一段论以及吸收劳农派的革命经验后，日本的经济快速飞升，超工团主义宣布成功。日本真的成为了世界上最民主、最发达以及社会发展指数最高的§s工团主义§!国家。"
 RULE_OPTION_JAP_PATH_BISSON_OUSTED: "重归沉寂"
 RULE_OPTION_JAP_PATH_BISSON_OUSTED_DESC: "在生活保障大会做出批判比森的报告后，远东委员会决定免除托马斯·比森的主席职务。在驻日盟军最高司令官§P朱德§!的指挥下，公社保卫委员会暂时平定了动乱，并举行了新一届的全国委员会选举。社会党在战后吸纳的原劳动农民党委员长§S大山郁夫§!被推举为全国政治委员会主席。"
 JAP_SYNDICATE_FUTURE_PATH: "产别会议的命运"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_RANDOM_DESC: "随着得到比森授权的山川均出任全国政治局委员会主席，日本工团主义改造宣告成功。不过，作为如今集合了行政与立法功能的超级机构，全日本产业别劳动者总同盟的中央代表会议主席之位如今却处于空缺当中，其人选悬而未决。最终，中央代表会议决定召开全体大会，以解决相关问题。"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_COMMITTEE: "§s如今的世界皆高举赤旗§!"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_COMMITTEE_DESC: "一个人或者一个政治党派永远无法代表全无产阶级的意志。因此，我们要废除全国政治委员会主席制度，由§s全日本劳动者联合会议§!依据马克思主义原理治理列岛。从此以后，再不会有人凌驾于无产阶级之上，劳动者将坚定地走§s正统工团主义§!道路，工人阶级将领导一切！"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_TAKANO: "§s如今的工人再非孤立无援§!"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_TAKANO_DESC: "高野实同志当选担任全国劳联会议长。在工人阶级中声望颇高的高野实同志是劳农派异端猪俣津南雄的弟子，劳农派猪俣思想主张§c横向左翼论§!，认为工人阶级应该与各个进步势力联合来完成社会主义革命。因此，高野实会在保障工人阶级领导一切的同时，与各个进步阶层展开紧密的合作，确保社会主义新日本的光辉能够惠及每个渴望民主自由的人。在全日本产业别劳动组合会议的领导下，日本将继续走在更正确的§s劳农派马克思主义§!道路上。"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_JSP: "§S第二届民主人民阵线政府：社会党§!"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_JSP_DESC: "尽管列岛改造计划十分成功，但劳联会的东京独大问题依然没有得到解决，这加强了§s关西労组§!与§S民主人民阵线§!的依存关系。在远东委员会宣布结束占领状态后，劳联会让渡权力，日本的政治制度转向了§s労§!§S众§!依存体制。在之后的民主人民阵线的选举中，§S社会党§!的候选人当选。在1906年的赤旗的照耀下，日本的劳动者们将会继续走向通往§s工团主义§!和§c共产主义§!的道路。"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_JCP: "§c第二届民主人民阵线政府：共产党§!"
 RULE_OPTION_JAP_SYNDICATE_FUTURE_PATH_JCP_DESC: "尽管列岛改造计划十分成功，但劳联会的东京独大问题依然没有得到解决，这加强了§s关西労组§!与§S民主人民阵线§!的依存关系。在远东委员会宣布结束占领状态后，劳联会让渡权力，日本的政治制度转向了§s労§!§S众§!依存体制。在之后的民主人民阵线的选举中，§c共产党§!的候选人当选。共产党将务实地与封建残余做出坚决的斗争，为劳动者们通向§c共产主义§!的道路扫清一切障碍！"
 JAP_SOCIALIST_FUTURE_PATH: "紧急政府的自救行动"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_RANDOM_DESC: "在生活保障大会做出批判比森的报告后，托马斯·比森的主席被免职。随后，大山郁夫被推举为全国政治委员会主席。不过，这一紧急政府成立于危难之际，南日本社会主义的前途能否存续，一切取决于新政府渡过危难时刻的决心与行动。"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SUCCESS: "§S社会主义共和国§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SUCCESS_DESC: "全国政治委员会主席大山郁夫顶住了混乱的局势和恐怖分子的频繁暗杀，并对日本的政治、经济和社会进行了完善的改革。在大山郁夫的领导下，日本摆脱了劳联会优越制，经济得到恢复，社会也趋于稳定,日本成为了一个正常的社会主义国家。在1954年大山郁夫去世后，全国为他举行了劳农葬，而日本将继续走在一条名为§S科学社会主义§!的康庄大道上。"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_DEMSOC: "§p江田三郎的构造改革§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_DEMSOC_DESC: "在森户-稻村论证中，森户辰男胜出且随后§S社会党§!与§p社民党§!组建连笠政府。由于左右不和，大山郁夫的改革屡屡受挫，§B西尾末广§!随即提交不信任案。最终左派做出妥协，大山郁夫被迫下台。§S江田三郎§!当选全国政治委员会主席，社会党右派也随之进入政府班底。江田三郎发表了著名的《江田构想》，在左派同志的批判声中，他选择与西尾末广展开合作。\n\n然而不久后，江田三郎察觉西尾末广正密谋篡党夺权。§B三井三池战斗§!§Y资方§!胜利后，江田三郎向佐佐木更三、成田知巳、和田博雄等同志致歉，并积极联合向坂逸郎，在争取罢工权的战争中号召全国劳动者共同抵制西尾末广的阴谋，遵循§S改良社会主义§!原则。"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SOCDEM: "§B西尾末广大权在握§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SOCDEM_DESC: "§p江田三郎§!当选全国政治委员会主席后，发表了著名的《江田构想》。在左派同志的批判声中，他选择与§B西尾末广§!展开合作。随后，西尾末广被任命为全国经济改革委员长，在全国范围内推行§Y民主会社制度§!，试图通过高福利、高工资收买工人配合的方式，恢复资本主义经济并邀请战前流亡的资本财阀回归。\n\n§B三井三池事件§!中§Y资方§!取得胜利后，西尾末广领导的第二工会占据了西日本几乎所有工厂。随着为了罢工权的斗争结束，西尾末广彻底架空了江田三郎，并在新一届全国政治委员会选举中当选主席，日本自此从美国的附庸转变为了中国的附庸。其建立民主社会党，并在§p社会民主主义§!指导下统治全国。"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SYNDIE: "§s总资本与总劳动的决战§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_SYNDIE_DESC: "西尾末广的改革为工人阶级创造了新的苦难，名为拯救国家，实为劳农之贼！在§B三井三池战斗§!§R劳方§!胜利后，工人阶级紧密团结在§S向坂逸郎§!同志的身边，将篡夺无产阶级革命果实的野心家西尾末广在国会中痛打一顿后，把他用抛石机扔到了北日本。工人阶级再次领导了一切，但是，世界正变得愈发硝烟弥漫。向坂逸郎的§c劳农马克思主义§!真的带领劳动者们抵御旧势力的反扑吗？"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_FAIL: "§a革新统一§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_FAIL_DESC: "§B西尾末广§!的经济改革让大量工人失业，在经历为了罢工权的战争之后，西尾末广顿感需要引咎辞职来转移对新政权的矛盾，§B河上丈太郎§!被社会党右派推举为下一届全国政治委员会主席。然而，西尾对工人运动的残酷镇压引来了工人国际和美国高度关注，在人民电力的丑闻被曝光后，社会党右派决定推出河上丈太郎作替罪羊。\n\n河上丈太郎也意识到自己的傀儡身份，为了保住政治生命，河上丈太郎通过§o平野力三§!的关系，和北日本当局进行统一的构通，条件是统一之后河上丈太郎继续担任首相。此时南日本政治高度混乱，在南日本高层的默许下，军部势如破竹地攻入了东京。\n\n§B中§!§R美§!双方严重抗议§o北日本§!违反停火协定，驻日国民革命军迅速控制了大阪，并稳住了交火前线。之后，远东委员会认为，南日本革命政权的崩溃证明了“日本人无法自己解决日本问题”，决定对日本实施更直接的军事统治。\n\n为阻止远东委员会推行占领政策，§P浅沼稻次郎§!联合向坂逸郎等人发起密集游说。最终促使远东委员会同意撤回军管方案，条件是浅沼稻次郎须承诺组建§R稳定的工人政府§!。因此，在当选全国组织委员会主席后，日本政界启动§O革新统一运动§!，§S社会党§!、§P社会民主党§!、§c共产党§!等无产阶级政党整合为§P统一社会党§!。浅沼稻次郎将建立§P左翼民族主义§!的社会主义政府，并接受中美的军事托管。"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_OCCUPY: "§P永久性托管§!"
 RULE_OPTION_JAP_SOCIALIST_FUTURE_PATH_OCCUPY_DESC: "§B西尾末广§!的经济改革让大量工人失业，在经历为了罢工权的战争之后，西尾末广顿感需要引咎辞职来转移对新政权的矛盾，§B河上丈太郎§!被社会党右派推举为下一届全国政治委员会主席。然而，西尾对工人运动的残酷镇压引来了工人国际和美国高度关注，在人民电力的丑闻被曝光后，社会党右派决定推出河上丈太郎作替罪羊。\n\n河上丈太郎也意识到自己的傀儡身份，为了保住政治生命，河上丈太郎通过§o平野力三§!的关系，和北日本当局进行统一的构通，条件是统一之后河上丈太郎继续担任首相。此时南日本政治高度混乱，在南日本高层的默许下，军部势如破竹地攻入了东京。\n\n§B中§!§R美§!双方严重抗议§o北日本§!违反停火协定，驻日国民革命军迅速控制了大阪，并稳住了交火前线。之后，远东委员会认为，南日本革命政权的崩溃证明了“日本人无法自己解决日本问题”，决定对日本实施更直接的军事统治。\n\n为阻止远东委员会推行占领政策，浅沼稻次郎联合向坂逸郎等人展开密集游说。然而，远东委员会不仅未同意撤回军管方案，还否决了浅沼稻次郎的提案，并逮捕了向坂逸郎等人。\n\n随后，远东委员会任命日裔美国人§R杰克·白井§!担任全国政治委员会主席。美军在对日本实施完全§P军事化托管§!的同时，推行系统性的§o“去日本化”§!政策，并强制推广§s美式工联主义§!。"
 JAP_EMERGENCY_GOVERNMENT_PATH: "共和国紧急状态"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_RANDOM_DESC: "在新潟保卫战中战败，使得南日本爆发严重的社会危机。只要社会危机没有平稳度过，或者社会稳定程度过低，就会迫使公社保卫委员会主席绀野与次郎接管政权。随后，共和国正式进入紧急状态。"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_JCLP: "§c鹬蚌相争，福本得利§!"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_JCLP_DESC: "保卫委员会主席§S绀野与次郎§!宣布暂停众议院和劳联会的活动。经历了残酷的镇暴和肃反行动后，保卫委员会的权力明显过头，同时全国政治委员会页发生了剧烈的人事变动。法国的工人国际意图调停，然而，保卫委员会在镇压的过程中过于激进，导致大量无辜的市民遇害。§c福本和夫§!与§c统一协议会§!抓住机会，煽动§c产别民主同盟运动§!，并控制了保卫委员会的人事任免。新政治局推举了共和国政治局委员§c野坂参三§!成为全国政治委员会主席，野坂很快辞职，福本和夫成为全国政治委员主席。"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_PLANISME: "§S全国计划经济委员会§!"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_PLANISME_DESC: "福本和夫的改革并未得到政治委员会的支持。在共产党第六次重组大会上，§S风早八十二§!得到全体委员的拥护，随即以反革命罪拘捕了福本和夫。风早担任全国政治委员会主席后，面对日益严峻的国际局势，他提出通过新型计划经济与国家结构改革方案来迅速增强国家力量。该方案的核心在于放弃民主和民生，转而构建§a技术官僚§!与§S唯生产力论§!相结合的体制。一切为了共和国的存活！"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_MAOISM: "§s继续革命论§!"
 RULE_OPTION_JAP_EMERGENCY_GOVERNMENT_PATH_MAOISM_DESC: "在新潟保卫战中，处于前线的社会党中执委委员§S黑田寿男§!负伤。重伤昏迷的他恍惚间看到了另一个世界的自己，那个世界的自己为他引荐了一位和蔼可亲的§c中国老前辈§!。黑田寿男在梦中向老前辈倾诉了自己在学习辩证法与政治经济学时的疑惑。\n\n老前辈告诉他，马克思主义原理千条万绪，归根结底就是一句话——§c造反有理§!。无产阶级必须§c在无产阶级专政下继续革命§!，才能维系革命的纯洁性。黑田寿男顿觉醍醐灌顶，醒来后，他总结了一套新的理论体系——黑田思想。这套理论包括支持辩证法的对立统一、宽大与镇压并行和人民战争等理论。最重要的是，面对工人国际在殖民地地区的社会矛盾问题，黑田寿男批判其社会殖民主义，并提出了继续革命理论和三个世界思想。\n\n随后，新潟保卫战的余波——肃反严重冲击了中执委。在工人国际的及时叫停下，委员会停止肃反工作，幸存下来的社会党中执委推举了黑田寿男作为中执委主席。如果黑田的理论能够在日本成功，那么对整个第三世界国际的革命必然是不可置疑的冲击。"
 JAP_SOCIALIST_ECON_PATH: "大山郁夫的经济政策"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_RANDOM: "随机"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_RANDOM_DESC: "大山郁夫政府成立后不久，东京大学召开了一场座谈会，日本马克思主义经济学界的一流学者悉数到场，这意味着这场会议的意义重大，很有可能决定着日本经济的未来走向。\n\n会上，东京大学经济学博士、马克思主义经济学家宇野弘藏就日本列岛改造实验的分析进行发言，系统批判了工团主义实验中远东委员会脱离实际的幼稚政治倾向。但与此同时，他在演讲中主张剥离马克思主义的阶级性和历史社会性，主张把马克思经济学中的革命的社会主义思想视为“消极的意识形态”，而把纯粹资产阶级经济学批判视为“积极的社会科学”，认为唯物史观不属于科学范畴。\n\n显然，宇野弘藏此次报告的内容并未提前告知其他与会者，结果引发全体出席人员的一致反对，座谈会立马变成大派斗，甚至现场无法完成速记。这场会议最终以失败告终，不仅未能讨论出日本未来的经济学方向，反而引发了各派系马克思主义的互相攻伐。"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_ORTHODOX: "劳农派马克思主义经济学"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_ORTHODOX_DESC: "以大内兵卫、向坂逸郎为主的劳农主义建制派在会议上最终胜出，主张労组斗争至上主义和保护劳动者生活权。"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_DIGITAL: "数理马克思主义经济学"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_DIGITAL_DESC: "数理马克思主义经济学派在会议上胜出。他们是为对抗新古典经济学日益扩大的影响力，将数学方法导入马克思主义经济学分析而形成的重要流派，这一派主张试图用严密的数学逻辑逻辑重新表述马克思的经典命题，实践上主张控制论。"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_MARKET: "市民社会派马克思主义经济学"
 RULE_OPTION_JAP_SOCIALIST_ECON_PATH_MARKET_DESC: "市民社会派在会议上胜出，他们主张以分工交换体系为核心，用“原始共同体、市民社会、社会主义”三阶段重构马克思历史理论。在实践上主张对市场的合理化、对国家干预的排斥，让市场在与合作社、公共性等马克思主义治理原则结合的基础上运行。"