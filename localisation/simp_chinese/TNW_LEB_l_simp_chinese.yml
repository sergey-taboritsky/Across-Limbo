#国策
 LEB_consolidate_beirut: "巩固贝鲁特城区"
 LEB_consolidate_beirut_desc: "贝鲁特是政权的摇篮也是十字路口。军官们清洗了旧市政厅，把海关与港口攥进手里——这座城市的每一张通行证都要盖新政权的钢印。"
 LEB_ala_veterans: "阿拉伯解放军老兵"
 LEB_ala_veterans_desc: "卡伍吉的旧部——阿拉伯解放军的老兵们——成建制投奔贝鲁特。他们打过巴勒斯坦，知道怎么用最少的子弹打最狠的仗。"
 LEB_beirut_arsenal: "贝鲁特兵工修械所"
 LEB_beirut_arsenal_desc: "港区仓库改成修械所。缴获的英式、法式、德式步枪在车床上一支支复活——贝鲁特的武器库没有派系，只有口径。"
 LEB_sacred_mission: "神圣使命"
 LEB_sacred_mission_desc: "萨阿德重开讲堂。他从贝鲁特的礼堂讲到山区的谷仓：叙利亚不是一个国家，而是一个待完成的民族——完成它，是这一代人的神圣使命。"
 LEB_party_in_barracks: "党支部进兵营"
 LEB_party_in_barracks_desc: "政委制度搬进了军营。每个连队有了党课，每本《民族复兴》有了军中读者——军官们发现，士兵们现在先向党旗敬礼。"
 LEB_secular_charter: "世俗宪章"
 LEB_secular_charter_desc: "宗教与国家分离的宪章公之于众。长老们的抗议被党报逐一驳斥——民族高于教派，公民高于信士。"
 LEB_intellectual_oath: "知识分子效忠"
 LEB_intellectual_oath_desc: "教师、律师、诗人在党的旗帜下集体宣誓。萨阿德说：笔也是武器，知识分子是民族的神经——神经必须连着大脑。"
 LEB_leader_cult: "领袖崇拜"
 LEB_leader_cult_desc: "领袖画像进入每一间教室与营房。元老们私下嘀咕：崇拜该有个限度——但没人敢公开说。"
 LEB_greater_syria_doctrine: "大叙利亚主义"
 LEB_greater_syria_doctrine_desc: "从托罗斯山到西奈，从塞浦路斯到美索不达米亚平原——"天然叙利亚"的地图挂在总参谋部墙上。这不是幻想，是作战计划。"
 LEB_hama_tradition: "哈马传统"
 LEB_hama_tradition_desc: "胡拉尼带来了哈马的怒火。他对军官们讲水车之城的旧事：农民如何掀翻帕夏的税册。少壮派们听懂了——枪杆子也可以为镰刀而战。"
 LEB_land_survey: "土地调查"
 LEB_land_survey_desc: "测量队背着标杆走进沿海平原。地主的田契第一次被政府的算盘质疑——谁在拥有，谁在耕种，账要算清楚。"
 LEB_peasant_leagues: "农民同盟"
 LEB_peasant_leagues_desc: "山村与平原的农民同盟挂起了牌子。胡拉尼亲自授旗：同盟既是互助社，也是民兵队——镰刀与步枪住在同一个谷仓。"
 LEB_land_reform: "分地法案"
 LEB_land_reform_desc: "分地法案颁布：地主的超限额土地强制赎买，分给耕者。贝鲁特的银行家们倒吸凉气——但山区来的新兵正源源不断。"
 LEB_labor_guarantees: "劳工保障令"
 LEB_labor_guarantees_desc: "港口与工厂实行八小时工作制与工伤抚恤。城市的工人发现，这个军官政权比任何一届议会都更在意他们的汗。"
 LEB_progressive_program: "进步纲领"
 LEB_progressive_program_desc: "少壮派抛出完整的进步纲领：土改、世俗、义务教育、妇女解放。元老们称之为背叛民族主义——胡拉尼回答：这才是民族的完成。"
 LEB_fedayeen_network: "敢死队网络"
 LEB_fedayeen_network_desc: "敢死队的联络站遍布海岸公路。他们炸军列、割电线、处决叛徒——战争还没有正式开始，贝鲁特的夜已经很忙了。"
 LEB_civil_defense: "民防军"
 LEB_civil_defense_desc: "民防军成立：工人、店员、学生在工余时间操练。他们守卫街垒、搬运伤员——每个街区都是一座堡垒。"
 LEB_artillery_battery: "炮兵连"
 LEB_artillery_battery_desc: "从阿拉伯解放军旧部里挑出的炮手组成了贝鲁特仅有的炮兵连。老炮手拍着炮身说：口径就是发言权。"
 LEB_mountain_recruits: "山区征募"
 LEB_mountain_recruits_desc: "征募官走进丘陵与山村的难民营。无地的人领到军装与口粮——内战对穷人而言，第一次成了一份有薪水的活计。"
 LEB_coastal_patrols: "海岸巡逻队"
 LEB_coastal_patrols_desc: "缉私艇挂上旗，巡逻黎凡特海岸。名为缉私，实则盯着每一艘可能运来敌人军火的船——也顺便做点自己的买卖。"
 LEB_bank_of_beirut: "贝鲁特银行公会"
 LEB_bank_of_beirut_desc: "贝鲁特银行公会被要求自愿合作。黄金储备登记造册，外汇管制连夜颁布——金融城第一次体会到什么叫革命政权。"
 LEB_silk_and_citrus: "丝与柑橘"
 LEB_silk_and_citrus_desc: "桑园与柑橘林重新排上生产计划。政权以统购统销接管出口——丝与柑橘换回的不再是地主的奢侈品，而是兵工厂的原料。"
 LEB_smugglers_network: "走私商网络"
 LEB_smugglers_network_desc: "封锁线上的走私商成了政权的编外采购员。黄金买军火，柑橘换情报——贝鲁特把整条地中海的黑市变成了自己的后勤线。"
 LEB_tripoli_understanding: "的黎波里谅解"
 LEB_tripoli_understanding_desc: "的黎波里的长老们与贝鲁特达成谅解：城市自治换兵员与粮秣。北方港口的大门温和地敞开——带着谈判桌上的矜持。"
 LEB_raid_damascus_roads: "袭扰大马士革商路"
 LEB_raid_damascus_roads_desc: "大马士革—贝鲁特的公路成了绞索。车队被劫、桥涵被炸——军政府每损失一批货物，贝鲁特的口袋就沉一分。"
 LEB_march_on_damascus: "进军大马士革"
 LEB_march_on_damascus_desc: "元帅的作战地图上，箭头终于指向东南。进军大马士革——把政权的都城从山城搬回平原，把旧军政府的旗子钉进泥土。"
 LEB_seize_aleppo: "夺取阿勒颇"
 LEB_seize_aleppo_desc: "北方的同志比南方的敌人更危险——他们抢在革命前面定义革命。夺取阿勒颇，让工团主义的红旗也让位于民族的圣火。"
 LEB_holy_city_irredenta: "圣城收复主义"
 LEB_holy_city_irredenta_desc: "天然叙利亚的疆域里当然包括耶路撒冷。圣城的收复主义宣言发表——宗教当局在贝鲁特听到的不是团结，是通牒。"
 LEB_cypress_dream: "塞浦路斯之梦"
 LEB_cypress_dream_desc: "萨阿德在地图上画下了塞浦路斯。跨海的雄心被写进党的青年教材——梦想先于国境存在。"
 LEB_left_road: "社会革命道路"
 LEB_left_road_desc: "少壮派主导了党：民族复兴首先意味着铲平封建。党章加上社会革命的序言——胡拉尼的农民军成了政权的心脏。"
 LEB_orthodox_road: "纯正民族主义道路"
 LEB_orthodox_road_desc: "元老派赢回了党。纯洁的、不可分割的民族主义重新成为唯一教义——社会问题可以有，但不能喧宾夺主。"
 LEB_qawuqji_marshal: "元帅卡伍吉"
 LEB_qawuqji_marshal_desc: "卡伍吉终于穿上了元帅服。这位打过整个巴勒斯坦战争的老兵接过全军统帅权——军人政权在贝鲁特完成了加冕。"
 LEB_national_renaissance: "民族复兴日"
 LEB_national_renaissance_desc: "独立的黎凡特在贝鲁特敲响了钟声。新国家宣布民族复兴纪年开始——从今天起，叙利亚民族的历史由贝鲁特执笔。"
