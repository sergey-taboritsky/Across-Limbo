#民族精神
 LEB_secular_mission: "世俗国家纲领"
 LEB_secular_mission_desc: "宗教与国家分离被写进贝鲁特的执政纲领。教长的讲坛不再能对国家发号施令——这在这片土地上，是最锋利也最危险的宣言。"
 LEB_peasant_program: "农民纲领"
 LEB_peasant_program_desc: "从土地调查到分地法案，胡拉尼的农民纲领成了政权的呼吸。山村的谷仓里，镰刀与步枪睡在同一张草席上。"
 LEB_cypress_irredenta: "塞浦路斯收复主义"
 LEB_cypress_irredenta_desc: "天然叙利亚的地图上画着一座海岛。跨海的收复主义激怒了所有邻国——但民族复兴的叙事，从来不因邻国愤怒而止步。"
 LEB_national_renaissance_idea: "民族复兴"
 LEB_national_renaissance_idea_desc: "民族复兴纪年已经开始。从贝鲁特的钟声到山村的谷仓，一个新的叙利亚民族正在旧文明的废墟上被铸造出来。"

