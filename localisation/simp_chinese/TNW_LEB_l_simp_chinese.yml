#领导人
 LEB_Fawzi_al_Qawuqji: "法齐·卡伍吉"
 LEB_Fawzi_al_Qawuqji_desc: "法齐·卡伍吉，打满半个黎凡特的老兵。从拉塔基亚到巴勒斯坦，他指挥过的旗帜换了一茬又一茬——如今他只效忠他亲手扶起的贝鲁特政权。"
 LEB_Antun_Saadeh: "安通·萨阿德"
 LEB_Antun_Saadeh_desc: "安通·萨阿德，叙利亚社会民族党的缔造者与大叙利亚主义的先知。他坚信民族是高于宗教与阶级的最高实在，而他本人正是这一信念的化身。"
 LEB_Antun_Saadeh_advisor: "政治顾问 安通·萨阿德"
 LEB_Akram_Hourani: "阿克拉姆·胡拉尼"
 LEB_Akram_Hourani_desc: "阿克拉姆·胡拉尼，哈马律师之子的农民辩护人。他在党内以少壮派旗手著称，一手把西北的农民运动锻造成党内最有力的一翼。"
 LEB_Akram_Hourani_advisor: "政治顾问 阿克拉姆·胡拉尼"

