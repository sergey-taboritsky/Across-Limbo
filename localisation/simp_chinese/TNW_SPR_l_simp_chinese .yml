 SPR_Authoritarianism_party: "人民行动党"
 SPR_Authoritarianism_party_long: "人民行动党(Acción Popular)\n§L随着君主主义者在内战中的溃败与社会主义者在共和国掌权，激进右翼大部分战败流亡或战死。然而，相对温和的右翼在支持天主教的口号下组建了支持共和国的人民行动党，披上合法外衣在新共和国活动。即使对社会主义政策颇有微词，但由于相当一部分西班牙人民群众仍然信奉天主教，当局无法对他们做出任何行动。§!\n"
