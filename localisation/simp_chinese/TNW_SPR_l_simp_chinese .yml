#parties
 SPR_communist_party: "西班牙统一共产党"
 SPR_communist_party_long: "西班牙统一共产党(Partido Comunista Unificado de España)\n§L在法兰西公社的支持下，西班牙共产党与工人社会党一道转投共和派，并支持卡瓦列罗成功取得了共和国政权。\n\n摆脱了与无政府主义合作带来的束缚，西班牙共产党终于得以整合大部分激进左翼，建立统一的激进马克思主义政党。为表团结，中央委员会主席一职被交给合并到党内的前“工农集团”领导人华金·毛林，不过大部分领导权仍然保留在中央书记处第一书记多洛雷斯·伊巴露丽手中。§!\n"
 SPR_syndicalism_party: "全国劳工联合会"
 SPR_syndicalism_party_long: "全国劳工联合会(Confederación Nacional del Trabajo)\n§L全劳联曾是西班牙最大的工会组织，也是西班牙左翼革命的中坚力量。不过，随着共产党和工人社会党叛离左翼阵线，全劳联军队瓦解冰消，最终不得不同意向卡瓦列罗投降——交出伊比利亚无政府主义联合会的领导人，放弃煽动革命，换取成为共和国合法工会的地位。不过，即使在吞并全国总工会后逐渐温和化，不满于新政府工人政策的工人与无政府主义者仍将全劳联视为救主。§!\n"
 SPR_socialism_party: "西班牙工人社会党"
 SPR_socialism_party_long: "西班牙工人社会党(Partido Socialista Obrero Español)\n§L随着内战之火越烧越旺，西班牙共产党与西班牙工人社会党的马克思主义者与左翼阵线日渐激进的无政府工团主义当权派愈发显现分歧。法兰西公社联邦新政府逐渐对支持无政府主义失去兴趣，而普列托开出的条件日渐优渥，卡瓦列罗做出了他的选择——两党的马克思主义者将转投共和国，而巴黎也支持这一决定。\n\n很快，在共产党和巴黎的支持下，卡瓦列罗出任共和国总理，并在内战后将共和国重组为如今的社会主义国家，但随着二战后共产党野心日渐膨胀，自由派甚至右派也逐渐在反战口号中联合起来，工人社会党对政权的控制还能维持多久，仍未可知。§!\n"
 SPR_Social_democracy_party: "西班牙工人社会党(普列托派)"
 SPR_Social_democracy_party_long: "西班牙工人社会党(Partido Socialista Obrero Español)\n§L随着内战之火越烧越旺，西班牙共产党与西班牙工人社会党的马克思主义者与左翼阵线日渐激进的无政府工团主义当权派愈发显现分歧。法兰西公社联邦新政府逐渐对支持无政府主义失去兴趣，而普列托开出的条件日渐优渥，卡瓦列罗做出了他的选择——两党的马克思主义者将转投共和国，而巴黎也支持这一决定。\n\n很快，在共产党和巴黎的支持下，卡瓦列罗出任共和国总理，并在内战后将共和国重组为如今的社会主义国家，但随着二战后共产党野心日渐膨胀，自由派甚至右派也逐渐在反战口号中联合起来，工人社会党对政权的控制还能维持多久，仍未可知。§!\n"
