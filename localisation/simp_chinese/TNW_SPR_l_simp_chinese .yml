#民族精神
 SPR_The_name_of_gold_the_reality_of_ironeroded: "黄金的名号，蚀铁的现实"
 SPR_The_name_of_gold_the_reality_of_ironeroded_desc: "我们的国家曾经以黄金的舰队，黄金的土地与黄金的王座构筑了一个世纪的黄金时代，当时的人们认为，这样的时光将永世不缁。\n\n然而黄金的时代终究伴随着1588年的战争湮灭了，剩下的只有孤冢枯骨，西班牙在墓穴中衰败，舰队沉寂，国土离散，王权衰微，昔日的日不落帝国只剩下了余光，再起不能呢。\n\n西班牙的军队与影响力已经落到了近五百年来的最低点，半岛上似乎再也看不见黄金的辉光，那辉煌的传说，宏伟的疆域，似乎只是梦中泡影，而现下，整个伊比利亚半岛只余废铁，在时光的摧残中慢慢腐蚀。"
 SPR_hundred_years_of_festering_hundred_years_of_decay: "百年溃烂，百年腐朽"
 SPR_hundred_years_of_festering_hundred_years_of_decay_desc: "自1808年拿破仑入侵伊比利亚之后，西班牙王国就开始陷入一场持续百年的疫病之中，直至今日仍未得到医治。\n\n秩序溃烂了，政府腐朽了，贪污腐败登堂入室，成为马德里乃至一切城市里上行下效的规则秩序，资产，补贴，乃至军用物资，似乎只有自己的灵魂与上帝是不能售卖的。半岛的黄金时代生了疮，西班牙母亲在王座上虚弱的呕吐，而王室浑然不知。\n\n现在的西班牙，道德像农村一样肮脏，而秩序则像城市一样，死气沉沉，一次又一次的起义没能剜去半岛的脓疮，反而让恶臭的组织液感染了羸弱的资产阶级，成为这场瘟疫的帮凶之一。\n\n四百年前，西班牙蒙主之恩得以拯救，眼及现在，唯主方可使牧群回归正轨。"