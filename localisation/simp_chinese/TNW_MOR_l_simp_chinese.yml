TNW_MOR_Ahmed_Balafrej:0 "艾哈迈德·巴拉夫雷杰"
TNW_MOR_Ahmed_Balafrej_desc:0 "拉巴特出身的独立党秘书长，巴黎大学出身的摩洛哥最早的现代政治家之一。他是1944年独立宣言的签署人之一，也是共和国年轻的外交头脑——温和、克制、左倾，在王冠已被扫进历史的国家里，他用议会语言 rather than 卡伊德的裙带逻辑谈论摩洛哥的未来。"
