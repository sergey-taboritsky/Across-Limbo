 RAJ_Sardar_Patel:0 "萨达尔·瓦拉巴伊·帕特尔"
 RAJ_Sardar_Patel_desc:0 ""
 RAJ_Chandra_Bose:0 "钱德拉·鲍斯"
 RAJ_Chandra_Bose_desc:0 "§Y出生于：§!§L1897年1月23日，英属印度，奥里萨克塔克§!\n\n§Y人物背景：§!§L印度国民大会党前主席、自由印度临时政府元首。大战中他率印度国民军与同盟国为敌，战败后辗转归国——如今他是印度武装部队与退伍军人的政治旗帜。共和国的法庭宣判他无罪，可他知道共和国也怕他。§!"
 RAJ_Mohan_Singh:0 "莫汉·辛格"
 RAJ_Mohan_Singh_desc:0 "§Y出生于：§!§L1909年，英属印度，旁遮普古吉兰瓦拉§!\n\n§Y人物背景：§!§L印度国民军的创建者。战俘营里的上尉把数万降兵拧成了一支军队，战后解甲归国——他不再带兵，但军营里的年轻人仍叫他"国民军之父"。§!"
 RAJ_Mohan_Singh_commander_desc:0 "国民军之父。他带兵的天赋在战俘营里就得到了证明。"
 RAJ_Lakshmi_Sahgal:0 "拉克希米·萨加尔"
 RAJ_Lakshmi_Sahgal_desc:0 "§Y出生于：§!§L1914年10月24日，英属印度，马德拉斯§!\n\n§Y人物背景：§!§L詹西女王军团指挥官。她用医生的双手在缅甸组建了南亚第一支女子作战部队，战败被俘又获释——如今她是印度最有名的女人之一，军中的女性把她当路标。§!"
 RAJ_Lakshmi_Sahgal_commander_desc:0 "詹西女王军团的统帅。她证明过一次：女兵的冲锋和男兵一样致命。"
 
