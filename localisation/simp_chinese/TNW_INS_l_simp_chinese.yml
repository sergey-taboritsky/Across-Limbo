#初期国策树与危机事件（2026-10-23）
 INS_Continue_Kasimo_Plan: "延续卡西莫计划"
 INS_Continue_Kasimo_Plan_desc: "卡西莫的粮食自给纲要是共和国少数能全境推行的政策。继续扩种、征购与配给的三驾马车，先把饭碗端稳。"
 INS_Sumatra_Planting_Expansion: "苏门答腊南部的扩种尝试"
 INS_Sumatra_Planting_Expansion_desc: "楠榜与巴邻旁的荒地还有的是。组织移民与垦荒队，把种植园的边界往雨林里再推一寸。"
 INS_Raise_Procurement_Prices: "提高征购价格"
 INS_Raise_Procurement_Prices_desc: "多给农民一个铜板，粮站的仓库就会满一寸。国库在流血，但城市在吃饭。"
 INS_Pilot_End_Rationing: "试点性取消配给制"
 INS_Pilot_End_Rationing_desc: "在雅加达和泗水先行废止粮票。配给制本是战时产物，如今它限制的不是投机，而是生产。"
 INS_Expand_Cropland: "扩充耕地面积"
 INS_Expand_Cropland_desc: "爪哇的梯田已经到顶了。把苏门答腊的荒原纳入垦殖计划，是唯一不抢人的增量。"
 INS_Russia_Grain_Exchange: "与俄罗斯的农产品交换"
 INS_Russia_Grain_Exchange_desc: "欧亚协定的俄国人想要橡胶与香料的订单已经排到了后年。用粮食换他们的农机与化肥，各取所需。"
 INS_Fertilizer_Seeds: "引入化肥良种"
 INS_Fertilizer_Seeds_desc: "东京农学家的配方，巨港糖厂试种站的收成表，两样东西凑在一起就是丰收。"
 INS_Balance_Cash_Crops: "平衡经济作物生产"
 INS_Balance_Cash_Crops_desc: "橡胶和烟草挤占了太多稻田。给经济作物划一条红线，给口粮留一份底线。"
 INS_Academy_of_Agriculture: "国家农业科学院"
 INS_Academy_of_Agriculture_desc: "把茂物植物园的旧班底、日惹的农学院与东京援助的试验站合并成一所国家科学院——农业立国，就要有立国的学问。"
 INS_Support_Djuanda: "支持朱安达"
 INS_Support_Djuanda_desc: "朱安达是共和国少数没被派系撕碎的技术官僚。给他站台，就是给整个经济机器站台。"
 INS_Normalize_Planning_Bureau: "国家计划局的正规化"
 INS_Normalize_Planning_Bureau_desc: "把计划局从总统府的附设班底升格为正式部委，编制、预算、职权一件件落实。"
 INS_National_Economic_Experts: "补充民族经济专家"
 INS_National_Economic_Experts_desc: "谕令各部门优先任用本地培养的经济学者——职位是有限的，但空出来一个就要坐上去一个自己人。"
 INS_Far_East_Reconstruction_Boom: "利用远东重建潮"
 INS_Far_East_Reconstruction_Boom_desc: "共荣圈内的重建订单正从东京、西贡和马尼拉源源涌来。共和国的港口和糖厂没有理由缺席。"
 INS_Incubate_Postwar_Plan: "孵化战后经济计划"
 INS_Incubate_Postwar_Plan_desc: "把各部委的计划草案汇总成共和国第一份全国经济纲领——计划经济不等于社会主义，但一定等于清楚自己在做什么。"
 INS_Resource_Export_Board: "资源出口统筹局"
 INS_Resource_Export_Board_desc: "橡胶、锡、石油的出口许可证统一收归一个局里发放。散装出售的时代结束了。"
 INS_Announce_Benteng: "宣布堡垒计划"
 INS_Announce_Benteng_desc: "以总统令宣布\"堡垒计划\"：进口特许与国家信贷优先授予土著商人。经济堡垒要由民族自己来守。"
 INS_Import_Licenses: "设立进口许可证"
 INS_Import_Licenses_desc: "每一批进口货物都得先问过堡垒局。许可证是纸做的，但它是这个国家最贵的纸。"
 INS_Squeeze_Alien_Capital: "挤压非民族资本的经营网络"
 INS_Squeeze_Alien_Capital_desc: "从碾米厂到港口转运，外侨商行的每一层网络都要用行政手段顶回去。"
 INS_Local_Importers_First: "本地进口商优先"
 INS_Local_Importers_First_desc: "许可证的分配名单上，土著商行的名字要排在最前面。这不是歧视，这是扶植。"
 INS_Nationalize_Industry: "产业国有化"
 INS_Nationalize_Industry_desc: "把殖民时代留下的矿山、码头与公用事业收归国有——不管东京高兴不高兴。"
 INS_Sumitro_Plan: "执行苏米特罗方案"
 INS_Sumitro_Plan_desc: "苏米特罗的紧急经济纲领：以进口替代和快速工业化立国。计划、工厂、账本——技术官僚的答案。"
 INS_Economic_Sovereignty_Movement: "发动经济主权运动"
 INS_Economic_Sovereignty_Movement_desc: "把街头动员起来：游行、抵制、接管——人民的经济要由人民的双手直接收回。账本在燃烧时最有说服力。"
 INS_Import_Substitution: "进口替代"
 INS_Import_Substitution_desc: "凡是能自己造的，就不再进口。用关税和许可把民族工业的摇篮围起来。"
 INS_Accelerate_Industrialization: "加速工业化"
 INS_Accelerate_Industrialization_desc: "不再是正常速度。厂房、机器、电力全都要在最短时间内落地——落后就要被群岛抛弃。"
 INS_Organize_Five_Year_Plan: "组织五年计划"
 INS_Organize_Five_Year_Plan_desc: "共和国的第一个五年计划。数字是冷的，但表格里的每一行都是工厂的烟囱。"
 INS_Package_Confiscation: "一揽子没收方案"
 INS_Package_Confiscation_desc: "对殖民时代遗留的产业开出一份完整清单，一次没收，绝不零敲碎打。"
 INS_Strengthen_Takeover: "强化接管能力"
 INS_Strengthen_Takeover_desc: "没收容易接管难。先培训一批懂账目、懂机器的接收干部，再谈清单的事。"
 INS_Manage_New_Enterprises: "交易新企业"
 INS_Manage_New_Enterprises_desc: "国有化的企业进入新的流通：租给合作社、卖给民族资本、或干脆由工人自己经营。"
 INS_Central_Banking_Law: "中央银行法"
 INS_Central_Banking_Law_desc: "货币是一国经济的主权。共和国需要一部自己的中央银行法，把发钞、汇率、储备收进同一个屋檐下。"
 INS_Recoup_Java_Bank: "收回爪哇银行的发钞权"
 INS_Recoup_Java_Bank_desc: "爪哇银行百年来替殖民者印钞。现在，印刷机要换主人了。"
 INS_Complete_Monetary_Sovereignty: "补完货币主权"
 INS_Complete_Monetary_Sovereignty_desc: "从纸币到外汇储备，共和国货币的最后一枚铆钉拧紧了。"
 INS_Army_Rationalization: "军队合理化运动"
 INS_Army_Rationalization_desc: "整编、裁并、统一编制。什锦之军要有什锦之军的结束。"
 INS_Demobilize_Militias: "遣散乡土民兵"
 INS_Demobilize_Militias_desc: "让他们放下枪回家种地。愿意留下的，换上统一的军装与番号。"
 INS_Keep_Guerrillas: "保持游击队规模"
 INS_Keep_Guerrillas_desc: "不要动他们。那些山里的营头是共和国在群岛上唯一铺得开的棋子。"
 INS_Siliwangi_Model_Division: "效仿西利万吉模范师"
 INS_Siliwangi_Model_Division_desc: "纳苏蒂安的西利万吉师证明了一件事：革命军队可以是专业军队。以它为模板重组全军。"
 INS_Positional_Warfare: "《阵地战》"
 INS_Positional_Warfare_desc: "纳苏蒂安藏身西爪哇时写成的作战纲要。阵地、纵深、军区——这本书会定义共和国军队的未来。"
 INS_Total_Peoples_Defense: "全民总体防御理论"
 INS_Total_Peoples_Defense_desc: "每一个村庄都是堡垒，每一个农民都是哨兵。总体战不只是军队的事。"
 INS_Border_Guerrilla_Zones: "建设边境游击区"
 INS_Border_Guerrilla_Zones_desc: "在边境预置武器库与地下网络——不是为了进攻，而是为了\"即使首都沦陷也不投降\"。"
 INS_Reorganize_Military_Districts: "重组军区制"
 INS_Reorganize_Military_Districts_desc: "全国划为若干军区，每个军区一位司令、一份预算、一片防区。"
 INS_Self_Funded_Army: "军费自筹方案"
 INS_Self_Funded_Army_desc: "国库养不起这支军队，那就让他们自己想办法。军区的生意头脑会让人吃惊。"
 INS_Guardian_Political_Action: "监护政治行动"
 INS_Guardian_Political_Action_desc: "军队要在政治中扮演监护人的角色——不是夺权，是守护。至少公告是这么写的。"
 INS_Improve_Magelang_Academy: "改善马吉冷军校"
 INS_Improve_Magelang_Academy_desc: "马吉冷军事学院的校舍、教员与课程全面翻新。共和国需要自己的军官团。"
 INS_Civilian_Transport_Licenses: "开放军事运输的民用许可"
 INS_Civilian_Transport_Licenses_desc: "军车回程顺路捎货、军港闲时开放泊位——规定放宽一个字，收入多出一大截。"
 INS_Army_Plantations: "支持军办种植园"
 INS_Army_Plantations_desc: "各军区的种植园生意合法化、规模化。军饷从这里来，麻烦也从这里来。"
 INS_Military_Import_Permits: "为军事单位发放进口证"
 INS_Military_Import_Permits_desc: "给各军区发放专属进口许可证。堡垒计划的例外名单上，军队永远排第一。"
 INS_Unity_Training: "针对民族统一的特殊训练"
 INS_Unity_Training_desc: "军官团的新课程：大印尼版图、帕拉帕誓言、以及\"群岛统一是军队的天命\"。"
 INS_Officer_Nationalism: "对军官灌输民族主义"
 INS_Officer_Nationalism_desc: "从入学第一天起，军校学员要背的不是条令，是誓言。"
 INS_National_Defense_University: "成立印度尼西亚国防大学"
 INS_National_Defense_University_desc: "马吉冷之上的更高学府——培养的不是军官，是战略家。"
 INS_Constitutional_Challenge: "应对修宪派挑战"
 INS_Constitutional_Challenge_desc: "制宪危机爆发了。联邦主义遗老在议会发难，要求修宪限制总统权力。共和国必须回应。"
 INS_Mobilize_Council_Elders: "动员独立调研会元老"
 INS_Mobilize_Council_Elders_desc: "把独立准备调查会的老先生们从各处请出来——他们的名分就是宪法的活化石。"
 INS_Sartono_Endorsement: "寻求萨尔托诺背书"
 INS_Sartono_Endorsement_desc: "老自由派还握着民议会的体面。萨尔托诺的一句话，抵得上十篇社论。"
 INS_Prioritize_Socialists: "优先安抚社会党"
 INS_Prioritize_Socialists_desc: "给沙里尔的社党几个部长位置，换他们在修宪表决时留在政府一边。"
 INS_Prioritize_Masyumi: "优先安抚马斯友美"
 INS_Prioritize_Masyumi_desc: "纳西尔要的不是职位，是宗教事务部的实权。给他，换取伊斯兰党团的沉默。"
 INS_Petition_Founding_Father: "请国父发言"
 INS_Petition_Founding_Father_desc: "病中的苏托莫被抬进议会大厅。他不需要说什么——他坐在那里，宪法就还活着。"
 INS_Suppress_Hatta: "打压哈达权威"
 INS_Suppress_Hatta_desc: "哈达的名字虽然没出现在修宪请愿书上，但每个人都知道它在哪儿。该收网了。"
 INS_Purge_Federalists: "清洗联邦主义遗毒"
 INS_Purge_Federalists_desc: "联邦主义者在行政系统的最后据点被逐一拔除。共和国只有一个中心。"
 INS_Kartosuwirjo_Rebellion: "卡托苏维里约叛乱"
 INS_Kartosuwirjo_Rebellion_desc: "西爪哇的绿帐篷升起来了。卡托苏维里约宣布\"印尼伊斯兰国\"，被裁撤的民兵带着枪投奔了他。"
 INS_Deploy_Siliwangi: "调动西利万吉师"
 INS_Deploy_Siliwangi_desc: "正规军对叛军。纳苏蒂安的部队从驻地开拔，向西爪哇进军。"
 INS_Dispatch_Sudirman: "派遣苏迪尔曼"
 INS_Dispatch_Sudirman_desc: "大元帅威名还在。让苏迪尔曼亲自去跟山里的旧部谈判——或者收编，或者清剿。"
 INS_Contain_West_Java: "将叛乱限制在西爪哇"
 INS_Contain_West_Java_desc: "合围、隔离、断粮。战火必须被摁在万隆郊外的山里，不许蔓延进城。"
 INS_Suppress_Parliamentary_Islam: "打压议会伊斯兰主义"
 INS_Suppress_Parliamentary_Islam_desc: "枪杆子叛乱带来的政治红利：马斯友美党团在议会的嗓门，该小一些了。"
 INS_Amnesty_Peripheral_Fighters: "招抚外围军事人员"
 INS_Amnesty_Peripheral_Fighters_desc: "跟着卡托苏维里约的大多是被遣散的义勇军。给出路，他们就会下山。"
 INS_End_Darul_Islam: "终结达鲁伊斯兰"
 INS_End_Darul_Islam_desc: "最后一个据点升起了共和国的旗帜。达鲁伊斯兰，终结于它开始的地方。"
 INS_Fathers_Deathbed: "国父的病床前"
 INS_Fathers_Deathbed_desc: "总统的病榻成了共和国真正的权力中枢。所有人的目光都盯着那扇门。"
 INS_Denounce_Sjahrir: "斥责沙里尔的图谋"
 INS_Denounce_Sjahrir_desc: "社党领袖近来在病房外的走动太勤了。国父的愤怒是共和国最后的政治资本，用一次就少一次。"
 INS_Sjahrir_Guardian: "任命沙里尔为国父的守护者"
 INS_Sjahrir_Guardian_desc: "与其让他在外面搅局，不如把他锁进体制：国父健康状况委员会的名义主席。"
 INS_Unite_the_Party: "团结党内"
 INS_Unite_the_Party_desc: "临时的休战协定。两派同意在国父弥留之际不公开动手——至少表面上如此。"
 INS_Stabilize_Frontier_Garrisons: "优先稳定边疆驻军"
 INS_Stabilize_Frontier_Garrisons_desc: "苏门答腊与婆罗洲的驻军还在观望。先稳住他们，首都的事才能从容布置。"
 INS_Preventive_Deterrence: "制造预防性威慑"
 INS_Preventive_Deterrence_desc: "让每个人都看见军队在调动。威慑的意思是：我希望你先动手。"
 INS_May_Tragedy: "五月悲剧与双头政权"
 INS_May_Tragedy_desc: "五月三十日，苏托莫逝世。共和国一夜之间出现两个心脏——党机器在亚明手里，街头在苏加诺手里。"
 INS_Panchasila_Copyright: "争夺潘查希拉著作权"
 INS_Panchasila_Copyright_desc: "国家基石的解释权开战了：1945 年的会议记录，究竟是谁的手笔？"
 INS_Show_the_Vision: "展示愿景"
 INS_Show_the_Vision_desc: "继承战争归根结底是叙事战争。谁能讲清共和国的未来，谁就继承了国父。"
 INS_Consolidate_Army_Ties: "巩固军事联系"
 INS_Consolidate_Army_Ties_desc: "派系领袖们突然都想起了军中的老朋友。电话线比公路更早通向各军区。"
 INS_Deny_Forgery: "指责文件伪造行为"
 INS_Deny_Forgery_desc: "对方拿出的每一页文件都是伪造的——这条指控本身就是武器。"
 INS_Internal_Council_Vote: "调研会内部表决"
 INS_Internal_Council_Vote_desc: "让还健在的独立调研会元老们表决：国家基石的作者栏应该写谁的名字。"
 INS_Second_Panchasila_Speech: "第二轮潘查希拉演讲"
 INS_Second_Panchasila_Speech_desc: "历史将重演一次：同一座大厅，同一个主题，两位演讲者。听众席就是法庭。"
 INS_Great_Indonesia_Territory: "强调大印尼版图"
 INS_Great_Indonesia_Territory_desc: "从沙璜到马老奇——版图是宪法序言里的祭坛，也是继承人资格的试金石。"
 INS_Urgency_of_Unity: "强调民族统一的急迫性"
 INS_Urgency_of_Unity_desc: "群岛在等待，危机在发酵。统一的口号在这个五月比任何时候都响亮。"
 INS_Interpret_Sumpah_Palapa: "解读帕拉帕誓言"
 INS_Interpret_Sumpah_Palapa_desc: "满者伯夷的旧誓言被重新翻译。谁掌握了誓言的解释权，谁就掌握了未来。"
 INS_Nasution_Guards_Capital: "任命纳苏蒂安拱卫首都"
 INS_Nasution_Guards_Capital_desc: "正规系接过了首都卫戍。西利万吉师的军列在夜色中驶进雅加达。"
 INS_Mobilize_Guerrillas_into_City: "调动人民游击队入城"
 INS_Mobilize_Guerrillas_into_City_desc: "苏迪尔曼系的人民游击队开进城区。工人们端着汤和子弹在街口迎接他们。"
 INS_Secure_Army_Cooperation: "确保军队配合"
 INS_Secure_Army_Cooperation_desc: "无论是哪一种未来，都需要枪杆子点头。军队的沉默就是默许。"
 INS_Dust_Settles: "尘埃落定"
 INS_Dust_Settles_desc: "葬礼结束了。围观的人群散去，权力的账本翻开了新的一页。现在，数一数各自手里的筹码。"
 INS_Propaganda_Master: "报道部的操盘家"
 INS_Propaganda_Master_desc: "旧报道部的人脉、党的文书机器、外岛精英的联名信——亚明在纸面上赢得了共和国。"
 INS_Army_Seals_Parliament: "军队封锁议会"
 INS_Army_Seals_Parliament_desc: "军队的装甲车堵住了议会大门。墙上贴出的公告只有一行字：国家高于派系。"
 INS_Peoples_Bannerman: "人民的旗手"
 INS_Peoples_Bannerman_desc: "码头停工，报童嘶喊，广场上的人海一直涨到总统府台阶。苏加诺向人群挥手——共和国向人群挥手。"
 INS_crisis.1.t: "修宪派发难"
 INS_crisis.1.d: "议会大厅里，联邦主义遗老与部分技术官僚联名递交了修宪请愿书：限制总统权力、改单一制为联邦制、重开制宪会议。请愿书上没有哈达的签名，但每一处措辞都有他的影子。病中的苏托莫尚未表态，而各派系已经开始站队。\n共和国的日常议程被按下了暂停键。"
 INS_crisis.1.a: "宪法一字不可易。"
 INS_crisis.2.t: "西爪哇的绿火"
 INS_crisis.2.d: "万隆郊外的山村里，绿帐篷一夜之间取代了红白旗。卡托苏维里约宣布\"印尼伊斯兰国\"成立，此前被裁撤的民兵带着枪械成建制投奔了他。西利万吉师已请求出击，但议会里的伊斯兰党团要求\"政治解决\"。\n共和国的日常议程被按下了暂停键。"
 INS_crisis.2.a: "叛乱必须扑灭。"
 INS_crisis.3.t: "国父的病床前"
 INS_crisis.3.d: "总统的咳嗽声已经停了整整一周。东京的医生在走廊里压低声音，党内两派在病房外的长椅上排起了队，每个人带来的花束都比问候更长。五月就要到了。\n共和国的日常议程被按下了暂停键。"
 INS_crisis.3.a: "共和国不能没有国父。"

 INS_crisis.4.t: "元老出山"
 INS_crisis.4.d: "独立准备调查会的老先生们拄着手杖重返议事厅——那是日本占领时期由苏加诺一手主持缔造的班底。元老们的名分就是宪法条文，广场上重新有人喊起\"独立之父\"的名字，民粹的声浪一夜高涨。"
 INS_crisis.4.a: "元老们的分量还在"
 INS_ft_elders_tt: "马尔哈恩之友立场向苏加诺推移10格。"

 INS_crisis.5.t: "议长的背书"
 INS_crisis.5.d: "萨尔托诺受邀出面仲裁，民议会的体面系于一人。坐上仲裁席的人也就成了各方争相拉拢的裁判——老自由派的省议员们闻讯归队，而亚明的说客已经等在他家门口。"
 INS_crisis.5.a: "体面就是力量"
 INS_ft_sartono_endorse_tt: "萨尔托诺圈立场向亚明推移10格。"

 INS_crisis.6.t: "社党的部长席位"
 INS_crisis.6.d: "几个部长职位送到了沙里尔的桌上。社党议会党团连夜开会后宣布：在修宪表决中与政府同行。温和左翼归队，街头的群众集会也随之降温。"
 INS_crisis.6.a: "先过眼前这一关"
 INS_ft_socialists_tt: "马尔哈恩之友立场向苏加诺推移10格。"

 INS_crisis.7.t: "宗教事务部的实权"
 INS_crisis.7.d: "纳西尔拿到了他要的东西：宗教事务部的编制、预算与瓦格夫地产的监督权。马斯友美的党团会议以近乎全票通过了对政府的信任案，议长席上的伊斯兰不再作声。"
 INS_crisis.7.a: "一笔体面的交易"
 INS_ft_masyumi_tt: "奉公会友立场向亚明推移10格。"

 INS_crisis.8.t: "西利万吉出击"
 INS_crisis.8.d: "西利万吉师的纵队沿公路向万隆郊外开进，钢盔在晨雾里泛着冷光。正规军的哨卡一个接一个替换了绿帐篷的路障，军中都在说：打仗还是得靠正规军。"
 INS_crisis.8.a: "让专业的人打仗"
 INS_ft_deploy_siliwangi_tt: "西利万吉系势力上升10，人民游击系势力下降5。"

 INS_crisis.9.t: "大将军亲征"
 INS_crisis.9.d: "苏迪尔曼拒绝了参谋部的拦阻，只带一支轻装卫队直赴前线。所到之处，民兵与游击队夹道相迎——大将军和他们吃过一样的苦。人民游击系的旗帜在阵地上重新竖了起来。"
 INS_crisis.9.a: "与士兵同灶吃饭"
 INS_ft_sudirman_tt: "人民游击系势力上升10，西利万吉系势力下降5。"

 INS_crisis.10.t: "取缔伊斯兰党团"
 INS_crisis.10.d: "军警查封了两家伊斯兰报社，马斯友美的集会被戒严令打散，议会里为\"政治解决\"辩护的声音被斥为通敌。萨尔卡派的长老们在清真寺里沉默地收拾经卷。"
 INS_crisis.10.a: "非常之时，非常之法"
 INS_ft_suppress_islam_tt: "萨尔卡派立场向亚明推移10格，西利万吉系势力上升5。"

 INS_crisis.11.t: "外围战士的特赦"
 INS_crisis.11.d: "一纸特赦令让山林里的绿帐篷战士放下了枪，成建制编入地方警备队——军装换了，人留了下来。人民游击系的兵员簿一夜之间厚了一倍，萨尔卡派的长老们也保住了体面。"
 INS_crisis.11.a: "枪收进来，人留下来"
 INS_ft_amnesty_tt: "人民游击系势力上升10，萨尔卡派立场向苏加诺推移5格。"

 INS_crisis.12.t: "矛头指向沙里尔"
 INS_crisis.12.d: "党的集会上，青年团代表把一沓《策略评论》摔在讲台上：\"就是这个人在巴黎的沙龙里议论总统！\"骂声持续了一整夜，激进青年的怒火找到了出口，文书派的元老们皱紧了眉头。"
 INS_crisis.12.a: "让怒火烧向该烧的人"
 INS_ft_denounce_sjahrir_tt: "穆尔巴派立场向苏加诺推移10格，国民印尼团立场向亚明推移5格。"

 INS_crisis.13.t: "沙里尔的保护人"
 INS_crisis.13.d: "一队\"自愿警卫\"悄无声息地驻进了沙里尔宅邸所在的街口。文书派放话：党的体面不允许私刑。贴在墙上的激进传单，一夜之间被揭得干干净净。"
 INS_crisis.13.a: "秩序先于怒火"
 INS_ft_sjahrir_guard_tt: "国民印尼团立场向亚明推移10格，穆尔巴派立场向苏加诺推移5格。"

 INS_crisis.14.t: "边防驻军整训"
 INS_crisis.14.d: "西爪哇与南苏门答腊的边境哨所换了双岗，补给车队按周抵达。西利万吉系的参谋们把地图钉满了一整面墙：防线归防线，追击归追击。"
 INS_crisis.14.a: "先把篱笆扎牢"
 INS_ft_frontier_tt: "西利万吉系势力上升10。"

 INS_crisis.15.t: "预防性威慑"
 INS_crisis.15.d: "国防部收到了三个军区游击纵队的联合通报：集结地域已经选定，粮弹齐备。不需要开一枪，山里的人已经证明他们随时可以下山。"
 INS_crisis.15.a: "让他们知道我们能"
 INS_ft_deterrence_tt: "人民游击系势力上升10。"

 INS_crisis.16.t: "伪造之说，一驳了之"
 INS_crisis.16.d: "党的文书处公开了病中领袖历年手稿的原始笔记，纸页黄脆，笔迹却清清楚楚。\"抄袭\"之说在照相制版面前碎得干干净净，青年们把报纸号外抛向天空。"
 INS_crisis.16.a: "白纸黑字，无可争辩"
 INS_ft_deny_forgery_tt: "穆尔巴派立场向苏加诺推移10格。"

 INS_crisis.17.t: "闭门表决"
 INS_crisis.17.d: "中央理事会连夜传阅了鉴定报告，随后是一轮漫长的举手。表决结果封进党的档案柜，走廊里的耳语却已经传开：委员会站在文书那一边。"
 INS_crisis.17.a: "党内的事，党内了结"
 INS_ft_council_vote_tt: "国民印尼团立场向亚明推移10格，穆尔巴派立场向苏加诺推移5格。"

 INS_crisis.18.t: "大印尼的地图"
 INS_crisis.18.d: "一张把马来亚、北婆罗洲乃至整个新几内亚都画进疆界的地图在军官食堂里流传。年轻军官们的酒杯碰在一起，游击队的入伍登记处排起了长队。"
 INS_crisis.18.a: "把地图挂到墙上"
 INS_ft_greater_indo_tt: "穆尔巴派立场向苏加诺推移10格，人民游击系势力上升5。"

 INS_crisis.19.t: "团结高于一切"
 INS_crisis.19.d: "\"共和国经不起第二场分裂。\"马尔哈恩之友在各省同时发起签名运动，请愿书盖满了两百个县的印章。领土争议被暂时封进抽屉——先让共和国活下去。"
 INS_crisis.19.a: "先守住手里的"
 INS_ft_unity_tt: "马尔哈恩之友立场向苏加诺推移10格。"

 INS_crisis.20.t: "纳苏蒂安进京"
 INS_crisis.20.d: "雅加达的桥梁与电台一夜之间换了岗哨。纳苏蒂安没有发表任何声明，他只是让西利万吉的宪兵出现在每一个路口。议会大厦的台阶被擦得锃亮，像一面镜子。"
 INS_crisis.20.a: "沉默的秩序"
 INS_ft_nasution_tt: "西利万吉系势力上升10。"

 INS_crisis.21.t: "游击队进城"
 INS_crisis.21.d: "卡车的帆布掀开时，雅加达人看见的是一双双沾着红泥的赤脚。人民游击系的队伍在广场上露宿，炊烟从街角升起。\"首都需要的是人，不是钢盔。\""
 INS_crisis.21.a: "让人民看着军队"
 INS_ft_guerrilla_city_tt: "人民游击系势力上升10。"

 INS_crisis.22.t: "宣传机器的胜利"
 INS_crisis.22.d: "亚明的讲演稿压过了所有杂音：电台、报纸、电影院新闻片，整齐得像受阅的方阵。\"誓言需要执笔人。\"当夜，国民印尼团的干部们无人入眠——他们赢了。"
 INS_crisis.22.a: "笔杆子赢了"
 INS_ft_propaganda_tt: "国民印尼团立场向亚明推移15格，穆尔巴派立场向苏加诺推移10格。"

 INS_crisis.23.t: "刺刀盖了章"
 INS_crisis.23.d: "议会休会的通告贴在大门上，落款是军区司令部。没有流亡，没有枪声，只有坦克在滨海大道原地调头的轰鸣。军官们相互致意：共和国的遗嘱，由枪杆来保管。"
 INS_crisis.23.a: "军队接管遗嘱"
 INS_ft_army_seals_tt: "西利万吉系势力上升10，人民游击系势力上升5。"

 INS_crisis.24.t: "人民的旗手"
 INS_crisis.24.d: "广场上的人海从清晨站到深夜。\"遗嘱写在人民心里！\"马尔哈恩之友的蓝旗与青年团的红旗汇成一片。当苏加诺举起手臂的那一刻，继承之争已经不需要唱票了。"
 INS_crisis.24.a: "人海就是选票"
 INS_ft_bannerman_tt: "马尔哈恩之友立场向苏加诺推移15格，穆尔巴派立场向苏加诺推移10格。"
 INS_nat_rev_econ_dm: "民族革命经济"
 INS_nat_rev_econ_dm_desc: "革命不止是夺权，更是把经济命脉从殖民地结构里夺回来。农业与工业战线上每一场运动的成果，都会沉淀为这台机器的马力。"
 INS_nre_upgrade_tt: "§Y民族革命经济§!获得强化"
 INS_five_year_plan: "五年计划"
