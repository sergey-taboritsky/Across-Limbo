 INS_Rus_Grain_Trade: "印尼-俄罗斯粮食贸易"
 INS_Rus_Grain_Trade_desc: "爪哇的糖和橡胶换西伯利亚的麦子。莫斯科的商船队每两周靠一次丹戎不碌，账面上谁也不吃亏——粮食进了市面，工厂里多了讲俄语的技师。"
