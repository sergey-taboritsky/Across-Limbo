 INS_military_reform: "军事改革"
 INS_military_reform_desc: "什锦之军的整编工程。西利万吉系 [?THIS.INS_army_siliwangi_var]｜人民游击系 [?THIS.INS_army_guerrilla_var]｜义勇军系 [?THIS.INS_army_gyugun_var]"
 INS_party_struggle: "党内斗争"
 INS_party_struggle_desc: "执政大帐篷党的派系角力。立场档位决定该派影响力计入哪位候选人（全面=100%、部分=50%、中立=0）。\n国民印尼团 [?THIS.INS_goni_var]（[Get_INS_stance_goni]）｜马尔哈恩之友会 [?THIS.INS_marhaen_var]（[Get_INS_stance_marhaen]）\n奉公会友 [?THIS.INS_hokokai_var]（[Get_INS_stance_hokokai]）｜萨尔托诺圈 [?THIS.INS_sartono_var]（[Get_INS_stance_sartono]）\n萨尔卡派 [?THIS.INS_sarekat_var]（[Get_INS_stance_sarekat]）｜穆尔巴派 [?THIS.INS_murba_var]（[Get_INS_stance_murba]）\n苏托莫的态度：[Get_INS_soetomo_stance]\n苏加诺影响力分数：[?THIS.INS_sukarno_score|0]\n亚明影响力分数：[?THIS.INS_yamin_score|0]"
 INS_army_siliwangi: "拉拢西利万吉系"
 INS_army_siliwangi_desc: "向纳苏蒂安与西马图邦的正规军官团让渡军费与人事权，换取总参谋部对整编工程的支持。"
 INS_army_siliwangi_tt: "西利万吉系势力 +5，陆军经验 +10"
 INS_army_guerrilla: "招抚人民游击系"
 INS_army_guerrilla_desc: "承认苏迪尔曼麾下营头的既成地盘，把乡土军头们从谈判桌外请到谈判桌前。"
 INS_army_guerrilla_tt: "人民游击系势力 +3，获得 5000 可用人力和 2% 战争支持度"
 INS_army_gyugun: "收编义勇军残系"
 INS_army_gyugun_desc: "把日训青年军官团纳入正式军衔体系。塔希尔的军官们要的不过是一纸委任状。"
 INS_army_gyugun_tt: "义勇军残系势力 +5，陆军经验 +5，战争支持度 +1%"
 INS_party_goni: "国民印尼团集会"
 INS_party_goni_desc: "亚明的文书派在《人民之声报》上大造声势，外岛精英集团表态拥立建国文件的执笔人。"
 INS_party_goni_tt: "国民印尼团立场向亚明移动 +5（<=20 全面支持苏加诺 / <=40 部分支持苏加诺 / <=60 中立 / <=80 部分支持亚明 / >80 全面支持亚明）"
 INS_party_marhaen: "马尔哈恩之友会动员"
 INS_party_marhaen_desc: "街头派走进码头与铁路工棚，马尔哈恩的小农寓言变成集会的号角。"
 INS_party_marhaen_tt: "马尔哈恩之友会立场向苏加诺移动 -5（分档规则同上）"
 INS_party_hokokai: "奉公会友联谊"
 INS_party_hokokai_desc: "旧奉公会的技术官僚们设宴联欢——东京伸进党内的那只手轻轻压了压天平。"
 INS_party_hokokai_tt: "奉公会友立场向亚明移动 +5（分档规则同上）"
 INS_party_sartono: "萨尔托诺圈茶会"
 INS_party_sartono_desc: "老自由派律师们在民议会的走廊里闲谈。他们不再握有权力，却还握着体面。"
 INS_party_sartono_tt: "萨尔托诺圈立场向苏加诺移动 -5（分档规则同上）"
 INS_party_sarekat: "萨尔卡派礼拜"
 INS_party_sarekat_desc: "萨尔卡伊斯兰老党的遗老们重开讲坛，追忆旧日商团与教团的荣光。"
 INS_party_sarekat_tt: "萨尔卡派立场向苏加诺移动 -5（分档规则同上）"
 INS_party_murba: "穆尔巴派街头集会"
 INS_party_murba_desc: "穆尔巴的青年们把「誓言只属于敢兑现它的人」刷满了雅加达的墙。温和派皱起了眉头。"
 INS_party_murba_tt: "穆尔巴派立场向苏加诺移动 -5（分档规则同上），稳定度 -1%"
 INS_party_soetomo: "总统的意向"
 INS_party_soetomo_desc: "苏托莫仍在世。无论他多少天不露面，他的名义本身就是压舱石——两派都还得仰赖总统的咳嗽声。"
