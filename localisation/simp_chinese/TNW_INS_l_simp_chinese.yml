 INS_Mohammad_Yamin: "穆罕默德·亚明"
 INS_Mohammad_Yamin_desc: "党的文书中枢与建国文件的执笔人，苏门答腊外岛精英集团「国民印尼团」的领袖。他守着宪法序言里的帕拉帕誓言：时机未到，但誓言没有有效期。"
 INS_Woerjaningrat: "维尔贾宁格拉特"
 INS_Susanto_Tirtoprodjo: "苏桑托·蒂尔托普罗佐"
 INS_Soangkupon: "索安格蓬"
 INS_Abdul_Rasjid: "阿卜杜勒·拉希德"
 INS_Tadjuddin_Noor: "塔朱丁·努尔"
 INS_Teuku_Mohammad_Hasan: "特乌库·穆罕默德·哈山"
 INS_Sukarno: "苏加诺"
 INS_Sukarno_desc: "被东京晾在一边的群众演说家，工会与青年团心中的另一尊神。他相信誓言只属于敢于兑现它的人。"
 INS_Sidik_Djojosukarto: "西迪克·佐约苏卡尔托"
 INS_Ali_Sastroamidjojo: "阿里·萨斯特罗阿米佐约"
 INS_Adam_Malik: "亚当·马利克"
 INS_Iskaq_Tjokrohadisurjo: "伊斯卡克·佐克罗哈迪苏尔乔"
 INS_Iskaq_Tjokrohadisurjo_desc: "党机器里最硬的拳头，账本后面站着的是工厂与工会。玛尔哈恩之友会里，他比谁都更早把左翼写进章程。"
 INS_Sukarni: "苏卡尔尼"
 INS_Sukarni_desc: "穆尔巴党魁，玛尔哈恩无产者战斗团的旗手，坚信革命该由最穷的人来点火。"
 INS_Chaerul_Saleh: "查埃鲁尔·萨利赫"
 INS_Wikana: "维卡纳"
 INS_Sutan_Sjahrir: "苏丹·沙里尔"
 INS_Sutan_Sjahrir_desc: "茉莉芬清洗后与起义切割、保住议会席位的社党领袖。他对巴黎的向往与对枪杆的警惕同样出名。"
 INS_Dipa_Nusantara_Aidit: "D.N.艾地"
 INS_Dipa_Nusantara_Aidit_desc: "在茉莉芬废墟上重建共产党的地下组织者。议会里没有他的席位，但工厂的车间里到处都是他的传单。"
 INS_Mohammad_Natsir: "穆罕默德·纳西尔"
 INS_Hamka: "哈姆卡"
 INS_Sjafruddin_Prawiranegara: "沙弗鲁丁·普拉维拉内加拉"
 INS_Kartosuwirjo: "S.M.卡托苏维里约"
 INS_Siauw_Giok_Tjhan: "萧玉灿"
 INS_Thio_Thiam_Tjong: "郑添聪"
 INS_Assaat: "阿萨特"
 INS_Sudirman: "苏迪尔曼"
 INS_Sudirman_commander_desc: "人民游击系的旗帜，什锦之军中威名最高的元帅。他的命令要经过一个个营头的谈判才能变成行动。"
 INS_Abdul_Haris_Nasution: "阿卜杜勒·哈里斯·纳苏蒂安"
 INS_Abdul_Haris_Nasution_commander_desc: "西利万吉系的正规化旗手，坚信军队最大的敌人是无序本身。"
 INS_Tahi_Bonar_Simatupang: "T.B.西马图邦"
 INS_Tahi_Bonar_Simatupang_commander_desc: "总参谋部的改革派，起草过无数份整编计划，也在无数份报告里声明军队不站队。"
 INS_Achmad_Tahir: "阿赫马德·塔希尔"
 INS_Achmad_Tahir_commander_desc: "义勇军残系的青年领袖，日训军官出身的苏门答腊驻军司令——在东京扶植的体制里，这是最正统的出身。"
 INS_Suharto: "苏哈托"
 INS_Suharto_commander_desc: "中爪哇某营头的中校。所有人都知道他可靠，没人知道他向着谁。"
 INS_Mohammad_Hatta: "穆罕默德·哈达"
 INS_Agus_Salim: "阿古斯·萨利姆"
 INS_Tan_Malaka: "丹马拉卡"
 INS_Mohammad_Natsir_desc: "马斯友美的少壮旗手，清真的账本与共和国的账本在他手里是同一本。"
 INS_Tan_Malaka_desc: "漂泊半生的革命浪人回到群岛，他的第三条道路既不认阿姆斯特丹也不认莫斯科。"
 INS_Siauw_Giok_Tjhan_desc: "同化派的华人领袖，坚信共和国的公民名单不该分出身。"
 INS_Sartono_desc: "老派的议会绅士，把民议会的议程表守得比党旗还紧。"
 INS_Kartosuwirjo_desc: "绿帐篷里的教法师，他丈量国家的方式只有一本经典。"
 INS_Wikana_desc: "雅加达的青年鼓手，相信工人的手能把共和国从政客嘴里抢回来。"
 INS_Abdul_Haris_Nasution_desc: "西利万吉的头脑。当政治家们吵架时，他在地图上沉默地划箭头。"
 INS_Sartono: "萨尔托诺"

