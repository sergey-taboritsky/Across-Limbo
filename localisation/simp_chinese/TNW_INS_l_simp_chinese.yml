 INS_defense_forces_dm: "印度尼西亚国防军"
 INS_defense_forces_dm_desc: "从什锦之军的废墟上，一支真正属于共和国的军队正在被锻造出来。军事路线上的每一次整训、每一所学府、每一场改革，都会铸进这身军装里。"
 INS_idf_upgrade_tt: "§Y印度尼西亚国防军§!获得强化"
 INS_Tentara_Gado_Gado_2: "什锦之军"
 INS_Tentara_Gado_Gado_2_desc: "整编初见成效：统一的编制表与军政条令压住了各营头的山头气，但派系的脸色仍然要看的。"
 INS_Tentara_Gado_Gado_3: "什锦之军"
 INS_Tentara_Gado_Gado_3_desc: "军区重组之后，命令终于能从雅加达一路传到连队。什锦之味渐淡，国防军之形渐成。"
 INS_Tentara_Gado_Gado_desc: "三系并立、号令不一的「什锦之军」：西利万吉、人民游击与义勇军的联合体。与其说是一支军队，不如说是各有其主的联军。"
