#国策
 JAP_Ripples_of_Fourth_Fukushima: "第四次福岛战役的余波"
 JAP_Ripples_of_Fourth_Fukushima_desc: ""
 JAP_End_Food_Crisis: "食粮危机结束"
 JAP_End_Food_Crisis_desc: "食粮危机给我们敲响了警钟。虽然本次危机已经得到解决，但日本的农业领域仍面临诸多严峻问题，赤旗政府必须立刻启动土地改革工作，否则第二次粮食危机随时可能爆发。"
 JAP_General_Congress_Conference: "产别全国大会"
 JAP_General_Congress_Conference_desc: "历经长久的革命战争，日本的劳动者们终于得到了解放。如今产别会议召开全国大会，将分散于各地的劳动组合凝聚为一股统一的力量，共同决定战后日本劳动者的命运。"
 JAP_Worker_Alliance_Congress: "总同盟大会"
 JAP_Worker_Alliance_Congress_desc: ""
 JAP_Three_and_Six_Acres: "“三町步”与“六町步”"
 JAP_Three_and_Six_Acres_desc: "土地改革旨在彻底废除佃租制度，最终确保每户农民均拥有足以维持生计的土地。基于此原则，政府必须没收所有3町步以上地主的土地，并将其免费分给少地或者无地的佃农自耕农。依照远东委员会与农地改革委员会和田博雄委员的主张，政府规定的补偿标准为：3町步以内收回适当补偿，3至6町步部分则半价补偿，超过6町步则无偿收回。"
 JAP_Land_Reform_Refund_Voucher: "农地被没收者国库债券"
 JAP_Land_Reform_Refund_Voucher_desc: "结合中国革命的经验来看，土地改革不应采取过激方式推进。因此，依照国民政府特派员邵力子同志与农地改革委员会水谷长三郎委员的主张，政府应当没收持有5町步以上的地主的土地，并发行相应债券对被收买者予以适当补偿。"
 JAP_Evaluate_Planting_Season: "评估农地复耕情况"
 JAP_Evaluate_Planting_Season_desc: "帝国主义对日本人民造成的伤害不可估量。革命战争期间，日本约79%的农地遭到毁灭性破坏，无数耕地被邪恶的旧帝国军队化为焦土。但在共产党组织的农民协会领导下，无数英勇的农民同志们克服重重困难，前赴后继地推进复耕工作，并取得了不错的成就。远东委员会要求社会主义政府提交农地复耕情况评估，以此作为后续土地改革工作的决策依据。"
 JAP_Agriculture_Central_Bank: "农林中央金库"
 JAP_Agriculture_Central_Bank_desc: "改革农林中央金库，以保证农民协会、村公所与农垦基地的资金融资流通顺畅，为土地改革后的农业生产与农村信贷提供可靠保障。"
 JAP_Ceasefire_in_Japan: "日本列岛停火协议"
 JAP_Ceasefire_in_Japan_desc: ""
 JAP_Far_East_Council: "国际远东问题委员会"
 JAP_Far_East_Council_desc: "远东委员会是在二战末期，由中美俄法四国外长于南京会议决议成立的国际组织。由于俄罗斯在1947年单方面退出，且英法无力掌管远东事务，因此该组织现在由中美两大集团掌控。按照远东委员会当值主席托马斯·比森的指示。远东委员会应当负有审判战争罪犯、确保日本新政权存续、以及确保日本成为一个对世界革命有所贡献的社会主义国家等义务。"
 JAP_Constitutional_Creation_Committee: "宪法制定委员会"
 JAP_Constitutional_Creation_Committee_desc: ""
 JAP_War_Crimes_Special_Court: "战争罪与反人类罪特别法庭"
 JAP_War_Crimes_Special_Court_desc: "远东委员会主席托马斯·比森与驻日盟军最高统帅朱德发布特别公告，宣布在东京成立远东国际军事法庭，审判及惩罚被控告以个人身份或团体成员身份犯有破坏和平罪、破坏战争法规罪和违反人道罪的日本战犯。"
 JAP_Sue_Wartime_Murderers: "对反抗暴行案提起诉讼"
 JAP_Sue_Wartime_Murderers_desc: "基于联军总司令部（GHQ）的要求，从今日起开始从公职机构彻底驱逐一切犯有战争帮助行为的绝对主义分子。对于大日本一新会、大日本生产党等27个主要犯有战争罪、破坏罪和反革命罪的右翼团体实行武力解散。除此之外，劳动自卫队将对在1945年后在解放区内实行反抗暴行的人员实行逮捕并提出公诉。"
 JAP_Clearup_Wartime_Rubble: "清理废墟"
 JAP_Clearup_Wartime_Rubble_desc: ""
 JAP_Agricoop_Formation_Law: "农业协同组合法"
 JAP_Agricoop_Formation_Law_desc: ""
 JAP_Women_in_Workforce: "妇女参政权"
 JAP_Women_in_Workforce_desc: "在社会主义新社会中，无论男女都应当享有完全平等的政治权利。全国妇女联合会的平冢雷鸟、山川菊荣同志以法国妇女权益法为范本，推动出台了《女性人权拥护法》。该法案规定，凡是年满十八周岁的日本公民，不论性别，都享有同等的选举权和被选举权。"
 JAP_Electronics_Labor_Law: "电产劳动法"
 JAP_Electronics_Labor_Law_desc: "基于电产十条要求以及入江浩同志的观点，经济改革委员会的向坂逸郎同志与产别的听涛克巳同志共同制定了日本《労働基準法》。该法秉持生活保障权至上的理念，在确立劳动者享有基础生活保障、劳动尊严权与罢工权的同时，确立了电产型工资体系。劳动基准法是日本历史上第一部以劳工权益为核心的法律，具有重大历史意义。"
 JAP_Pullback_Opressive_Policies: "压制的诸制度撤废"
 JAP_Pullback_Opressive_Policies_desc: ""
 JAP_Socialist_Education_Law: "社会主义教育法"
 JAP_Socialist_Education_Law_desc: "在废除战前《教育敕语》与华族学校等糟粕后，日教组依据“教育是人民的义务”这一基本原则，提出了社会主义教育法的基本原则。该原则要求全体6-18岁的青少年强制性接受自然科学和社会科学的教育，并且将接受教育作为公民义务的一环。"
 JAP_Peoples_Republic_Constitution: "人民共和国宪法"
 JAP_Peoples_Republic_Constitution_desc: "经过长达半年的起草工作，在宪法制定委员会委员长约瑟夫·布罗德斯基的指示下，远东委员会与日本临时政治局即将开展宪法草案的最终讨论。这将是日本人民共和国的第一部宪法。"
 JAP_Reward_Progressive_Unions: "进步劳组奖励法"
 JAP_Reward_Progressive_Unions_desc: ""
 JAP_Promote_Union_Autonomy: "自治劳方向努力"
 JAP_Promote_Union_Autonomy_desc: ""
 JAP_Promote_Production_Democracy: "民主生产方向努力"
 JAP_Promote_Production_Democracy_desc: ""
 JAP_AJTFU_Formation: "全国劳连会"
 JAP_AJTFU_Formation_desc: ""
 JAP_Political_Unions_Congress: "公劳共斗大会"
 JAP_Political_Unions_Congress_desc: ""
 JAP_Northsea_Squadron: "北海工作组"
 JAP_Northsea_Squadron_desc: "得益于30年代的北海渔业罢工，社会党目前在北海道保留了不少地下组织。统战委员会将利用边界叛逃者引发的混乱，将工作组成员秘密送到青森和函馆，以便与当地的同志取得联系。"
 JAP_Socialist_Reform_Program: "日本列岛社会主义改造方案"
 JAP_Socialist_Reform_Program_desc: "日本列岛改造计划是远东委员会主席托马斯·比森与民政局劳动科科长爱奥多尔·科恩共同制定的改革计划。远东委员会试图通过强力的政治、经济及社会改革，将日本塑造为一个由总工会主导的马克思工联主义国家。"
 JAP_Elect_First_President: "首届全国政治委员会选举"
 JAP_Elect_First_President_desc: ""
 JAP_Accept_Social_Revolution_Linearity: "接纳社会革命一段论"
 JAP_Accept_Social_Revolution_Linearity_desc: "以山川均同志为首的民主人民阵线已经准备好承担组建第一届共和国的任务。劳农派的“社会革命一段论”虽与美国工联主义存在差异，但符合日本国情，远东委员会认为应当予以信任。相信在山川均同志的领导下，日本定能更好更快地完成民主化进程与社会主义改造。"
 JAP_Farmer_Comrade_Organization: "农民同志会主导"
 JAP_Farmer_Comrade_Organization_desc: ""
 JAP_Farmer_Union_Organization: "农民连大会"
 JAP_Farmer_Union_Organization_desc: ""
 JAP_Life_Sustaining_First: "生活保障权优先"
 JAP_Life_Sustaining_First_desc: "任何愿意勤劳工作的人都应当享有生活保障权！经济统筹委员长向坂逸郎同志主张：共和国政府应当通过缩减工时、适度调节工资水平，为每一位劳动者创造就业岗位，从而真正保障其基本生存权。这一主张以降低工时和工资为代价，换取充分的就业机会，使全体劳动者都能在社会主义改造中安身立命。"
 JAP_Labor_Reliance_System: "劳组依存体制"
 JAP_Labor_Reliance_System_desc: ""
