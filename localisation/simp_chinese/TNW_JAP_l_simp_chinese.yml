 JAP_report_on_Matsukawa_incident: "松川事件报告书"
 JAP_report_on_Matsukawa_incident_desc: "现已查明，松川事件就是反革命分子中曾根康弘策划实施的恐怖主义行为。然而自卫队在应对过程中暴露出严重的混乱无能，引发了全社会的严重不安。无论自卫队内部给出何种处理结果，松川事件都必须尽快结案。当前社会主义政府需要责令自卫队立即出具正式报告书，用于对罪犯中曾根康弘提起公诉。"
 JAP_worse_than_imagined: "拆分自卫队武装与警察职责"
 JAP_worse_than_imagined_desc: "自下山事件起，自卫队在后续的三鹰事件、松川事件中丑态频出，甚至出现了GHQ比远东委员会和日本政府更早获知三鹰事件相关信息的情况。国防对策委员会委员长绀野裕次郎认为，劳动自卫队必须立即开展全面整肃、改革体制，明确各部门保卫革命职责的分工。"
 JAP_republic_security_council: "共和国保卫委员会"
 JAP_republic_security_council_desc: "在拆分自卫队的警察职责之后，新设立的共和国保卫委员会将接管国内治安与反革命侦查工作，使劳动自卫队得以专心履行国防义务。"
