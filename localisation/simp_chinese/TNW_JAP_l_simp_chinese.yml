 JAP_Prepare_Imminently_desc: ""
 JAP_Production_Management_Model: "生产管理模式"
 JAP_Production_Management_Model_desc: ""
 JAP_Support_China_Revolution: "支援中国革命"
 JAP_Support_China_Revolution_desc: ""
 JAP_postwar_econ_reform: "战后经济改革"
 JAP_postwar_econ_reform_desc: ""
 JAP_leaned_production: "倾斜式生产"
 JAP_leaned_production_desc: ""
 JAP_manufacturing_economy: "加工型经济"
 JAP_manufacturing_economy_desc: ""
 JAP_evaluate_coalsteel_industry: "煤铁产业需求评估"
 JAP_evaluate_coalsteel_industry_desc: ""
 JAP_electroproduction_salary_mode: "电产型工资体系"
 JAP_electroproduction_salary_mode_desc: "所谓电产工资体系，本质上是以从业人员生活状况的实地调查为依据，采用基于恩格尔系数的基本生活费计算方式，并纳入物价波动等影响要素，以此明确劳动者应得的劳动报酬。作为初步踏入社会主义的我国，应当贯彻落实这一制度，让工人的权益得到切实保障。"
 JAP_economic_independence: "经济自主"
 JAP_economic_independence_desc: ""
 JAP_physics_chemistry_lab: "理化学研究所"
 JAP_physics_chemistry_lab_desc: ""
 JAP_metropolitan_renovation: "革新都市计划"
 JAP_metropolitan_renovation_desc: ""
 JAP_american_absolute_government: "米山提携政府"
 JAP_american_absolute_government_desc: "日本劳农派马克思主义者及其同党民主人民阵线，至今仍坚持列宁式先锋队主义的错误观点，且在战前还犯有清算主义的错误。因此，遵照托马斯·比森主席的指示，现要求米田刚三、山本悬藏等可信任的同志进入第一届共和国政府班底，并负责引领日本走上正确的马克思工联主义道路。"
 JAP_combined_manufacturing: "联合式生产"
 JAP_combined_manufacturing_desc: ""
 JAP_labour_rights_law: "劳动权益法案"
 JAP_labour_rights_law_desc: ""
 JAP_american_economic_assistance: "美国经济援助"
 JAP_american_economic_assistance_desc: ""
 JAP_japanese_deleonism: "德莱昂主义日本化"
 JAP_japanese_deleonism_desc: ""
 JAP_unite_farmer_association: "统一农协"
 JAP_unite_farmer_association_desc: ""
