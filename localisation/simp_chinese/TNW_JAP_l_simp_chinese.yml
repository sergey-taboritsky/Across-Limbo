 JAP_american_military_direction: "美式军事指导"
 JAP_american_military_direction_desc: "作为我们祖国的解放者之一，美国军队的强大是世界人民有目共睹的。劳动自卫队须以美国为蓝本进行彻底的军事改革。"
 JAP_mechanized_red_army: "机械化红军"
 JAP_mechanized_red_army_desc: "美国在太平洋战争中的机械化作战和民兵制度证明了其战争模式非常有效。我们须学习这一模式，将机械化作战理念全面引入我军。"
 JAP_chinese_military_direction: "中式军事指导"
 JAP_chinese_military_direction_desc: "作为我们祖国的解放者之一，国民革命军的建军模式与战术思想更符合自卫队的作战要求。劳动自卫队须以中国为蓝本进行彻底的军事改革。"
 JAP_whampoa_experiences: "黄埔经验"
 JAP_whampoa_experiences_desc: "在抗击帝国主义侵略的战斗中，国民革命军充分证明了黄埔精神的决定性价值。新日本劳动自卫队须全面汲取国民革命军的黄埔精神，引入中式政治建军与作战训练，以革命理想凝聚军心，锻造一支绝对忠于人民、敢于牺牲的新型武装力量。"
