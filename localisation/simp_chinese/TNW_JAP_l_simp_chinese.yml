 JAP_assess_labour_defense_force: "评估劳动自卫队现状"
 JAP_assess_labour_defense_force_desc: "劳动自卫队是1945年起，由各地工厂工人自发组建的护厂队伍，因此自卫队作战部队基本采取民兵模式。这导致自卫队作为一支军队却纪律涣散，完全不具备抵御北方入侵的作战能力。国防对策委员会委员长绀野裕次郎同志需要对自卫队的现状开展一系列评估，以此确定后续改革的方向。"
 JAP_resist_pseudo_empire: "抵抗伪帝国军队"
 JAP_resist_pseudo_empire_desc: "旧帝国军队在败亡奥羽地区后仍然野心不死，仍盘踞于东北一隅伺机反扑。劳动自卫队必须做好与其决战的准备，彻底肃清这支为帝国主义招魂的残余武装。"
 JAP_defense_negotiation_with_unions: "同产别谈判"
 JAP_defense_negotiation_with_unions_desc: "自卫队承担着保卫祖国、防范资本主义复辟与帝国主义反攻的义务，肩负保卫千万劳动者自由的使命。产别会议无论如何都应当支持立即开展军事改革，至于自卫队改革的主导权，这可能需要产别向政府进行一些让步。"
 JAP_worker_soldier_separation: "脱产军队"
 JAP_worker_soldier_separation_desc: "除了曾参加革命战争的老兵之外，大多数自卫队成员都是在职工人和义务作战人员，甚至一线作战部队中还有成建制的妇女先锋队。革命战争绝对不是儿戏，非专业作战人员的军事素质无法承担未来高强度作战任务。因此，军事局的长谷川茂同志提出要求：立即停止义务兵役制与民兵制度，并以职业军人取代工人民兵，以此终结自卫队过家家一样的兵役制度。"
 JAP_stick_with_worker_militia: "劳动者的自卫队"
 JAP_stick_with_worker_militia_desc: "自卫队在东京会战中的出色表现，足以证明工人民兵完全可以承担作战任务。同时出于对旧帝国军队的历史恐惧，一味引入专业军事人员反而可能引发劳动阶级的恐慌。此外，和职业军队相比，民兵制度本身具备嵌入社会的动员与情报优势，还拥有更灵活广泛的战争理念。军事局的大冢有章同志认为，在提升社会主义武装力量专业性的基础上，自卫队仍应当保留一定自治权，委员会应当相信劳动人民的力量。"
