#决议
 JAP_socialist_reform_category: "工团主义试验田"
 JAP_socialist_reform_category_desc: "§R《日本列岛社会主义改造计划》§!是托马斯·比森和远东委员会的美国集团所制定的日本重建计划，也是南日本社会主义初步建设的蓝图。在该计划书中，托马斯·比森与爱奥多尔·科恩详细地规划了日本的重建工作、经济改造以及社会改造，旨在以激进的工团主义改革措施，将日本变成一个令世界人民羡慕的社会主义共和国，证明共产主义并非空想而是科学。\n\n工团主义实验的成功与否取决于以下几个指标\n1.	煤铁产量（只计算加工不计算矿产）\n2.	教育水平（学校的普及度和数量来计算）\n3.	民众的生活质量（统计民用工厂数量）\n4.	工团主义热情（[?JAP_socialist_reform_enthusiasm_var]%）\n5.	实行生产管理模式的工厂百分比\n\n要想使工团主义实验成功，则必须使这五个数值达到一定数值，如果在1951年有一项没有达成，那么改造计划或将遭遇§Y严重挫折§!。"
 JAP_socialist_reform_enthusiasm_small_rise_tt: "工团主义热情将§G小幅提升§!" #0-2
 JAP_socialist_reform_enthusiasm_mid_rise_tt: "工团主义热情将§G中幅提升§!" #2.5-5
 JAP_socialist_reform_enthusiasm_large_rise_tt: "工团主义热情将§G大幅提升§!" #5.5+
 JAP_socialist_reform_enthusiasm_small_fall_tt: "工团主义热情将§R小幅衰减§!" #0-2
 JAP_socialist_reform_enthusiasm_mid_fall_tt: "工团主义热情将§R中幅衰减§!" #2.5-5
 JAP_socialist_reform_enthusiasm_large_fall_tt: "工团主义热情将§R大幅衰减§!" #5.5+

 JAP_food_crisis_category: "食粮危机"
 JAP_food_crisis_category_desc: "战后的日本百废待兴，而撤到北方的帝国临走前焚毁了所有粮食储备。如今正值春耕时节，距离今年粮食收获尚要等待至少半年，因此我们必须稳住政府建立后第一年的粮食供给。\n\n以下决议中，抬升供给度到100则粮食危机将会成功解除。注意：§Y如果食粮劳动节事件链没有解决，那么工团主义实验的未来将会蒙上阴影！§!\n\n粮食供给度：[?JAP_food_crisis_stash_var]/100"
 JAP_End_Food_Crisis_tt: "§Y食粮危机§!已经结束"
 JAP_food_crisis_decision_if_success_tt: "§G若该决议成功：§!"
 JAP_food_crisis_decision_if_fail_tt: "§R若该决议失败：§!"
 JAP_food_crisis_trade_unions_impatience_mission: "产别耐心即将耗尽......"
 JAP_food_crisis_trade_unions_impatience_mission_desc: "解决粮食危机的方法具有延后性，而产别只能给出短短数十天的时间窗口。若要完美渡过这一危机，我们必须尽可能拖延产别怒火降临的时间，同时尽可能加速粮食供应落实。"
 JAP_food_crisis_stash_fulfilled_tt: "粮食供给度满足要求"
 JAP_food_crisis_convince_america_decision: "申请美利坚援助"
 JAP_food_crisis_convince_america_decision_desc: "我们将派遣使者赴美，说服美利坚劳联会对日提供援助和低息贷款。本决议首次使用必然成功，但是每点一次都会降低成功率"
 JAP_food_crisis_convince_france_decision: "申请英法援助"
 JAP_food_crisis_convince_france_decision_desc: "我们将派遣使者赴欧，说服英国工党和法国共产党对日提供援助和低息贷款。本决议首次使用成功率5%，且每点一次都会降低成功率"
 JAP_food_crisis_Taiwan_negotiation_decision: "与国民政府谈判"
 JAP_food_crisis_Taiwan_negotiation_decision_desc: "台湾曾经是我们粮食供应的重要来源，而它如今早已回归中国。不过，我们仍可以就台湾农地资源问题与国民政府谈判，争取获得部分台湾的粮食产出，以交换在台湾土改中为中方提供协助。"
 JAP_food_crisis_Taiwan_negotiation_decision_tt_a: "由于我方开出的条件略高，§R中国共产党§!赢得台湾地方选举的成功率略微下降"
 JAP_food_crisis_Taiwan_negotiation_decision_tt_b: "由于我方开出的条件略低，§R中国共产党§!赢得台湾地方选举的成功率略微上升"
 JAP_food_crisis_steal_money_decision: "扣留对华援助"
 JAP_food_crisis_steal_money_decision_desc: "扣留工人国际对中国的援助款项，并将其暂时挪用以购买粮食。"
 JAP_food_crisis_harsher_rationing_decision: "实行更科学的配给制"
 JAP_food_crisis_harsher_rationing_decision_desc: "实行更科学更严苛的配给制\n本决议仅可选择一次"
 JAP_food_crisis_exploit_huludao_decision: "利用葫芦岛混乱"
 JAP_food_crisis_exploit_huludao_decision_desc: "利用葫芦岛返还的混乱走私粮食"
 JAP_food_crisis_exploit_huludao_decision_decision_tt_a: "由于走私商人携款潜逃，此次行动并未产生任何成果"
 JAP_food_crisis_exploit_huludao_decision_decision_tt_b: "由于行动被俄国发现，此次行动彻底失败"

