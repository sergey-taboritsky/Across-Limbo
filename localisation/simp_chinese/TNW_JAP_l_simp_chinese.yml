#事件
 JAP_event.1.t: "第四次福岛战役"
 JAP_event.1.d: "早在革命之初，中美联军与日本赤卫队便都认为胜利的果实唾手可得——东京会战占领了东京，第一次福岛战役控制了东北，仿佛几个月内日本全国就将迎来解放。就在这时，俄军出手了。\n\n第二次福岛战役期间，俄军协助帝国军队无情地撕碎了工团军队的防线。第三次，联军司令朱德亲自指挥，也未能重新将城市夺回。\n\n就在几天前，第四次福岛战役也最终得出了结果——日本军队与俄罗斯斯沃博达志愿军在第四次福岛会战中击败了中美联军。在福岛的连续三次重大失利，很可能将会迫使日本战区最高司令朱德和美军总司令巴特勒同意签订福岛停火协议，并且在日本列岛暂停大规模军事行动。"
 JAP_event.1.a: "日本南北分裂的局势将成为定局吗？"
 JAP_event.2.t: "维也纳会议"
 JAP_event.2.d: "中美联军与俄罗斯的代表在维也纳经过数天的磋商后，停火协议最终达成。按照规定，除米泽线的共同警备区外，中美俄等第三国不得在本州岛东部及东北部设置军事基地。尽管停火并不是真正意义上的终结战争，但日本列岛停火协议的签订仍然被认为是第二次世界大战结束的标志。\n\n在停战协定签订后，日本形成了南北对峙的局势。北部的旧日本帝国在俄罗斯的扶持下得以苟延残喘，而一个新生的工人政权出现在了福岛以南。"
 JAP_event.2.a: "那接下来呢？"
 JAP_event.3.t: "国际远东联合委员会"
 JAP_event.3.d: "早在太平洋战争末期，国民政府和工人国际就在如何建立新的日本政府就有所分歧。按照1945年中美重庆会议的结果，双方本期望建立一个由中美主导的中立民主过度政府，同时不排斥保留天皇制。\n\n然而，由于霸王行动的失利与京都大阪起义，外加产别战斗队组织的东京二一总蜂起，日本意料之外地居然出现了一个工人政权，并且驻日国军的朱德总司令和美国人都承认新政权的合法性。显然，无论南京国府如何要求，所谓亲中的新民主主义政府都是不可能实现的了，战后的南日本必然是一个亲美的工团主义政权。\n\n1948年2月，在工人国际牵头和国民政府的协作下，负责解决日本占领政策和宪法制定的远东问题委员会宣告成立。原工人国际日本联络员托马斯·比森担任主席，远征军总司令朱德出任日本占领军总司令。\n\n雄心勃勃的托马斯·比森主席与他的战友——劳动科长爱奥多尔·科恩共同制定了《日本列岛改造计划》，该计划旨在1957年之前将日本建设成为一个最为进步、最富革命性的工团主义国家。比森和他的理想主义同志们，要把日本塑造成一个工团主义的灯塔，以此向世界人民证明——共产主义绝不是一个空想，而是科学。"
 JAP_event.3.a: "社会主义日本万岁！"

 JAP_news_event.1.t: "日本列岛停火协定"
 JAP_news_event.1.d: "《日本列岛停火协定》于今日14时在奥地利首都维也纳正式签署。在美联盟、中华民国与俄罗斯三方联合调解下，日本帝国陆军参谋总长重光葵大将与民主人民阵线代表大山郁夫共同签署了这份具有历史意义的文件。\n\n根据协定，双方将自1月30日零时起全面停止军事行动，并沿当前实际控制线设立纵深五公里的非军事缓冲区。协议还明确规定：俄军不得在本州岛驻军，中美联军不得在东日本地区设立军事基地。对于俄罗斯提出的开放宫古海峡与对马海峡的主张，各方未能达成一致。\n\n自1945年6月战事爆发以来，日本本土的战争已造成逾三百六十万民众伤亡。受日本帝国军队“一亿玉碎”政策影响，福岛县以南地区人口减少20%，工业基础设施损毁率高达87%，东京、大阪等主要城市几近废墟，大量劳动人口被有组织性地屠杀。自1947年起，双方战线沿新潟-山形-福岛一线陷入长期僵持，均无力实现决定性突破，最终导致了这份协议的诞生。"
 JAP_news_event.1.a: "至少世界大战终于结束了。"
 JAP_news_event.1.b: "日本的工人阶级在战场上证明了自己的力量！"
 JAP_news_event.1.c: "又一次“二十年的休战”罢了。"
 JAP_news_event.1.e: "国仇家恨何为？"
 JAP_news_event.1.f: "内战结束了。"
 JAP_news_event.1.g: "内战结束了。"
 JAP_news_event.2.t: "远东委员会宣布结束占领状态"
 JAP_news_event.2.d: "远东委员会今日于东京正式宣布，自1947年起实施的《日本列岛社会主义改造计划》已达成预定目标，日本的政治、生产、外交均实现彻底的民主化，证明了马克思主义绝不是空想而是科学。委员会同时宣布，对日占领状态自即日起正式结束，日本劳动者公社将恢复完全主权。\n\n在为期五年的改革进程中，英勇且坚韧的日本劳动者们出色地完成了工业公有化、土地改革与工会民主体系的制度化建设。百分之九十五以上的在职工人均有高于世界基准的可支配收入，发展指数高于全世界各国，而劳联会作为工人阶级代议机构正式行使最高权力的构想被证明为可能。在工人阶级的领导下，日本主要城市重建基本完成，配给制度有序退出。\n\n原定更早结束的占领状态因数次边境危机而延迟，今日的决定标志着工团主义对日改造路线取得阶段性成功。即日起，劳动自卫队恢复完整国防职能，远东委员会代表团将在一周内撤离东京。"
 JAP_news_event.2.a: "令人震惊。"
 JAP_news_event.2.b: "工人阶级的自我管理不是空想，而是可以实践的科学！"
 JAP_news_event.2.c: "欢迎托马斯·比森同志回国！"
 JAP_news_event.2.e: "也只有无耻的工团分子才会把摧毁祖国这件事讲述的如此神圣。"
 JAP_news_event.2.f: "新日本？"
 JAP_news_event.3.t: "远东委员会勒令托马斯·比森辞职"
 JAP_news_event.3.d: "远东委员会今日正式宣布，在新一轮的委员会表决会议中，大会决定免去托马斯·比森同志远东委员会主席职务，其职务由中华民国代表邵力子同志接任。\n\n比森同志于1947年2月受命主持《日本列岛社会主义改造计划》，其脱离客观实际，从空想角度出发，盲目地进行错误的社会改造。在过去一年间，日本南部地区重建进展远低于预期。工业产能恢复仍然不足战前百分之十五，生活物资配给持续紧张。在上月由共产劳动党举办的生活保障大会上，民众代表对比森改革路线提出激烈的批评，指出过度依赖行政命令、脱离实际等根本性问题。\n\n远东委员会经审议认定，现行改造路线已陷入困境，须更换领导层以调整方针。比森同志将返回美国继续从事理论工作。"
 JAP_news_event.3.a: "理想主义者试图在废墟上建造人间天堂。"
 JAP_news_event.3.b: "那之后怎么办？"
 JAP_news_event.3.c: "工团分子的可笑闹剧。"
 JAP_news_event.3.e: "仲辉同志的就任标志着中国在日本的政治胜利。"
 JAP_news_event.4.t: "下越侵攻"
 JAP_news_event.4.d: "今日凌晨4时，日本帝国陆军以“缉捕越境破坏分子”为由，沿新潟边境展开军事行动。自上月国民革命军驻日占领军启动阶段性撤军以来，北日本方面已多次在福岛边境地带进行武装侦察。此次侵攻中，帝国陆军投入约三个师团兵力，沿阿贺野川河谷向南推进，至日落前已占领新潟，成功截断新潟至东京段的铁路线。\n\n此役使得东京与日本海沿岸的陆地联系将被完全切断，帝国大本营在推进峰值后于傍晚发出单方面停火声明，称此次行动已达到预定目标，无意引发全面战事。\n\n分析人士指出，北日此举意在利用中美反应的时间窗口，尽可能扩大控制区，待联军抵达前巩固既得阵地。驻日美军司令部发言人表示将在四十八小时内对局势做出评估。"
 JAP_news_event.4.a: "一次精心算计的抢劫。"
 JAP_news_event.4.b: "帝国主义残余破坏世界和平的又一罪证！"
 JAP_news_event.4.c: "出色的进攻！"
 JAP_news_event.4.e: "他妈的！反了天了！"
 JAP_news_event.5.t: "下越侵攻"
 JAP_news_event.5.d: "今日凌晨4时，日本帝国陆军以“缉捕越境破坏分子”为由，沿新潟边境全线展开军事行动。自上月国民革命军驻日占领军启动阶段性撤军以来，北日本方面已多次在福岛边境地带进行武装侦察。帝国陆军投入约三个师团兵力，沿阿贺野川河谷向南推进，遭遇劳动自卫队依托预设工事的顽强阻击。\n\n至午后，自卫队发动反击，将入侵部队逐回出发阵地。傍晚时分，劳动自卫队的进攻已经越过了停火线，炮兵对山形县临时皇居周边实施警告性炮击，数枚炮弹落入距御所两公里范围内，是否造成人员伤亡未知。\n\n北日本大本营于当夜紧急宣布停止一切进攻行动。分析人士指出，北日本溃败暴露了其指挥部对自卫队防御能力的评估存在严重误判。"
 JAP_news_event.5.a: "那句话怎么说来着？胜利转进？"
 JAP_news_event.5.b: "工人同志们打的好啊！"
 JAP_news_event.5.c: "工团主义者正在密谋组建进攻性力量，意图向爱国阵营发起进攻。"
 JAP_news_event.5.e: "幸亏没出大乱子。"
 JAP_news_event.6.t: "祖国复归运动"
 JAP_news_event.6.d: "今日上午，愤怒的北海道罢工群众攻入斯韦勒莫耶委员会办公楼，并将旗杆上的俄罗斯国旗替换为大日本帝国国旗。罢工工人喊出“祖国日本即刻复归”的口号，要求俄军撤离北海道，并终结俄罗斯斯维勒摩耶委员会对北海道长达六年的实际控制。\n\n自上月北海道与仙台工人突破津轻海峡实现跨海联动以来，群众运动已从函馆、札幌蔓延至青森、盛冈、秋田，甚至越过福岛停火线，在南日本东京、大阪引发万人规模的声援集会。运动中，俄罗斯青年战斗民族主义组织与示威群众爆发激烈冲突，在札幌、小樽等地持械攻击罢工队伍，造成数百人伤亡。\n\n此次运动虽以回归北日本政权为目标，但据斯韦勒莫耶委员会发言人称，运动中有大量南日本活动家秘密潜伏在罢工群众中。\n\n针对远东局势，俄军驻北海道部队已进入警戒状态，远东委员会今日召开紧急闭门会议。萨文科夫元首至今未就此发表公开讲话。"
 JAP_news_event.6.a: "一面纯白的旗帜，中间升起一轮赤红色的太阳。"
 
