#欢迎界面
 TNW_welcome_JAP_intro_text_1: "1945年，太平洋战争已经接近尾声。美军在冲绳战役取得胜利，而国民政府的反攻也势如破竹。在经历无数辩论与最后通牒后，美军开展霸王行动，对九州、四国以及南本州地区展开登陆。然而，由于日军本土作战加上焦土政策，霸王行动的后续非常不顺利。同时，评议会领导的产别会议组建了劳动自卫队，在京都、大阪等西日本城市对抗日帝的暴行并协助美军。\n\n1946年年末，俄国介入远东地区，帝国政府向俄罗斯国单方面投降。此时俄罗斯正在就远东问题与中美谈判。就日本问题，俄方有意建立一个由中美俄三国共管的、保留天皇制度的统一日本政府，美方则希望保留革命果实，实行日本南北分治。美俄谈判味着日本已经被送上了谈判桌，无论是产别还是天皇都已经沦为筹码，这是日本劳动者-尤其是当时还处于日帝控制的东京的劳动者所不能接受的。因此，产别会议在未知会美军的情况下，擅自决定要在东京组织一场起义。\n\n1947年1月31日，在劳动自卫队东京军事局委员长长谷午麿的指挥下，东京二十一个地下工会率先发动罢工和起义，随后又有11个温和工会与民同系工会也开始响应，爆发了“二一总蜂起”。在联军的支援下，起义军与日军的交战烈度逐渐增大。随后在托马斯比森的请求下，联军总司令朱德决定介入东京，起义演化为了东京会战。5月，日军与天皇被迫撤离东京。\n\n由于日本平衡被打破，俄军开始介入日本及远东局势。\n\n1947年6月，在彻底埋葬日本帝国主义的呼声下，联军在陆奥地区展开了一系列攻势，攻破福岛。同年秋季，中日双方在福岛地区展开了接连三次会战。在俄罗斯的援助下，日军对联军予以重创，并且在第二次会战中收复了福岛。\n\n1947年12月，日本军队与俄罗斯国斯沃博达志愿军在第四次福岛会战中击败了中美联军。在福岛的连续三次重大失利，迫使日本战区最高司令朱德和美军总司令巴特勒决意签订福岛停火协议，并且在日本列岛暂停大规模军事行动。\n\n仍在谈判中的停火协议雏形规定，除米泽线的共同警备区外，中美俄等第三国不得在本州岛东部及东北部设置军事基地。尽管停火并不是真正意义上的终结战争，但日本列岛停火协议的签订仍然被认为是第二次世界大战结束的标志。\n\n在停战协定签订后，日本形成了南北对峙的局势。北部的旧日本帝国在俄罗斯的扶持下得以苟延残喘，而一个新生的工人政权出现在了福岛以南。"
 TNW_welcome_JAP_intro_text_2: "早在太平洋战争末期，国民政府和工人国际就在如何建立新的日本政府就有所分歧。根据重庆会议的结果，两国的共识是期望建立一个由中美主导的日本民主过度政府，起初甚至想要保留天皇制。\n\n然而，由于霸王行动的失利和京都大阪的起义，再加上后来产别战斗队组织的东京二一总蜂起，使日本居然出现了一个工人政权，并且朱德总司令和美国人都承认这个新政权的合法性。显然，无论南京的国民政府怎么要求，所谓亲中的新民主主义政府都是不可能实现的了，战后的南日本必然是一个亲美的工团主义的政府。\n\n1948年2月，在工人国际牵头和国民政府的协作下，负责解决日本占领政策和宪法制定的远东问题委员会宣告成立。原工人国际日本联络员托马斯·比森担任主席，远征军总司令朱德出任日本占领军总司令。\n\n雄心勃勃的托马斯·比森主席与他的战友——劳动科长爱奥多尔·科恩共同制定了《日本列岛改造计划》，该计划旨在1957年之前将日本建设成为一个最为进步、最富革命性的工团主义国家。比森和他的理想主义同志们，要把日本塑造成一个工团主义的灯塔，以此向世界人民证明——共产主义绝不是一个空想，而是科学。\n\n试想，如果连日本这样的封建帝国主义国家都能够实现共产主义，还有哪个国家不能实现共产主义呢？"
 TNW_welcome_JAP_intro_text_3: "为了更好地帮助比森同志完成他塑造工人天国的梦想，我们必须介绍日本南部的情况\n\n1.	所有城市均被日帝实行焦土政策（包括北日本控制的福岛），其战前的工业、公共设施和教育机构被系统性摧毁。东京及新潟则因为解放时间相对较晚，未来得及实行玉碎，其工业保存相对完好，不过也至仅保留战前40%。不仅如此，南部地区的人口经历了战争和系统性屠杀，总计544万人口因非正常原因死亡。\n\n2.	食粮紧缺。在任何时代，人都不能没有吃的，要怎么样养活战后南部5000万张嘴是一个困难的问题。可恨的是，日帝政权几乎没有给南方人民留下粮食，东京、大阪和京都的食粮储备严重告罄，工人政权很有可能因为粮食问题而摇摇欲坠。没有粮食，工人们吃什么！是啊，吃什么？\n\n3.	大工会，小政党，军队服从于产别而不是党和国家。由于受到工团主义影响并且狱内指挥部长期失联，产别的前身——劳动评议会独立发展，至1945年已经形成了巨大的劳动者地下网络。一亿玉碎计划实行之际，在产别会议的号召下，大阪、京都的劳动者率先组织劳动自卫队对抗日帝军队，而现在承担南日本国防责任的正是自卫队。因为这层历史缘故，劳动自卫队自然是听从工会的指挥而不是党和国家。\n\n4.	国防问题。\n南日本：22万工人自卫队\n国际联军：30万美军，4-5万国民革命军\n北日本：35万甲乙军团，65万丙丁军团，6-7万俄军\n劳动自卫队目前仅有22万人左右的战斗部队，与拥有100万参加本土决战的帝国陆军相比有一些差距。并且，劳动自卫队要承担一部分的国内治安工作。不仅如此，自卫队士兵大多数是没有受到过军事训练的普通工人，其中还有相当一部分妇女战斗队，甚至有相当一部分人还没有脱产。尽管南北在国际社会的操控下实现了停火，但是多次的小规模的军事冲突和军力对比表明，如果不依靠驻日国民革命军的帮助，南部政权对北方的侵略毫无还手之力。\n\n5.	公职追放问题。战前的官僚与技术人员中，不少人并未撤往北方，且他们在战时大多存在污点，如何公正处置这些人成为亟待解决的问题。至于公务员系统，比森倒无需费心——产别的官公労和全官労已完全掌控日本官僚体系，他即便想插手也无能为力。\n\n6.	还有不少，但我暂时先写到这里，日后再补充\n\n就这么说吧，比森的目标就是：在一片几乎是白地的土地上，让一群混乱到到底听从党还是工会都不知道的工人们，在十年之后达成共产主义。\n\n马克思大菩萨在上啊！（胸口画齿轮锤子）\n\n不过，比森并不是没有盟友。产别会议和民主人民战线——社会党和共产党的联立——将美军视为解放者，目前还“坚定不移”地站在比森的身边。"
 TNW_welcome_JAP_intro_text_4: "需注意的是，此社会党并非OTL的社会党（尽管二者重合度较高）。1922 年，在法国社会主义革命的激励下，日本社会主义者决定继承 1906 年社会党的精神，重新组建第二次社会党。此次社会党的理论指导以山川主义为主，故而也被称作山川社会党。\n\n1926 年，福本和夫与佐野学趁山川均等人入狱之机，于上海发布了《上海一月提纲》，宣称党将不再施行山川主义纲领，而以福本共产主义党纲取代原有党纲。\n\n福本和夫对党的改组，显然未得到尚在狱中的社会党中央以及工人国际的批准。因此，在山川均等人出狱后，强烈谴责福本和夫篡夺党权的行径。1927 年，福本和夫与山川均各率八名代表前往法国巴黎，在工人国际大会上展开辩论。最终，法国工人国际委员长蒙索目判定山川主义取得完全胜利，同时也对山川主义的合法主义倾向提出了批评。此后，劳农派的大内兵卫留驻法国，取代片山潜成为工人国际日本支部的常务委员。\n\n福本和夫和佐野学等人拒不服从工人国际的指示，决定重建共产党。九名福本派成员均未返回日本，而是留在法国并进入共产主义学院学习。福本派的渡边正之辅、德田球一、河合悦三等后来陆续回国，试图即刻发动武装革命。渡边在台湾遇害，德田后来在三一五四一六事件中也不幸遇难，这都是后话。\n\n后来，共产党的市川正一、国领五一郎等人决定接受社会党的三二年提纲，与社会党组建人民战线。尽管党中央做出了与社会党合流的决策，但福本和夫等人依旧拒不服从党的决定，强烈反对组建人民阵线，因而被共产党开除。之后，福本和夫等人在英国重建共产党（统一协议会）。与相对稳健、温和且采取隐蔽阵线策略的社会党相比，英国委员会始终坚持大张旗鼓地反对战争、反对绝对主义政府的立场。\n\n1937 年人民阵线事件中，社会党的皮套无产党遭遇大规模逮捕，人民阵线事件使社会党和共产党的大多数党员被捕入狱。在狱中，共产党和社会党逐渐合流，两党结下了深厚的革命情谊。战后，在山川均的倡议下，社共两党组建了现今的民主人民阵线。"
 TNW_welcome_JAP_intro_text_5: "俗话说，党内无派，千奇百怪。作为帐篷的民主人民阵线也有以下几个派系。\n\n社会党\n\n1.	社会党中央执行委员会：党中央，包括山川均、荒田寒村等劳农派老资历。后特别邀请前劳农党委员长大山郁夫加入社会党中央执行委员会。党中央坚定不移的实行劳农派马克思主义，将劳农派理论践行于社会生产之中。社会党中执委并不是一个独立的山头，相反，党内几乎所有山头都在此有一席之地——要知道向坂逸郎也是中执委的一员，但我们通常把他归类为协会派。在游戏中，中执委的地位很模糊，大概可以视为团结政府\n\n2.	労组协会派：以社会党阶级纲领铁三角——向坂逸郎、伊藤好道、稻村顺三核心。该派系大多数是激进的劳农派马克思主义者和德莱昂主义者，并且与产别的太田熏有强烈的依存关系。\n\n3.	社会主义研究会：以在战时吸纳的合法左翼和稳健派社会党党员为主，以铃木茂三郎为代表。研究会的意识形态是科学社会主义，并且是党内的劳农派稳健派，但也有极强的妥协倾向。与产别的高野实有依存关系。\n\n4.	社会主义讲座派：在蒙索目裁决之后，一些受到裁决影响归社会党的福本主义者，如市川正一、神山茂夫、伊藤律等。这些社会党人虽然接纳工团主义，但是仍然受到列宁主义的影响，不同意党对“列宁主义是俄国经验”的看法，主张左翼共产主义。\n\n5.	构造改革派：江田修正分子，改良社会主义\n\n6.	正统派议员团：由党内最左派的六名议员为核心的团体，反对工团实验失败后社会党中执委的稳健温和政策，以黑田寿男、冈田春夫为代表。正统派议员团既反对研究会的温和态度，又反对协会派的労组斗争至上原则，也厌恶讲座派为社会殖民主义辩护。其主张劳动者与农民的共斗，并且提倡三个世界理论。日后这帮人还会吸纳西泽隆二、大冢有章，他们会找到一个名为黑田思想的道路，在无产阶级专政下继续革命，意识形态是左翼共产主义。\n\n日本共产党\n\n1.	代代木系：日共党中央，以其总部在代代木公园得名，是日本共产党唯一主流的派系。\n\n共产党虽然是以福本主义为党纲建党的，但在开除福本和夫之后渐渐去除福本化，现在是一个以马克思列宁主义为指导思想的共产主义政党。\n\n日本共产党代代木系主张社会革命二段论，认为封建残余不可忽视。并且共产党所主张的农业革命，受到了农民的支持，日共的农民协是能与相对保守的农民同志会分庭抗礼的农民组织。\n\n除此之外，代代木下辖战无、节育同盟、科普罗是共和国重要的反封建助力\n\n2.	革命共产主义者同盟：由反对工团主义、莫斯利主义的反主流系共产主义者组成，这些人认为极权主义都是莫斯利主义。代表人物是太田龙与黑田宽一\n\n3.	日本之声：钝角\n\n以下党不是民主人民战线成员\n\n共労党\n\n全称共产主义劳动党，系日本战后除民主人民阵线之外的第二大党。1932年，福本和夫被开除出党后，与彼时身处英国的福本派成员佐野学、野坂参三、三田村四郎共同组建共产党统一协议会，该组织被共产党正统派称作“英国委员会”。英国委员会在战争期间坚定开展反战运动，鼓动无产阶级进行反抗，获得法国共产主义者和莫斯利的支持。战后，福本和夫返回国内，受到社会党和左翼界的欢迎。然而，福本和夫认为其与劳农派的矛盾不可调和，故而统一协议会拒绝加入民主人民战线，并组建共产主义劳动党与民主人民战线相抗衡。 \n\n1.	英国委员会：福本和夫在英国的小团体和佐野学的上海机关\n\n2.	国内指挥部：在国内的武装共产党指挥部，代表人物为田中青玄、宫本显治。该派系因为文战战旗论争，十分反对民主人民战线"
 
