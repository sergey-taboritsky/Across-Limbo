 JAP_GHQ_communist_party: "远东国际委员会 - 巴黎系"
 JAP_GHQ_communist_party_long: "工人国际远东临时委员会(法国派遣团)\n\n§W由法国方面派遣的规模较小的代表团主要由陆军中将亨利·罗尔-唐吉率领，其主要目标为协助远东委员会的主流与日本共产主义者进行沟通，以确保共产主义者加入日本政府。由于其政治目标主要为辅助政务与行驶军事占领义务，该派别并未表现出争取委员会领导权的动机。§!"
 JAP_GHQ_syndicalism_party: "产别/远东国际委员会 - 底特律系"
 JAP_GHQ_syndicalism_party_long: "日本产业别劳动组合总同盟/工人国际远东临时委员会(美国派遣团)\n\n§W美国是占领日本的主力军，也是远东委员会的主导力量。作为日本民主化改造运动的主要推手，庞大的美国代表团较为排斥另外三方的干预，期望独自完成对日本的改造。§!"
 JAP_GHQ_socialism_party: "远东国际委员会 - 伦敦系"
 JAP_GHQ_socialism_party_long: "工人国际远东临时委员会(英国派遣团)"
 JAP_GHQ_Social_democracy_party: "远东国际委员会 - 南京系"
 JAP_GHQ_Social_democracy_party_long: "工人国际远东临时委员会(中国派遣团)\n\n§W国民政府并没有对日本政务的过多诉求，但由于其作为日本侵略最严重的受害者，南京方面把持着新日本的外交工作，并通过“外交民主化”的名义尝试在日本外交界培养起亲中风潮。§!"

 JAP_communist_DPF_JCP_party: "民主人民阵线 - 日本共产党"
 JAP_communist_DPF_JCP_party_long: "民主人民阵线 - 日本共产党\n\n§W共产党虽以福本主义为党纲建党，但在开除福本和夫之后渐渐去除福本化，现在是一个以马克思列宁主义为指导思想的共产主义政党。\n\n日本共产党的党中央主张社会革命二段论，认为封建残余不可忽视。此外，共产党所主张的农业革命受到了农民的大力支持，日共的农民协是能与相对保守的农民同志会分庭抗礼的农民组织。除此之外，日共下辖的战无、节育同盟、科普罗也都是共和国重要的反封建助力。\n\n此外，党内还存在由太田龙与黑田宽一牵头的名为“革命共产主义者同盟”的分裂组织，由反对工团主义、莫斯利主义的反主流系共产主义者组成。§!"
 JAP_communist_JCLP_party: "共労党"
 JAP_communist_JCLP_party_long: "共产主义劳动党\n\n§W共产主义劳动党系日本战后除民主人民阵线之外的第二大党。1932年，福本和夫被开除出党后，与彼时身处英国的福本派成员佐野学、野坂参三、三田村四郎共同组建共产党统一协议会，该组织被共产党正统派称作“英国委员会”。英国委员会在战争期间坚定开展反战运动，鼓动无产阶级进行反抗，获得法国共产主义者和莫斯利的支持。\n\n战后，福本和夫返回国内，受到社会党和左翼界的欢迎。然而，福本和夫认为其与劳农派的矛盾不可调和，故而统一协议会拒绝加入民主人民战线，并组建共产主义劳动党与民主人民战线相抗衡。§!"
