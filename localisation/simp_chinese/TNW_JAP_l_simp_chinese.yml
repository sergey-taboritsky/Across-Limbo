#事件
 JAP_event.1.t: "第四次福岛战役"
 JAP_event.1.d: "早在革命之初，中美联军与日本赤卫队便都认为胜利的果实唾手可得——东京会战占领了东京，第一次福岛战役控制了东北，仿佛几个月内日本全国就将迎来解放。就在这时，俄军出手了。\n\n第二次福岛战役期间，俄军协助帝国军队无情地撕碎了工团军队的防线。第三次，联军司令朱德亲自指挥，也未能重新将城市夺回。\n\n就在几天前，第四次福岛战役也最终得出了结果——日本军队与俄罗斯斯沃博达志愿军在第四次福岛会战中击败了中美联军。在福岛的连续三次重大失利，很可能将会迫使日本战区最高司令朱德和美军总司令巴特勒同意签订福岛停火协议，并且在日本列岛暂停大规模军事行动。"
 JAP_event.1.a: "日本南北分裂的局势将成为定局吗？"
 JAP_event.2.t: "维也纳会议"
 JAP_event.2.d: "中美联军与俄罗斯的代表在维也纳经过数天的磋商后，停火协议最终达成。按照规定，除米泽线的共同警备区外，中美俄等第三国不得在本州岛东部及东北部设置军事基地。尽管停火并不是真正意义上的终结战争，但日本列岛停火协议的签订仍然被认为是第二次世界大战结束的标志。\n\n在停战协定签订后，日本形成了南北对峙的局势。北部的旧日本帝国在俄罗斯的扶持下得以苟延残喘，而一个新生的工人政权出现在了福岛以南。"
 JAP_event.2.a: "那接下来呢？"
 JAP_event.3.t: "国际远东联合委员会"
 JAP_event.3.d: "早在太平洋战争末期，国民政府和工人国际就在如何建立新的日本政府就有所分歧。按照1945年中美重庆会议的结果，双方本期望建立一个由中美主导的中立民主过度政府，同时不排斥保留天皇制。\n\n然而，由于霸王行动的失利与京都大阪起义，外加产别战斗队组织的东京二一总蜂起，日本意料之外地居然出现了一个工人政权，并且驻日国军的朱德总司令和美国人都承认新政权的合法性。显然，无论南京国府如何要求，所谓亲中的新民主主义政府都是不可能实现的了，战后的南日本必然是一个亲美的工团主义政权。\n\n1948年2月，在工人国际牵头和国民政府的协作下，负责解决日本占领政策和宪法制定的远东问题委员会宣告成立。原工人国际日本联络员托马斯·比森担任主席，远征军总司令朱德出任日本占领军总司令。\n\n雄心勃勃的托马斯·比森主席与他的战友——劳动科长爱奥多尔·科恩共同制定了《日本列岛改造计划》，该计划旨在1957年之前将日本建设成为一个最为进步、最富革命性的工团主义国家。比森和他的理想主义同志们，要把日本塑造成一个工团主义的灯塔，以此向世界人民证明——共产主义绝不是一个空想，而是科学。"
 JAP_event.3.a: "社会主义日本万岁！"
 JAP_event.4.t: "社会改造与《赤旗宪法》"
 JAP_event.4.d: "社会改造被委员会列为对日管制的头等要务。它要回答的，是一个根本问题：被解放后的日本，究竟要成为怎样一个社会主义国家？在委员会的长桌上，围绕着新宪法的三原则，争论早已超出了礼节的范围：有人要一个紧握枪杆的无产阶级专政，有人要一个温润如春的民主社会主义，也有人坚持只有工农的联盟才能托起这个岛国。\n\n其中，激进的产别工会主义者与委员会主席比森本人均支持无产阶级专政、马克思-工团主义与世界革命作为新国家的建国原则。与此同时，民主人民阵线方面提议三原则确定为工人阶级主导的民主政治、科学社会主义、国际和平主义，而福本派的共产主义劳动党则主张工人阶级主导的工农联盟、科学社会主义、世界革命。当然，在委员会接连不断的会议与争论中，他们最终还是达成了一致："
 JAP_event.4.a: "无产阶级专政-马克思工团主义-世界革命"
 JAP_event.4.b: "工人阶级民主-科学社会主义-国际和平主义"
 JAP_event.4.c: "工农联盟-科学社会主义-世界革命"
 JAP_event.5.t: "新日本的国歌"
 JAP_event.5.d: "《赤旗宪法》的墨迹未干，新的问题已经摆上台面。一个社会主义的日本，该用怎样的歌声宣示自己的存在？委员会内部对此争执不下。当然，选择《国际歌》是所有委员均认可的方案，但由于美国方面的反对导致远东委员会驳回了这一提案。\n\n日本教职员组合，作为产别的成员工会之一，提出了自身的方案，也即《绿色的山河》，此曲旋律取自乡土民谣，温厚而抒情，被认为最能弥合战争创伤，而这一提议也被认为是产别方面的总体意见。同时，共劳党则主张赤松克麿作词的《赤旗之歌》，但这一方案被社会党激烈反对：赤松克麿本人曾参与翼赞政治与绝对主义政权，如今仍身处北方。相应的，民主人民阵线主张《守护和平》，词曲平和，强调反战与劳动，试图在各方之间寻找最大公约数。最后，国铁劳动组合提议采用《听吧，万国的劳动者》，但远东委员会却直言它“不适合作为国歌”，曲调过于激昂，且与国际歌的意象高度重合，恐引发外交误会。\n\n在做出选择之前，必须明白：每一首候选歌曲背后，都站着不同的政治力量，也埋着不同的地雷。"
 JAP_event.5.a: "《绿色的山河》"
 JAP_event.5.b: "《赤旗之歌》"
 JAP_event.5.c: "《守护和平》"
 JAP_event.5.e: "《听吧，万国的劳动者》"
 JAP_event.6.t: "民权草案蓝本"
 JAP_event.6.d: "新宪法的骨架既立，血肉便要由民权草案来填充。委员会收到了五份立场迥异的意见书，它们将决定“权利”二字在日本究竟意味着什么。每一份草案都出自不同的流派与人物之手，背后是各自的政党与工会。委员会最终的抉择，等于在为新日本的法治定调。\n\n京都帝国大学法学集团的佐佐木惣一草案主张：人民应当免于奴役的恐惧，基本人权不可侵犯。这是一份带着自由主义底色的草案，最受知识分子与旧法曹界欢迎。相应的，自由律师团代表人物布施辰治的主张：社会主义的公理与正义至上，法律必须为被压迫者而存在。草案锋芒直指旧体制的剩余价值逻辑。同时，产别意见书主张：必须确保劳动者的尊严，劳动权是一切权利的前提。这份草案带着浓厚的工会本位色彩。此外，民主人民阵线理论家山川均的意见书主张：一切愿意诚实劳动的人，都应有生活保障权，也就是试图在革命理想与务实福利之间架桥。最后，共劳党最为激进的马克思主义者们在领袖野坂参三的意见书中主张：无产阶级专政必须压过一切，民权从属于阶级解放。这是最激进的一份，令温和派侧目。"
 JAP_event.6.a: "佐佐木惣一草案"
 JAP_event.6.b: "布施辰治草案"
 JAP_event.6.c: "产别意见书"
 JAP_event.6.e: "山川均（民主人民战线）意见书"
 JAP_event.6.f: "野坂参三（共労党）意见书"
 JAP_event.7.t: "日本革命的历史问题"
 JAP_event.7.d: "新国家需要一部自己的史书。委员会责令史学家重新书写“日本无产阶级运动”的开端——而“第一次”这个桂冠落在谁头上，将直接抬高其继承者在今日的政治身价。\n\n第一份方案主张将1908年赤旗事件奉为起点，强调思想启蒙先于武装。此举为社会党的统治叙事铺路，温和派系据此自证“正统”。第二份方案将足尾铜山矿工的怒火奉为起点，强调阶级反抗根植于剥削。此举利好日本共产党，为其“工农革命”论述提供历史依据。最后一份方案将1947年二一总罢工奉为起点，强调有组织的劳工总动员。此举利好产别与各人民自卫队，抬高其“革命主力”的地位。"
 JAP_event.7.a: "确立赤旗事件为第一次无产阶级运动"
 JAP_event.7.b: "确立足尾铜山骚乱为第一次无产阶级运动"
 JAP_event.7.c: "确立二一总蜂起为第一次无产阶级革命"
 JAP_event.8.t: "社会遗留问题的看待法"
 JAP_event.8.d: "最后一桩根本之争，关乎日本究竟“还剩多少旧世界的残骸”。对封建与资本的不同诊断，将决定革命下一步的步幅与方向——是急转向共产主义，还是先在民主的浅滩上站稳。\n\n委员会里的理论家们分作三派，各自握着一套看似精密、实则互相否定的公式。其中，日本社会党提出封建残余已被彻底消灭，日本劳动者面对的是资本主义与民族主义的挑战；无产阶级革命即奔赴共产主义的社会主义革命。随后，日本共产党则指出日本的封建残余不可忽视，明治维新是不彻底的资产阶级革命；日本革命是广泛包含资产阶级民主任务的无产阶级革命。最后，共劳党则认为日本资本主义在战前已达最高阶段垄断资本主义或帝国主义，而非社会党与共产党所主张的上升阶段。共労党据此标榜自身的“理论先进性”。"
 JAP_event.8.a: "接纳社会革命一段论"
 JAP_event.8.b: "接纳社会革命二段论"
 JAP_event.8.c: "接纳资本主义最高阶段论与分离结合论"
 JAP_event.9.t: "远东委员会 第32条 命令"
 JAP_event.9.d: "鉴于旧有宪法已经不符合时代需求，经宪法起草委员会的一致同意及工人国际与远东委员会的批准，准许《日本人民共和国宪法草案（第7版）》作为日本人民共和国正式宪法使用。新宪法将于1948年11月3日正式生效\n\n署名：\n托马斯·比森 （远东委员会当值主席）\n邵力子 （中华民国驻日特派员）\n朱德 （驻日联军最高司令官）\n大内兵卫 （社会主义工人国际日本支部书记）\n查尔斯·赛迪斯（宪法起草委员会委员长）\n尾崎行雄（宪法起草委员会首席顾问）\n\n\n在宪法实行之后，承认并祝贺日本人民共和国成立的国家为（按照承认顺序）\n1.	美利坚社会主义工人联盟\n2.	中华民国\n3.	大韩民国\n4.	法兰西公社联邦\n5.	意大利社会主义共和国\n6.	不列颠联合共和国"
 JAP_event.9.a: "日本人民共和国，以此而始！"
 JAP_event.10.t: "首届共和国政府确认宪法生效"
 JAP_event.10.d: "日本人民共和国宪法（节选）\n\n日本人民共和国是一个由全体劳动者领导、以无产阶级同盟和各民族团结为根基的社会主义共和国。共和国坚定不地帝投身于世界人民解放事业，为全人类解放做出应有的贡献。\n\n在日本劳动者的英勇斗争和全世界追求解放的劳动者的帮助下，日本人民取得了反对帝国主义、军国主义和绝对主义的伟大胜利，结束了千年来被压迫、被奴役的历史，建立了社会主义的人民共和国。\n\n鉴于日本历史遗留之屈辱及其给世界人民造成的深重苦难，为实现全体共和国人民的自由与民主，共和国全体人民兹此宣告：日本将永久废除天皇制度及一切资产阶级独裁统治，废除君主地位并取缔一切反对和平、解放与无产阶级民主的政治组织，以无产阶级民主的原则治理国家。\n\n根据宪法原则，全体日本人民共和国公民，不问出身、地位、民族，均享有平等的政治权利，依法享有选举权与被选举权，并履行相应义务。共和国之政策制定与未来发展方向，应由全体劳动者与人民代表根据民主选举程序共同决定。参与选举之政治团体必须以建设社会主义、实现共产主义、增进劳动者福祉以及共和国利益为根本宗旨。\n\n日本人民共和国之公民，应矢志不渝地践行全人类实现自由与解放的崇高理想。将以鲜血与尊严为誓，共同致力于这一伟大的事业。\n\n全世界无产者，联合起来！\n\n署名：\n\n山川均（全国政治委员会主席）\n伊井弥四郎（劳联会议长）\n荒田寒村（内政委员会委员长）\n向坂逸郎（全国经济产业统筹委员会委员长）\n浅沼稻次郎（众议院议长）\n布施辰治（共和国最高法院首席法官）\n鹿地亘（外务委员会委员长）\n伊藤好道（政策审议会议议长）\n大山郁夫（教养委员会委员长）\n佐野学（农林水产委员会委员长）\n铃木茂三郎（交通递信委员会委员长）\n绀野与次郎（国防对策委员会委员长）\n中野重治（无产阶级文化联盟委员长）\n平冢雷鸟（全国妇人联合会会长）"
 JAP_event.10.a: "万岁！"
 JAP_event.11.t: "首届共和国政府确认宪法生效"
