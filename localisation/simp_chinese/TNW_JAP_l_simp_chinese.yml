#决议
 JAP_socialist_reform_category: "工团主义试验田"
 JAP_socialist_reform_category_desc: "§R《日本列岛社会主义改造计划》§!是托马斯·比森和远东委员会的美国集团所制定的日本重建计划，也是南日本社会主义初步建设的蓝图。在该计划书中，托马斯·比森与爱奥多尔·科恩详细地规划了日本的重建工作、经济改造以及社会改造，旨在以激进的工团主义改革措施，将日本变成一个令世界人民羡慕的社会主义共和国，证明共产主义并非空想而是科学。\n\n工团主义实验的成功与否取决于以下几个指标\n1.	煤铁产量（只计算加工不计算矿产）\n2.	教育水平（学校的普及度和数量来计算）\n3.	民众的生活质量（统计民用工厂数量）\n4.	工团主义热情（[?JAP_socialist_reform_enthusiasm_var]%）\n5.	实行生产管理模式的工厂百分比\n\n要想使工团主义实验成功，则必须使这五个数值达到一定数值，如果在1951年有一项没有达成，那么改造计划或将遭遇§Y严重挫折§!。"
