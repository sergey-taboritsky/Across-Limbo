 RUS_Boris_Savinkhov: "鲍里斯·萨文科夫"
 RUS_Boris_Savinkhov_desc: ""
 RUS_Mikhail_Levitov: "米哈伊尔·列维托夫"
 RUS_Mikhail_Levitov_desc: "§Y出生于：§!§L1893年9月30日，俄罗斯帝国，梁赞省§!\n\n§Y人物背景：§!§L“我并非俄罗斯的救世主也并非俄罗斯的人民之父，我只是元首的继任者。”\n\n内战结束后，米哈伊尔·列维托夫参与了科尔尼洛夫的\"百日血洗\"，对布尔什维克怀有刻骨之恨。正是这份恨意，让他日后与萨文科夫结识，并于1924年加入保卫祖国与自由同盟。及至萨文科夫夺得国家大权，列维托夫亦凭军中职务水涨船高。\n\n萨文科夫虽身居高位，却常因政令难以下达而懊恼，总向列维托夫倾吐胸中抱负。久而久之，那些念想便深深烙进列维托夫的脑海，挥之不去——这便是他之所以成为萨文科夫最忠诚追随者的根源。\n\n二战期间，列维托夫以波罗的海战区总指挥之职突破德军防线，战后晋升将军并出任彼得格勒总督；1946年调任莫斯科总督。眼见萨文科夫年迈，列维托夫早已为那个终局悄然布局。眼见萨文科夫年迈多病，列维托夫早已为那个终局悄然布局：他联合马尔科夫将军与菲洛年科，尽力争取国家议会支持，只待元首一旦不起便接掌大局。然而党内另有觊觎者，反对之声从未消弭，他必须抢在别人之前把这张位子坐稳……§!"
