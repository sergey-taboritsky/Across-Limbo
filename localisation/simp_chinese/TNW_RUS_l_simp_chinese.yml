#事件
 RUS_event.1.t: "鲍里斯·萨文科夫病故"
 RUS_event.1.d: "莫斯科传来消息：元首在一次聚会后突发中风，虽经抢救仍在数日后离世。保卫祖国与自由联盟的缔造者没有留下明确的继任者，党书记、宣传部长与彼得格勒市长三人组成临时国务委员会，宣布在国丧期间共同执政。议会与各军区都在等一个名字，而这个名字还没写出来。"
 RUS_event.1.a: "举国致哀，静待继任者。"
 RUS_event.2.t: "临时国务委员会的终结"
 RUS_event.2.d: "国丧过去了一百余天，三巨头的共同执政已难以为继。党务系统、欧亚主义的知识分子与彼得格勒的激进派各自递上了名单，议会要求尽快定下一人。军队的表态，将决定这个国家往哪条路上走。"
 RUS_event.2.a: "推举彼得·萨维茨基（思想统治）"
 RUS_event.2.c: "推举维克托·拉里奥诺夫（强硬路线）"
 RUS_worldnews.1.t: "鲍里斯·萨文科夫去世"
 RUS_worldnews.1.d: "近日，举世震惊的消息从莫斯科传来：俄罗斯民族共和国的缔造者、保卫祖国与自由联盟主席、俄罗斯唯一的元首鲍里斯·萨文科夫在一次聚会后突发中风，并在医院抢救无效后去世。\n\n国际社会对此反应不一，东欧与多瑙联邦均表示深切哀悼，而英法美等国则对俄罗斯民众表示同情。此外，由于萨文科夫本人并未留下明确的继任者，目前保卫祖国与自由联盟和俄罗斯民族共和国将由保卫联盟党书记、宣传部长彼得·萨维茨基和彼得格勒市长维克托·拉里奥诺夫组成的三巨头政府临时执政。"
 RUS_worldnews.1.a: "元首离我们而去，而我们又将何去何从？"
 RUS_worldnews.1.b: "世界大战的参与者正在逐渐谢幕。"
 RUS_worldnews.2.t: "彼得·萨维茨基就任俄罗斯元首"
 RUS_worldnews.2.d: "在边缘化三巨头中的另外两人后，彼得·萨维茨基已经在俄罗斯民族共和国的权力斗争中胜出，并于近日正式宣布废除三巨头“临时国务委员会”，就任俄罗斯元首。\n\n作为曾经的立宪民主党党员以及远近闻名的欧亚主义者，萨维茨基主张俄罗斯扩张为“欧亚国”，并实行其梦想中的“蒙古式专制”。对此，西方与多瑙联邦均表达了对安全环境恶化的担忧。"
 RUS_worldnews.2.a: "为新元首欢呼！"
 RUS_worldnews.2.b: "思想的统治将在俄罗斯实现吗？"
 RUS_worldnews.6.t: "维克托·拉里奥诺夫就任俄罗斯元首"
 RUS_worldnews.6.d: "在边缘化三巨头中的另外两人后，维克托·拉里奥诺夫已经在俄罗斯民族共和国的权力斗争中胜出，并于近日正式宣布废除三巨头“临时国务委员会”，就任俄罗斯元首。\n\n曾作为彼得格勒市长的拉里奥诺夫是人尽皆知的激进派，其对社会主义与自由主义的厌恶人尽皆知，而正是这种激进态度令他在萨文科夫统治晚期得到萨文科夫本人青睐。然而，其对“最终圣战”的呼吁目前被巴黎与维也纳理解为第三次世界大战即将爆发的前兆，欧洲各国正在重新动员军队以适应新的国际形势。"
 RUS_worldnews.6.a: "为新元首欢呼！"
 RUS_worldnews.6.b: "第三次世界大战难道不远了吗？"
 RUS_Anton_Denikin: "安东·邓尼金"
 RUS_Anton_Denikin_desc: ""
 RUS_Andrey_Vlasov: "安德烈·弗拉索夫"
 RUS_Andrey_Vlasov_desc: ""
 RUS_event.3.t: "目标：爱琴海"
 RUS_event.3.d: "总参谋部的沙盘前，爱琴海被红笔圈了出来。雅典与安卡拉的两个社会主义政权把这片海当成了自家的池塘——而黑海的出口只有一条。政治局在文件上批下了一行字：打破封锁，无论代价。"
 RUS_event.3.a: "打破封锁。"
 RUS_worldnews.3.t: "俄罗斯照会爱琴海沿岸各国"
 RUS_worldnews.3.d: "莫斯科发表措辞强硬的声明：俄罗斯绝不承认希腊与土耳其两个社会主义政权对爱琴海的非法封锁，要求两国立即开放海域、恢复通航。声明同时宣布，俄罗斯将向塞萨洛尼基周边的希腊白军游击队提供全面支援。地中海的空气骤然紧张起来。"
 RUS_worldnews.3.a: "这是黑海的门钥。"
 RUS_worldnews.3.b: "密切关注事态发展。"
 RUS_worldnews.4.t: "雅典易帜"
 RUS_worldnews.4.d: "调停破裂后，俄罗斯志愿军越过保加利亚边境开进希腊北部，雅典未做任何有效抵抗。深夜，希腊王国摄政委员会在卫城脚下宣誓就职，宣布恢复被激进分子窃取的希腊，并申请加入欧亚协定。红旗在希腊全境降落。"
 RUS_worldnews.4.a: "黑海的南岸从此只有一个声音。"
 RUS_worldnews.4.b: "巴尔干的火药桶又响了一声。"
 RUS_worldnews.5.t: "塞萨洛尼基的王旗"
 RUS_worldnews.5.d: "在莫斯科与伦敦、巴黎的来回电报之后，妥协方案落笔签字：社会主义希腊割让北部两州，希腊王国临时政府在建有拜占庭城墙的塞萨洛尼基宣告成立。爱琴海重新对俄罗斯商船开放，白军游击队放下了枪，领了新政府的委任状。"
 RUS_worldnews.5.a: "体面，有时候比舰队还管用。"
 RUS_worldnews.5.b: "和平——至少是纸面上的。"
