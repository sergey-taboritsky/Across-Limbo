#事件
 RUS_worldnews.1.t: "鲍里斯·萨文科夫去世"
 RUS_worldnews.1.d: "近日，举世震惊的消息从莫斯科传来：俄罗斯民族共和国的缔造者、保卫祖国与自由联盟主席、俄罗斯唯一的元首鲍里斯·萨文科夫在一次聚会后突发中风，并在医院抢救无效后去世。\n\n国际社会对此反应不一，东欧与多瑙联邦均表示深切哀悼，而英法美等国则对俄罗斯民众表示同情。此外，由于萨文科夫本人并未留下明确的继任者，目前保卫祖国与自由联盟和俄罗斯民族共和国将由党书记卡罗尔·文贾戈利斯基、宣传部长彼得·萨维茨基和彼得格勒市长维克托·拉里奥诺夫组成的三巨头政府临时执政。"
 RUS_worldnews.1.a: "元首离我们而去，而我们又将何去何从？"
 RUS_worldnews.1.b: "世界大战的参与者正在逐渐谢幕。"
 RUS_worldnews.2.t: "彼得·萨维茨基就任俄罗斯元首"
 RUS_worldnews.2.d: "在边缘化三巨头中的另外两人后，彼得·萨维茨基已经在俄罗斯民族共和国的权力斗争中胜出，并于近日正式宣布废除三巨头“临时国务委员会”，就任俄罗斯元首。\n\n作为曾经的立宪民主党党员以及远近闻名的欧亚主义者，萨维茨基主张俄罗斯扩张为“欧亚国”，并实行其梦想中的“蒙古式专制”。对此，西方与多瑙联邦均表达了对安全环境恶化的担忧。"
 RUS_worldnews.2.a: "为新元首欢呼！"
 RUS_worldnews.2.b: "思想的统治将在俄罗斯实现吗？"
 RUS_worldnews.3.t: "卡罗尔·文贾戈利斯基就任俄罗斯元首"
 RUS_worldnews.3.d: "在边缘化三巨头中的另外两人后，卡罗尔·文贾戈利斯基已经在俄罗斯民族共和国的权力斗争中胜出，并于近日正式宣布废除三巨头“临时国务委员会”，就任俄罗斯元首。\n\n身为保卫祖国与自由联盟的党书记，文贾戈利斯基向来以紧贴萨文科夫主义而闻名，其上台也得到了大多数党内保守派干部的支持。作为稳健作风的代表，国际社会普遍认为文贾戈利斯基元首将不会进行过于激烈的变革。此外，令人瞩目的是，先前曾被俄罗斯主流政局压制的“斯沃博达主义盟友”协作主义民族联盟成员正在大规模进入俄罗斯政府任职。"
 RUS_worldnews.3.a: "为新元首欢呼！"
 RUS_worldnews.3.b: "他能实现他所希望的稳定吗？"
 RUS_worldnews.4.t: "维克托·拉里奥诺夫就任俄罗斯元首"
 RUS_worldnews.4.d: "在边缘化三巨头中的另外两人后，维克托·拉里奥诺夫已经在俄罗斯民族共和国的权力斗争中胜出，并于近日正式宣布废除三巨头“临时国务委员会”，就任俄罗斯元首。\n\n曾作为彼得格勒市长的拉里奥诺夫是人尽皆知的激进派，其对社会主义与自由主义的厌恶人尽皆知，而正是这种激进态度令他在萨文科夫统治晚期得到萨文科夫本人青睐。然而，其对“最终圣战”的呼吁目前被巴黎与维也纳理解为第三次世界大战即将爆发的前兆，欧洲各国正在重新动员军队以适应新的国际形势。"
 RUS_worldnews.4.a: "为新元首欢呼！"
 RUS_worldnews.4.b: "第三次世界大战难道不远了吗？"