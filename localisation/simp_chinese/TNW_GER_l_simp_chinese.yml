 #顾问
 GER_Adolf_hitler:0 "阿道夫·希特勒"
 
 #民族精神
 GER_The_remnants_of_the_resistance:0 "残存的反抗分子"
 GER_The_remnants_of_the_resistance_desc:0 "尽管我们掌握了巴伐利亚地区的政权，但还有许多不忠于我们的人，我们必须尽快处理掉这些该死的麻烦，以确保我们能够彻底掌握该地区。"
 GER_Sturmabteilung:0 "纳粹冲锋队"
 GER_Sturmabteilung_desc:0 "冲锋队最初主要从事破坏革命运动、冲击其他党派群众集会及进行街头殴斗等活动。\n\n之后在国家社会主义工人党分裂后，绝大部分的冲锋队跟随希特勒来到巴伐利亚作为他的私人武装用以对抗该地区的武装力量。"
 GER_Blitzkrieg:0 "闪电战"
 GER_Blitzkrieg_desc:0 "我们以极快的速度成功推翻了原巴伐利亚的政府，但政权依旧处在极度危险的境地，如果我们不能以最快的速度击败法兰克福政府，那我们就有危险了…"