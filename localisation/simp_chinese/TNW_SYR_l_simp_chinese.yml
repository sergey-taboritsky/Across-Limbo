l_simp_chinese:
 SYR_fourth_delay: "第四次推迟大选"
 SYR_fourth_delay_desc: "自1936年以来，王座之下欠下的选举账已拖过三轮。宫廷决定再写一张无法兑现的期票——然而这一次，街垒后面的人已经不再相信期票。"
 SYR_army_control: "稳固对军队的控制"
 SYR_army_control_desc: "军饷欠了三个月，可靠部队只剩两个旅。国王把宫廷卫队扩编成'王室师'，把亲信塞进每一个团——扎伊姆们看在眼里，只是没说。"
 SYR_damascus_security: "继续维稳大马士革"
 SYR_damascus_security_desc: "首都的面包价签每天都在变。宪兵照旧在街角列队，报纸照旧只准印好消息——只要大马士革不烧，王国就还站着。"
 SYR_aleppo_suppression: "镇压阿勒颇革命骚动"
 SYR_aleppo_suppression_desc: "北方的工商业城市已经不听号令：集市罢市、学生游行、军营里流传着大马士革听不懂的口号。宫廷派去的专员带去两样东西——津贴和骑兵。"
 SYR_royal_infrastructure: "整备王国道路"
 SYR_royal_infrastructure_desc: "王国唯一还在运转的东西是奥斯曼时代留下的公路和铁桥。修补它们不为繁荣，只为让讨伐队能更快地开到出事的地方。"
 SYR_pipeline_renewal: "油管特权续约"
 SYR_pipeline_renewal_desc: "基尔库克的黑色血液流经海法，管线的每一寸都要从大马士革的国土上过。续签特许权的签字费足够填上国库的窟窿——也足够让爱国者骂上十年。"
 SYR_zaim_coup: "扎伊姆政变"
 SYR_zaim_coup_desc: "总参谋长胡斯尼·扎伊姆在阿兹姆宫的灯火下按住了地图上的大马士革。他说这是'清君侧、救社稷'——军官团的枪口已经替他把后半句咽了回去。"
 SYR_martial_law_full: "全国军事管制"
 SYR_martial_law_full_desc: "宵禁、军管、邮件检查。军政府用刺刀把秩序重新钉回街头——至于宪政，等到打完这一仗再说。"
 SYR_attasi_coalition: "挽留阿塔西"
 SYR_attasi_coalition_desc: "老阿塔西本以为自己被捕是政变的信号弹，没想到等来的却是军政府的登门相请。'国家需要一个体面的面孔'——他犹豫了三日，最终答应入阁：也许军队真的只是清障。"
 SYR_republic_proclamation: "宣布共和"
 SYR_republic_proclamation_desc: "'清君侧'的戏码演到幕终：军政府宣布废黜王政，叙利亚共和国就此立国。加齐国王连夜出奔安曼——哈希姆家族的哈里发梦碎在大马士革的晨祷之前。"
 SYR_hashemite_purge: "清洗宫廷党羽"
 SYR_hashemite_purge_desc: "谢里夫派、宫廷旧吏、领双份津贴的部落酋长——军政府的肃反名单一夜之间写满。监狱人满为患，而空出来的官位正好安置自己人。"
 SYR_army_reorganization: "陆军整编"
 SYR_army_reorganization_desc: "旧军队按血统与山头分营，如今按军令与军饷分营。扎伊姆把靠得住的师调进大城市，靠不住的师调去边境——整编即放逐。"
 SYR_tapline_agreement: "外约旦管道谅解"
 SYR_tapline_agreement_desc: "共和国不承认王室的卖国条约，但承认管道照常输油。买主们很快明白了新政府的语言——签字费照旧，只是收据换了抬头。"
 SYR_constituent_assembly: "制宪议会"
 SYR_constituent_assembly_desc: "军政府需要一张文官的牌子挂在门口。制宪议会开进旧国会大厦，阿塔西被推上议长席——究竟是军队还政于民，还是给刺刀缝一件长袍，尚在未定之天。"
 SYR_levant_mobilization: "黎凡特总动员"
 SYR_levant_mobilization_desc: "阿勒颇的驻军打出了革命旗号，贝鲁特的兵营升起临时政府的徽章，安曼的王廷宣誓'讨逆'。四方的旗帜在同一夜升起——黎凡特的内战，再无回旋余地。"
 SYR_constitutional_debt: "宪政赤字"
 SYR_constitutional_debt_desc: "1936年的大选承诺至今仍是承诺。每一次推迟都在透支王座的信用，而现在，债主们已经开始上门。"
 SYR_military_junta_idea: "军政府统治"
 SYR_military_junta_idea_desc: "枪杆子里面出政权——扎伊姆的军政府效率优先，胜在令行禁止，败在四面树敌。"
 SYR_republic_vigor: "共和气象"
 SYR_republic_vigor_desc: "废除了国王不等于废除了忠于国王的人，但至少——大马士革的报纸终于可以印出'共和国'三个字。"
 SYR_crisis.1.t: "第四次推迟大选"
 SYR_crisis.1.d: "1936、1940、1944——选举已经推迟了三次。如今第四个选举年到来，宫廷幕僚呈上两份议案：一份写着'延期至治安恢复'，另一份干脆是一张空白支票。街上的人群比议案堆积得更快。"
 SYR_crisis.1.a: "延期至治安恢复（继续拖）"
 SYR_crisis.1.b: "承诺来年必选（再骗一次）"
 SYR_crisis.2.t: "德鲁兹山起义"
 SYR_crisis.2.d: "讨伐队的骡队刚到山口，德鲁兹长老的火漆信就送到了大马士革：要么撤军，要么让山峰再来一次 1925 年式的烈火。阿特拉什家族的旗帜在 Jabal al-Druze 升起，山民开始磨那祖传的弯刀。"
 SYR_crisis.2.a: "发兵进剿"
 SYR_crisis.2.b: "遣使抚绥"
 SYR_crisis.3.t: "霍姆斯兵变"
 SYR_crisis.3.d: "最不该出事的地方出了事：霍姆斯兵营的征召兵拒绝开赴德鲁兹山，士兵委员会占领了军械库。带头的军士曾是德式训练的模范——帝国的崩塌比军饷先一步传到了兵营。"
 SYR_crisis.3.a: "绝不宽赦"
 SYR_crisis.3.b: "谈判怀柔"
 SYR_crisis.4.t: "霍姆斯惨案"
 SYR_crisis.4.d: "进城的命令已经下达。城门口，士兵与人群对峙——对面的军装和自己一模一样。军官把枪抬起了三寸，人群里有人在唱旧奥斯曼军歌。这一枪，无论开或不开，都回不去了。"
 SYR_crisis.4.a: "开枪"
 SYR_crisis.4.b: "中止行动"
 SYR_crisis.5.t: "扎伊姆政变"
 SYR_crisis.5.d: "1948年春，阿兹姆宫的门房还没来得及通报，总参谋长的车队已经堵住了宫门。胡斯尼·扎伊姆踏着红毯走进觐见厅，对惊惶的大臣们只说了一句话：'国王陛下需要静养，即日起由救国军政府代行国政。'帐篷外，军官们的枪已上膛。"
 SYR_crisis.5.a: "清君侧，救社稷"
 SYR_crisis.6.t: "国王出逃安曼"
 SYR_crisis.6.d: "共和宣布的那个夜晚，加齐国王的车队从后门驶出大马士革，星夜兼程奔向安曼。外约旦的沙漠部族仍向他效忠，安曼城头升起了哈希姆的红白旗。'叛逆的将军们'与'出走的国王'——黎凡特的天空裂成了两半。"
 SYR_REPUBLIC: "叙利亚共和国"
 SYR_crisis.6.a: "共和国万岁"
 SYR_crisis.7.t: "军队分裂，内战爆发"
 SYR_crisis.7.d: "总动员令像一块巨石砸进结冰的湖面：阿勒颇驻军率先哗变，左翼军官与社民党人打出'阿勒颇革命政府'的旗号；贝鲁特卫戍部队随即宣布成立'临时政府'，与安曼的保王政府遥相呼应。大马士革手中只剩下内陆诸省。四旗并立，黎凡特内战爆发。"
 SYR_crisis.7.a: "为了叙利亚，前进"
 SYR_crisis.6.b: "随王驾东渡安曼（扮演外约旦王国）"
 SYR_crisis.7.b: "加入阿勒颇革命（扮演阿勒颇革命政府）"
 SYR_crisis.7.c: "投身贝鲁特临时政府（扮演贝鲁特临时政府）"
 SYR_Ghazi_bin_Faisal: "加齐·本·费萨尔"
 SYR_Ghazi_bin_Faisal_desc: "哈希姆家族的叙利亚国王。年轻时以开明与勇武著称，如今被宪政赤字与宫廷倾轧层层裹挟。他知道王座在漏气，只是不知道先漏完的是气，还是忠诚。"
 SYR_Husni_al_Zaim: "胡斯尼·扎伊姆"
 SYR_Husni_al_Zaim_desc: "总参谋长，阿勒颇库尔德裔职业军人。没有主义，只有秩序；没有誓言，只有时机。他的亲哈希姆名声保住了宫廷对他的信任，直到车轮碾过宫门的那一刻。"
 SYR_Hashim_al_Attasi: "哈希姆·阿塔西"
 SYR_Hashim_al_Attasi_desc: "国立宪法党元老，三届首相，全国最体面的反对派。他一生的信条是'秩序中的立宪'——因此当军队举事时，他选择相信那是秩序的最后一个机会。"
 SYR_Sami_al_Hinnawi: "萨米·欣纳维"
 SYR_Sami_al_Hinnawi_desc: "阿勒颇籍将领，军中亲巴格达一派的代表人物。他在军政府中沉默寡言，因为他真正效忠的王座不在大马士革，也不在安曼——而在底格里斯河畔。"
 SYR_Adib_Shishakli: "阿迪卜·希沙克利"
 SYR_Adib_Shishakli_desc: "从汉志战场走出来的铁腕军官，军政府中最锋利也最不安分的一把刀。他对扎伊姆敬而远之，对王政不屑一顾——只对自己的野心唯命是从。"
 JOR_Ghazi_bin_Faisal: "加齐·本·费萨尔"
 JOR_Ghazi_bin_Faisal_desc: "出奔的叙利亚国王，如今是安曼的流亡王廷之主。沙漠部族仍记得他是敢开赛车的勇士哈里发——他要用这支忠诚夺回大马士革，或者至少，夺回家族的体面。"
 SYR_Hashim_al_Attasi_hog: "政府首脑 哈希姆·阿塔西"
#权斗平衡
 SYR_junta_balance: "军政府权斗"
 SYR_attasi_bloc_bop: "阿塔西-民族党"
 SYR_zaim_army_bop: "扎伊姆-军队"
 SYR_junta_cooperation: "文武合作"
 SYR_attasi_bop_1: "文官政府主导"
 SYR_attasi_bop_2: "文官政府优势"
 SYR_attasi_bop_3: "文官政府抬头"
 SYR_zaim_bop_1: "军方抬头"
 SYR_zaim_bop_2: "军方优势"
 SYR_zaim_bop_3: "军人独裁"
 SYR_junta_bop_categories: "军政府权斗"

#民族精神
 SYR_levant_unified_idea: "黎凡特一统"
 SYR_levant_unified_idea_desc: "从阿勒颇的城堡到安曼的王宫废墟，共和国的鹰旗重新插遍黎凡特。用鲜血换来的版图，再不许它碎裂。"

#国策
 SYR_security_directorate: "军事安全总局"
 SYR_security_directorate_desc: "政变之后扎伊姆需要眼睛和耳朵。安全总局在阿迪卜·希沙克利的主持下成立，盯住每一个可能有二心的军官与文官。"
 SYR_military_tribunals: "革命军事法庭"
 SYR_military_tribunals_desc: "政权以军法庭之名清理旧王朝的法官、贪官与保王党密探，死刑判决在数小时内执行。扎伊姆相信恐惧比宪法更能维系秩序。"
 SYR_young_officers_cadre: "少壮派军官团"
 SYR_young_officers_cadre_desc: "校官们挤满了总参谋部——希沙克利与欣纳维各自拉拢自己的同学与同乡。军队正在变成政权的脊椎，也在变成内部斗争的角力场。"
 SYR_zaim_personal_rule: "扎伊姆个人统治"
 SYR_zaim_personal_rule_desc: "元帅的头像挂上了每一面墙。宪法被搁置，敕令代替法律。扎伊姆宣称：叙利亚需要的不是议会，而是一位强有力的再造者。"
 SYR_veterans_settlement: "退伍军人垦殖"
 SYR_veterans_settlement_desc: "内战制造了士兵，也制造了失业者。军政府把退伍老兵安置到杰济拉与绿洲的垦殖区——既是抚恤，也是监视网络。"
 SYR_border_fortification: "边境要塞化"
 SYR_border_fortification_desc: "大马士革与戈兰的棱堡群昼夜施工。军政府不指望讨好任何邻居——它只想活下来。"
 SYR_mass_conscription: "战时征兵法"
 SYR_mass_conscription_desc: "村庄按名册交人。征兵官拿着花名册走遍平原与山地，把1948年的青年一代推入这场所有人都不想要的内战。"
 SYR_barazi_finance: "巴拉齐理财"
 SYR_barazi_finance_desc: "穆赫辛·巴拉齐——律师出身的技术官僚——接管了财政。他重估税制、紧缩宫廷开支，试图让这个流血的国家重新算得清账。"
 SYR_secret_israel_channel: "对以秘密渠道"
 SYR_secret_israel_channel_desc: "扎伊姆派出了密使。与南方犹太政权的秘密接触震惊了整个阿拉伯世界——但在元帅看来，结束一条战线比保全颜面更重要。"
 SYR_civil_cabinet: "文官联合内阁"
 SYR_civil_cabinet_desc: "阿塔西被请回来组阁。民族党与人民党的元老们不情愿地与枪杆子共享权力——他们相信军队只是暂时的清道夫。"
 SYR_national_party_elders: "民族党元老院"
 SYR_national_party_elders_desc: "法里斯·胡里——议会的老议长——被请出来主持元老会议。旧共和国的体面人物们聚集在大马士革，等待恢复宪政的那一天。"
 SYR_peoples_party_leaders: "人民党少壮系"
 SYR_peoples_party_leaders_desc: "纳齐姆·库德西与鲁什迪·基赫亚带着人民党的青年团入阁。他们与巴格达的哈希姆王朝眉来眼去——军政府对此睁一只眼闭一只眼。"
 SYR_general_amnesty: "全国大赦令"
 SYR_general_amnesty_desc: "大赦令释放了政变以来被逮捕的数千名政治犯。监狱清空了，街头的传单却多了起来——自由一旦呼吸过，就再难被锁回去。"
 SYR_civil_administration: "文官行政重建"
 SYR_civil_administration_desc: "文官们接管了税册、学校与铁路时刻表。将军们打他们的仗，官僚们修他们的路——叙利亚在枪声与公文的双轨上勉强运转。"
 SYR_parliament_restored: "议会回归"
 SYR_parliament_restored_desc: "制宪议会在大马士革人民宫重新开幕。军队退回军营的承诺被郑重写下——至于它是否会被遵守，没有人敢打包票。"
 SYR_damascus_defense_line: "大马士革防御圈"
 SYR_damascus_defense_line_desc: "环绕首都的混凝土与铁丝网一天天延长。军政府宣称这是和平的屏障——人人都知道战争离城墙只有几公里。"
 SYR_golan_watchtowers: "戈兰瞭望线"
 SYR_golan_watchtowers_desc: "戈兰高地的瞭望塔俯瞰南方。无论是对犹太政权还是对河东岸的哈希姆军，这片高地都是俯瞰战场的王座。"
 SYR_druze_mountain_pact: "德鲁兹山和约"
 SYR_druze_mountain_pact_desc: "政府特使带着自治许诺与补贴进山，与阿特拉什家族达成体面和约。山民们收下承诺——德鲁兹山的忠诚从来按季结算。"
 SYR_refugee_resettlement: "难民营整顿"
 SYR_refugee_resettlement_desc: "数十万巴勒斯坦难民滞留在叙利亚南部。军政府登记、安置、征募——难民营既是人道包袱，也是现成的兵源池。"
 SYR_pipeline_tolls: "油管过境税"
 SYR_pipeline_tolls_desc: "基尔库克的石油流经叙利亚土地。军政府重新厘定过境税率，让每一滴流向海法的石油都为战争机器添柴。"
 SYR_reclaim_aleppo: "收复阿勒颇"
 SYR_reclaim_aleppo_desc: "北方的革命政权盘踞在阿勒颇。军政府动员军团向北推进——收复这座商城，就掐断了叛军的粮道与外援。"
 SYR_reclaim_beirut: "收复贝鲁特"
 SYR_reclaim_beirut_desc: "社会民族党与他们的军官们窃据了海岸。收复贝鲁特，大叙利亚的窗口就重新回到共和政权手中。"
 SYR_reclaim_amman: "南征安曼"
 SYR_reclaim_amman_desc: "逃亡的国王在外约旦招兵买马。军政府宣布：只要哈希姆王朝一天盘踞在安曼，共和国就一天不得安枕。"
 SYR_levant_unified: "黎凡特一统"
 SYR_levant_unified_desc: "最后一面叛旗倒下。从阿勒颇的城堡到安曼的王宫废墟，共和国的鹰旗重新插遍黎凡特——用鲜血换来的版图，再不许它碎裂。"
 SYR_german_dependence:0 "德械依赖"
 SYR_german_dependence_desc:0 "叙利亚军官团两代人都出自德式操典，从步枪到火炮全是德国货。随着德意志帝国在大战烈火中崩溃，这条军械生命线一夜断绝——训练仍按普鲁士条令进行，弹药却要数着打了。"
 SYR_pipeline_corridor:0 "油管走廊"
 SYR_pipeline_corridor_desc:0 "基尔库克的黑色血液横穿王国全境，管线的每一寸都要从大马士革的国土上过。过境特许权的签字费足够填上国库的窟窿——也足够让爱国者骂上十年。"
 SYR_mountain_autonomy:0 "山地诸侯"
 SYR_mountain_autonomy_desc:0 "德鲁兹山、阿拉维山与黎巴嫩山区的诸侯各拥武装、自行其是，大马士革的政令出了城就得打折。历次山地征讨都以和局收场，王庭只能默认这纸面上的疆土。"
 SYR_hashem_unity:0 "哈希姆纽带"
 SYR_hashem_unity_desc:0 "大马士革、巴格达与汉志的王座同出圣裔一脉，血统与姻亲把三个王国捆在一起。无论宫廷如何不得人心，"哈希姆家事"四个字总能让亲戚们拉上一把。"
 SYR_isolated_monarchy:0 "孤立无援的王国"
 SYR_isolated_monarchy_desc:0 "德意志帝国崩溃之后，叙利亚王国成了国际舞台上无人问津的孤儿：没有金主、没有军火来源，也没有愿意为它出头的盟友。宫廷比谁都清楚这座王座悬在半空——所以才拼命抓住每一根稻草。"


#介绍
 TNW_welcome_SYR_intro_text_1: "大叙利亚王国是“光荣和平”的产物：同盟国赢得了世界大战，奥斯曼帝国却被伦敦与柏林联手出卖，被迫承认阿拉伯诸省独立。麦加的哈希姆圣裔家族如愿加冕于大马士革——按大起义时家族内部的分工，三子费萨尔领有叙利亚，兄长阿卜杜拉受封两河，圣裔之长侯赛因坐镇汉志。费萨尔一世用十年时间把这个拼凑起来的国家捏合成形：奥斯曼留下的省份重划为九个州，柏林的顾问按德意志操典训练出西亚最齐整的军官团，德意志资本的铁路从阿勒颇铺到海法，基尔库克的石油沿着管线流进地中海——每一桶都要向大马士革缴纳过境费。\n\n1923年宪法许诺四年一度的大选，议会里坐着旧贵族、部落酋长与谢里夫派宠臣。1933年费萨尔病逝，年仅二十岁的加齐继承王位——这位以飞行动力和电台演说闻名的年轻君主很快发现：王座之下，宪政的账、军队的账、德国人的账，没有一本是清的。"
 TNW_welcome_SYR_intro_text_2: "宪政赤字从加齐登基的第一年就开始累积。1936年的大选是王国至今最后一次真正的选举：民族党与反对派候选人在城市大获全胜，惊恐的宫廷旋即以“时局不稳”为由推迟下届大选——这一推，就是三轮。议会沦为宫廷的橡皮图章，谢里夫派旧吏与领双份津贴的部落酋长填满了席位，\n\n而真正的反对派却在别处生长：复兴运动的知识分子在耶路撒冷与安曼的沙龙里传播阿拉伯社会主义，其激进领袖虽被流放的黎波里塔尼亚，火种未熄；共产党转入地下，在铁路工场与港口码头织网；1938年海法大罢工中诞生的民族革命党，则把青年军官的目光第一次引向了街头。军队同样不再可靠：总参谋长扎伊姆没有主义只有时机，阿勒颇籍将领欣纳维效忠的是底格里斯河畔的叔父王座，汉志战场出身的希沙克利只忠于自己的野心——国王把他们一个个提进总参谋部，用亲哈希姆的名声安抚宫廷，却没有人知道，车轮会在哪一刻碾过宫门。"
 TNW_welcome_SYR_intro_text_3: "第二次世界大战给了王国最后一记闷棍。叙利亚没有参战，但柏林的崩溃比任何战场都更快地改写了它的命运：1945年德意志帝国战败投降，军械供应一夜中断，海外市场随之蒸发，总参谋部清点武库时发现，库存步枪连一场边境冲突都支撑不了。宫廷只剩伦敦一个金主——以军事基地与油管特权换取军饷的条约激怒了所有人，开罗与耶路撒冷的报纸把大马士革称作“新苏伊士”。国库仰赖的油管过境费在萧条中逐年缩水，面包价签每天都在变，宪兵照旧在街角列队。\n\n1947年冬，德鲁兹山的税吏被逐出山区，山民的怨声再度汇聚；霍姆斯兵营里的征召兵为欠饷发生了第一次哗变的苗头——两次骚动都被弹压下去，但弹压者自己，也在动摇。"
 TNW_welcome_SYR_intro_text_4: "1948年，大马士革表面的秩序仍在运转：国王的车队每天清晨驶过阿兹姆宫，报纸只印好消息，第四次推迟大选的诏书正在起草。但所有人都闻到了火药味。北方，阿勒颇的工商业城市已经不听号令，革命阵线的传单混在面粉袋里进城；西方，贝鲁特的军人集团割据海岸，教授与军官结成了自己的委员会；东方，安曼的王廷与巴格达的叔父各怀心思。宫廷能倚仗的只有扩编的王室师和三个月的军饷欠条。\n\n总参谋部里，扎伊姆沉默地看着地图上自己的名字；阿塔西——三届首相、全国最体面的反对派——在自己的书房里安静地等待；而年轻军官们在食堂里传抄着同一个词：清君侧。哈希姆家族在叙利亚的王座已经站立了二十九年，它熬过了奥斯曼的瓦解，熬过了沙漠战争的惨败，熬过了金主的更替——如今它要面对的，是自己一手养大的军队。"
