# 第二十轮：战后经济／军事／外交（38 个国策）
 AFF_econ_repeal_controls: "自由党温和派·解除战时管制"
 AFF_econ_repeal_controls_desc: "内战期间的限价、配给与征购条例一次性退场，商号重新自行定价与结算。"
 AFF_econ_asset_disposal: "战时国有资产处置"
 AFF_econ_asset_disposal_desc: "战时由官方接管的工场、仓库与车队公开作价出让，受让方须一次付清。"
 AFF_econ_price_release: "限价与配给退场"
 AFF_econ_price_release_desc: "登记簿上的限价品目逐项撤销，配给证停止核发，账册封存备查。"
 AFF_econ_bank_reprivatisation: "银行复归私营"
 AFF_econ_bank_reprivatisation_desc: "战时并入官方清算的银行恢复独立经营，存款与放款改由各行自行承担。"
 AFF_econ_share_consolidation: "股权集中"
 AFF_econ_share_consolidation_desc: "同类工场合并持股，董事会席位按出资比例重排，小额股东逐步退出。"
 AFF_econ_trust_register: "托拉斯登记"
 AFF_econ_trust_register_desc: "跨州经营的同业联合体须登记资本、董事与经营范围，登记后取得统一议价资格。"
 AFF_econ_guild_charter: "行业公会特许"
 AFF_econ_guild_charter_desc: "公会取得自定产量与销价的许可，准入与除名由公会自行裁定。"
 AFF_econ_rail_trust: "铁路托拉斯"
 AFF_econ_rail_trust_desc: "干线铁路并入单一联合体，时刻表、运价与车辆调度归一处核定。"
 AFF_econ_shipping_trust: "航运托拉斯"
 AFF_econ_shipping_trust_desc: "沿海与南洋航线的船东并入同一联合体，舱位与运价统一分配。"
 AFF_econ_antitrust_exemption: "反垄断豁免"
 AFF_econ_antitrust_exemption_desc: "法令明确同业联合不受解散条款约束，只保留登记与报表义务。"
 AFF_econ_defence_contracts: "军工承包制"
 AFF_econ_defence_contracts_desc: "军械与船坞订单改由长期承包，承包方自行筹措原料与扩建资金。"
 AFF_econ_trust_settlement: "托拉斯体系定型"
 AFF_econ_trust_settlement_desc: "铁路、航运与军工的联合体各有固定边界，产能与价格由其自行维持。"
 AFF_mil_elite_doctrine: "自由党温和派·精锐部队与海军重心"
 AFF_mil_elite_doctrine_desc: "战后不维持大规模征兵，把经费与训练集中到小规模常备精锐与舰队。"
 AFF_mil_special_selection: "特种兵选拔"
 AFF_mil_special_selection_desc: "从复员军官与老兵中遴选，淘汰后不补员，编制缺口不下放地方。"
 AFF_mil_naval_staff: "海军参谋部"
 AFF_mil_naval_staff_desc: "参谋部统一舰队、船坞与护航的调度，岸上机构并入同一套报表。"
 AFF_mil_amphibious_school: "两栖训练学校"
 AFF_mil_amphibious_school_desc: "训练以岛屿登陆与沿岸机动为主，结业学员直接补入常备分队。"
 AFF_mil_commando_equipment: "突击队装备"
 AFF_mil_commando_equipment_desc: "为常备精锐单独配发轻武器与通信器材，库存与常规部队分账。"
 AFF_mil_dockyard_expansion: "船坞扩建"
 AFF_mil_dockyard_expansion_desc: "在指定沿海州增建船坞，修造能力优先供给舰队而非商船。"
 AFF_mil_fleet_formation: "舰队编成"
 AFF_mil_fleet_formation_desc: "水面舰艇与护航舰按远洋任务编组，岸防与近海巡逻另列。"
 AFF_mil_jungle_warfare: "丛林与岛屿作战"
 AFF_mil_jungle_warfare_desc: "训练科目按北部与群岛地形设置，精锐分队按小规模独立行动编写教范。"
 AFF_mil_escort_doctrine: "远洋护航教范"
 AFF_mil_escort_doctrine_desc: "护航船团按固定波次编组，反潜与补给路线写进同一份教范。"
 AFF_mil_regular_army: "常规陆军整编"
 AFF_mil_regular_army_desc: "常规部队只保留本土守备与动员骨架，不参与远洋任务的编制竞争。"
 AFF_mil_convoy_arm: "远洋补给船团"
 AFF_mil_convoy_arm_desc: "补给船团常设编组，平时承担商路护送，战时直接并入舰队。"
 AFF_mil_air_wing: "本土航空联队"
 AFF_mil_air_wing_desc: "航空联队以本土防空与近海侦察为限，作为舰队与精锐分队的补充。"
 AFF_mil_capability_settlement: "军力结构定型"
 AFF_mil_capability_settlement_desc: "精锐分队与舰队为两大主干，常规陆军与航空联队只承担支援任务。"
 AFF_dip_anti_socialist_line: "自由党温和派·反社会主义外交"
 AFF_dip_anti_socialist_line_desc: "内战结束后的对外口径以遏制社会主义势力为准，战时不结盟的采购安排重新定性。"
 AFF_dip_left_audit: "左翼组织清查"
 AFF_dip_left_audit_desc: "对政党、工会与侨团的关系逐一登记，与境外左翼机构的往来列为审查项。"
 AFF_dip_union_dissolution: "工会解散令"
 AFF_dip_union_dissolution_desc: "战时延续下来的行业工会停止活动，资产清点后移交登记机构。"
 AFF_dip_press_campaign: "反共宣传"
 AFF_dip_press_campaign_desc: "官方统一对外说明，把国有化与对外依附并列为反面教材。"
 AFF_dip_sever_socialist_ties: "断绝左翼国际联系"
 AFF_dip_sever_socialist_ties_desc: "与社会主义阵营各机构的联络一律中止，贸易与航运改由官方核准的商号承接。"
 AFF_dip_moscow_committee: "莫斯科经委会接洽"
 AFF_dip_moscow_committee_desc: "与莫斯科经济委员会重开谈判，把战时供货清单扩为长期经贸安排。"
 AFF_dip_trade_mission: "对俄商务代表团"
 AFF_dip_trade_mission_desc: "派出常驻商务代表团，专责船期、结算与原料采购的核对。"
 AFF_dip_observer_status: "经委会观察员"
 AFF_dip_observer_status_desc: "以观察员身份参加经委会例会，接受其贸易与技术标准，不派驻军队。"
 AFF_dip_defence_understanding: "防务谅解"
 AFF_dip_defence_understanding_desc: "双方就印度洋航线的护航与情报交换达成谅解，不写入共同宣战条款。"
 AFF_dip_supply_agreement: "供货协定"
 AFF_dip_supply_agreement_desc: "原料、船用配件与工业设备的供货按年度协定结算。"
 AFF_dip_moscow_sphere: "加入俄罗斯势力范围"
 AFF_dip_moscow_sphere_desc: "联邦正式纳入莫斯科阵营的势力范围，对外政策与之协调。"
 AFF_postwar_cold_war_alignment: "冷战定位"
 AFF_postwar_cold_war_alignment_desc: "私有化经济、精锐舰队与莫斯科阵营三条线并成一套战后国策。"
 AFF_postwar_new_order: "战后新秩序"
 AFF_postwar_new_order_desc: "内战期间的临时安排全部退场，联邦以新的经济、军力与对外定位进入冷战。"

# 第二十轮通用机制提示
 AFF_moscow_sphere_tt: "加入俄罗斯（莫斯科）势力范围"
 AFF_build_dockyard_tt: "指定州建成 1 座船坞"
 AFF_deregulation_tt: "行政管制程度下降"
