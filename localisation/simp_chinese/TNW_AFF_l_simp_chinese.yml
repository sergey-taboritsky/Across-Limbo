 #书签：1948 东澳（自由党主导的内战一方）
 AFF_BLITZKRIEG_DESC: "东澳大利亚联邦：1946年新西兰分治危机后，工党政府为维系与社会主义美国的关系承认各自治领高度自治，右翼怒斥其为‘美国人的狗’。1947年国有化银行业被高等法院判违宪，宪法危机叠加孟席斯炒作的共产主义威胁，自由党—国家党—民主工党联盟在东岸都会带崛起，与西澳工党政府兵戎相见，澳大利亚内战全面爆发。"
