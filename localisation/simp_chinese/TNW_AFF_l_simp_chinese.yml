# === AFF 国策树本地化（R18，以下由 _aff_tree_r18.py 生成）===
# 国策名称 / 描述（无 <id>_tt：原生效果由引擎自动显示）
 AFF_war_outbreak: "堪培拉的第一道命令"
 AFF_war_outbreak_desc: "宪法危机与银行业国有化争议之后，东岸各州的警备、税册与仓库被归到同一张调度表上。内战已经开打，纸面命令得先追上仓库里的现实。"
 AFF_war_command_staff: "东岸统帅部"
 AFF_war_command_staff_desc: "把堪培拉、布里斯班与猎人谷的三套请示并成一处，明确谁签调令、谁负责任，避免两套军令同时下达。"
 AFF_war_eastern_front: "东岸战局"
 AFF_war_eastern_front_desc: "东北海岸是联盟起家之地，也是补给最短的一条线；战线先稳住，才谈得上向内陆与西北推。"
 AFF_war_home_front: "后方内政"
 AFF_war_home_front_desc: "战时行政没有议会辩论的余裕，物价、工会与难民救济都靠临时条例维持，条例本身也需要有人执行。"
 AFF_war_economy: "战时经济"
 AFF_war_economy_desc: "小麦、铁路与港口关税是东岸仅有的三样硬通货，征购与调度的账必须记在同一本册子上。"
 AFF_war_foreign: "外援通道"
 AFF_war_foreign_desc: "没有结盟可依，能争取的只有船期、舱位与结算方式；对外接触一律不签共同防务条款。"
 AFF_war_hunter_line: "猎人谷防线"
 AFF_war_hunter_line_desc: "沿猎人谷布置纵深，把通往内陆的公路与煤点纳入同一道警戒。"
 AFF_war_brisbane_port: "布里斯班港防务"
 AFF_war_brisbane_port_desc: "港务、引水与仓库守卫合并指挥，避免卸货与调兵抢同一条码头。"
 AFF_war_morale_campaign: "战时动员广播"
 AFF_war_morale_campaign_desc: "把征发、配给与防空须知压成同一份通告，减少各州自行解释的空间。"
 AFF_war_union_truce: "工会停战协定"
 AFF_war_union_truce_desc: "与工会约定战时不再以停工相争，争议先交仲裁登记，复工与配给同步执行。"
 AFF_war_wheat_requisition: "小麦征购"
 AFF_war_wheat_requisition_desc: "按州登记产量与库存，征购量以账面数为准，避免同一批麦子被征两次。"
 AFF_war_port_tariff: "港口关税"
 AFF_war_port_tariff_desc: "进出口税则统一，码头收费与军运结算分开记账。"
 AFF_war_indian_ocean_route: "印度洋航路"
 AFF_war_indian_ocean_route_desc: "登记抵港船期与舱单，运价按航次结算，不涉及任何防务承诺。"
 AFF_war_nanyang_shipping: "南洋商路"
 AFF_war_nanyang_shipping_desc: "南洋航线的中转仓与保险改由本地商号自理，官方只核对舱单。"
 AFF_war_hunter_depot: "猎人谷煤点堆栈"
 AFF_war_hunter_depot_desc: "把煤点、油桶与备用轮胎集中到猎人谷沿线三处堆栈，领用须登记车号与去向。"
 AFF_war_joint_command: "统一东岸指挥"
 AFF_war_joint_command_desc: "两条战线的请示并到一处，前线口令与补给优先级终于有了同一版本。"
 AFF_war_port_pilotage: "引水与泊位规则"
 AFF_war_port_pilotage_desc: "港务把引水、泊位与卸货顺序写成一张表，军运与商运按同一队列叫号。"
 AFF_war_price_control: "物价管制"
 AFF_war_price_control_desc: "对面粉、燃油与布匹设上限，配给证与税册使用同一套编号。"
 AFF_war_ration_ledger: "配给证编号册"
 AFF_war_ration_ledger_desc: "配给证与税册改用同一套连号，各州按月报送已发与作废的号码段。"
 AFF_war_refugee_relief: "难民救济"
 AFF_war_refugee_relief_desc: "由各州登记流入人口，救济粮从征购账里单列，不挤占前线份额。"
 AFF_war_rail_repair: "铁路抢修"
 AFF_war_rail_repair_desc: "优先修复连接港口与小麦带的路段，工料清单由统帅部核准。"
 AFF_war_munition_workshop: "军械工场"
 AFF_war_munition_workshop_desc: "把分散的修械所并为几处固定工场，零件规格先统一再谈产量。"
 AFF_war_coal_allocation: "煤与焦炭配额"
 AFF_war_coal_allocation_desc: "机车用煤、工场用焦与民用煤分开立账，配额按月核发，不得互相挪用。"
 AFF_war_moscow_talks: "北方供货谈判"
 AFF_war_moscow_talks_desc: "谈判只覆盖供货清单与结算方式，不写入共同防务或驻军条款。"
 AFF_war_no_alliance: "不结盟声明"
 AFF_war_no_alliance_desc: "公开声明战时采购不等于结盟，避免外界把商路读成阵营。"
 AFF_war_manifest_rule: "舱单格式统一"
 AFF_war_manifest_rule_desc: "抵港舱单一律列明货名、重量与收货商号，保险与运价由商号自行结算。"
 AFF_war_northwest_garrison: "西北卫戍"
 AFF_war_northwest_garrison_desc: "西北方向的驻军改由统帅部直接补给，地方征发一律登记入册。"
 AFF_war_murray_crossing: "墨累河渡口"
 AFF_war_murray_crossing_desc: "渡口与驳船归一处调度，过河顺序按补给优先级排，地方征发一律先登记。"
 AFF_war_coastal_convoy: "沿岸船团"
 AFF_war_coastal_convoy_desc: "把沿岸短途运输编成船团，按统一船期发航，减少空等与重复护航。"
 AFF_war_price_register: "限价登记簿"
 AFF_war_price_register_desc: "面粉、燃油与布匹的限价按州登记，商人须报进货价与零售价，差额定在册面上。"
 AFF_war_relief_inspection: "救济粮抽查"
 AFF_war_relief_inspection_desc: "救济粮从征购账里单列后，按月抽查发放名册与仓库出库是否对得上。"
 AFF_war_refugee_register: "流动人口登记"
 AFF_war_refugee_register_desc: "各州把流入人口按原籍与现住址登记，登记册同时用于配给与警备核对。"
 AFF_war_wheat_ledger: "征购总账"
 AFF_war_wheat_ledger_desc: "各州征购量并入一本总账，同一批麦子不得在两州重复计入。"
 AFF_war_fuel_pool: "燃油统筹"
 AFF_war_fuel_pool_desc: "港口油料与内陆库存并账，运输先后由同一张表排出。"
 AFF_war_rail_timetable: "军运时刻表"
 AFF_war_rail_timetable_desc: "铁路把军运与货运排进同一张时刻表，抢修路段限速单独标注。"
 AFF_war_supply_ledger: "供货清单备案"
 AFF_war_supply_ledger_desc: "北方供货谈判只留下货名、数量与结算方式三栏，不附任何防务条款。"
 AFF_war_public_notice: "不结盟公告释文"
 AFF_war_public_notice_desc: "公告附一份释文，说明采购、船期与保险都不构成阵营义务。"
 AFF_war_insurance_local: "转运保险本地化"
 AFF_war_insurance_local_desc: "中转仓与保险改由本地商号承接，官方只核对舱单与到港日期。"
 AFF_war_garrison_audit: "卫戍补给审计"
 AFF_war_garrison_audit_desc: "西北驻军的粮秣、弹药与燃料按月对账，缺口由统帅部直接补齐。"
 AFF_war_front_stabilised: "战线稳定"
 AFF_war_front_stabilised_desc: "两处前沿的补给请示不再互相抢占，战局分区的阶段性任务到此收束。"
 AFF_war_harbour_watch: "港口夜巡"
 AFF_war_harbour_watch_desc: "夜巡把仓库、码头与锚地并成一条路线，交接班须在登记簿上签字。"
 AFF_war_control_review: "限价复核"
 AFF_war_control_review_desc: "限价执行满一季后复核一次，超编的品目逐项撤销或并入配给。"
 AFF_war_home_order: "后方秩序"
 AFF_war_home_order_desc: "物价与救济两条线合并复核，后方行政不再各自发文。"
 AFF_war_warden_network: "街区管理员"
 AFF_war_warden_network_desc: "各州指定街区管理员核对配给证与防空须知，争议先报区署再转部会。"
 AFF_war_quota_board: "配额核发表"
 AFF_war_quota_board_desc: "征购、铁路与关税三本账并到一张核发表上，工场与油料按表领用。"
 AFF_war_industrial_board: "战时生产委员会"
 AFF_war_industrial_board_desc: "征购、铁路与关税三本账并到一处，工场与油料的配额由委员会统一核发。"
 AFF_war_workshop_spec: "零件规格统一"
 AFF_war_workshop_spec_desc: "修械所并入固定工场后，先统一螺栓与枪管规格，再谈产量。"
 AFF_war_freight_settlement: "运价结算办法"
 AFF_war_freight_settlement_desc: "运价按航次结算，结算凭证与舱单同号，避免同一批货两次付账。"
 AFF_war_supply_secured: "补给线落定"
 AFF_war_supply_secured_desc: "两条口径并成一份对外说明，补给线分区的阶段性任务到此收束。"
 AFF_war_route_registry: "船期登记处"
 AFF_war_route_registry_desc: "抵港船期集中登记，逾期未到的航次另列一栏，供商号自行查询。"
 AFF_war_field_repair: "野战修械班"
 AFF_war_field_repair_desc: "前沿修械班只做换件与校准，大修一律后送固定工场。"
 AFF_war_front_report: "战线旬报"
 AFF_war_front_report_desc: "各段每旬报送兵力、弹药与损失，旬报使用同一张表格。"
 AFF_war_escort_rotation: "护航轮换"
 AFF_war_escort_rotation_desc: "护航船团按固定周期轮换，轮空期由沿岸瞭望哨补位。"
 AFF_war_ordinance_book: "临时条例汇编"
 AFF_war_ordinance_book_desc: "把限价、配给与警备的临时条例编成一册，编号后停止各州自行发文。"
 AFF_war_appeal_office: "申诉登记处"
 AFF_war_appeal_office_desc: "对限价与配给的申诉统一登记，裁决结果抄送区署存档。"
 AFF_war_air_raid_drill: "防空演练"
 AFF_war_air_raid_drill_desc: "街区管理员按册组织防空演练，缺勤名单并入户籍复核。"
 AFF_war_procurement_audit: "征购账复核"
 AFF_war_procurement_audit_desc: "配额表按月与实际出库复核，差额挂账，不直接改写原册。"
 AFF_war_economy_stable: "经济稳住"
 AFF_war_economy_stable_desc: "配额表按月复核，战时经济分区的阶段性任务到此收束。"
 AFF_war_factory_output: "工场月报"
 AFF_war_factory_output_desc: "固定工场按月报送修械与产量，报表与零件领用册一并归档。"
 AFF_war_ship_charter: "租船契约范本"
 AFF_war_ship_charter_desc: "租船统一使用一份范本，船期、运价与免责条款逐栏填写。"
 AFF_war_external_wording: "对外口径统一"
 AFF_war_external_wording_desc: "两条商路的对外说明并成一份，不结盟口径在各港一致。"
 AFF_war_warehouse_ledger: "中转仓台账"
 AFF_war_warehouse_ledger_desc: "中转仓按货主与批次立账，出库须与舱单号对应。"
 AFF_war_garrison_rotation: "卫戍轮换"
 AFF_war_garrison_rotation_desc: "西北驻军按季轮换，换防时把弹药与燃料账目一并交接。"
 AFF_war_front_supply_table: "前沿补给表"
 AFF_war_front_supply_table_desc: "各段补给优先级写进同一张表，旬报与领用册按表核对。"
 AFF_war_convoy_ledger: "船团航行簿"
 AFF_war_convoy_ledger_desc: "每次船团发航登记船名、货量与到港时刻，逾期单列一栏。"
 AFF_war_ordinance_review: "条例年度复核"
 AFF_war_ordinance_review_desc: "临时条例汇编满一年后逐条复核，失效的从册中注销并公告。"
 AFF_war_appeal_archive: "申诉案卷归档"
 AFF_war_appeal_archive_desc: "申诉裁决按州归档，同类争议引用既有案卷，不再另立口径。"
 AFF_war_warden_report: "街区月报"
 AFF_war_warden_report_desc: "街区管理员按月报送配给与防空演练情况，缺勤名单附在册后。"
 AFF_war_quota_settlement: "配额结算"
 AFF_war_quota_settlement_desc: "配额表与实际出库结算一次，差额挂账，原册不作涂改。"
 AFF_war_production_review: "生产月核"
 AFF_war_production_review_desc: "工场月报与零件领用册按月核对，超领部分下月扣回。"
 AFF_war_fuel_reserve: "燃油储备线"
 AFF_war_fuel_reserve_desc: "港口油料与内陆库存并账后，划出一条不动用的储备线。"
 AFF_war_charter_audit: "租船契约复核"
 AFF_war_charter_audit_desc: "租船契约按期复核，运价与免责条款的改动须留书面记录。"
 AFF_war_port_notice: "到港公告统一"
 AFF_war_port_notice_desc: "各港到港公告使用同一措辞，不结盟口径不另作解释。"
 AFF_war_manifest_archive: "舱单归档"
 AFF_war_manifest_archive_desc: "舱单按航次归档，结算凭证与舱单同号便于事后查对。"
 AFF_war_front_settlement: "战局分区结项"
 AFF_war_front_settlement_desc: "战线的补给、旬报与船期三条线并成一册，战局分区的任务到此收束。"
 AFF_war_home_settlement: "内政分区结项"
 AFF_war_home_settlement_desc: "条例、申诉与街区月报归入同一套行政册籍，后方分区的任务到此收束。"
 AFF_war_economy_settlement: "经济分区结项"
 AFF_war_economy_settlement_desc: "配额、生产与储备三本账完成结算，战时经济分区的任务到此收束。"
 AFF_war_foreign_settlement: "外援分区结项"
 AFF_war_foreign_settlement_desc: "契约、公告与舱单归档完毕，商路分区的任务到此收束。"
 AFF_war_all_fronts_ready: "全面反攻准备"
 AFF_war_all_fronts_ready_desc: "四个分区的账册、配额与船期对齐，统帅部才敢把兵力从东岸向外推。"
 AFF_war_demobilisation: "战事结束与复员"
 AFF_war_demobilisation_desc: "战时条例逐项复核，复员名册与税册交接完成，才具备宣布大选的条件。"
 AFF_election_announced: "宣布大选"
 AFF_election_announced_desc: "战时统帅部把行政权交回临时选举委员会，公告只列程序与日期，不预设哪一派组阁。"
 AFF_election_voter_roll: "选民名册"
 AFF_election_voter_roll_desc: "以各州税册与复员名册交叉核对选民资格，争议登记留待开票前处理。"
 AFF_election_broadcast: "竞选广播"
 AFF_election_broadcast_desc: "四派在同一时段使用公共频道，讲稿按时长分配，不设官方倾向。"
 AFF_election_army_neutral: "军警中立"
 AFF_election_army_neutral_desc: "投票日军队与警察只维持秩序，不得进入开票场所或干预名册。"
 AFF_election_polling: "投票日"
 AFF_election_polling_desc: "名册、广播时段与军警中立三项就绪后开票，按州汇总并由四派派员监票。"
 AFF_gov_liberal: "自由党组阁"
 AFF_gov_liberal_desc: "孟席斯战时内阁原班人马过渡，行政权逐步交回议会，战时监管逐项撤销。"
 AFF_gov_country: "国家党组阁"
 AFF_gov_country_desc: "法登一系把乡村与小州的要求带进组阁谈判，补贴、关税与州权写进纲领。"
 AFF_gov_dlp: "民主工党组阁"
 AFF_gov_dlp_desc: "桑塔马里亚与麦克马纳斯主张以劳资仲裁与教派学校补助为纲领，把组织网络带进政府。"
 AFF_gov_radical: "极端派自由党组阁"
 AFF_gov_radical_desc: "休斯主张延长紧急权力、把街头动员带进战后政治，制宪议程被推后。"
 AFF_lib_repeal_controls: "撤销战时管制"
 AFF_lib_repeal_controls_desc: "物价上限与征发条例逐项废止，废止清单先在议会宣读再执行。"
 AFF_lib_press: "放宽新闻检查"
 AFF_lib_press_desc: "取消战时稿件预审，只保留对军务机密的事后追责。"
 AFF_country_farm_subsidy: "乡村补贴"
 AFF_country_farm_subsidy_desc: "按州登记耕种面积与产量，补贴直接落到生产者账上。"
 AFF_country_wheat_tariff: "小麦关税"
 AFF_country_wheat_tariff_desc: "对进口小麦设阶梯税则，税额随到岸价调整，不另设配额。"
 AFF_dlp_corporate_council: "社团议事会"
 AFF_dlp_corporate_council_desc: "由工会与职业团体各派代表列席，议题先经团体汇总再送部会。"
 AFF_dlp_school_grant: "教派学校补助"
 AFF_dlp_school_grant_desc: "补助按在校人数核发，教材与账目由学校自行报送。"
 AFF_rad_emergency_powers: "紧急权力延长"
 AFF_rad_emergency_powers_desc: "战时条例不随复员自动失效，逐条列出延长清单与复核期限。"
 AFF_rad_street_mobilisation: "街头动员"
 AFF_rad_street_mobilisation_desc: "把竞选期的组织网络转为常设动员队，集会须向警方报备。"
 AFF_lib_parliament: "恢复议会程序"
 AFF_lib_parliament_desc: "恢复质询、读会与表决的完整顺序，临时条例一律重交议会追认。"
 AFF_lib_budget_audit: "预算复核案"
 AFF_lib_budget_audit_desc: "战时账目逐项交议会复核，已核发的拨款不再追改，只登记差额。"
 AFF_country_state_rights: "州权下放"
 AFF_country_state_rights_desc: "把警备之外的行政细则交回各州，中央只保留军务、外交与关税。"
 AFF_country_rail_board: "铁路董事会"
 AFF_country_rail_board_desc: "铁路调度改由各州与货主共同派员，运价公开列账。"
 AFF_dlp_arbitration: "劳资仲裁"
 AFF_dlp_arbitration_desc: "停工争议一律先交仲裁登记，裁决期间双方维持既有排班。"
 AFF_dlp_union_register: "工会登记办法"
 AFF_dlp_union_register_desc: "工会按行业与会员数登记，登记册作为仲裁席位的依据。"
 AFF_rad_anti_red_purge: "反共清查"
 AFF_rad_anti_red_purge_desc: "对公职人员的政治归属重新登记，处置结果须留书面记录。"
 AFF_rad_rally_rules: "集会报备规则"
 AFF_rad_rally_rules_desc: "集会须提前报备地点与人数，警方只核对秩序，不审查讲稿。"
 AFF_lib_civil_service: "文官任用条例"
 AFF_lib_civil_service_desc: "战时任命的文官逐案复核，留任者补办任用手续，缺额公开补选。"
 AFF_lib_local_election: "地方选举恢复"
 AFF_lib_local_election_desc: "各州议会按原有选区恢复选举，战时委任的州署在开票后移交。"
 AFF_country_land_register: "耕地登记令"
 AFF_country_land_register_desc: "耕种面积按地块登记，补贴以登记数为准，争议由州署裁定。"
 AFF_country_freight_rate: "货运运价公示"
 AFF_country_freight_rate_desc: "铁路运价按里程与货类列成价目表，各站张贴，调整须先行公告。"
 AFF_dlp_wage_board: "工资评议会"
 AFF_dlp_wage_board_desc: "工资争议由工会与雇主各派代表评议，评议结果送部会备案。"
 AFF_dlp_school_report: "教材报送规则"
 AFF_dlp_school_report_desc: "受补助学校按学期报送教材与账目，报送格式由部会统一。"
 AFF_rad_public_order: "公共秩序条例"
 AFF_rad_public_order_desc: "把战时警戒改编为常设秩序条例，适用范围与复核期限逐条列明。"
 AFF_rad_veteran_corps: "复员军人编队"
 AFF_rad_veteran_corps_desc: "复员军人按原部队编成后备队，召集与解散均须书面命令。"
 AFF_lib_court_review: "司法复核程序"
 AFF_lib_court_review_desc: "战时条例涉及的案件可申请复核，复核以书面卷宗为准。"
 AFF_lib_trade_ordinance: "商事条例整理"
 AFF_lib_trade_ordinance_desc: "把许可、契约与税则的战时规定整理成册，失效条款逐一注销。"
 AFF_country_rural_credit: "乡村信贷案"
 AFF_country_rural_credit_desc: "信贷以耕地登记与产量为凭据，放款与还款按季列入州署账册。"
 AFF_country_tariff_court: "税则争议仲裁"
 AFF_country_tariff_court_desc: "税则争议由货主与税署各派一人仲裁，裁决只适用本案。"
 AFF_dlp_work_hours: "工时条例"
 AFF_dlp_work_hours_desc: "工时上限按行业列明，加班须登记时数并计入评议会记录。"
 AFF_dlp_welfare_levy: "救济征费案"
 AFF_dlp_welfare_levy_desc: "救济征费按工资册定额征收，收支按季公开，不并入一般税项。"
 AFF_rad_emergency_review: "延长清单复核"
 AFF_rad_emergency_review_desc: "紧急权力的延长清单按期复核，未续列的条款自动失效。"
 AFF_rad_command_council: "常设动员委员会"
 AFF_rad_command_council_desc: "动员队与后备队归同一委员会调度，命令须留签字与日期。"
 AFF_lib_cabinet: "孟席斯内阁就位"
 AFF_lib_cabinet_desc: "议会程序与新闻令并行生效，自由党组阁路线完成交接。"
 AFF_country_cabinet: "法登内阁就位"
 AFF_country_cabinet_desc: "补贴、关税与州权三条纲领并入施政清单，国家党组阁路线完成交接。"
 AFF_dlp_cabinet: "麦克马纳斯内阁就位"
 AFF_dlp_cabinet_desc: "议事会、补助与仲裁三条线并入施政清单，民主工党组阁路线完成交接。"
 AFF_rad_cabinet: "休斯战时内阁"
 AFF_rad_cabinet_desc: "紧急权力与动员队并入常设体制，极端派自由党组阁路线完成交接。"
 AFF_shared_liberal_legacy: "自由党共同遗产"
 AFF_shared_liberal_legacy_desc: "无论由孟席斯还是休斯组阁，自由党的党部档案、地方分支与竞选账目都要一并移交，这一节不因路线不同而分家。"
 AFF_country_cabinet_programme: "国家党施政清单"
 AFF_country_cabinet_programme_desc: "把补贴、关税与州权三条纲领列成施政清单，逐项标注承办部会。"
 AFF_dlp_cabinet_programme: "民主工党施政清单"
 AFF_dlp_cabinet_programme_desc: "把仲裁、补助与工时三项列成施政清单，逐项标注承办部会。"
 AFF_shared_party_machine: "党部机器重整"
 AFF_shared_party_machine_desc: "把两派共用的名册、会费与选区干事重新登记，明确哪些资源属于党部而非本届内阁。"
 AFF_country_constitutional_draft: "国家党宪制草案"
 AFF_country_constitutional_draft_desc: "宪制草案写明中央只掌军务、外交与关税，其余细则留归各州。"
 AFF_dlp_constitutional_draft: "民主工党宪制草案"
 AFF_dlp_constitutional_draft_desc: "宪制草案把劳资仲裁与职业团体列席写入常设条款。"
 AFF_postwar_constitution: "战后宪制"
 AFF_postwar_constitution_desc: "不论哪一派组阁，选举程序、议会权限与行政复核都写进同一份宪制文本，战时临时条例至此全部退场。"

