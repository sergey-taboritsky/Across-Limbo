l_simp_chinese:
 #人物
 AFF_Robert_Menzies: "罗伯特·孟席斯"
 AFF_Robert_Menzies_desc: ""
 #书签：1948 东澳（自由党主导的内战一方）
 AFF_BLITZKRIEG_DESC: "东澳大利亚联邦：1946年新西兰分治危机后，工党政府为维系与社会主义美国的关系承认各自治领高度自治，右翼怒斥其为‘美国人的狗’。1947年国有化银行业被高等法院判违宪，宪法危机叠加孟席斯炒作的共产主义威胁，自由党—国家党—民主工党联盟在东岸都会带崛起，与西澳工党政府兵戎相见，澳大利亚内战全面爆发。"
 #东澳阵营其他领袖
 AFF_Arthur_Fadden: "阿瑟·法登"
 AFF_Arthur_Fadden_desc: "澳大利亚国家党党魁，二战期间曾任总理（1941），后长期任孟席斯政府的财政部长。"
 AFF_Bob_Santamaria: "鲍勃·桑塔马里亚"
 AFF_Bob_Santamaria_desc: "民主工党（DLP）幕后思想家，天主教反共运动的核心人物，主张以强硬手段遏制共产主义渗透。"
 AFF_Frank_McManus: "弗兰克·麦克马纳斯"
 AFF_Frank_McManus_desc: "民主工党议会领袖，反共工团主义路线的旗手，游走于天主教工会与自由党之间。"
 AFF_Billy_Hughes: "比利·休斯"
 AFF_Billy_Hughes_desc: "前总理（1915—1923），年迈而好斗的激进自由党人；在‘战斗民粹主义’路线下可成为东澳的强人元首。"
