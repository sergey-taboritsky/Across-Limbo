l_simp_chinese:
 CHA_event.1.t:0 "法属赤道非洲的抉择"
 CHA_event.1.d:0 "在掌管乍得数年之后，法国总督皮埃尔·梅斯梅尔决定履行其改革承诺，将政权和平移交给本地民族主义领袖加布里埃尔·利塞特。这一决定在非洲殖民地上开了一个先例。"
 CHA_event.1.o:0 "移交政权"
 CHA_event.1.tt:0 "将国家最高权力交予本地领导人加布里埃尔·利塞特"
 CHA_event.2.t:0 "乍得实现权力移交"
 CHA_event.2.d:0 "法属赤道非洲治下的乍得，今日由殖民总督和平移交权力予本地政府，标志着非洲殖民秩序出现松动。"
 CHA_event.2.o:0 "确认"
