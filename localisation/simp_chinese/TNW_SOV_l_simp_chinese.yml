 RUS_gong_chang_guo_ji:0 "共产国际成员国"
 RUS_gong_chang_guo_ji_desc:0 "§R我们将摧毁压迫的世界，并将它彻底的改变！§!\n\n§R不要说我们一无所有，我们将掌握一切！§!\n\n§R这是最后的斗争，团结起来到明天，英特纳雄耐尔就一定要实现！§!"

#顾问
 RUS_Siweier_deluofu:0 "雅可夫·伊诺维奇·斯维尔德洛夫"
 RUS_Siweier_deluofu_desc:0 "谁是斯维尔德洛夫？\n\n犹太人，革命的黑魔鬼，苏俄的第一任国家元首，冷血的实干家...他的敌人或者是政见不同者总会给予他贴上各种各样的标签。\n\n斯维尔德洛夫出身于一个逐步落魄的犹太人家庭，他的家乡是在下诺夫哥罗德。大城市的流放者们被沙皇驱逐到这里，而他们却为这座小城带来了最新的思想，斯维尔自小就在这种氛围中长大，高尔基就是他家中的常客。\n\n二月革命以来，布尔什维克在列宁的领导下不断奋进，长期被判处监禁和苦役的斯维尔德洛夫得以逃脱禁锢，回到权力的中心。他过往丰富的经验和丰厚的学时在这时展现出强大的能力：党政机关，国家机器，暴力机构在他的麾下流畅运转，为德国，匈牙利和波兰的胜利奠定了坚实基础。\n\n西班牙流感来了，纵使他抱病完成繁重的工作，也没有被疾病击垮。列宁被刺杀后，健康迅速恶化——众人将目光投向了斯维尔德洛夫，只有他，能够弥合各方，总揽全局，让庞大的机器流畅高效运转。\n\n他没有辜负众望，结束旧的过渡时期，开始新的全面工业化、公社化，赢得了两次大辩论，通过两个五年计划，为国家的强盛奠定了坚实的基础。\n\n这一切不是没有代价的，两次大辩论所造就的裂痕，演化成了暗流里各种各样的派别，社会各个部分都对国家的道路有着自己的看法，并推动着局势的变化——但是斯维尔德洛夫已经无力改变这一切了。长期辛劳的工作，使得这颗螺丝钉的金属疲劳性达到了顶点，疾病，疲劳，精神上的重压在他的身体上爆发了——他中风了。\n\n革命的黑魔鬼，冷血的实干家，强悍的螺丝钉断裂了，他并不能阻止这一切的发生，§R他甚至改变不了自己衰颓的身体，朦朦胧胧的耳边总能传来各种各样的争辩声...§!"
 RUS_feifa_zuzhize:0 "掌控一切的主席"
 
#民族精神
 RUS_Arms_are_wasted:0 "军备废弛"
 RUS_Arms_are_wasted_desc:0 "虽然在内战中取得了胜利，但苏俄的红军从未谈得上强大。长期缺乏经费、社会动荡和党内分歧延伸到军队、军队本身的路线争夺、甘于现状且缺少现代战争经验的将领层都使得这支本应“革命进取”的军队显得死气沉沉。随着和西方帝国主义国家的矛盾越来越激烈，军队改革的呼声越来越高。我们必须马上着手改革工作，否则我们有可能在接下来的战争中被毁灭。"
 RUS_birthplace_revolution:0 "革命始源地"
 RUS_birthplace_revolution_desc:0 "“同志们！在完成第三个五年计划并开始第四个五年计划后，我们已经建立了一个初具体系的工业化国家。现在，我们应该继续加强社会主义和无产阶级专政的基础，建立起各民族、各社会主义盟国之间的信赖关系，加强对帝国主义的军事准备。到那个时候，‘英特纳雄耐尔’将成为现实。”"
 RUS_chenxiang_maodun:0 "农村“阶级战争”的余波"
 RUS_chenxiang_maodun_desc:0 "当斯维尔德洛夫决定在1925年结束“新经济政策”时，党内怀疑、反对的声音不绝于耳。虽然事实证明布尔什维克成功经受了考验，完成了相当伟大的“社会苏维埃化”进程，但连绵整个二十年代中后期的农村“阶级战争”却给党与中农的关系以重大打击。不过，“阶级战争”也使得党对农村的控制力大大加强——这使得国家得以更方便的获得粮食。是保留现状，还是做些改变？"
 RUS_one_five_jihua:0 "革命始源地"
 RUS_one_five_jihua_desc:0 "“同志们！在完成第三个五年计划并开始第四个五年计划后，我们已经建立了一个初具体系的工业化国家。现在，我们应该继续加强社会主义和无产阶级专政的基础，建立起各民族、各社会主义盟国之间的信赖关系，加强对帝国主义的军事准备。到那个时候，‘英特纳雄耐尔’将成为现实。”"
 RUS_zongjiao_wenti:0 "形式上统一的党"
 RUS_zongjiao_wenti_desc:0 "在列宁去世后，斯维尔德洛夫毫无疑问就是布尔什维克党内最有威望的人——内战时期的巨大贡献、列宁半指定的接班人、战后领导了集体化以及工业化。在他巨大的威望和精细的操控之下，党维持着形式上的统一——虽然大家都心知肚明，党内早已形成了实际上的派别。已经有观察家指出这位主席对布尔什维克内部团结的重要性——幸运的是，斯维尔德洛夫同志身体很好。"
 RUS_jia_meng_guo:0 "苏联加盟国-苏维埃俄国"
 RUS_jia_meng_guo_desc:0 "1922年，列宁提议所有的苏维埃政权应该建立一个按平等自愿原则的苏维埃共和国联盟，并且所有加盟国应该独立自主，互不干涉内政。在这一想法下，德国，白俄罗斯，芬兰，乌克兰，波罗的海，外高加索，中亚成为苏联的创始国。" 

#决议
 SOV_Subvert_Britain:0 "颠覆不列颠"
 SOV_Subvert_Britain_desc:0 "\n\n\n\n\n\n\n作为头号老牌资本主义国家，工业革命的发源地，英国培育了许许多多的无产阶级。在不列颠的这块土地上诞生了众多为无产阶级争取利益的组织与政党，但都无一例外的遭受当局的镇压，部分组织甚至遭遇查禁被迫转入地下工作。\n\n距离上次停战已经过去了十几年。毫无疑问，东西双方意识形态的冲突已经临近临界点，东西德——这个由双方在柏林签下和平条约所产生的畸形物终将被他们亲手摧毁。山雨欲来风满楼，如果不能尽快消灭以英国为首的协约国资本主义国家的有生力量，那么很有可能资本主义将会再临俄国乃至整个欧亚大陆。\n\n革命军事委员会的将军们对此给出了答案：颠覆英国政权，号召不列颠人民起义反抗英国政府。一旦起义发生，红军将以最快的速度在起义水手与当地人民的帮助下登陆英伦三岛，解放不列颠。\n\n当前的颠覆进度为: §Y[?SOV_Subvert_Britain_var|%0]§!\n"
 SOV_Subvert_Britain_1_custom_trigger:0 "当前颠覆进度为§Y100%§!"
 SOV_Subvert_Britain_1:0 "播种吧，不要让暴君搜刮！"
 SOV_Subvert_Britain_1_desc:0 "哪里有伟大的革命斗争，哪里就会产生伟大的文学。\n而无产阶级，这个最年青、最革命、最朝气蓬勃，前途最光明的阶级，它肩负着消灭阶级制度，解放全人类，创造新世界的伟大的历史使命。"
 SOV_Subvert_Britain_1_custom:0 "§R英伦三岛的工人们将起义并推翻腐朽的联合王国……\n一场血雨腥风的内战将在英伦三岛上演。§!"
