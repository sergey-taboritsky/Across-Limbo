#民族精神
 BUL_will_of_god: "“乃是上帝旨意！”"
 BUL_will_of_god_desc: "§Y摄政委员会的设立应该是§R在国民议会通过§!，然而这帮§R“反犹的混蛋”§!却是在§R大国民议会选举§!中产生的，这可真叫一部分议员难受§!"
 BUL_scars_of_second_weltkrieg: "世界大战的创伤"
 BUL_scars_of_second_weltkrieg_desc: "§Y没有人再称呼他们为将军、议员、警察…首相、沙皇了，甚至也不称呼先生了，剩下的称呼只有§R抢钱夺命的混蛋§!§!"
 BUL_russian_diplomacy_problems: "对俄态度问题"
 BUL_russian_diplomacy_problems_desc: "§Y惊叹不已的是，尽管我们彼此之间是盟友，§R但是我们的首相以及一部分民族主义者却并不想与俄罗斯人交好！这不是其他人所认同的！§!§!"
 BUL_tsar_homeland_bulgaria: "沙皇！祖国！保加利亚！"
 BUL_tsar_homeland_bulgaria_desc: "§Y保加利亚民族主义者们虽分为两派，但很幸运的，大部分都效忠于沙皇。在大街上，他们对抗祖国阵线的暴徒；在工厂里，他们勤劳工作；在军队里，他们是最勇敢的士兵。有了他们，保加利亚必将恢复往昔荣光！§!"
 
