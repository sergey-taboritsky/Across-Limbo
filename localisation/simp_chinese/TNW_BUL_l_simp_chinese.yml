#GUI
 TNW_BUL_parliament_desc: "第 届大国民议会，下次选举 年 月"
 TNW_BUL_parliament_desc2: "普通国民议会由人民直接选举的代表组成，每两万人口选举一名代表。代表任期四年。\n所有年满21周岁、享有公民权利和政治权利的保加利亚公民均有选举权。\n所有享有公民权利和政治权利、年满30周岁且识字的保加利亚公民均有被选举为代表的权利。\n将制定专门选举法规范选举事宜。\n\n国民议会负责：\n\n1. 根据第四十四条讨论法律草案。\n2. 讨论关于国家贷款、增加、减少或废除税收及各类规费，以及关于其支出和征收方式的提案。\n3. 豁免认为无法征收的拖欠税款和各类未收规费。\n4. 讨论年度收支预算。\n5. 审核预算所拨款项的支出账目。\n6. 审核最高审计院的账目，该院有义务向议会提交预算执行情况的详细报告。\n7. 提出追究部长责任的质询。"
