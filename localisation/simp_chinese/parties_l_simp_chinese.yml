 structural_reformism: "构造改革论"
 structural_reformism_desc: "“如果社会主义者无法在赢得市民阶层的信任，我们就永远无法触及权力的核心。必须在国家的肌体内部动手术，用持续的、累积的改革来重塑这个国家的结构。”\n\n稻村-加藤论争中加藤勘十胜出之后，为了对抗社民党的不信任案，社会党重新推举江田三郎为中央执行委员长。在西尾末广的支持下，社会党确立了构造改革论为暂时方针。\n\n构造改革论主张：在现有社会主义政治的的框架内，通过一系列持续的、累积性的改革，挽救国家的经济和改良生产结构，对政府进行有效的改良，最终走出战后经济、逐步过渡到稳定的社会主义社会。\n\n与西尾末广等社会自由主义的改革主张不同，江田构造改革的目标是纠正战后经济的创伤、摆脱工团主义和労组依存的僵化体制，创造一个尊重市场原则、市民政治和劳动者人性的社会主义社会。然而，构造改革论直接触碰了党内最核心的意识形态红线——社会党究竟是不是劳动者的党？以向坂逸郎为代表的社会主义协会，坚信构造改革论是对日本劳动者的背叛，批判其为背离革命目标的修正主义路线。这对社会党中央构成了重大挑战。"

