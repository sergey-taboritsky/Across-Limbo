 Japanese_Syndicalism: "劳农派马克思主义"
 Japanese_Syndicalism_desc: "“无产阶级运动的最后目的，即无产阶级的绝对胜利，是政治的目的，是政治的胜利。与这种政治目的和政治胜利完全分离的经济上的直接行动，总之是以局部改良为目的的斗争，即改良主义运动。这种局部斗争，与无产阶级的最后目的即政治目的连结在一起时，才产生革命的意义。”\n\n劳农派马克思主义，又称山川主义，是日本最具影响力的马克思主义流派，其得名于1927年创办的《劳农》杂志。劳农派坚持社会革命目标、拒绝向资产阶级妥协、但反对列宁的先锋队理论，推崇労组斗争至上主义。\n\n1922年，受法国社会主义革命鼓舞，日本社会主义者决定继承1906年社会党精神，重建第二次社会党。此次建党以山川主义为理论指导，故称山川社会党。1926年，福本和夫、佐野学趁山川均等人入狱，在上海发布《上海一月提纲》，试图以福本主义党纲取代山川主义纲领。但福本和夫的改组始终未获狱中的社会党中央及工人国际批准。因此在1927年，福本和夫与山川均各率八名代表赴巴黎，在工人国际大会上辩论。最终，法国工人国际委员长蒙穆判定山川主义为社会党唯一指导思想。\n\n与讲座派不同，劳农派主张“社会革命一阶段论”，即明治维新是不彻底的资产阶级革命。既然日本已是成熟的资本主义国家，封建残余已非主要障碍，那么革命任务就直接无产阶级社会主义革命，无需经过一个独立的资产阶级民主革命阶段。对于劳农派而言，“无产阶级的绝对胜利是政治的目的”。任何议会、工会、农会的斗争，都只是用来“施以政治训练、推进资产阶级与无产阶级之间决定性斗争”的战术工具。劳农派认为资产阶级议会本质上是反动的斗争，明确主张最终必须通过社会革命推翻资本主义统治。"

