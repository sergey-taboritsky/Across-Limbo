 Fascism_desc: ""
 National_Socialism: "民族民粹主义"
 National_Socialism_desc: "“在痛苦中，一个崭新的俄罗斯、一个既不是沙皇也不是布尔什维克的俄罗斯正在诞生。”\n\n民族民粹主义，或称萨文科夫主义，是由伟大的国家元首鲍里斯·萨文科夫提出并践行的政治信仰体系，其核心思想集中体现在纲领性著作《俄罗斯之路：为了祖国与自由》之中。该意识形态以民族革命为绝对核心，反对共产主义、工团主义以及一切形式的国际主义，主张俄罗斯的命运应由俄罗斯民族自己掌握，而非受制于任何外来意识形态或阶级理论的支配。\n\n萨文科夫去世后，其追随者将他的思想系统化、体系化，正式定义为“萨文科夫主义”，其主要定义为俄罗斯是由民族共同体为根基、以强国家为保障、以社会公正为目标的有机国家。其元首代表了民族与国家的象征。\n\n萨文科夫的追随者认为这种思想并非教条而是一种动态的、面向未来的民族事业。其终极目标是建设一个由民族意志主导、国家机器强大、社会伦理牢固的共同体。也就是所谓的第三俄罗斯之道路。\n\n随着时间的推移，萨文科夫主义的影响开始超越俄罗斯国界，在欧亚大陆乃至更广泛的区域中传播并本土化，衍生出形态各异的变体。尽管形态各异，但都共享一个核心——以民族为最高政治单位，国家权力至高无上并凌驾于资本和外来意识形态之上。萨文科夫主义也因此成20世纪中叶后期极右翼团体与民族革命的思想渊源。"
