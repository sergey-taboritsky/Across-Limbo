 Marxism: "马克思主义"
 Marxism_desc: "“迄今为止一切社会的历史都是阶级斗争的历史。自由民和奴隶、贵族和平民、领主和农奴、行会师傅和帮工，一句话，压迫者和被压迫者，始终处于相互对立的地位，进行不断的、有时隐蔽有时公开的斗争，而每一次斗争的结局都是整个社会受到革命改造或者斗争的各阶级同归于尽。”\n\n作为一套涵盖了政治、经济和哲学等诸多领域的庞大体系，马克思主义的形成贯穿了十九世纪的整个资本主义上升期，并因其自身的科学性以及对新兴的无产阶级所肩负的历史任务的指明——随着资本主义因其自身矛盾不可避免地走向毁灭，身为被剥削者的无产阶级必将通过斗争消灭一切阶级差别、使人类于崭新的基础上重建无阶级社会——而在接下来数十年内迅速传播开来，成为了于世界范围内流传最为广泛的系统性学说，也正因如此，无论拥护抑或反对，它都已是各国政界和学界不可避免的讨论对象。\n\n自社会主义国际成立以来，纵使经历过数次分裂，各自所秉持的世界观和方法论或许也并不相同，但现存各派马克思主义者的根本追求始终如一：经由政治革命，取得政权的无产阶级将运用国家这一武器，不仅对一切剥削阶级执行剥夺剥夺者的政策、并且要在大机器工业的基础上对一切小生产加以改造；当这一进程彻底结束之时，生产的社会化与生产资料私有制之间的矛盾将从根本上得到消弭，无阶级的社会主义社会将确立起来，而作为阶级统治的工具的国家则将在随后迎来消亡，自由人的联合体亦将由此化为现实，从而真正终结人类社会的史前时期。于经济危机和第二次世界大战的烈火将昔日帝国主义秩序焚毁殆尽的当下，随着半个世界的无产阶级彻底挣脱锁链、迎来解放，加之马克思主义者成功在多个发达国家取得了政权，可以说，作为一种意识形态的马克思主义已然赢得了空前的胜利。尽管迄今为止也并非所有社会主义者都选择将其奉为圭臬，不过，于国际无产阶级的奥林匹斯山当中，它的权威早已不证自明。"
 Marxism_Leninism: "布尔什维主义"
 Marxism_Leninism_desc: "“共产党人不屑于隐瞒自己的观点和意图。他们公开宣布：他们的目的只有用暴力推翻全部现存的社会制度才能达到。让统治阶级在共产主义革命面前发抖吧！无产阶级在这场革命中失去的只是锁链。他们获得的将是整个世界。”\n\n布尔什维主义同马克思主义的其它流派相比，最大的差别在于列宁提出了“民主集中制”、“先锋队理论”。除此之外，他们更加重视政治集中化，加强完善严密的先锋队政党组织以使得革命政权组织度张力逐渐扩大，并强调“过渡时期”的无产阶级专政是社会主义阶段必不可少的特征。列宁认同“暴力革命”和“无产阶级专政”是实现社会主义最重要的途径。并且认为不发达的资本主义社会里，无产阶级可以率先夺取政权，建立社会主义国家。19世纪末20世纪初，国际共产主义运动在“如何取得政权”和“无产阶级政权如何治理国家”两个问题上出现了重大分歧。以考茨基为代表的一派认为，无产阶级政党应当致力于走合法议会斗争路线，在取得政权之后可以保留原本的民主制度。而列宁为代表的另一派认为，无产阶级政党寻求合法斗争中还必须保持高度的警惕性，必须时刻准备着武武装起义以暴力革命取得政权。而在取得政权之后，不应当保留资产阶级民主制度，而应实施无产阶级专政，实行无产阶级民主，在无产阶级获得政权之后，有必要采取无产阶级对资产阶级实行专政的方式保卫无产阶级政权。"
 Fukumotoism: "再建派马克思主义"
 Fukumotoism_desc: "真正的马克思主义者绝不能与折衷主义者同流合污。我们必须通过毫不妥协的理论斗争，将一切改良主义与机会主义的杂质从无产阶级的先锋队中涤荡干净，只有这样，纯粹的革命力量才能在历史的暴风雨中凝结成形。”\n\n一九二五年，一名叫做北条一雄的青年在《马克思主义》期刊发表批判山川主义的文章，此后他反对工团主义的论述广受无产阶级革命家认同，甚至在社会党内掀起一场“福本旋风”。作为北条一雄真实身份的福本和夫，其主张的不仅是关于政党组织与革命战略的政治路线，更是一套带有强烈黑格尔主义色彩与精英主义倾向的哲学纲领。怀着极致的理论热忱，福本和夫的追随者致力于纠正当时日本左翼运动中的工团主义与合法主义错误。\n\n1926年蒙索目裁决后，落败的福本和夫与河合悦三等人未返回日本，而是前往英国，在莫斯利支持下组建共产党（海外委员会）。1923年，日本共产党将福本和夫、野坂参三、河合悦三开除出党，福本等人随即另行组建日本共产党（统一协议会），远程指挥日本国内的反战运动。1945年战争结束后，福本和夫等人回国，尽管山川均与共产党邀请其加入民主人民阵线，福本和夫却拒绝邀请，组建“共产主义劳动者党”参与政治活动。\n\n福本主义拒绝一切工团主义与妥协路线，不仅将北方天皇制和美国占领军视为亟待摧毁的“绝对君主制”，还始终主张资产阶级民主革命必须由绝对纯粹的马克思主义者领导，认为共产党和社会党都是妥协的、工团化的非马克思主义政党。因此，共労党与其工会“产别民主同盟”坚定反对社会党政权，认为必须将“祖国摧毁并再建”，才能实现真正的共产主义。"
 Japanese_Marxism: "劳农派马克思主义"
 Japanese_Marxism_desc: "“无产阶级运动的最后目的，即无产阶级的绝对胜利，是政治的目的，是政治的胜利。与这种政治目的和政治胜利完全分离的经济上的直接行动，总之是以局部改良为目的的斗争，即改良主义运动。这种局部斗争，与无产阶级的最后目的即政治目的连结在一起时，才产生革命的意义。”\n\n劳农派马克思主义，又称山川主义，是日本最具影响力的马克思主义流派，其得名于1927年创办的《劳农》杂志。劳农派坚持社会革命目标、拒绝向资产阶级妥协、但反对列宁的先锋队理论，推崇労组斗争至上主义。\n\n1922年，受法国社会主义革命鼓舞，日本社会主义者决定继承1906年社会党精神，重建第二次社会党。此次建党以山川主义为理论指导，故称山川社会党。1926年，福本和夫、佐野学趁山川均等人入狱，在上海发布《上海一月提纲》，试图以福本主义党纲取代山川主义纲领。但福本和夫的改组始终未获狱中的社会党中央及工人国际批准。因此在1927年，福本和夫与山川均各率八名代表赴巴黎，在工人国际大会上辩论。最终，法国工人国际委员长蒙穆判定山川主义为社会党唯一指导思想。\n\n与讲座派不同，劳农派主张“社会革命一阶段论”，即明治维新是不彻底的资产阶级革命。既然日本已是成熟的资本主义国家，封建残余已非主要障碍，那么革命任务就直接无产阶级社会主义革命，无需经过一个独立的资产阶级民主革命阶段。对于劳农派而言，“无产阶级的绝对胜利是政治的目的”。任何议会、工会、农会的斗争，都只是用来“施以政治训练、推进资产阶级与无产阶级之间决定性斗争”的战术工具。劳农派认为资产阶级议会本质上是反动的斗争，明确主张最终必须通过社会革命推翻资本主义统治。"
 Committee_Communism: "委员会共产主义"
 Committee_Communism_desc: "“如果无产阶级取得了政权，它应当创造社会主义民主制去代替资产阶级民主制，而不是取消一切民主制，这是无产阶级的历史使命……社会主义民主制是与废除阶级统治和建设社会主义同时开始的。它在社会主义政党夺取政权的那一时刻就开始了。它无非是无产阶级专政。是的，专政！但这一专政是在于运用民主的方式，而不是在于取消民主，是在于有力地、坚决地侵犯资产阶级社会的既得权利和经济关系，没有这种侵犯，社会主义革命就不能实现。但是这一专政必须是阶级的事业，而不是极少数领导人以阶级的名义实行的事业，这就是说，它必须处处来自群众的积极参与，处于群众的直接影响下，接受全体公众的监督，从人民群众日益发达的政治教育中产生出来。”\n\n委员会共产主义与列宁主义最大的差别就是前者推崇少量的集权化，以最大的程度推崇无产阶级民主，他们更注重政治民主实践，保障公民应得的社会自由与倡导平等-团结的社会价值观。\n\n委员会共产主义其代表性特征包括但不仅限于：少量集权化的计划经济，苏维埃民主，思想自由与文化自由等。值得一提的是，虽然他们也和列宁主义者一样支持国家控制工会，但往往给予工会更大的自治权以确保工会能真正参与到经济决策之中。"
 Left_wing_communism: "左翼共产主义"
 Left_wing_communism_desc: ""
 Imperial_Communism: "天皇制共产主义"
 Imperial_Communism_desc: "“万世一系にあらざる皇室を是正して、住みよい日本をつくりあげる（纠正并非万世一系的皇室，创造一个宜居的日本）”\n\n1392年南北朝统一时，室町幕府将军足利义满曾承诺皇位由大觉寺统与持名苑统两系交替继承，但北朝系的持名苑统独占了皇位，背弃了约定。因此，此后所有北朝系天皇——包括此时的昭和天皇裕仁——的皇位都是不法的。因此作为南朝后龟山天皇第18代子孙，其家系在应仁之乱后隐居于尾张国的熊泽宽道，才是南朝正统的合法继承人——日本唯一合法的统治者。\n\n在新潟保卫战战后造成的混乱中，熊泽宽道凭借个人魅力平息了当地的混乱，并向共产党临时委员长神山茂夫明确表达了支持立场。在与熊泽宽道会谈后，神山茂夫折服于正统天皇的神威，决定拥立其为帝。\n\n天皇共产主义认为天皇制度与共产主义并不冲突，天皇作为高于先锋队的上位者，能够监督并预防先锋队腐化。不同于北方的劳动前卫同盟，天皇共产主义主张天皇依附于劳动者，而非劳动者依附天皇，是一套彻底的马克思主义理论。\n\n在动乱平息后，经产别会议一致通过决议，熊泽宽道加冕为为大日本勤劳大众帝国的天皇。从此日本诞生了世界上首位共产党员皇帝！\n\n§R天皇陛下！万岁！劳动者的日本帝国！万岁！§!"

