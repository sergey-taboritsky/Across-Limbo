 Junshen_government: "军绅政权"
 Junshen_government_desc: "自平定太平天国以来，中国的绅权与军权相结合，出现了“绅军政权”的政治势力，例如清季的湘，淮，袁三集团；但在辛亥革命后，军人的势力壮大，中国的行政机构自上而下地变成了军人领导绅士的政权。尽管这一类政权在省宪运动以后似乎主动拥抱了“民主宪政”，但他们的地方权力却因自治运动而得到强化，地方的乡长，县长也受军人的操纵。军绅政权基于儒家伦理的社会关系，带有显著的地方主义色彩并汲汲于争权夺利；与清季主导工业发展的督抚不同，军绅政权的领袖尽管也参与了国家的工业发展或金融事业发展等改革，但他们更注重于通过发展经济来囤积个人财富，扩充军力，为此不惜破坏和阻挠交通运输，搅乱中国的货币制度；地方的军绅政权能否捍卫中国的主权也是很成问题的，至于他们是否甘心做外国控制中国的爪牙，那只是“意愿”的问题。"
