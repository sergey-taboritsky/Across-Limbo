 Socialism_Britain: "英式社会主义"
 Socialism_Britain_desc: "“政府机构应进行最彻底的改革；通过遵循公共工程计划，可以大幅减少失业；长期经济重建需要以比以往设想更大的规模动员国家资源。”\n\n英式社会主义源自工党领袖奥斯瓦尔德·莫斯利所提出的“莫斯利备忘录”，其中包括一系列旨在通过国家干预和计划经济来实现社会主义目标的政策建议。莫斯利认为，传统的自由放任经济无法解决社会不平等和经济危机，因此需要通过政府的积极干预来实现社会的公平与正义。\n\n英式社会主义强调国家在经济中的主导作用，主张通过国有化关键产业、实施全面的社会福利制度以及推动公共服务的发展来改善人民的生活条件。莫斯利提出了一套详细的经济计划，旨在通过国家控制资源分配和生产方式，实现经济的稳定增长和社会的全面发展。"
