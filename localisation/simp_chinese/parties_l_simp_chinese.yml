 discipline: "训政"
 discipline_desc: "“在训政时期，政府当派曾经训练、考试合格之员，到各县协助人民筹备自治。其程度以全县人口调查清楚，全县土地测量完竣，全县警卫办理妥善，四境纵横之道路修筑成功；而其人民曾受四权使用之训练，而完毕其国民之义务，誓行革命之主义者得选举县官，以执行一县之政事；得选举议员，以议立一县之法律，始成为一完全自治之县。”\n\n孙中山认为以目前中国国民的素质水平，暂时无法行使作为国家主人权力的能力，因此需要由中国国民党领导国民政府对国民的素质进行训练、教导，以开化民心。训政的最终目的就是实现将中华民国最终建设为民主的国家，即“宪政”的阶段。\n\n训政时期由中国国民党全国代表大会代表国民大会行使中央统治权。中国国民党全国代表大会闭会时，其职权由中国国民党中央执行委员会行使之。\n\n这个时期的主要任务是：施行约法，进行政治训练；筹备地方自治，并以三民主义训练人民，使其了解应行使的民权和应尽的义务；发展经济并进行社会建设。"
