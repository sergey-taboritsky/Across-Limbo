 National_Socialism_desc: "“在痛苦中，一个崭新的俄罗斯、一个既不是沙皇也不是布尔什维克的俄罗斯正在诞生。”\n\n民族民粹主义，或按俄罗斯官方称谓，“斯沃博达”，是一种特殊的激进民族主义意识形态。\n\n相比诉求明确的各种社会主义流派，斯沃博达主义主张较为模糊不清，几乎完全由领袖一人维系其定义权——而根据公认定义，该思想的信徒应当在单一领袖、单一组织、单一国家的框架下踏上反对民族敌人、自由主义与各色社会主义的圣战，完成道德与灵魂的救赎，并在此征途中抛弃堕落腐化的唯物主义。\n\n随着俄军于世界大战中击碎德意志帝国，斯沃博达主义的影响力迅速增长，全球反工团主义的右翼独裁者都开始逐步学习其意识形态准则与治理方略，从而使该意识形态自俄罗斯发源而推广至世界的各个角落。"
