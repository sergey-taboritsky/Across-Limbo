 National_Conservatism: "民族保守主义"
 National_Conservatism_desc: "“上帝、民族、领袖！祖国、家庭、秩序！”\n\n民族保守主义是一种重视“民族利益和传统社会结构、种族观点”具有民族主义元素的保守主义思想，他们大多注重社会稳定以及传统家庭，寻求维护宗教、议会政府和财产权等一系列制度，目的是强调社会的稳定性和连续性。\n\n在意识形态上，民族保守主义不是一种统一的哲学，但追随者广泛表达了对民族主义、爱国主义、同化主义和单一文化主义的支持。与此同时，人们表达了对国际主义、种族政治、多元文化主义的反对。民族保守派坚持一种文化民族主义形式，强调维护民族认同和文化认同。因此，许多人赞成融入主流文化，限制移民和严格的法律和秩序政策。\n\n除了这些共同元素，民族保守主义者在不同国家里，依当地因素的不同而有不同的观点。尤其是在经济议题上，民族保守主义者的观点可以从支持一部分的计划经济到中间派的混合经济，或是自由放任经济。"
 Patriarchal_Conservatism: "家长制保守主义"
 Patriarchal_Conservatism_desc: "“我们不能总是为我们的青年造就美好未来，但我们能够为未来造就我们的青年一代。”\n\n家长保守主义特别强调家长式的义务，参考贵族义务的封建概念，即那些在社会上享有特权和富裕的人对社会较贫穷的部分负有责任。与职责、等级和有机统一等原则相一致，家长保守主义可以被视为传统保守主义的产物。家长保守主义根据最实际的情况支持或建议个人和国家之间的平衡。\n\n家长保守主义强调政府的职责需要相当广泛的国家干预，以培养所有公民的美好生活。政府被设想为一个仁慈的父亲形象设定目标并确保公平竞争和平等机会的指导主义路径，强调社会安全网对解决贫困和支持再分配的重要性，以及政府为了消费者和生产者的利益对市场进行监管。通常情况下他们支持受限制的市场经济，但是更加自由开放的经济政策也不是没有先例。"
