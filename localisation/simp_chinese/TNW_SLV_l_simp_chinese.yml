 SLV_Boris_Kidric:0 "鲍里斯·基德里奇"
 SLV_Boris_Kidric_desc:0 "斯洛文尼亚共产党最年轻的中央委员，解放阵线的实际操盘手。他给卢布尔雅那带来的不是简单的阶级口号，而是一整套把工人、农民与进步知识分子组织为一体的建国方略——第三国际的同志们称他是山那边最有经济学头脑的共产党人。"
