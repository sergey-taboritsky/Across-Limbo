#决议（继承角力）
 PER_suc_decisions: "继承角力"
 PER_suc_decisions_desc: "新伊朗党内各派力量（总和恒为100）：\n特穆尔塔什集团：§Y[?THIS.PER_suc_progress_var|.0]§!\n军方派：§Y[?THIS.PER_suc_military_var|.0]§!\n激进派：§Y[?THIS.PER_suc_radical_var|.0]§!\n第二共和协会：§Y[?THIS.PER_suc_association_var|.0]§!\n\n路线表决需要本派力量§Y不低于35§!。"
 PER_suc_rally_progress: "特穆尔塔什集团造势"
 PER_suc_rally_progress_desc: "达瓦尔的幕僚们翻出特穆尔塔什时代的工业账本，在每一位代表面前展开。"
 PER_suc_rally_military: "军方派造势"
 PER_suc_rally_military_desc: "将军们穿着熨烫笔挺的军装出现在每一场党内茶会上。"
 PER_suc_rally_radical: "激进派造势"
 PER_suc_rally_radical_desc: "激进派的演说家们把1921年立宪革命的故事讲了一遍又一遍。"
 PER_suc_rally_association: "第二共和协会造势"
 PER_suc_rally_association_desc: "协会元老们请代表们赴宴。宴席的规格无可挑剔，账单的来路同样无可挑剔。"

#理念
 PER_oil_for_machines: "石油换机床"
 PER_oil_for_machines_desc: "石油北去，机床南来。莫斯科与德黑兰的共生生意。"
 PER_tabriz_unrest: "大不里士风云"
 PER_tabriz_unrest_desc: "阿塞拜疆人的记忆没有随共和国一起死去。大不里士的街垒只是暂时休息。"
 PER_gulf_ambition: "波斯湾的诉求"
 PER_gulf_ambition_desc: "巴林、阿布穆萨、通布群岛——波斯湾的地图必须用波斯语重新标注。"
 PER_route_progress: "进步狂热"
 PER_route_progress_desc: "特穆尔塔什集团执政。整个国家被当作一台待装配的机器，而达瓦尔手里握着全部的图纸。"
 PER_route_gendarme: "铁腕宪兵"
 PER_route_gendarme_desc: "军方执政。秩序、纪律与油井的轰鸣——将军们许诺的现代化是列队行进的现代化。"
 PER_route_constitution: "复归宪政"
 PER_route_constitution_desc: "激进派执政。1921年的立宪承诺在四分之一个世纪后终于被兑现。"
 PER_route_republic: "老共和派"
 PER_route_republic_desc: "第二共和协会执政。一个由元老们用程序与资历精心修剪的共和国。"
 PER_route_caretaker: "看守内阁"
 PER_route_caretaker_desc: "摩萨台的看守政府。国家在四派沉默的对峙中缓缓呼吸。"
 PER_Fazlollah_Zahedi_army_chief: "陆军参谋长扎赫迪"
 PER_Fazlollah_Zahedi_army_chief_desc: "扎赫迪将军接管全军参谋部。"
 PER_Mahmud_Jam_political_advisor: "首席参议贾姆"
 PER_Mahmud_Jam_political_advisor_desc: "贾姆是党内最受元老信任的老成谋国之士。"

#角色
 PER_Ali_Razmara: "阿里·拉兹马拉"
 PER_Ali_Razmara_desc: "§Y出生于：§!§L1893年，波斯崇高国，德黑兰§!\n§Y人物背景：§!§L哥萨克师出身的职业军人，埃卢姆麾下最受信任的集团军司令官。他以治军严谨与不问政治著称——但所有人都知道，埃卢姆死后的军队听谁的，伊朗就听谁的。§!"
 PER_Fazlollah_Zahedi: "法兹卢拉·扎赫迪"
 PER_Fazlollah_Zahedi_desc: "§Y出生于：§!§L1897年，波斯崇高国，哈马丹§!\n§Y人物背景：§!§L老资格的宪兵将领，南方宪兵体系的缔造者。他在胡齐斯坦的油井之间经营了自己的二十年，油田警备司令部的每一个哨位上都有他的人。§!"
 PER_Mahmud_Jam: "马哈茂德·贾姆"
 PER_Mahmud_Jam_desc: "§Y出生于：§!§L1881年，波斯崇高国，大不里士§!\n§Y人物背景：§!§L新伊朗党元老，曾任数届内阁大臣。贾姆以调和党内各派闻名，第二共和协会视他为定海神针。§!"
 PER_Mohammad_Ali_Foroughi: "穆罕默德-阿里·佛咯衣"
 PER_Mohammad_Ali_Foroughi_desc: "§Y出生于：§!§L1877年，波斯崇高国，德黑兰§!\n§Y人物背景：§!§L立宪革命时代的最后一位元老，第二共和协会的荣誉主席。他的书房里保存着1921年共和国的全部法统，而他本人就是一部活着的宪政法典。§!"
 PER_Iraj_Eskandari: "伊拉杰·埃斯坎达里"
 PER_Iraj_Eskandari_desc: "§Y出生于：§!§L1907年，波斯崇高国，德黑兰§!\n§Y人物背景：§!§L人民党的核心组织者。他在油田与纱厂之间建立了一张地下网络，在埃卢姆时代的高压之下奇迹般地保存了党的火种。§!"
 PER_Mohammad_Mosaddeq: "穆罕默德·摩萨台"
 PER_Mohammad_Mosaddeq_desc: "§Y出生于：§!§L1882年，波斯崇高国，德黑兰§!\n§Y人物背景：§!§L以清廉与固执著称的老律师。他反对埃卢姆，也反对达瓦尔，还反对将军们——但在继承危机的僵局里，反对所有人的他成了所有人唯一的公约数。§!"

#事件
 PER_event.1.t: "将军的心脏"
 PER_event.1.d: "深夜，德黑兰传来急电：总统穆罕默德-胡塞因·埃卢姆因突发心脏病抢救无效逝世。这位哥萨克出身的总统统治伊朗七年有余，他带来了稳定、秩序与石油的繁荣，也带来了消声的报纸与噤声的反对派。此刻，新伊朗党的走廊灯火通明——按照宪法，代总统将由党的最高领导人暂时代行，但所有人都清楚：真正的权力交接，要在走廊里完成。"
 PER_event.1.a: "让葬礼先办完吧。"
 PER_event.2.t: "特穆尔塔什的遗产"
 PER_event.2.d: "达瓦尔以代总统身份召见党的最高委员会。他没有发表煽动演说，只是把特穆尔塔什时代的工业计划书一份份摊在长桌上：机床的到货日期、油井的增产指标、铁路的延长里程。'这是我们的纲领。'他说，'也是对他的纪念。'走廊里的窃窃私语变了调子——达瓦尔不是一个可以轻视的过渡人物。"
 PER_event.2.a: "进步的事业将由他的学生完成。"
 PER_event.3.t: "人民党的浪潮"
 PER_event.3.d: "阿巴丹炼油厂的工人率先放下工具，大不里士与伊斯法罕的纱厂随即响应。人民党的地下网络一夜之间浮出水面：传单、标语与游行队伍出现在七座城市。他们要求八小时工作制、工会合法化，以及——在口号的最末一行——'一个人民的伊朗'。政府面临选择：刺刀、谈判，还是沉默。"
 PER_event.3.a: "出动宪兵。罢工必须立刻结束。"
 PER_event.3.b: "派人与工人代表谈判。"
 PER_event.3.c: "不予理会。浪潮总会退去。"
 PER_event.4.t: "大不里士的春天"
 PER_event.4.d: "大不里士的市政选举出现了一场精心策划的示威：阿塞拜疆语的标语第一次公开悬挂在市政厅对面的墙上。安全部门的报告指出，流亡的阿塞拜疆民族活动家正在得到某种庇护，而茶馆里的旧口号——'阿塞拜疆人的阿塞拜疆'——正重新被人传唱。"
 PER_event.4.a: "逮捕名单上的每一个人。大不里士不是他们的舞台。"
 PER_event.4.b: "允许阿塞拜疆语教育与市政自治的有限试验。"
 PER_event.4.c: "装作什么都没有发生。"
 PER_event.5.t: "波斯湾的遗产"
 PER_event.5.d: "海军部的地图摊在总理府的长桌上：巴林的珍珠与炼油设施、阿布穆萨与通布群岛的锚地——每一处都被标上了波斯帝国的旧名。'这些岛屿在伦敦的地图上是别的颜色，'海军大臣说，'但历史书站在我们这边。'向大英帝国递交照会意味着什么，没有人比德黑兰更清楚——四十年前，正是英国人的舰队把这片海湾变成了'英国湖'。"
 PER_event.5.a: "递交照会。波斯湾的名字必须改回来。"
 PER_event.5.b: "现在不是时候。把地图卷起来。"

#政党（原位替换空占位）
#路线纵腿（进步狂热：国有化与国家调控）
 PER_State_Oil_Monopoly: "石油国家专营"
 PER_State_Oil_Monopoly_desc: "从胡齐斯坦的井口到阿巴丹的炼塔，石油的每一滴都属于国家。莫斯科的工程师可以留下，但账本必须换成德黑兰的。"
 PER_Supreme_Plan_Board: "最高计划委员会"
 PER_Supreme_Plan_Board_desc: "仿照俄国的计划机关，伊朗成立了自家的最高计划委员会：七年为期，油元流向国家指定的方向。"
 PER_Regulate_the_Bazaar: "管制巴扎"
 PER_Regulate_the_Bazaar_desc: "大巴扎的商人们第一次发现，价签上的数字不再由他们决定。配给、限价与国营批发把千年商道纳入了计划的轨道。"
 PER_Fever_of_Progress: "进步的狂热"
 PER_Fever_of_Progress_desc: "达瓦尔的伊朗在狂奔：学校、工厂、铁路与标语一样不缺。有人称之为复兴，也有人称之为一场不许缺席的行军。"
#路线纵腿（铁腕宪兵：国家投资）
 PER_Trans_Iranian_Railway: "跨伊朗铁路"
 PER_Trans_Iranian_Railway_desc: "从里海到波斯湾，钢轨纵贯国土。军队的列车优先通行，但农民的羊群也能赶上新开的班次。"
 PER_Steel_of_Isfahan: "伊斯法罕的钢铁"
 PER_Steel_of_Isfahan_desc: "在萨法维穹顶的阴影下，第一座国家钢铁厂立起了烟囱。将军们说：刺刀会锈，国家不会。"
 PER_Arms_of_the_Nation: "国家的军械"
 PER_Arms_of_the_Nation_desc: "把军械库从兵营搬进工厂：制式步枪、火炮弹壳与军靴的生产线全部收归国有。军队第一次不必看外国军火商的脸色。"
 PER_Order_of_Iron: "铁之秩序"
 PER_Order_of_Iron_desc: "拉兹马拉的伊朗像一座军营：准时、清洁、沉默。大街上游荡的人民党学生少了很多，因为兵营里多了很多位置。"
#路线纵腿（复归宪政：开放自由市场）
 PER_Open_the_Banks: "开放银行业"
 PER_Open_the_Banks_desc: "帝国银行许可证制度寿终正寝。德黑兰的金融街上，波斯商人的钱庄与外国银行的分行隔着门脸互相打量。"
 PER_Free_Trade_Charter: "自由贸易宪章"
 PER_Free_Trade_Charter_desc: "关税壁垒被议会一刀砍平。丝绸、地毯、干果与棉花涌向口岸，而外国的棉布也第一次与本地货平起平坐。"
 PER_Invite_Foreign_Capital: "引进外国资本"
 PER_Invite_Foreign_Capital_desc: "议会以法律形式担保外资的安全。伦敦、巴黎乃至莫斯科的资本都想在波斯下一注，而德黑兰乐得坐庄。"
 PER_Market_of_Empires: "万商之门"
 PER_Market_of_Empires_desc: "千年前，商队从这条路走向世界；如今轮船与火车带来了整个世界。塔代永的伊朗成了各大帝国之间敞开的柜台。"
#路线纵腿（老共和派：文官兴业）
 PER_Civil_Investment_Bank: "国家兴业银行"
 PER_Civil_Investment_Bank_desc: "不直接办厂，而是放贷：国家兴业银行以低息把油元贷给商人、合作社与地方议会。文官们相信，播种比收割更需要耐心。"
 PER_Textiles_of_the_Caspian: "里海的纺织"
 PER_Textiles_of_the_Caspian_desc: "吉兰的棉花、安扎利的码头与新起的纱厂连成一线。第一代女工走进厂房时，感到的是既恐惧又崭新的自由。"
 PER_Roads_and_Posts: "道路与驿政"
 PER_Roads_and_Posts_desc: "把驿道换成公路，把驿站换成邮局。文官政府的政令第一次能在一周之内传遍各省——这本身就是一场革命。"
 PER_Republic_of_Offices: "文官的共和"
 PER_Republic_of_Offices_desc: "佛咯衣的共和国不靠刺刀也不靠演说家，靠的是档案、名册与按时发放的薪水。平淡，但这是两百年来头一次。"
#看守内阁分线（共和不废）
 PER_Republic_Endures: "共和不废"
 PER_Republic_Endures_desc: "摩萨台在议会上宣布：1906年的宪法从未死亡，共和国只是暂时缺席。现在，它回来了，而且不再离开。"
 PER_Oil_Sovereignty: "石油主权"
 PER_Oil_Sovereignty_desc: "摩萨台向议会递交了石油国有化法案：从井口到油轮，波斯的每一滴黑色血液都只接受德黑兰的调遣——包括俄国人的那份。"
 PER_Active_Neutrality: "积极中立"
 PER_Active_Neutrality_desc: "均势外交是波斯的古老技艺：不让任何大国在波斯湾站稳，也不让任何大国被彻底得罪。摩萨台把这门手艺练成了国策。"
 PER_Legacy_of_the_Majlis: "议会之魂"
 PER_Legacy_of_the_Majlis_desc: "议会的尊严不在于它能命令谁，而在于没有人能绕开它。摩萨台用一场教科书式的宪政危机，把这句话写进了每个人心里。"
#看守内阁分线（凯加复辟）
 PER_Restoration_Council: "复辟枢密院"
 PER_Restoration_Council_desc: "摩萨台本人就是凯加王室的苗裔。枢密院的密谈只有一个议题：既然共和无人能立，何不迎回那个被革命仓促赶走的王朝？"
 PER_Invite_Hamid_Mirza: "迎立王储"
 PER_Invite_Hamid_Mirza_desc: "流亡欧洲的哈米德·米尔扎王子收到了德黑兰的密信：王座虚悬二十八年，现在，议会请您回家。"
 PER_Crown_and_Constitution: "王冠与宪法"
 PER_Crown_and_Constitution_desc: "加冕礼与宪章签署在同一天：沙阿的权力被宪法逐条框定，议会照常开会，大臣照常对议会负责。凯加王朝以一种从未有过的姿态归来了。"
 PER_Restored_Crown: "归来的王冠"
 PER_Restored_Crown_desc: "王座上重新坐了一位沙阿，但真正坐稳的是宪法。历史学家将会争论：这究竟是复辟，还是一场借用了王冠的革命。"
#新理念
 PER_state_monopoly: "石油专营"
 PER_state_monopoly_desc: "石油归国家，账本归德黑兰。"
 PER_plan_board: "计划委员会"
 PER_plan_board_desc: "七年为期，油元有主。"
 PER_regulated_bazaar: "受管的巴扎"
 PER_regulated_bazaar_desc: "价签上的数字不再由商人决定。"
 PER_fever_of_progress: "进步的狂热"
 PER_fever_of_progress_desc: "一场不许缺席的行军。"
 PER_iron_order: "铁之秩序"
 PER_iron_order_desc: "准时、清洁、沉默。"
 PER_open_banks: "开放的银行"
 PER_open_banks_desc: "金融街上的新门脸。"
 PER_free_trade: "自由贸易"
 PER_free_trade_desc: "关税壁垒已成历史名词。"
 PER_gate_of_merchants: "万商之门"
 PER_gate_of_merchants_desc: "整个世界都来波斯下注。"
 PER_civil_bank: "兴业银行"
 PER_civil_bank_desc: "播种比收割更需要耐心。"
 PER_offices_republic: "文官共和"
 PER_offices_republic_desc: "靠档案、名册与按时发放的薪水统治。"
 PER_oil_sovereignty: "石油主权"
 PER_oil_sovereignty_desc: "波斯的黑色血液只听德黑兰调遣。"
 PER_active_neutrality: "积极中立"
 PER_active_neutrality_desc: "不站队，是一门手艺。"
 PER_majlis_soul: "议会之魂"
 PER_majlis_soul_desc: "没有人能绕开议会。"
 PER_qajar_restoration: "凯加复辟"
 PER_qajar_restoration_desc: "王座虚悬二十八年，如今重归旧主。"
 PER_restored_crown: "归来的王冠"
 PER_restored_crown_desc: "借用了王冠的革命。"
#角色
 PER_Hamid_Mirza: "哈米德·米尔扎"
 PER_Hamid_Mirza_desc: "流亡中的凯加王储。温和、谨小慎微，但对重回家园这件事，他从未真正死心。"
#工具提示
