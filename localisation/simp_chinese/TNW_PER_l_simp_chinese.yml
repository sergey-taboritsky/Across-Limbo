 PER_Mohammad_Hosayn_Ayrom: "穆罕默德-胡塞因·埃卢姆"
 PER_Mohammad_Hosayn_Ayrom_desc: "§Y出生于：§!§L1882年3月31日，俄罗斯帝国，巴库§!\n§Y人物背景：§!§L阿塞拜疆族的埃卢姆氏族自古以来便居于阿塞拜疆与亚美尼亚的狭长交界处，直到俄波战争将这片土地永远从波斯手中夺去。穆罕默德-胡赛因的这一支脉在随后俄罗斯帝国的工业化浪潮中迁往巴库，并定居在城市中。穆罕默德-胡赛因的父亲帖木儿汗·埃卢姆在青年时便南下波斯加入恺加王朝军队，而随后回到巴库娶妻生子，当穆罕默德-胡赛因出生时，其父已在波斯军中担任将军。然而，穆罕默德-胡赛因却选择了加入波斯哥萨克部队的同时留在俄罗斯帝国参军，直到伊朗立宪革命前夕才从俄军中退伍。此时，其在波斯军队中已经官至中校。\n\n1921年，穆罕默德-胡塞因·埃卢姆正式追随其父脚步迁往波斯，并立刻作为哥萨克领袖被卷入世界大战后的乱局中。伊朗局势的迅速演变也同样成为他不断晋升的契机—同年的共和革命，1925年的内战都使得伊朗军队迅速缩水，而他却凭借优秀的判断力选出了每一次风波中最终的胜利者。随着1933年的军事政变终结了最后一个民主选举的共和国政府，穆罕默德-胡塞因已经成为伊朗国家警察的总指挥官，同时被授予中将军衔。\n\n1934年初，新伊朗党上台执政，阿卜杜勒侯赛因·特穆尔塔什总统开始向莫斯科的萨文科夫靠拢。很快，俄罗斯急需复兴的工业生产得到了伊朗廉价石油的滋养，而其工业母机产出的机床则同时流向德黑兰新建的工业集群。然而，特穆尔塔什似乎有些过度轻信了俄罗斯人，而他的扩张野心与激进民族主义理念也在干扰俄罗斯的外交政策。就这样，1939年底，作为俄土密约的一部分，俄罗斯选择扶持出生于俄国境内、曾有俄军服役精力的前哥萨克穆罕默德-胡塞因·埃卢姆将军发动又一次政变，随后将向奥斯曼帝国购买的胡齐斯坦省交还伊朗。很快，在全国人民欢呼领土收复的庆贺声中，穆罕默德-胡塞因成为伊朗的新总统、新伊朗党的新主席。\n\n除去北印度战场的少量余波，第二次世界大战对伊朗几乎毫无影响。直到现在，穆罕默德-胡塞因统治伊朗已有数年，反对派已基本消声匿迹，而伊朗经济似乎仍在稳定发展中，仿佛稳定与秩序将会是伊朗当下乃至未来数十年的主旋律。§!"

