#事件
 PER_news.1.t: "伊朗总统病逝"
 PER_news.1.d: "据德黑兰传来的紧急消息称，伊朗总统穆罕默德-胡塞因·埃卢姆已经在深夜中突发心脏病去世。直到下次选举前，伊朗总统职位将由新伊朗党秘书长阿里-阿克巴·达瓦尔暂时代行。\n\n作为出生在阿塞拜疆的波斯哥萨克，穆罕默德·胡塞因·埃卢姆通常被认为是俄国的傀儡领导人，与新伊朗党对外展现的波斯民族主义与民粹主义并不相容。然而，此次被推举为代总统的达瓦尔则是前总统阿卜杜勒侯赛因·特穆尔塔什的总理，此举或许是伊朗共和国在对外展示全新的信号。"
 PER_news.1.a: "进步狂热的回归？"
#国策（1948 埃卢姆时代-1950 继承危机）
 PER_Stability_and_Order: "稳定与秩序"
 PER_Stability_and_Order_desc: "埃卢姆总统统治伊朗已有数年。反对派已经消声，报纸只印刷好消息。在德黑兰，稳定本身正在被供奉为一种成就。"
 PER_Oil_For_Machinery: "石油换机床"
 PER_Oil_For_Machinery_desc: "伊朗的廉价石油滋养着莫斯科的工业复兴，而俄国的机床则源源不断流向德黑兰的工厂。这笔共生生意是政权的经济命脉。"
 PER_Party_of_the_State: "作为国家的党"
 PER_Party_of_the_State_desc: "新伊朗党的支部深入每一个省份的税务局与警察局。党的名册就是国家的名册。"
 PER_Tehran_Modernises: "德黑兰的时髦"
 PER_Tehran_Modernises_desc: "电影院、百货公司与咖啡馆沿着旧城墙生长。特穆尔塔什时代的进步狂热留下了一座渴望现代的都市——哪怕乡村依然沉睡在中世纪。"
 PER_Gendarme_of_the_South: "南方宪兵"
 PER_Gendarme_of_the_South_desc: "胡齐斯坦的油井需要枪杆子看守。宪兵部队沿着输油管线驻扎，确保石油像钟表一样流向北方。"
 PER_Northern_Garrisons: "北方警备"
 PER_Northern_Garrisons_desc: "大不里士与库尔德山区的驻军换上了新任司令官。北方的边境线上，火药味比南方的石油更浓。"
 PER_Tabriz_Question: "大不里士问题"
 PER_Tabriz_Question_desc: "阿塞拜疆人从未忘记短暂共和国的记忆。大不里士的茶馆里，人们仍在低声谈论皮谢瓦里的名字。"
 PER_Kurdish_Highlands: "库尔德山区"
 PER_Kurdish_Highlands_desc: "马哈巴德的山民只服从部族与教长。德黑兰的命令要翻过多少道山梁，才能变成山民们听得懂的语言？"
 PER_The_Acting_President: "代总统的走廊"
 PER_The_Acting_President_desc: "埃卢姆的葬礼之后，新伊朗党的走廊里挤满了低声密语的人。达瓦尔暂时坐进了总统办公室——但每个人都知道，那把椅子还悬在半空。"
 PER_Teymourtash_Legacy: "特穆尔塔什的遗产"
 PER_Teymourtash_Legacy_desc: "达瓦尔是特穆尔塔什的总理与遗产执行人。特穆尔塔什集团相信：那位把石油变成机床的总统的路线，理应由他的学生续写。"
 PER_Barracks_Meeting: "军营里的会议"
 PER_Barracks_Meeting_desc: "哥萨克旧部的将军们关起营门开了整整一夜的会。埃卢姆死了，但枪杆子还在——军队必须由军人掌管。"
 PER_Radical_Spring: "激进派的春天"
 PER_Radical_Spring_desc: "新伊朗党的激进派一直被军方压制。如今他们公开提出：让共和国回到1921年的立宪初心，让选举归还人民。"
 PER_Association_Gentlemen: "协会诸公"
 PER_Association_Gentlemen_desc: "第二共和协会是党内的元老俱乐部。他们不信任将军，也不信任煽动家，只信任程序、资历与体面。"
 PER_Tudeh_Wave: "人民党的浪潮"
 PER_Tudeh_Wave_desc: "石油工人罢工，纺织工人声援，德黑兰大学的墙上贴满了人民党的传单。继承危机的走廊之外，另一种力量正在街上集结。"
 PER_Party_Supreme_Council: "最高委员会表决"
 PER_Party_Supreme_Council_desc: "新伊朗党最高委员会将召开全会，就总统职位与党的领导权举行表决。真正的较量在表决之外。"
 PER_Route_Progress: "进步狂热"
 PER_Route_Progress_desc: "达瓦尔正式当选总统，特穆尔塔什集团全面接管党和国家。进步狂热的回归：把整个伊朗改造成一台机床。"
 PER_Route_Gendarme: "铁腕宪兵"
 PER_Route_Gendarme_desc: "拉兹马拉将军以军委会名义接管总统职位。国家将由纪律、宪兵与油井的轰鸣声统治。"
 PER_Route_Constitution: "复归宪政"
 PER_Route_Constitution_desc: "塔代永宣布恢复选举与议会。立宪革命的火种在四分之一个世纪之后重新点燃。"
 PER_Route_Republic: "老共和派"
 PER_Route_Republic_desc: "佛咯衣与第二共和协会接管国家：一个由元老、程序与唯一执政党管理的体面共和国。"
 PER_Caretaker_Government: "看守内阁"
 PER_Caretaker_Government_desc: "无人过半。各派最终把摩萨台请了出来——这位以清廉与固执著称的老律师将组建看守内阁，直到国家想清楚要什么。"
 PER_Moscow_Partnership: "莫斯科的伙伴"
 PER_Moscow_Partnership_desc: "德黑兰正式加入莫斯科主导的联盟。石油与机床的生意从此有了刺刀作保。"
 PER_Independent_Course: "自立门户"
 PER_Independent_Course_desc: "伊朗感激俄国的机床，但伊朗的路要伊朗人自己走。独立自主的代价由官僚机器去精打细算。"
 PER_Schools_of_the_Nation: "国家的学堂"
 PER_Schools_of_the_Nation_desc: "让每一个村庄都有一所小学，让每一个孩子都读得懂《新伊朗报》。"
 PER_Wells_of_Khuzestan: "胡齐斯坦的油井"
 PER_Wells_of_Khuzestan_desc: "更多的井架、更多的炼塔、更多的管线。胡齐斯坦的黑色黄金将浇灌整个国家的工业化。"
 PER_Irrigation_of_the_Plains: "平原的灌溉"
 PER_Irrigation_of_the_Plains_desc: "坎儿井、水坝与信贷社。让农民的收成不再取决于天气的心情。"
 PER_Gulf_Legacy: "波斯湾遗产"
 PER_Gulf_Legacy_desc: "巴林的珍珠、通布岛的锚地、阿布穆萨的渔场——波斯湾的每一座岛屿都写着我伊朗的名字。伦敦的地图不认，那就让他们重新画。"
 PER_Navy_of_the_Gulf: "海湾的海军"
 PER_Gulf_Navy_of_the_Gulf_desc: "炮舰、巡逻艇与海上宪兵。主权不是照会写出来的，是舰队巡出来的。"
 PER_Navy_of_the_Gulf_desc: "炮舰、巡逻艇与海上宪兵。主权不是照会写出来的，是舰队巡出来的。"
 PER_The_New_Iran: "新伊朗"
 PER_The_New_Iran_desc: "学堂、油井与灌溉渠——一个把进步写进每一寸国土的新伊朗，在废墟与希望之间站了起来。"

