#事件
 PER_event.6.t: "石油主权宣言"
 PER_event.6.d: "议会大厅座无虚席。摩萨台拄着拐杖走上讲台，用他一贯的、近乎迂腐的严谨宣读了石油国有化法案：所有油田、炼厂、输油管与租让合同一律收归国家。法案的措辞没有点任何国家的名，但每个人的目光都扫向了同一处——那些挂着俄国招牌的钻井。莫斯科的答复尚在途中，而德黑兰的股市已经开始摇晃。"
 PER_event.6.a: "波斯的石油属于波斯。"
 PER_event.7.t: "王座归来"
 PER_event.7.d: "专列驶进德黑兰车站时，月台上挤满了旧贵族、教士、商团代表与看热闹的市民。哈米德·米尔扎王子走下车厢，向人群鞠躬——他的动作略显生疏，毕竟这是凯加家族二十八年来第一次踏上故土。摩萨台在车站大厅宣读了迎立诏书：王位虚悬的时代结束了，但宪法的条文一字未改。"
 PER_event.7.a: "恭迎陛下回国。"
