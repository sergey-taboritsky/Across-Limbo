 #事件
 WGR_event.1.t: "巴伐利亚问题"
 WGR_event.1.d: "巴伐利亚是一片遍布纷争的土地。一战结束后，巴伐利亚地区曾短暂成立过一个红色性质土匪政权，但他们的弱小反抗很快被我们扑灭；1929年的经济大危机对刚结束内战的德国是一记重创，更糟糕的是，伴随着经济手段在边缘地区的失衡，政治情况本就复杂的巴伐利亚更加动荡不定。\n\n另一方面，自从国家社会主义德意志工人党分裂，我们的德意志母亲已经被她的敌人——阿道夫·希特勒——一个极端的民族主义右翼分子侵扰了近十年。如今临近国家大选，以希特勒为首的极右翼分子加紧了对国家领导权的掠夺，越来越多的反抗活动在巴伐利亚进行，而人民高涨的独立情绪让政府焦头烂额，更糟糕的是，如果我们不能及时解决这棘手的麻烦，也许东边的伪政权就会有所动作了...德国绝不能再次陷入内乱之中！"
 WGR_event.1.a: "是时候解决掉他们了！"
 WGR_event.2.t: "军事戒严的必要性"
 WGR_event.2.d: "近日，政府内阁中有人提议应该进行军事戒严以确保能稳定住巴伐利亚的局势。\n\n事实证明这个举措是对的，在前任政府的时候并未进行军事戒严，结果可想而知，巴伐利亚地区的局势愈加动荡，不断有着各种各样的反政府游行示威，而极端分子居然宣称是我们造成的这一切，但他们没有想过，如果不是他们的干扰，巴伐利亚地区会变成这样吗？\n\n为了阻止这些极端分子，我们也必须采取极端措施，在该地区宣布军事戒严一切人员物品进出入巴伐利亚都会经过严格的审查，审查没问题之后才会进行放行，但只要极端分子已被镇压，我们就会取消军事戒严，让当地民众回归正常生活。"
 WGR_event.2.a: "相信民众会理解我们的"
 WGR_event.3.t: "增加警力"
 WGR_event.3.d: "随着巴伐利亚地区的局势愈加紧张，当地的警力已经远远不够维持当地的秩序，我们必须派遣更多的警力以维护当地的秩序\n\n除此之外我们还需要考虑要派遣多少警力前往当地，如果仅仅派遣一小部分也许还不够，但如果派遣一大批警力的话又会导致别的地区警力短缺。支持第一种方案的人认为巴伐利亚地区的极端组织人数并不多，只需要派遣少量的警力前去支援仅可稳定当地秩序，支持第二种方案的人认为巴伐利亚地区的极端组织人数已经远远超过当地的警力，如果派遣过少的警力不会起到什么作用，不过无论支持哪种方案，巴伐利亚地区的形势都会有所缓解。"
 WGR_event.3.a: "无论如何势必要铲除极端分子"
 WGR_event.4.t: "宁肯错抓一千，不肯放过一个"
 WGR_event.4.d: "事实证明这些极端分子已经远远超乎我们的想象了，不仅人数众多，且言论极具蛊惑性，普通的手段已经不能威慑住这些暴徒了，我们必须使用更极端的办法对付这些极端组织了。\n\n在最近的一次会议上，内阁选择执行只要有任何反政府，极端观点的人通通抓起来的政策，不管他们是否真正有罪，尽管这样也许会让民众反对政府从而加入极端组织，但如果不这样做，极端分子只会愈加猖狂。我们会尽力向民众解释该政策的原因，让他们支持我们，并且民众举报一个可疑分子可以获得一定的报酬。这样极端组织就没有办法宣传“正是当地政府的腐败无能，所以才会导致巴伐利亚地区的经济萎靡。”我们要让民众明白造成这一切的不是政府，而是这些极端分子，要不是他们，我们的国家绝不会变成这样！"
 WGR_event.4.a: "只有用更极端的手段对付他们才能获得胜利"
 WGR_event.5.t: "申请拨款发展巴伐利亚地区的经济状况"
 WGR_event.5.d: "因为先前巴伐利亚地区的经济状况并不富裕，又因大萧条的影响，导致该地区的物价上涨，这才给了当地极端组织发展的机会，如果我们能改善当地的经济状况，那么极端组织的支持率就会下降，毕竟如果好好的活着谁会去拼命呢？\n\n不过现在最为紧要的是，我们要花费多少资金投资巴伐利亚地区呢，毕竟我们的财政状况并不良好，如果我们花费过高的资金改善巴伐利亚地区，这将会导致政府的财政赤字，但这同时会大大降低极端组织的实力，如果花费过少的资金，也许不见得有多少效果，我们是时候做出抉择了"
 WGR_event.5.a: "我们选择花费大量的资金投资巴伐利亚地区"
 WGR_event.5.b: "我们选择花费适量的资金投资巴伐利亚地区"
 WGR_event.6.t: "维也纳之梦"
 WGR_event.6.d: "合上书，压低帽檐，他匆匆地离开，走进浓雾之中。\n\n阔别维也纳二十四年，除去年岁，他似乎什么也没得到，而那些面带狂热的党员，以及烈火中的街垒、夜空中的探照灯光，也早已像是上辈子的事了。\n\n是啊，上辈子的阿道失·希特勒，加此风光，而这辈子的阿道夫·希特勒，却仅仅只是一个逃犯:在维也纳的街头惶惶不可终日，等待着攒够进继续逃亡的钱，或是等待着一双手铐。\n\n向左拐，向右拐，突然地回头转身，一系列不寻常的动作足以摆脱寻常的跟踪者:那些平庸的探子并不能征明他就是希特勒，否则，柏林的特工早就破门而入了。\n\n希特勒松了口气，他转身走进巷子星的一家小啤酒馆，打算喝上两杯。 这时，一双纤细的手拉了他的衣摆，一个怯生生的女声在他身后响起：“先生，请等一等，您掉了东西。”\n\n希特勒回首，一个穿着连衣裙的女人站在他身后，天鹅般的长颈，小鹿般的眼睛，百合花的芬芳。这样柔弱的形象让他不自主地放下了部分戒心:“什么？”\n\n女人靠近了一步，那天鹅般的长颈，那小鹿般的眼睛，那百合花的芬芳变得更加明显，这引导着希特勒也不由自主地靠近了一步。\n\n这时，他感到有一个硬物抵住了自己的腹部，他低头，天鹅般的长颈变成了蛇颈，小鹿般的眼睛变得凛冽，像是失去了孩子的母鹿，唯一不变的是百合花的芬芳，它只是变得更浓，带着腐烂的气息。\n\n“一颗子弹。”希特勤一愣，然后才反应过来是在回答他的前一个问题，他想要退后，但这早已不可能。\n\n一声枪响划破了雾母的面纱，一位母系饱饮了仇敌之血。"
 WGR_event.6.a: "始于啤酒馆，终于啤酒馆"
 WGR_event_6_custom: "解锁最后§Y叛徒，去死！§!国策"
 WGR_event.7.t: "巴伐利亚地区爆发起义"
 WGR_event.7.d: "近日巴伐利亚地区发生大规模游行示威活动并同军警发生肢体冲突，随后该地区的州政府被国家社会主义工人党攻陷并成立了一个所谓“巴伐利亚德意志”的伪政权向我们宣战，我们必须尽快派出国防军前去镇压，不然东边的赤匪恐怕就要有所行动了…"
 WGR_event.7.a: "坦克出动！镇压这群叛匪！"
 WGR_event.8.t: "德意志1937年选举开始"
 WGR_event.8.d: "孩子们，我想不出来文案了，我选择相信你们的智慧"
 WGR_event.8.a: "投票给社会民主党！"
 WGR_event.8.b: "投票给中央党！"
 WGR_event.8.c: "投票给国家人民党！"
 WGR_event.8.e: "投票给国家社会主义工人党！"
 WGR_event.9.t: "民主党的建议"
 WGR_event.9.d: "“请进。”\n随着门把手转动，厚重的木门被缓缓打开。一双很有质感的皮鞋轻轻地踩在地板上，皮鞋的主人——民主党的领袖——赫尔曼·迪特里希轻轻地关上门之后，转过身看了看这位德国总理，只觉得他明显憔悴了许多。\n“总理先生，您找我？”\n“先坐。”德国总理——弗朗茨·冯·帕彭指了一下一旁的座椅，开始翻找着什么，“希特勒带来的动乱已经初步平息，但还剩下不少余孽在煽风点火，这给德国造成了很大的麻烦。”帕彭顿了一下，将找到的一叠纸张递给迪特里希，“但是他造成的财产损失远远不如大萧条的大，而我们至今仍未能从大萧条之中走出来，它带给我们的冲击和灾难有多糟糕相信不用我描述了。况且最大的麻烦在我们的东边……”\n迪特里希粗略地看完了那不堪入目的财政报表，抬头看见总理帕彭正在看着一旁的德国地图——或者说德意志第二帝国的地图，只是中间被粗暴地花了一条线，左边有一块突兀的涂抹痕迹。\n“总理先生……”迪特里希轻声说着，帕彭回过神来，“抱歉，回想起了一些事情。”他对迪特里希露出一个疲惫的微笑，“所有，请你到这里是想要听听你的建议，关于我们的经济的。”\n“请容我思索一下。”\n迪特里希盯着那副地图，帕彭盯着迪特里希，不知过了多久，迪特里希忽地叹了口气。\n“总理先生，您知道的，我们党派离共产党是最近的，无论是以前的关系、思想主张、政治诉求还是其他方面，所以我非常清楚他们的力量。他们的核心在于工人，只要我们能够稳住工人，那么他们就无法从内部瓦解我们。无论是提高工人待遇，还是减少工作时长，我们只需一点一点地让步，工人运动就不是问题。”\n“而工人和企业家之间有着难以调和的冲突，在我们目前的经济形式之下，放任这种冲突不管，只会迎来裁员和压榨工人。我认为我们必须保障工人的一些权利，比如保证最低工资和最高工作日时数，给予他们与企业家谈判的的权利。其次我们应该鼓励好玩引导企业家这么做，我们可以给他们一些荣誉也好，或者给他们一些实质上的东西，总之我们必须要让德国工人都站在我们这一边，哪怕只是暂时地。”\n“说得很好，还有吗”\n“暂时就这些了，总理先生。”"
 WGR_event.9.a: "“好，感谢你为德国做出的贡献。”"
 WGR_event.10.t: "社会民主党的胜利"
 WGR_event.10.d: ""
 WGR_event.10.a: "德意志的新时代"
 WGR_event10_tt: "将进入§t社会民主党§!第一任期的§Y国策§!"
 WGR_newevent.1.t: "德意志再次陷入分裂"
 WGR_newevent.1.d: "近日，巴伐利亚地区的武装叛乱有了最新消息：由阿道夫·希特勒领导的冲锋队成功夺取了巴伐利亚州的政权，并且建立了一个独裁政权。\n\n据悉，德意志共和国内已经宣布国家进入战时状态，并且宣布将会立刻派遣军队镇压这场叛乱。不过此时临近德意志共和国大选，这是否会影响到共和国国内稳定还尚不可知。\n\n现在，巴伐利亚德意志已经向德意志共和国宣战，并宣布自己才是德意志的正统，同时协约国的其他成员国表示将会密切观察局势，必要时将会派遣军队前往德意志境内镇压这场叛乱。"
 WGR_newevent.1.a: "把这群疯子赶出巴伐利亚！"
 WGR_newevent.1.b: "我们绝不会允许这样一个疯子成为德国的领导者"
 WGR_newevent.1.c: "资本主义的无能"
 WGR_newevent.1.e: "真是风水轮流转"
 WGR_newevent.2.t: "巴伐利亚地区极端组织被镇压"
 WGR_newevent.2.d: "近日，巴伐利亚地区的武装叛乱有了最新消息：德意志共和国及其盟国成功地镇压了巴伐利亚地区的叛乱，武装叛乱的发起者阿道夫·希特勒不知所踪。\n\n德意志共和国的国防军已经进驻巴伐利亚地区，届时会由早已完备的警察部队接手监管。\n\n现在，阿道夫·希特勒已经被德意志共和国及其盟国通缉并发表声明——如果通缉犯已经越过了边境线，协约国希望相关国家不要包庇窝藏罪犯。"
 WGR_newevent.2.a: "德意志祖国不容分裂！"
 WGR_newevent.2.b: "终于结束了。"
 WGR_newevent.2.c: "资本主义的脆弱。"
 WGR_newevent.2.e: "他躲哪里去了？"