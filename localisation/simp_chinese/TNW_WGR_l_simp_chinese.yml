 WGR_Absolutism_party: "俄军驻德集群"
 WGR_Nationalism_party: "德意志社会党"
 WGR_Nationalism_party_long: "德意志社会党(Deutschsozialistische Partei)"

 WGR_volksrepublik: "德意志人民共和国"
