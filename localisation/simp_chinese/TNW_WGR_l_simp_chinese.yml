 WGR_German_1937_elections: "德意志1937年选举"
 WGR_German_1937_elections_desc: "\n\n\n\n\n\n\n§Y德国国民议会§!成立于1919年，权力由《魏玛宪法》所规定。\n\n该宪法规定议员为全体人民之代表，惟服从其良心所主张，并不受其他请托之约束。联邦国会以四年为任期。惟有议员五十人以上之动议并得2/3之多数赞成时，可改为秘密会议。凡联邦国会，各邦议会及其议会内之委员会，于公开议事中之言论、记录及正确报告，不发生责任问题。\n\n参与选举的主要党派有：§3中央党§!，§t社会民主党§!，§g国家人民党§!，§L国家工人党§!\n\n§3中央党§!代表了德国境内大多数的天主教徒以及汉诺威地区的利益，占据了意识形态的中间地带，主张民主政治，是维持德国民主政治的重要政党之一。\n\n§t社会民主党§!1875年成立，是德国历史最悠久的活跃政党。政治立场偏左，其党员主要由工人、小商人和知识分子构成。\n\n§g德意志国家人民党§!1918年成立，由战前德国的保守党人士、自由保守党人士及各种反犹政党合并组建。这是一个右翼政党，主要代表贵族、地主、军官，高级公务员和一些大企业集团的利益。\n\n§L德意志国家社会主义工人党§!由1919年成立的德国工人党转化而来。其奉行右翼立场，在20世纪20年代末期以前，一直是一个边缘化的政党，后来开始赢得广泛支持。\n\n目前得票率最高的党派为：§Y[TNW_WGR_Elections_localization]§!"
