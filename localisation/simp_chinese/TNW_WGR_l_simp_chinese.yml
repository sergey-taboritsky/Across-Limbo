 #国策
 WGR_0_1_0: "着手开始处理巴伐利亚问题"
 WGR_0_1_0_desc: "自1935年开始，巴伐利亚不断有着各种各样的反政府游行示威，现在选举将至，我们必须尽快处理这个棘手麻烦，不然这会导致民众对我们政府的信任再度降低。"
 WGR_0_1_1: "宣布军事戒严"
 WGR_0_1_1_desc: "随着巴伐利亚地区的局势愈加紧张，有人向我们提议应该宣布巴伐利亚地区军事戒严，让民众好好的待在家里面，而不是上街游行。"
 WGR_0_1_2: "增加警力"
 WGR_0_1_2_desc: "随着巴伐利亚极端组织的人数增多，巴伐利亚地区的警察人数远远不足以支撑镇压极端组织，我们有必要增加更多的警力派往该地区以维持当地的正常秩序。"
 WGR_0_1_3: "通缉可疑分子"
 WGR_0_1_3_desc: "为了德意志的稳定，我们迫不得已只能采取更加极端的措施，只要是可疑分子，都必须抓起来，宁肯错抓一千，不肯放过一个。"
 WGR_0_1_4: "自由军团，前进！"
 WGR_0_1_4_desc: "自由军团曾在镇压赤匪的行动中表现不错，我们也许可以通过一些别的手段让自由军团再次为我们服务，不过也许这样会继续增加自由军团的影响力…"
 WGR_0_1_5: "派遣国防军"
 WGR_0_1_5_desc: "为了对抗国家社会主义德国工人党的先锋队，普通的警察已经远远不够了，我们必须要让军队介入，把这群叛徒全部送上天！"
 WGR_0_1_6: "在燃烧的慕尼黑"
 WGR_0_1_6_desc: "随着局势愈加动荡，慕尼黑已经快沦为无政府状态，前方的自由军团啊，戴上头盔，拿起步枪，消灭叛徒！"
 WGR_0_1_7: "忠诚的骑士精神"
 WGR_0_1_7_desc: "我们坚决不能让自私、贪婪、诱惑、自暴自弃等邪恶的力量侵犯到我们的德意志，德意志的人民关注着你们。国防军的将士们，你们不可有丝毫懈怠。珍惜并且捍卫你们的荣誉吧。"
 WGR_0_1_8: "保卫德意志的领土"
 WGR_0_1_8_desc: "我们不能再忍受一次德意志被分割的痛苦了，我们必须保卫德意志领土，无论是赤匪还是什么极右翼组织，我们都将粉碎他们的反抗。"
 WGR_0_1_9: "叛徒，去死！"
 WGR_0_1_9_desc: "现在巴伐利亚地区的秩序已经恢复，极右翼组织已经无法再发起任何有组织的进攻了，是时候逮捕这群叛徒，并审判他们了。"
 WGR_0_1_4_tt: "极端组织准备度: §G-5§!"
 WGR_0_1_9_tt: "§Y阿道夫·希特勒§!§R已被解决§!"
 WGR_0_1_10: "维护大帐篷的稳定"
 WGR_0_1_10_desc: "由1934年紧急选举组成的大帐篷一定程度上缓解了德国政治的紧张情况，但因参加大帐篷的政党都有自己的主张，所以维护大帐篷的稳定就成了帕彭重中之重，为了维护这个大帐篷，帕彭不得不花费大量的时间去和各党沟通以确保这个松散的大帐篷不会解体。"
 WGR_0_1_11: "妥协的艺术"
 WGR_0_1_11_desc: "保持大帐篷的稳定就不得不寻求各个政党妥协的平衡点，以确保各政党的主张不会冲突过于的严重以产生分歧。"
 WGR_0_1_12: "中央党的建议"
 WGR_0_1_12_desc: "中央党的政策大多支持基督教的价值观以及部分民主思潮，德国国内大多支持基督教，只要我们执行一部分符合中央党的理念就能让他们支持政府。"
 WGR_0_1_13: "人民党的建议"
 WGR_0_1_13_desc: "人民党通常代表了我国的大部分工业家和企业家的利益，我们可以采取他们的部分政策，例如削减福利支出，这无论对于大帐篷的稳定还是对于国家财政来说都是一件好事。"
 WGR_0_1_14: "民主党的建议"
 WGR_0_1_14_desc: "该党通常反对较为保守的右翼政策，但又不支持非常激进的左翼政策。他们呼吁要扩大德国人民的民主权利以让更多的德国人来参与到政治当中。如果我们想要维护大帐篷的稳定，就必须做出一些很微小的改变来换取该党的支持。"
 WGR_0_1_15: "重振德国经济"
 WGR_0_1_15_desc: "一战摧毁了德国的经济，而内战的创伤更加加重了这一情况，但还未从内战中恢复过来大萧条就爆发了，这更让德国的经济雪上加霜。物价横飞，失业人数年年如极快的速度上涨，如果我们还想让德国免受二次内战之苦，我们就有必要做出行动。"
 WGR_0_1_16: "勒紧裤腰带"
 WGR_0_1_16_desc: "我们必须削减各项支出以确保德国不会陷入财政赤字的情况，尽管这样的举措势必会遭到社会各界的反对，但要让他们明白如果不这么做，德国将会陷入更加困难的境地。"
 WGR_0_1_17: "削减福利开支"
 WGR_0_1_17_desc: "社民党的福利政策已经被完全证明是错的，我们不能将大量的财政花费到福利支出上，尽管削减福利支出势必会遭到一些底层民众的反对，但在国家利益面前他们又算什么呢？"
 WGR_0_1_18: "调控物价"
 WGR_0_1_18_desc: "1929年的大萧条让德国的物价横飞，如果想让我国的经济恢复稳定，第一步要做的就是调控物价，让物价保持在一个相对稳定的水平，以确保民众可以以合适的价格买到商品。"
 WGR_0_1_19: "从大萧条中恢复过来"
 WGR_0_1_19_desc: "经过我们长期的努力，德国的经济终于有所回暖，人民的生活有所保障。民众对于政府的不信任已被大大的缓解，我们已经证明了政府有能力为德国带来幸福！"
 WGR_0_1_20: "舒伦堡协议"
 WGR_0_1_20_desc: "为了工人不受东边赤匪的蛊惑，民主党提议我们应该召集企业家与工人们谈判以签署一个合理的协议确保劳资双方和谐共处。"
 WGR_0_1_21: "黑鹰运动"
 WGR_0_1_21_desc: "我们将为愿意遵守“舒伦堡协议”的企业家们颁发带有象征爱国意义的“黑鹰”标识，以鼓励他们为德国的经济恢复做出贡献。"
 WGR_0_1_22: "有形的大手"
 WGR_0_1_22_desc: "尽管我们并不同意赤匪的政治观点，但他们在某些方面的见解的确是正确的。事实证明了光靠市场的自行调控是不能解决经济问题的，我们必须要让政府参与进来调控经济以确保不会再出现如今的状况。"
 WGR_0_1_23: "民用工程署"
 WGR_0_1_23_desc: "根据现任政府的调查，德国的基础设施很多已经老化，有些甚至是上个世纪的老东西！为了确保物流运输不会出现任何因基础设施老旧导致的问题，我们将会按照人民党的建议启动“民用工程署”计划来改善德国的基础设施状况。"
 WGR_0_1_25: "工业复兴运动"
 WGR_0_1_25_desc: "近日政府内阁通过了“工业复兴法”的法案，该法案将会在各地新建工厂，以确保就业以及恢复德国的经济。"
 #社民国策树
 WGR_The_victory_of_the_Social_Democrats: "社会民主党的胜利"
 WGR_The_victory_of_the_Social_Democrats_desc: "在激烈的选举战后，社会民主党获得了最终的胜利，让我们拭目以待吧。"
 WGR_When_the_blue_sky_kisses_the_earth: "当青天吻过大地"
 WGR_When_the_blue_sky_kisses_the_earth_desc: "德意志的天空是怎样的，而它又应该是怎样的？或许有些人会在经历过残暴专制与腐败无能的政府后说出“天空不是非黑即白的，而是一抹精致的灰”，这意味着他们实际上已经彻底失去了对政府的信任，而我们的政府难辞其咎。\n德意志的天空理应是青色的，明净的，社会民主党会肃清政府内部大大小小的各项问题，将这本就理应属于德意志母亲的天空还给大地。"
 WGR_The_trade_union_serves_as_the_mouthpiece: "工会作喉舌"
 WGR_The_trade_union_serves_as_the_mouthpiece_desc: "作为同样站在人民群众与历史进步的一方，德意志境内的工会组织与我们有着天然的同盟关系，凭借这层关系，我们可以通过工会的渠道来为我们的政策造势宣传，这也使得我们能够更加贴近德意志的人民群众们。"
 WGR_All_media_are_free: "媒体皆自由"
 WGR_All_media_are_free_desc: "一个没有自由媒体的国家是不可想象的，记者与闪光灯是腐败与滥权的天敌，他们能够协助政府的监察机关打击全国上下的各种乱象，我们将通过各项手段推动新闻媒体行业的自由化与透明化。"
 WGR_Interracial_equality: "种族间平等"
 WGR_Interracial_equality_desc: "德意志人，法兰西人，不列颠人，犹太人，乃至信奉伊斯兰教的中东移民，只要拥有了德意志的合法身份，我们就不应该使他们的合法权利受到侵犯，一个真正自由的国家是不应该有“二等公民”这样龌龊的词语的，我们会推行种族平等和反歧视的法律制度，建立一个真正的平等天堂。"
 WGR_Please_exit_the_nobles: "请贵族退场"
 WGR_Please_exit_the_nobles_desc: "自神圣罗马帝国以来，封建贵族势力就是这个国家最坚实的基础，而普鲁士的统一又带来了新的容克军事贵族，这样的社会环境使得我们的国家天然便与进步的方向绝缘，因此，为了德意志的包容与进步，我们必须请这些贵族老爷依法离场，走下政治舞台了。"
 WGR_Allow_for_public_elections: "允大众选举"
 WGR_Allow_for_public_elections_desc: "在德意志第一帝国的时代，选举是独属于选帝侯与大贵族的专有名词，而在第二帝国时期，各种各样的限制也使得选举结果并不能代表人民的声音，现在，我们来了，因此一切旨在限制大众选举的政策法律将被统统修改，德意志人将迎来一个真正自由而民主的时代！"
 WGR_Fair_diligent_and_openminded: "公正，尽职，开明"
 WGR_Fair_diligent_and_openminded_desc: "在社会民主党的政治改革下，一个公正、尽职与开明的政府已经降临在德意志的土地上了！"
 WGR_Forward_for_the_German_people: "前进，为了德意志人民"
 WGR_Forward_for_the_German_people_desc: "伟大的德意志祖国，伟大的德意志人民，伟大的社会民主党，为了你们，我们必须前进，我们必须胜利！"
 WGR_Clean_up_corruption: "肃清腐败"
 WGR_Clean_up_corruption_desc: "对于腐败问题的态度将直接决定人民对于政府的信任度，在旧贵族的阴谋运作和大资本家的金钱攻势中，德意志人民早已对腐败问题深恶痛绝，为了德意志祖国，为了人民，也是为了支持率与选票，我们必须尝试着根除各式各样的腐败问题。"
 WGR_Restricting_officials: "限制官员权力"
 WGR_Restricting_officials_desc: "旧时代的官员权力明显的有些过于大了，这也容易滋生腐败问题与裙带关系"
