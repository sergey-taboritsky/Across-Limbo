 #国家名字
 WGR: "俄占德国"
 WGR_DEF: "俄罗斯在德占领区"
 WGR_ADJ: "东德"
 WGR_communist_party: "地下叛乱组织"
 WGR_socialism_party: "地下叛乱组织"
 WGR_Social_democracy_party: "社民党"
 WGR_Social_democracy_party_long: "德国社会民主党(Sozialdemokratische Partei Deutschlands)\n\n§W施莱歇尔内阁中期，授权法通过后的参政问题将德国社会民主党彻底撕裂。青年激进派与党内民族主义派系认同施莱歇尔的政治行动，并积极支持政府；施莱歇尔拉拢到的社民党内阁成员也多数站在总理一边。然而，党内仍在坚持马克思主义的中间派和左派却对授权法和随后的政策强烈反对，甚至以开除施莱歇尔支持者党籍为威胁。最终，在持续一年的党组织危机后，德国旧社会民主党从社民党中分裂出来，并参与施莱歇尔内阁，而多数社会民主党则被新的《反社会党人法》查禁。\n\n战后，施莱歇尔的战败导致爱国社民党在西部的势力全部被清洗，只得在实力大幅缩减的情况下聚集在俄占区，尝试与俄罗斯合作以保住其仅存的政治影响力。由于西部社民党组织已经全面解散，旧社会民主党重拾社民党之名，以彰显他们的正统性。§!"
 WGR_Liberalism_party: "中央党"
 WGR_Conservatism_party: "自由德国民族委员会"
 WGR_Conservatism_party_long: "自由德国民族委员会(Nationalkomitee Freies Deutschland)\n\n§W随着战争末期德军东西两线的同步崩溃，大量东线将领与地方贵族选择投降俄罗斯以对抗社会主义者的进军，并在即将成立的新德国政府中谋取地位。为了协调大量出现的合作者，自由德国民族委员会于1944年在彼得格勒成立。起初其成员大多为投降的将领，但在俄军突破维斯瓦河后，大量不满施莱歇尔的保守派政客同样选择投靠萨文科夫。\n\n如今，俄军占领区内建立的新政府均以该委员会为名义，而德意志帝国时期的行政机构与军事组织大部分已经被其整合。§!"
