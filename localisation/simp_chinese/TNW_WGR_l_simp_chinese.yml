 TNW_Degree_extreme_organizations: "巴伐利亚极端组织准备度每月增加"
 
 #民族精神
 WGR_Fragile_peace: "脆弱的和平"
 WGR_Fragile_peace_desc: "1923年与共党分子在柏林签订的条约结束了我们和东边赤匪分子的战争状态，这可恶的条约把我们的祖国一分为二，但这只是短暂的和平，我们必将统一德国！"
 WGR_Bavarian_independence_crisis: "巴伐利亚独立危机"
 WGR_Bavarian_independence_crisis_desc: "巴伐利亚自一战结束就有独立的倾向，又因自从1933年起，在该地区时常发生有极端势力组织攻击当地政府，试图夺取当地政权。我们必须得尽快处理掉这棘手的麻烦。"
 WGR_A_weak_economy: "羸弱不堪的经济"
 WGR_A_weak_economy_desc: "一战结束后丢失了德国的东部地区，这让我们的经济实力远远不及以前，而内战的摧残以及1929年波及全世界的经济危机更让德国的经济雪上加霜，即使政府采取了大量的措施，但经济状况依旧不容乐观。"
 WGR_Corrupt_Wehrmacht: "腐败的国防军"
 WGR_Corrupt_Wehrmacht_desc: "第一次世界大战结束时，德意志帝国的军队几乎处于无政府状态，在赤匪掀起叛乱之时，政府立刻重新整合了军队，但是由于士气低落，以及赤匪的煽动，许多士兵已不再听从长官的命令自行其是，要不就是叛逃到赤匪那边。尽管在内战结束后，政府再一次的重新改革了军队，但改革的成效微乎其微，军队依旧腐败横行，士气低落......"
 WGR_Take_advantage_of_the_Freikorps: "利用自由军团"
 WGR_Take_advantage_of_the_Freikorps_desc: "面对国内此起彼伏的苏维埃革命和分离主义者的威胁，当时的社民党政府需要一支强大的武装力量巩固其政权，于是新自由军团应运而生，他们被政府利用去镇压苏维埃革命和各地的叛乱分子，但现在战乱已经结束，我们当然可以继续利用自由军团来镇压各地叛乱，但这是必会提高自由军团的影响力…"
 WGR_A_government_that_is_not_trusted: "不被信任的政府"
 WGR_A_government_that_is_not_trusted_desc: "内战结束后，因社民党政府对处理苏维埃革命的无能，让祖国一分为二，这无疑不增加了社会各界对社民党政府的不信任，终于在内战结束后的不久，中央党对社民党发起不信任投票，迫使政府换届。但中央党政府的政绩似乎也没好到哪里去，于是在1933年的紧急选举中，一位无党籍议员——弗朗茨·冯·帕彭，赢得了选举。他将会把德国带领何方？我们拭目以待。"
 WGR_Expand_the_police_force: "扩编警察部队"
 WGR_Extremist_groups_that_have_been_successfully_suppressed: "成功被镇压的极端组织"
 WGR_idea_01: "投资巴伐利亚地区"

 #决议
 WGR_Bavarian_independence_crisis_decision: "巴伐利亚独立危机"
 WGR_Bavarian_independence_crisis_decision_desc: "\n\n\n\n\n\n\n一战结束后，巴伐利亚曾成立过一个赤匪组织的政权，但很快就被我们镇压下去了，但谁曾想到，巴伐利亚的独立之火没有被扑灭，反而越烧越旺了。\n\n1929年，大萧条爆发，这成功的波及到了德国，德国的经济本身因为内战的重创就已经不堪重负了，大萧条的打击更是雪上加霜。这也导致了巴伐利亚的情况愈加动荡。\n\n自从国家社会主义德国工人党分裂后，极右翼分子阿道夫·希特勒与他的追随者在巴伐利亚地区煽动独立。在他的煽动下，巴伐利亚独立情绪高涨，甚至已经与法兰克福政府叫板了。如果我们不能及时扑灭这场火势，那么整个德国将会陷入内乱当中，东边的共党分子甚至很可能会乘虚而入。\n\n§R消灭阿道夫·希特勒及其极右翼分子，稳定巴伐利亚的局势。§!\n\n巴伐利亚极端组织当前的准备度为: §Y[?WGR_Bavarian_extremist_group_readiness|0]§!\n\n"
