 WGR_volksrepublik_ADJ: "德国"
 
 #顾问
 WGR_Gottfried_Reinhold_Treviranus: "戈特弗里德·特雷维拉努斯"
 WGR_Gottfried_Reinhold_Treviranus_desc: "§Y出生于：§!§L1891年3月20日，沃尔德克和皮尔蒙特公国，希德尔-施瓦伦贝格§!\n§Y人物背景：§!§L作为保守党领导人之一，库诺·冯·韦斯塔普的门徒与继承人，特雷维拉努斯是投靠萨文科夫的最高层级德国领导人之一。因此，大部分俄军占领区重组而来的新政府便由他主导。\n\n尽管萨文科夫本人对德国除了维持如今的分裂现状外并无其他要求，但特雷维拉努斯仍然希望有朝一日德国能够清除全部左翼影响，并重归统一状态。当然，要想做到这点，他还有很长一段路要走......§!"
 WGR_Erwin_Rommel: "埃尔温·隆美尔"
 WGR_Erich_von_Manstein: "埃里希·冯·曼施坦因"
 WGR_Gerd_von_Rundstedt: "格尔德·冯·伦德施泰特"
 WGR_traits_01: "大帐篷领导者"
 
