#民族精神
 ENG_Twenty_Years_of_Red_London: "二十载红色伦敦"
 ENG_Twenty_Years_of_Red_London_desc: "自1925年红旗飘扬在白金汉宫上空以来，不列颠联盟成功确立了社会主义制度，对经济进行了彻底改造，并与法国盟友并肩作战粉碎了人类有史以来最为庞大的世界帝国。如今，社会主义理念已经深入人心，工党内部普遍相信，红旗至少还能再飘二十年。"
 ENG_Mosleynomics: "莫斯利主义经济"
 ENG_Mosleynomics_desc: "自战前执政至今的总统奥斯瓦尔德·莫斯利拥有与欧陆普遍的合作社市场-中央计划二元经济截然不同的经济政策。其注重国内市场的扩张、大规模指令与经济统制以及通过高额关税封闭英国市场，从而使得英国经济与欧陆隔绝，无缘其发展机遇，但也免受其波动风险。"
 ENG_Unsatisfied_workers: "不满的工人"
 ENG_Unsatisfied_workers_desc: "莫斯利主义的经济政策带来了全新的发展模式，为不列颠联盟建设出曼恩时期难以想象的庞大军事工业，并最终帮助国际联军击败德意志帝国。然而，由于工人福祉并未得到充分的重视，而重工业优先的经济政策在短时间内不存在解除的迹象，各地工会正在重新骚动起来。"
 ENG_splitting_government: "分裂的国家机器"
 ENG_splitting_government_desc: "莫斯利总统本人的威望暂时无人能及，但其政府内部绝非铁板一块。例如，工党书记处的乔治·爱德华·卡特林更加倾向于不列颠国家主义与左翼民族主义，而总理安奈林·贝文则愈发展现出同情工人的姿态，并要求进行经济改革。这些细微的斗争暂时未能完全浮出水面，但它也有可能成长为颠覆现政权的惊涛骇浪。"

 ENG_Mosleynomics_modifier_text: "莫斯利经济政策当前带给我们§Y[?ENG.ENG_var_industrial_complex]§!座地图外的民用工厂，§Y[?ENG.ENG_var_arms_factory]§!座地图外的军用工厂"

