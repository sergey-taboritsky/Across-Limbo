 ENG_Labour_Chair_Diana_Mitford: "戴安娜·米特福德夫人"
 ENG_Labour_Chair_Vacant: "缺位"
 ENG_parliament_seat_text: "议会第[?temp_seat|Y0]席"
 ENG_party_1_text: "工党 - 战斗派"
 ENG_party_1_text_desc: "“战斗社会主义者”源于工党的前身，英国社会民主联盟。该党直接由马克思主义主导的第二国际组织起来，并遵循马克思对社会主义的诠释，不过随着革命后工党确立其自身的思想体系，该派系在党内日渐边缘化，直到雪月事件后方才在法国支持下恢复了些许活力。\n\n如今，这一派系对准则派政策中的经济统制颇为不满，并尤其反对经济部为推高产能而不断扩大生产指标的行动。在其他问题上，其一般与准则派中的左翼进行合作。"
 ENG_party_2_text: "工党 - 联邦派"
 ENG_party_2_text_desc: ""
 ENG_party_3_text: "工党 - 公理会派"
 ENG_party_3_text_desc: ""
 ENG_party_4_text: "工党 - 全国劳联会"
 ENG_party_4_text_desc: "全国劳工联合会是不列颠联盟的官方工会组织，也是工党政治机器的重要零件。其在议会拥有五分之一的固定席位，以此展现联盟的“工人政权本质”。当然，在莫斯利上台后这一机构同样逐渐失去其独立性，并如今由准则左翼执掌。\n\n在各机构中，工会组织相对亲近工人，主张更高的福利待遇与较少的工作负担。当然，他们同样以莫斯利本人的指示为先。"
 ENG_party_5_text: "工党 - 人民革命集团"
 ENG_party_5_text_desc: "早在30年代初，奥斯瓦尔德·莫斯利曾脱离工党建立“人民革命党”，以吸引不得志的工党青年翼与党外力量加入其行列。事到如今，尽管大量左翼改革尝试均被废止，但人民革命党时期遗留下的忠于莫斯利的工党左翼网络仍在运作。\n\n以总理安奈林·贝文与党内理论家约翰·斯特雷奇为首的左翼准则派在呼吁提高对国际革命的支持的同时，还在国内推动进一步的经济统制。他们期盼用官僚机构的调控克服资本主义的生产无政府状态，并以此进一步发展不列颠经济。"
 ENG_party_6_text: "工党 - 莫斯利中心"
 ENG_party_6_text_desc: "总统奥斯瓦尔德·莫斯利本人对党内纷争并无插手之意，但紧密围绕在他身边、以他马首是瞻的工党成员仍然占据着党内极为重要的一部分。以莫斯利夫人戴安娜·米特福德为代表的工党党员们并不希望在派系斗争本身投入过多精力，而只希望全力支持莫斯利。当然，其理由多种多样，有的为了政治晋升，而其他人则是对莫斯利全心全意的认可。"
 ENG_party_7_text: "工党 - 准则宪章派"
 ENG_party_7_text_desc: "围绕1936年选举前的造势之作《准则派宪章》组建的“宪章派”是准则派集团中的明确右翼。他们一般倾向缩减劳工保护乃至减少国家调控，而对外则采取孤立主义与不列颠民族主义立场。\n\n诸如奥利弗·斯坦利等准则右翼多为莫斯利崛起后的新支持者。其基本盘多为军队、安全系统与相对保守的乡村地区选民，而这些民族保守主义支持者严重影响着他们推行的政策。"
