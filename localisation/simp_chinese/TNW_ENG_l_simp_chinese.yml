#GUI
 TNW_ENG_parliament_desc: "在废除代表贵族压迫的上议院后，新的联盟议会在原下议院的基础上建立起来。尽管随着莫斯利总统于1936年上台，议会内大部分非工党议员被工党议员替换，但如今该机构仍是联盟立法与国家权力的核心所在。"
 TNW_ENG_parliament_desc2: "工党议会党团主席：[Get_TNW_Labour_Parliament_Chair]"
