#事件
 ENG_event.1.t: "菜单卡背面"
 ENG_event.1.d: "咚咚咚——“请进。”\n\n私人秘书推开了鲍德温办公室的门，颤颤巍巍的拿着一封电报缓缓走到鲍德温的面前。此时已经将近21日的零点，办公室里除了鲍德温桌上的那盏台灯亮着，并没有开灯，而首相仍在处理一些繁杂琐碎的工作。\n\n“什么事情，伍利？不是太紧急的事情先放一边，我还有其他事情要处理。”首相并没有抬头看着私人秘书，在给烟斗添加新的烟丝后就便继续投入繁多的文书海洋工作当中。\n\n“桑德灵厄姆宫来电，首相。”听到‘桑德灵厄姆宫’这几个字时鲍德温突然停下手中的工作，从私人秘书那接来电报阅读了起来。“国……国王陛下刚刚在桑德灵厄姆宫驾崩……”\n\n这消息不仅对于鲍德温，更是对于整个大不列颠来说太突然了，尽管早在去年年底，国王陛下的私人医生道森子爵就已经告诉鲍德温国王正在“收拾行李，准备离开”。但事发突然，首相一时间不知道如何是好，只能吸口烟冷静下来思考思考。\n\n“我知道了。通电全国，各自治领与殖民地，一颗屹立于大英帝国皇冠上璀璨的明珠陨落了。”“是，首相。”私人秘书接到指示后离开了办公室，只留下坐在办公桌前抽着烟斗的鲍德温。\n\n隔天早上，日不落帝国的民众们统一在收音机前倾听着BBC这场沉重的广播：“……在这25年的动荡不安又光辉灿烂，若要说乔治国王教会了我们什么，那便是即为领袖又如兄长的风范。他在位期间，一直是这国家伟大的指路明星。而他去世时，许多孩子在街头哭泣……”"
 ENG_event.1.tt: "我们将乔治弟兄托付给慈悲的上帝，我们的创造者和救主。"
