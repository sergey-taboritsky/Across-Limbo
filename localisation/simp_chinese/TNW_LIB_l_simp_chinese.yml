 LIB_William_Tubman_desc:0 "真辉格党第十九任总统，哈珀城出身的梅苏拉多角政治世家后裔。他对内推行统一政策与开放门户，把美裔利比里亚人的旧江山往现代化的方向拖；对外则旗帜鲜明地站在华盛顿一边——在他的地盘上，共产主义连传教士的名额都拿不到。"
