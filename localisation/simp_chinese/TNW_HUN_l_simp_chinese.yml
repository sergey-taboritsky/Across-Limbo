 #顾问
 HUN_Kuhn_Bella:0 "库恩·贝拉"
 HUN_Sword_wielder:0 "执剑人"
 HUN_Kuhn_Bella_desc:0 "1886年2月20日，库恩· 贝拉出生在特兰西瓦尼亚莱列村。中学时代，他就参加了匈牙利社会民主党。第一次世界大战爆发后，他被征入伍，在对俄作战中被俘。在随后的时间内，他了参加俄国布尔什维克党。十月革命爆发后不久，他化名谢拜什捷·艾米尔少校回到匈牙利并着手建立匈牙利共产党。\n\n当时，匈牙利由于受十月革命的影响和奥匈帝国军事上的溃败，国内民主民族革命高涨。1918年12月，布达佩斯又爆发了总罢工，这是继一月总罢工之后的又一次大规模的行动。罢工中，工人与反动宪兵发生了流血冲突。在总罢工期间，首都及其他地方相继出现了许多苏维埃组织。一部分农民也起来夺取地主的土地。在协约国与同盟国签订停战条约后，匈牙利的资产阶级政府害怕国内爆发革命起义，于是向奥地利帝国求援，同时还利用报纸大造反革命舆论，诱骗国内人民停止罢工，并主动招揽社会民主党内的投降派参与政府，以便集中力量来镇压和群众革命运动。\n\n不久之后，在库恩的领导下，匈牙利共产党向广大的劳动群众发出了社会主义革命的口号：“解除资产阶级的武装，武装无产阶级，建立苏维埃政权”并发动全国总罢工夺取各地政权。随后在苏维埃政权成立后的几天内，协约国宣布干涉匈牙利革命。随后库恩宣布匈牙利苏维埃共和国进入战时紧急状态，并号召所有被压迫者联合起来反对他国干涉匈牙利内政，同时着手清除党内叛徒。这一系列的措施有力的帮助了匈共稳定国内局势并成功和苏俄，德国红军配合将战线推至特兰西瓦尼亚。尽管在1923年战争状态已经结束，尽管库恩·贝拉决不想止步于此，但国内的局势依旧十分严峻......"
 
 #民族精神
 HUN_Balkan_powder_keg:0 "巴尔干火药桶"
 HUN_Balkan_powder_keg_desc:0 "第一次世界大战结束后，匈牙利建立了苏维埃政权，但自建立以来就遭受着内外资产阶级的敌视。在1919年时，奥地利，南斯拉夫，罗马尼亚纷纷向我们宣战，但在党的领导下，我们的红军成功的和苏俄，德国红军阻挡了资产阶级企图颠覆我国苏维埃政权的企图，成功将革命烧至特兰西瓦尼亚。但所有人都明白，这绝不会是结束，而是刚刚开始..."
 HUN_All_power_rests_with_the_Soviets:0 "一切权力归于苏维埃"
 HUN_All_power_rests_with_the_Soviets_desc:0 "1919年在我们党的“解除资产阶级的武装，武装无产阶级，建立苏维埃政权“口号下，匈牙利无产阶级用革命暴力推翻资产阶级的统治。但要真正实现“苏维埃”恐怕还有很长一段路要走…"
 HUN_Red_Terror:0 "红色恐怖"
 HUN_Red_Terror_desc:0 "事实证明如果对资产阶级温和对待，我们的政权就会处在危机之中。如果不以恐怖的手段镇压资产阶级，他们就会在夺取政权后执行更加恐怖的手段镇压我们！"
 HUN_The_dream_of_the_Union:0 "联邦之梦"
 HUN_The_dream_of_the_Union_desc:0 "我们曾经想将革命烧遍整个多瑙河，但外国干涉军以及国内的反动派阻止了我们前进的步伐。虽然如此，不过我们不会放弃，终有一天，所有多瑙河地区的民族都会统一在一片红旗之下！"
 HUN_Rampant_reactionaries:0 "猖獗的反动派"
 HUN_Rampant_reactionaries_desc:0 "尽管《柏林条约》的签订让我们与周边敌对势力重归和平，但他们绝不会善罢甘休，在斯洛伐克，特兰西瓦尼亚还有许多残留的资产阶级分子反抗我们的统治，如果我们不能及时处理掉这群该死的资产阶级分子，也许奥地利帝国就要有所动作了…"
 HUN_Multi_ethnic_army:0 "多民族军队"
 HUN_Multi_ethnic_army_desc:0 "我们的军队中有捷克人，罗马尼亚人，塞尔维亚，还有各种各样的少数民族，这种状况导致匈牙利红军战斗力大大的被削弱了。如果我们想要将革命烧遍整个多瑙河地区，那么我们就不得不建设一只强大的军队。"