 HUN_Ferenc_Szalasi:0 "萨拉希·费伦茨"
 HUN_Ferenc_Szalasi_desc:0 "箭十字党的领袖，自称民族领袖。他的Hungarism把整个民族想象成一个命运与共的有机体，这与东方那场民族革命一拍即合。旧贵族与摄政宫廷在他面前低头，而布达佩斯的街头上，箭十字旗帜正与东欧防御协定的徽记并排飘扬。"
 HUN_dongou_xieding_member:0 "东欧协定成员"
 HUN_dongou_xieding_member_desc:0 "作为东欧协定的成员国，我国享受着莫斯科提供的保护伞，也承担着相应的义务——在外交、军事与经济上，都得看着克里姆林宫的眼色行事。"
