 FRA_special_cold_war_description:0 "§R法伦斯泰尔国际§!\n\n\n\n\n\n\n£FRA_Cold_War_Entry_embed \n\n\n\n\n\n\n§W随着雪月革命后国际主义热情不断高涨，公社与第三国际其他成员国于1936年协商后决议成立法伦斯泰尔国际，以便社会主义国家进行经济互助与文化交流。该组织历经风雨，见证国际社会主义运动的高潮与失落，并于第二次世界大战中证明了自己的韧性。随着红旗插遍欧美亚非各大洲，世界革命的高潮后，随着帝国秩序彻底瓦解，全世界的空白也等待着社会主义者们泼墨挥毫。\n\n如今，该组织正致力于扩大经济合作，开启逐渐消除国家边界的进程，向社会主义运动远大的最终目标迈进。其日常运作包含了许多国际化的前公社机构，包括社会主义反殖民委员会、工会-工团国际等。当然，由于各个社会主义大国都希望得到更为广泛的军事行动与外交自由，该组织不具备任何军事职能。\n\n“我们不指望，我们从来没有指望过工人的福祉增加，他们一天天赢得的相对自由，引导他们成为他们完全和最终解放的有意识和有能力的工具。贫穷，尤其是过度悲惨，只会造就乞丐或无政府主义者。幸福感，短工作日，这就是社会主义者的原因，同时还有革命者。”§!"
 RUS_special_cold_war_description:0 "§G莫斯科经济委员会§!\n\n\n\n\n\n\n£RUS_Cold_War_Entry_embed \n\n\n\n\n\n\n§W莫斯科经济委员会成立于1937年，用于帮助俄罗斯在鲍里斯·萨文科夫领导下摆脱德意志阴影。在委员会领导下，俄罗斯不但摆脱了德意志强加于身的经济束缚，而且撬动了印度、保加利亚等一系列重量级盟友，为俄罗斯战争经济汲取足够的养分，最终帮助坦克格勒与察里津产出海量的军备，淹没帝国东墙。\n\n随着世界大战结束，莫斯科经济委员会致力于根除治下的帝国残余，并吸纳第三世界新生的反殖民主义政权，以从非洲与南美洲方向包围西欧，借此与无神论社会主义势力抗衡。俄罗斯产品与政治影响力正随着经委会使者们扩散到世界的每一个角落，只要给予他足够时间，绿潮将足够席卷全球。\n\n“它是一个坚定的、爱国的、理论上自由的专制国家，它帮助人民分配自己真正的最佳的力量，教育人们清醒、自由、忠诚，自由地和有机地参与国家建设。只有这样的专制政权才能将俄罗斯从无政府状态和旷日持久的内战中拯救出来。”§!"
 CHI_special_cold_war_description:0 "§Y第三世界国际合作§!\n\n\n\n\n\n\n£AUS_Cold_War_Entry_embed \n\n\n\n\n\n\n§W§!"
