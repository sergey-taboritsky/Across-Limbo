 World_news.5.t:0 "不列颠内战"
 World_news.5.d:0 "腐朽的帝国终将倒下，这是历史的必然规律。尽管战争还在进行，但国内日益严重的阶级矛盾冲突最终导致事态严重扩大化。不列颠各个左翼政党联合起来发动了起义，势必要建立一个没有压迫，没有君主的民主共和的不列颠。\n\n首相[ENG.GetLeader]在起义爆发伊始便迅速宣布国家进入紧急状态，并着手调动军队，对解放阵线进行无情镇压。同时，他警告所有企图妨碍军队行动或与解放阵线有牵连的人士，将面临最严厉的惩罚。\n\n在国际舞台上，起义的消息如同野火般迅速蔓延。不久之后，有人目击共产国际的运输船只突破了皇家海军的封锁线，在利物浦和多佛尔的港口秘密停靠。俄苏政府公开表态，将不遗余力地支持不列颠解放阵线的革命行动，苏联的其他加盟国也纷纷表态支持。\n\n坊间传闻，英国王室已做好逃亡加拿大自治领的准备，并已向美国政府发出紧急援助请求。然而，[USA.GetLeader]总统对此尚未作出任何公开回应。"
 World_news.5.tt:0 "你们这些叛乱分子，看我派坦克来把你们一个个送上天！"
 World_news.5.td:0 "起来！不愿做奴隶的人们！"
 World_news.5.ta:0 "用无产阶级血肉筑起的帝国终将被革命的浪潮所吞噬。"
 Nuke_news.1.t:0 "核武器"
 Nuke_news.1.d:0 "[This.GetNukeEventDesc]"
 Nuke_news.1.tt:0 "[This.GetNukeEventOption]"
 Nuke_news.1.d_SOV:0 "俄苏政府向全世界公开了一则惊人的信息：代号第一闪电的超级炸弹已于前不久成功在[KAZ.GetName]的塞米巴拉金斯克试验场成功完成试爆。据相关负责人透露，爆炸所产生的巨大蘑菇状烟云最大高度达至约13716米，即约45000英尺；产生的威力相当于2.2万吨的TNT当量。\n\n目前，俄苏政府并没有向外界公开透露该超级炸弹的原理与制作原材料。据业内相关专业人员分析，这枚超级炸弹的原材料极有可能使用了具有放射性的铀元素，对此俄苏政府并没有做出回应。\n\n此外，[Root.GetLeader]在共产国际大会上表示，这类武器将作为攻击资本主义的最后手段，不到万不得已不会使用。非共产国际国家开始纷纷对此表示强烈抗议与不安，认为研制这类武器有违背人类道德的行为。"
 Nuke_news.1.tt_SOV:0 "打击资本主义壁垒的一击重锤"